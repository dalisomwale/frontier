<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Frontier Marketplace</title>
    <link rel="icon" href="images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Needed only for the embedded-tab detection so this page's own
         header collapses correctly when it's reached inside another page's
         tab-frame iframe (e.g. an unauthenticated Chat/Account tap). -->
    <script src="/js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Navigation -->
    <nav id="page-topnav" class="bg-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <div class="brand-mark-full">
              <img
                src="images/logo-full.jpg"
                alt="Frontier Farms &amp; Consult"
              />
            </div>
          </div>
          <a href="/" class="text-gray-600 hover:text-gray-900 font-medium"
            >Back to Home</a
          >
        </div>
      </div>
    </nav>

    <!-- Login Section -->
    <div class="min-h-[calc(100vh-64px)] flex">
      <!-- Photo panel (hidden on small screens). Logo box matches the
           register.html hero panel so both sign-in screens read the same. -->
      <div
        class="hidden lg:flex lg:w-1/2 hero-photo items-center justify-center p-12"
        style="
          background-image: url(&quot;images/livestock/hero-pasture.jpg&quot;);
        "
      >
        <div class="max-w-sm text-white text-center">
          <div
            class="w-24 h-24 mx-auto mb-6 rounded-2xl bg-white shadow-lg p-2"
          >
            <img
              src="images/logo-full.jpg"
              alt="Frontier Farms &amp; Consult"
              class="w-full h-full object-contain rounded-xl"
            />
          </div>
          <h2 class="text-2xl font-bold mb-3">
            Welcome to Frontier marketplace
          </h2>
          <p class="text-blue-100">
            Sign in to manage listings, message buyers and sellers, and keep
            track of your livestock trades.
          </p>
        </div>
      </div>

      <div
        class="w-full lg:w-1/2 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8"
      >
        <div class="w-full max-w-md">
          <div class="bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">Login</h2>

            <!-- Reason banner: plain red text, no box. Populated by
                 showLoginReasonBanner() from the ?reason= query param when
                 a signed-out user was bounced here by an action they tried
                 to take (buy, message, favourite, etc.). -->
            <div
              id="login-reason-banner"
              class="hidden mb-4 text-sm font-medium text-red-600"
            ></div>

            <form id="login-form" class="space-y-4">
              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Email Address</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="your@email.com"
                />
                <div
                  id="email-error"
                  class="text-red-600 text-sm mt-1 hidden"
                ></div>
              </div>

              <div>
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Password</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="••••••••"
                />
                <div
                  id="password-error"
                  class="text-red-600 text-sm mt-1 hidden"
                ></div>
              </div>

              <button
                type="submit"
                class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium transition"
              >
                Sign In
              </button>
            </form>

            <div class="mt-6 text-center">
              <p class="text-gray-600">
                Don't have an account?
                <a
                  href="register.html"
                  class="text-blue-600 hover:text-blue-700 font-semibold"
                  >Register here</a
                >
              </p>
            </div>

            <div class="mt-6">
              <a
                href="#"
                class="text-blue-600 hover:text-blue-700 text-sm font-medium"
                >Forgot password?</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script>
      const LOGIN_REASON_MESSAGES = {
        sell: "Log in to create and manage your livestock listings.",
        chat: "Log in to view and send messages.",
        profile: "Log in to view your profile.",
        dashboard: "Log in to view your dashboard.",
        message: "Log in to message this seller.",
        "seller-profile": "Log in to view this seller's profile.",
        buy: "Log in to send a buying inquiry.",
        favorite: "Log in to save favorites.",
      };

      function showLoginReasonBanner() {
        const { reason } = getQueryParams();
        const message = LOGIN_REASON_MESSAGES[reason];
        if (!message) return;
        const banner = document.getElementById("login-reason-banner");
        banner.textContent = message;
        banner.classList.remove("hidden");
      }

      document.addEventListener("DOMContentLoaded", () => {
        redirectIfAuthenticated();
        showLoginReasonBanner();

        const form = document.getElementById("login-form");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          // Validation
          if (!validateEmail(email)) {
            document.getElementById("email-error").textContent =
              "Please enter a valid email";
            document.getElementById("email-error").classList.remove("hidden");
            return;
          } else {
            document.getElementById("email-error").classList.add("hidden");
          }

          if (!password) {
            document.getElementById("password-error").textContent =
              "Password is required";
            document
              .getElementById("password-error")
              .classList.remove("hidden");
            return;
          } else {
            document.getElementById("password-error").classList.add("hidden");
          }

          // Show loading
          const submitBtn = form.querySelector('button[type="submit"]');
          const originalText = submitBtn.textContent;
          submitBtn.disabled = true;
          submitBtn.textContent = "Signing in...";

          // Attempt login
          const success = await login(email, password);

          if (!success) {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        });
      });
    </script>
  </body>
</html>
