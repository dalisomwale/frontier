<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Transport Dashboard - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/livestock.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/password-rules.js"></script>
    <script src="/vendor/leaflet-1.9.4/leaflet.js"></script>
    <script src="/js/transport-ui.js"></script>
    <script src="/js/transport.js"></script>
    <script src="/js/xlsx-lite.js"></script>
  </head>
  <body class="bg-gray-50">
    <div id="app-sidebar"></div>
    <div id="transport-topbar"></div>

    <main id="tp-main" class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" hidden>
      <div class="flex flex-wrap items-start justify-between gap-3 mb-6">
        <div>
          <h1 id="page-title" class="text-xl sm:text-2xl font-bold text-gray-900">Requests</h1>
          <p id="page-sub" class="text-gray-500 mt-1 text-sm"></p>
        </div>
        <label class="tp-switch" title="Switch off when you can't take new deliveries"><input type="checkbox" id="available"><span id="available-label">Available for new requests</span></label>
      </div>
      <div id="tp-banner" class="tp-status-banner"></div>
      <div id="tp-stats" class="tp-stats"></div>

      <section id="tab-requests"><div id="requests-list" class="tp-card-list"></div></section>
      <section id="tab-deliveries" hidden>
        <div class="sl-card">
          <div class="sl-toolbar"><h2 class="txd-card-title !mb-0">Active</h2></div>
          <div id="deliveries-list" class="p-3 tp-card-list"></div>
        </div>
        <div class="sl-card mt-6" id="history-card" hidden>
          <div class="sl-toolbar tp-hist-bar">
            <h2 class="txd-card-title !mb-0">Previous deliveries</h2>
            <input type="search" id="history-q" class="field-input" placeholder="Search delivery, place or load" aria-label="Search previous deliveries">
            <button type="button" id="history-export" class="tx-export">Export Excel</button>
          </div>
          <div id="history-totals" class="tp-hist-totals"></div>
          <div id="history-list" class="overflow-x-auto"></div>
        </div>
      </section>
      <section id="tab-vehicles" hidden>
        <div class="flex justify-end mb-4"><button type="button" class="acc-btn" id="add-vehicle" style="width:auto">Add a vehicle</button></div>
        <div id="vehicles-list" class="tp-vehicles"></div>
      </section>
      <section id="tab-drivers" hidden>
        <div class="flex justify-end mb-4"><button type="button" class="acc-btn" id="add-driver" style="width:auto">Add a Driver</button></div>
        <div id="drivers-list" class="tp-drivers"></div>
      </section>
      <section id="tab-ratings" hidden><div id="ratings-list"></div></section>
      <section id="tab-notifications" hidden><div class="sl-card"><div id="notifications-list"></div></div></section>
      <section id="tab-profile" hidden><div id="profile-box" class="tr-two"></div></section>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      let me = null;
      let meta = { cargo_types: [], doc_types: {} };
      let vehicles = [];
      let deliveries = [];
      const state = { tab: "requests", dtab: "active" };
      const TITLES = { requests: "Requests", deliveries: "My deliveries", vehicles: "Vehicles", drivers: "Drivers", ratings: "Ratings", notifications: "Notifications", profile: "Profile" };
      const SUBS = {
        requests: "Paid deliveries in your area that you can accept. The first provider to accept gets the job.",
        deliveries: "Deliveries you've accepted.",
        vehicles: "The vehicles you use. When you accept a request you choose which one goes.",
        drivers: "Your drivers sign in with their phone number and the sign-in code you give them.",
        ratings: "What buyers said about your deliveries.",
        notifications: "",
        profile: "Your details. Your coverage area is set by Frontier.",
      };
      const ACTIVE = ["provider_accepted", "vehicle_selected", "awaiting_collection", "collection_submitted", "collection_confirmed", "in_transit", "arrived", "delivery_submitted", "awaiting_confirmation", "disputed"];
      const approved = () => me && me.status === "approved" && me.is_active;
      // A company's driver (D: drivers): their own deliveries, no vehicles,
      // drivers, documents or money.
      const isDriver = () => me && me.role === "driver";
      const allowedTabs = () => transportNavFor(me).map((i) => i.key);

      // --------------------------------------------------------------- shell
      function setTab(name) {
        if (!TITLES[name] || !allowedTabs().includes(name)) name = "requests";
        state.tab = name;
        closeAllAdminViews();
        Object.keys(TITLES).forEach((t) => (document.getElementById(`tab-${t}`).hidden = t !== name));
        document.querySelectorAll("[data-tab-link]").forEach((a) => a.classList.toggle("active", a.dataset.tabLink === name));
        document.getElementById("page-title").textContent = TITLES[name];
        document.getElementById("page-sub").textContent = isDriver()
          ? ({ requests: `Paid deliveries for ${me.name}. The first to accept gets the job.`, deliveries: "Deliveries given to you.", profile: "" }[name] ?? SUBS[name])
          : SUBS[name];
        document.getElementById("tp-stats").hidden = !["requests", "deliveries"].includes(name);
        const url = new URL(location.href);
        url.searchParams.set("tab", name);
        ["booking", "welcome"].forEach((k) => url.searchParams.delete(k));
        history.replaceState(null, "", url.pathname + url.search);
        ({ requests: loadRequests, deliveries: loadDeliveries, vehicles: loadVehicles, drivers: loadDrivers, ratings: loadRatings, notifications: loadNotifications, profile: renderProfile })[name]();
      }
      document.addEventListener("click", (e) => {
        const a = e.target.closest("[data-tab-link]");
        if (!a) return;
        e.preventDefault();
        setTab(a.dataset.tabLink);
      });

      function renderBanner() {
        const box = document.getElementById("tp-banner");
        let html = "";
        document.querySelector(".tp-switch").hidden = isDriver();
        if (isDriver()) {
          box.innerHTML = me.status !== "approved" || !me.is_active ? `<div class="tr-warn-box"><b>${escapeHtml(me.name)} isn't taking deliveries yet.</b> Please check with your company.</div>` : "";
          return;
        }
        if (me.status === "pending") html = `<div class="tr-warn-box"><b>Waiting for Frontier's approval.</b> We're reviewing your details and documents. ${me.kind === "company" ? "In the meantime, give your drivers their sign-in codes (Drivers) and add photos of your vehicles" : "Add photos of your vehicle in the meantime"}: you'll start receiving requests once you're approved and your coverage is set.</div>`;
        else if (me.status === "rejected") html = `<div class="tr-warn-box"><b>Your registration was not approved.</b>${me.admin_note ? ` ${escapeHtml(me.admin_note)}` : ""} Please contact Frontier.</div>`;
        else if (me.status === "suspended") html = `<div class="tr-warn-box"><b>Your account is suspended.</b>${me.admin_note ? ` ${escapeHtml(me.admin_note)}` : ""} You won't receive requests. Please contact Frontier.</div>`;
        else if (!me.is_active) html = `<div class="tr-warn-box"><b>Your account has been deactivated by Frontier.</b> Please contact us.</div>`;
        else if (!me.coverage_active || !me.coverage_km) html = `<div class="tr-note-box">You're approved. Frontier hasn't switched on your coverage yet, so you won't receive requests until it does.</div>`;
        else if (!vehicles.some((v) => v.status === "active")) html = `<div class="tr-note-box">Add a vehicle to start receiving requests.</div>`;
        box.innerHTML = html;
        const sw = document.getElementById("available");
        sw.checked = me.is_available;
        document.getElementById("available-label").textContent = me.is_available ? "Available for new requests" : "Not taking new requests";
      }

      async function loadStats() {
        try {
          const s = (await transportApi("/api/transport/summary")).data;
          setBadge("[data-requests-badge]", s.requests);
          setBadge("[data-active-badge]", s.active);
          document.getElementById("tp-stats").innerHTML = `
            <div class="tx-total"><span>Open requests</span><b>${s.requests}</b></div>
            <div class="tx-total"><span>Active deliveries</span><b>${s.active}</b></div>
            <div class="tx-total"><span>Completed</span><b>${s.completed}</b></div>
            ${s.owed === null ? "" : `<div class="tx-total"><span>Owed to you</span><b>${kwacha(s.owed)}</b></div>`}`;
        } catch {
        }
      }

      // ------------------------------------------------------------ requests
      const jobCard = (b, attr) => `<button type="button" class="tp-job" ${attr}="${b.id}">
          <span class="tp-job-top"><span class="text-sm text-gray-500">${escapeHtml(b.reference)}${b.offered_at ? ` · ${escapeHtml(timeAgo(b.offered_at))}` : ""}</span>${trPill(b)}</span>
          <span class="tp-job-route block">${escapeHtml(b.from)} → ${escapeHtml(b.to)}</span>
          ${b.driver_name && !isDriver() ? `<span class="tp-job-meta block">Driver <b>${escapeHtml(b.driver_name)}</b></span>` : ""}
          <span class="tp-job-meta block">${trKm(b.distance_km)} by road${b.vehicle_size_label ? ` · <b>${escapeHtml(b.vehicle_size_label)} vehicle</b>` : ""} · ${escapeHtml(b.cargo_summary || "")}${b.provider_earning !== undefined ? ` · <b>${kwacha(b.provider_earning)}</b>` : ""}</span>
        </button>`;

      async function loadRequests() {
        const list = document.getElementById("requests-list");
        if (!approved()) {
          list.innerHTML = `<div class="empty-state"><p class="font-semibold text-gray-800">No requests yet</p><p class="text-sm mt-1">You'll see paid delivery requests here once Frontier has approved your account.</p></div>`;
          return;
        }
        let rows = [];
        try { rows = (await transportApi("/api/transport/requests")).data; } catch (error) { list.innerHTML = `<p class="text-sm text-red-600">${escapeHtml(error.message)}</p>`; return; }
        list.innerHTML = rows.length ? rows.map((b) => jobCard(b, "data-request")).join("")
          : `<div class="empty-state"><p class="font-semibold text-gray-800">No open requests</p><p class="text-sm mt-1">${me.is_available ? "New paid deliveries in your area appear here, and you'll get a notification." : "You're marked as not taking new requests."}</p></div>`;
        list.querySelectorAll("[data-request]").forEach((b) => b.addEventListener("click", () => openBooking(b.dataset.request)));
        loadStats();
      }

      // ---------------------------------------------------------- deliveries
      // Active deliveries as cards; everything finished below as a record.
      let historyQ = "";
      const finishedAt = (b) => b.completed_at || b.updated_at;
      const pastRows = () => deliveries.filter((b) => !ACTIVE.includes(b.status))
        .filter((b) => !historyQ || `${b.reference} ${b.from} ${b.to} ${b.cargo_summary || ""} ${b.status_label}`.toLowerCase().includes(historyQ));
      async function loadDeliveries() {
        try { deliveries = (await transportApi("/api/transport/bookings")).data; } catch (error) { return showNotification(error.message, "error"); }
        const rows = deliveries.filter((b) => ACTIVE.includes(b.status));
        const list = document.getElementById("deliveries-list");
        list.innerHTML = rows.length ? rows.map((b) => jobCard(b, "data-booking")).join("")
          : `<div class="empty-state"><p class="font-semibold text-gray-800">No active deliveries</p><p class="text-sm mt-1">Deliveries you accept appear here until they're completed.</p></div>`;
        list.querySelectorAll("[data-booking]").forEach((b) => b.addEventListener("click", () => openBooking(b.dataset.booking)));
        renderHistory();
        loadStats();
      }
      function renderHistory() {
        const past = deliveries.filter((b) => !ACTIVE.includes(b.status));
        document.getElementById("history-card").hidden = !past.length;
        if (!past.length) return;
        const done = past.filter((b) => b.status === "completed");
        const earned = done.reduce((t, b) => t + (Number(b.provider_earning) || 0), 0);
        document.getElementById("history-totals").innerHTML = `<span><b>${done.length}</b> completed</span><span>Earned <b>${kwacha(earned)}</b></span>${past.length > done.length ? `<span><b>${past.length - done.length}</b> cancelled or refunded</span>` : ""}`;
        const rows = pastRows();
        const box = document.getElementById("history-list");
        if (!rows.length) { box.innerHTML = `<p class="text-sm text-gray-500 p-4">No matches.</p>`; return; }
        box.innerHTML = `<table class="admin-table tp-hist"><thead><tr><th>Date</th><th>Delivery</th><th class="hidden md:table-cell">Route</th><th class="hidden lg:table-cell">Load</th><th class="text-right">Earning</th></tr></thead>
          <tbody>${rows.map((b) => `<tr data-past="${b.id}" tabindex="0">
            <td class="whitespace-nowrap text-gray-600">${escapeHtml(formatDateShort(finishedAt(b)))}</td>
            <td><b class="text-gray-900">${escapeHtml(b.reference)}</b>${b.status === "completed" ? "" : `<small class="block text-gray-500">${escapeHtml(b.status_label)}</small>`}<small class="block text-gray-500 md:hidden">${escapeHtml(b.from)} → ${escapeHtml(b.to)}</small></td>
            <td class="hidden md:table-cell text-gray-700">${escapeHtml(b.from)} → ${escapeHtml(b.to)}</td>
            <td class="hidden lg:table-cell text-gray-700">${escapeHtml(b.cargo_summary || "-")}</td>
            <td class="text-right whitespace-nowrap">${b.status === "completed" ? `<b>${kwacha(b.provider_earning)}</b>` : `<span class="text-gray-400">-</span>`}</td></tr>`).join("")}</tbody></table>`;
        box.querySelectorAll("[data-past]").forEach((tr) => {
          tr.addEventListener("click", () => openBooking(tr.dataset.past));
          tr.addEventListener("keydown", (e) => { if (e.key === "Enter") openBooking(tr.dataset.past); });
        });
      }
      document.getElementById("history-q").addEventListener("input", (e) => { historyQ = e.target.value.trim().toLowerCase(); renderHistory(); });
      document.getElementById("history-export").addEventListener("click", () => {
        downloadXlsx(`frontier-deliveries-${new Date().toISOString().slice(0, 10)}.xlsx`, "Deliveries",
          ["Date", "Delivery", "Status", "From", "To", "Distance (km)", "Load", "Vehicle", "Earning (K)"],
          pastRows().map((b) => [formatDateShort(finishedAt(b)), b.reference, b.status_label, b.from, b.to, b.distance_km ?? "", b.cargo_summary || "", b.vehicle_registration || "", b.status === "completed" ? Number(b.provider_earning) || 0 : ""]),
          { numberCols: [5, 8] });
      });

      // One request or delivery on its own page.
      let bookingView = null;
      let follow = null;
      async function openBooking(id, { replace = false } = {}) {
        let d;
        try { d = (await transportApi(`/api/transport/bookings/${id}`)).data; } catch (error) { return showNotification(error.message, "error"); }
        if (!(replace && bookingView)) {
          bookingView = openAdminView({ title: d.reference, params: { booking: d.id }, onClose: () => { bookingView = null; follow = null; } });
        }
        bookingView.bookingId = d.id;
        if (d.offer) return paintOffer(bookingView, d);
        paintDelivery(bookingView, d);
      }

      function paintOffer(view, d) {
        const vs = d.vehicles || [];
        view.body.innerHTML = `
          <div class="sv-head"><h1 class="admin-view-title !mb-0">${escapeHtml(d.pickup.district || d.pickup.province || "")} → ${escapeHtml(d.destination.district)}</h1>${trPill(d, true)}</div>
          <div class="tr-two">
            <div class="space-y-4 min-w-0">
              <div class="acc-card"><h2 class="txd-card-title">Request</h2>
                <dl class="sv-facts">
                  <div><dt>Pickup address</dt><dd>${escapeHtml(d.pickup.place)}</dd></div>
                  <div><dt>Delivery address</dt><dd>${escapeHtml(d.destination.place)}</dd></div>
                  <div><dt>Road distance</dt><dd>${trKm(d.distance_km)}${d.duration_min ? ` · about ${trDuration(d.duration_min)}` : ""}</dd></div>
                  ${d.offer.pickup_km !== null ? `<div><dt>From your address to pickup</dt><dd>${trKm(d.offer.pickup_km)}</dd></div>` : ""}
                  <div><dt>Load</dt><dd>${escapeHtml(d.cargo_summary || "-")}</dd></div>
                  ${d.vehicle_size_label ? `<div><dt>Vehicle size</dt><dd>${escapeHtml(d.vehicle_size_label)}</dd></div>` : ""}
                  <div><dt>Your earning</dt><dd><b>${kwacha(d.provider_earning)}</b></dd></div>
                </dl>
                <ul class="tr-qty mt-3">${d.orders.filter((o) => !o.cancelled).map((o) => `<li><span>${escapeHtml(o.title)}</span><b>${escapeHtml(o.units)}</b></li>`).join("")}</ul>
                <p class="text-sm text-gray-500 mt-3">The seller's and receiver's phone numbers are shown once you accept.</p>
              </div>
            </div>
            <div class="space-y-4 min-w-0">
              ${d.can.accept ? `<form class="acc-card" data-accept novalidate>
                <h2 class="txd-card-title">Accept with a vehicle</h2>
                ${vs.length ? `<div class="tp-choice">${vs.map((v) => `<label class="${v.fits && !v.busy ? "" : "is-off"}"><input type="radio" name="vehicle_id" value="${v.id}" ${v.fits && !v.busy ? "" : "disabled"}><span><b>${escapeHtml(v.registration)}</b> · ${v.size_label ? `${escapeHtml(v.size_label)} · ` : ""}${escapeHtml(v.vehicle_type)}${v.busy ? " · on another delivery" : v.wrong_size ? " · not the size the buyer chose" : !v.fits ? " · can't carry this load" : ""}</span></label>`).join("")}</div>`
                  : `<p class="text-sm text-gray-600">You have no active vehicles.</p>`}
                <p class="field-error hidden" data-error-for="vehicle_id"></p>
                ${d.drivers ? `<label class="field-label mt-4" for="acc-driver">Driver</label>
                  <select id="acc-driver" name="driver_id" class="field-input"><option value="">Choose later</option>${d.drivers.map((x) => `<option value="${x.id}" ${x.busy ? "disabled" : ""}>${escapeHtml(x.name)}${x.busy ? " · on another delivery" : ""}</option>`).join("")}</select>
                  <p class="field-error hidden" data-error-for="driver_id"></p>` : ""}
                <div class="tr-actions mt-4"><button type="submit" class="acc-btn">Accept delivery</button>${isDriver() ? "" : `<button type="button" class="acc-mini-btn" data-decline>Decline</button>`}</div>
              </form>` : `<div class="acc-card"><p class="text-sm text-gray-700">${d.offer.status === "declined" ? "You declined this request." : "This request is no longer open."}</p></div>`}
            </div>
          </div>`;
        const form = view.body.querySelector("[data-accept]");
        if (!form) return;
        const first = form.querySelector('input[name="vehicle_id"]:not([disabled])');
        if (first) first.checked = true;
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const v = form.querySelector('input[name="vehicle_id"]:checked');
          if (!v) return showFieldErrors(form, { errors: { vehicle_id: "Choose the vehicle you'll use." } });
          try {
            const res = await withBusy(form.querySelector("button[type=submit]"), "Accepting…", () => transportApi(`/api/transport/bookings/${d.id}/accept`, { method: "POST", body: { vehicle_id: Number(v.value), driver_id: form.driver_id ? Number(form.driver_id.value) || null : null } }));
            showNotification(res.message, "success");
            openBooking(d.id, { replace: true });
            loadStats();
          } catch (error) {
            showFieldErrors(form, error);
            showNotification(error.message, "error");
            if (error.status === 409) openBooking(d.id, { replace: true });
          }
        });
        form.querySelector("[data-decline]")?.addEventListener("click", async () => {
          const reason = await trPrompt({ title: "Decline this request?", label: "Reason", placeholder: "e.g. Vehicle not available that day", confirmText: "Decline" });
          if (reason === null) return;
          try {
            const res = await transportApi(`/api/transport/bookings/${d.id}/decline`, { method: "POST", body: { reason } });
            showNotification(res.message, "success");
            await view.close(true);
            loadRequests();
          } catch (error) { showNotification(error.message, "error"); }
        });
      }

      function paintDelivery(view, d) {
        const can = d.can || {};
        const subs = (stage) => d.submissions.find((s) => s.stage === stage);
        const collected = (o) => { const q = d.quantities.find((x) => x.stage === "provider_collected" && Number(x.order_id) === Number(o.id)); return q ? q.quantity : o.quantity; };
        // Collected / Delivered: a comment (with details if something isn't
        // right) and photos. Quantities aren't changed by the provider.
        const commentForm = (attr, title, intro, notes, button) => `<form class="acc-card" ${attr} novalidate>
            <h2 class="txd-card-title">${title}</h2>
            <p class="text-sm text-gray-600">${intro}</p>
            <label class="field-label mt-4" for="${attr}-c">Comment</label>
            <select id="${attr}-c" name="comment" class="field-input">
              <option value="">Choose…</option>
              ${Object.entries(notes).map(([k, v]) => `<option value="${k}">${escapeHtml(v)}</option>`).join("")}
            </select>
            <p class="field-error hidden" data-error-for="comment"></p>
            <div data-details hidden>
              <label class="field-label mt-3" for="${attr}-d">What isn't right?</label>
              <textarea id="${attr}-d" name="details" rows="2" maxlength="1000" class="field-input"></textarea>
              <p class="field-error hidden" data-error-for="details"></p>
            </div>
            <p class="field-label mt-4">Photos of the goods <span class="text-red-500">*</span> <span class="text-gray-400 font-normal">(1 to 6)</span></p>
            <div class="acc-ph-grid" data-photos></div>
            <p class="field-error hidden" data-error-for="images"></p>
            <button type="submit" class="acc-btn mt-4">${button}</button>
          </form>`;
        const onWay = ["provider_accepted", "vehicle_selected", "awaiting_collection", "collection_submitted"].includes(d.status);
        let action = "";
        if (can.collect) {
          action = commentForm("data-collect", "At the pickup",
            `Drive to ${escapeHtml(d.pickup.place)}. Check the goods with the seller, then choose a comment, add photos and tap Collected. The buyer and seller are told.`,
            d.comments.collection, "Collected");
        } else if (can.start) {
          action = `<div class="acc-card acc-card-ok"><b>Collected</b><p class="text-sm text-gray-700 mt-1">Tap Start delivery when you leave for ${escapeHtml(d.destination.place)}. The buyer and seller are told you're on the way.</p><button type="button" class="acc-btn mt-3" data-start>${uiIcon("truck")}<span>Start delivery</span></button></div>`;
        } else if (can.deliver) {
          action = `<div class="acc-card"><h2 class="txd-card-title">At the destination</h2><p class="text-sm text-gray-600">Drive to ${escapeHtml(d.destination.place)}. ${d.status === "arrived" ? "You've arrived. " : "Your arrival is noted automatically from your location. "}Hand the goods over to the buyer, then tap Delivered.</p><button type="button" class="acc-btn mt-4" data-delivered>${uiIcon("check")}<span>Delivered</span></button></div>`;
        } else if (d.status === "awaiting_confirmation") action = `<div class="acc-card acc-card-ok"><b>Delivered</b><p class="text-sm text-gray-600 mt-1">The buyer has been told. The delivery completes automatically unless they report a problem.</p></div>`;
        else if (d.status === "disputed") action = `<div class="tr-warn-box"><b>The buyer reported a problem.</b> Frontier is reviewing the records and may contact you.</div>`;
        const ratingCard = d.status === "completed"
          ? `<div class="acc-card"><h2 class="txd-card-title">Buyer's rating</h2>${d.rating ? `<p>${trStarsHtml(d.rating.stars)}</p>${d.rating.feedback ? `<p class="text-sm text-gray-700 mt-1">"${escapeHtml(d.rating.feedback)}"</p>` : ""}` : `<p class="text-sm text-gray-500">The buyer hasn't rated this delivery yet.</p>`}</div>`
          : "";
        const showMap = TR_MOVING.includes(d.status) || ["delivery_submitted", "awaiting_confirmation"].includes(d.status);
        const goTo = onWay ? d.pickup : d.destination;
        view.body.innerHTML = `
          <div class="sv-head"><h1 class="admin-view-title !mb-0">${escapeHtml(d.pickup.district || d.pickup.label)} → ${escapeHtml(d.destination.district)}</h1>${trPill(d, true)}</div>
          ${trProgressHtml(d.status)}
          <div class="tr-two">
            <div class="space-y-4 min-w-0">
              ${can.share_location ? `<div data-gps></div>` : ""}
              ${showMap ? `<div class="acc-card"><h2 class="txd-card-title">${onWay ? "To the pickup" : TR_MOVING.includes(d.status) ? "To the buyer" : "Route"}</h2><div data-track></div>
                ${TR_MOVING.includes(d.status) && goTo.lat ? `<p class="text-sm mt-2"><a class="acc-link" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${goTo.lat},${goTo.lng}">Turn-by-turn directions in your maps app</a></p>` : ""}</div>` : ""}
              ${d.can && d.can.assign_driver ? `<form class="acc-card" data-assign novalidate><h2 class="txd-card-title">Driver</h2>
                ${d.drivers.length ? `<div class="flex flex-wrap gap-2 items-end"><select name="driver_id" class="field-input flex-1 min-w-[180px]" aria-label="Driver"><option value="">No driver yet</option>${d.drivers.map((x) => `<option value="${x.id}" ${d.driver && d.driver.id === x.id ? "selected" : ""} ${x.busy && !(d.driver && d.driver.id === x.id) ? "disabled" : ""}>${escapeHtml(x.name)}${x.busy && !(d.driver && d.driver.id === x.id) ? " · on another delivery" : ""}</option>`).join("")}</select><button type="submit" class="acc-mini-btn">Save</button></div>
                  ${d.driver ? `<p class="text-sm text-gray-600 mt-2">${escapeHtml(d.driver.name)} · <a class="acc-link" href="tel:${escapeHtml(String(d.driver.phone).replace(/[^\d+]/g, ""))}">${escapeHtml(d.driver.phone)}</a></p>` : `<p class="text-sm text-gray-600 mt-2">Choose who drives. They see it when they sign in.</p>`}`
                  : `<p class="text-sm text-gray-600">Add drivers in the Drivers tab to give them deliveries.</p>`}
                <p class="field-error hidden" data-error-for="driver_id"></p></form>` : ""}
              ${action}
              <div class="acc-card"><h2 class="txd-card-title">Delivery details</h2>${trFactsHtml(d, { role: "provider" })}
                ${d.driver && !(d.can && d.can.assign_driver) && !isDriver() ? `<p class="text-sm text-gray-700 mt-3">Driver <b>${escapeHtml(d.driver.name)}</b> · ${escapeHtml(d.driver.phone)}</p>` : ""}
                ${d.vehicle ? `<p class="text-sm text-gray-700 mt-3 tr-inline-icon">${uiIcon("truck")} Vehicle <b>${escapeHtml(d.vehicle.registration)}</b> · ${escapeHtml(d.vehicle.type)}</p>` : ""}
                <ul class="tr-qty mt-3">${d.orders.filter((o) => !o.cancelled).map((o) => `<li><span>${escapeHtml(o.reference)} · ${escapeHtml(o.title)}</span><b>${escapeHtml(o.units)}</b></li>`).join("")}</ul>
              </div>
            </div>
            <div class="space-y-4 min-w-0">
              <div class="acc-card"><h2 class="txd-card-title">Collection record</h2>${trEvidenceHtml(d)}</div>
              ${ratingCard}
              <details class="acc-card acc-more"><summary>History</summary>${trTimelineHtml(d.events)}</details>
            </div>
          </div>`;
        view.body.querySelectorAll("select[name=comment]").forEach((sel) => sel.addEventListener("change", () => {
          sel.form.querySelector("[data-details]").hidden = !sel.value || sel.value === "ok";
        }));
        const reopen = () => openBooking(d.id, { replace: true });
        const assign = view.body.querySelector("[data-assign]");
        assign?.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const res = await withBusy(assign.querySelector("button[type=submit]"), "Saving…", () => transportApi(`/api/transport/bookings/${d.id}/driver`, { method: "PATCH", body: { driver_id: Number(assign.driver_id.value) || null } }));
            showNotification(res.message, "success");
            reopen();
          } catch (error) { showFieldErrors(assign, error); showNotification(error.message, "error"); }
        });
        const bindForm = (sel, url, label) => {
          const form = view.body.querySelector(sel);
          if (!form) return;
          const picker = bindPhotoPicker(form.querySelector("[data-photos]"), 6, (n) => { if (n) form.querySelector('[data-error-for="images"]').classList.add("hidden"); });
          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const errs = {};
            if (form.comment && !form.comment.value) errs.comment = "Please choose a comment.";
            if (form.comment && form.comment.value && form.comment.value !== "ok" && !form.details.value.trim()) errs.details = "Please add a few words about what isn't right.";
            if (!picker.files().length) errs.images = "Please add at least one photo.";
            if (Object.keys(errs).length) return showFieldErrors(form, { errors: errs });
            const fd = new FormData(form);
            picker.files().forEach((f) => fd.append("images", f));
            const btn = form.querySelector("button[type=submit]");
            try {
              const res = await withBusy(btn, label, async () => {
                const here = await currentPosition();
                if (here) { fd.append("lat", here.lat); fd.append("lng", here.lng); }
                return transportApi(url, { method: "POST", body: fd });
              });
              showNotification(res.message, "success");
              if (sel === "[data-deliver]") gps.stop();
              reopen();
            } catch (error) {
              showFieldErrors(form, error);
              showNotification(error.message, "error");
            }
          });
        };
        bindForm("[data-collect]", `/api/transport/bookings/${d.id}/collection`, "Saving…");
        view.body.querySelector("[data-delivered]")?.addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          if (!(await confirmAction({ title: "Mark as delivered?", message: "Only do this once the goods have been handed over. The buyer is asked to confirm everything is okay.", confirmText: "Delivered" }))) return;
          try {
            const res = await withBusy(btn, "Saving…", async () => {
              const here = await currentPosition();
              return transportApi(`/api/transport/bookings/${d.id}/delivery`, { method: "POST", body: here || {} });
            });
            showNotification(res.message, "success");
            gps.stop();
            reopen();
          } catch (error) { showNotification(error.message, "error"); }
        });
        view.body.querySelector("[data-start]")?.addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          if (!(await confirmAction({ title: "Start the delivery?", message: "The buyer and seller are told you're on the way and can follow you until you mark it delivered. Keep this page open during the trip.", confirmText: "Start delivery" }))) return;
          try {
            const res = await withBusy(btn, "Starting…", async () => {
              const here = await currentPosition();
              return transportApi(`/api/transport/bookings/${d.id}/start`, { method: "POST", body: here || {} });
            });
            showNotification(res.message, "success");
            reopen();
          } catch (error) { showNotification(error.message, "error"); }
        });
        view.body.querySelector("[data-arrive]")?.addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          if (!(await confirmAction({ title: "Mark your arrival?", message: "The buyer is told you've arrived.", confirmText: "I've arrived" }))) return;
          try {
            const res = await withBusy(btn, "Saving…", async () => transportApi(`/api/transport/bookings/${d.id}/arrive`, { method: "POST", body: (await currentPosition()) || {} }));
            showNotification(res.message, "success");
            reopen();
          } catch (error) { showNotification(error.message, "error"); }
        });
        const gpsBox = view.body.querySelector("[data-gps]");
        if (gpsBox) {
          const paint = (g) => {
            if (!gpsBox.isConnected) return;
            const on = g.status === "on" && g.bookingId === d.id;
            gpsBox.innerHTML = `<div class="tr-gps ${on ? "tr-gps-on" : "tr-gps-off"}"><span class="tr-gps-dot"></span><span>${on
              ? `Sharing your location${g.sentAt ? ` · last sent ${escapeHtml(g.sentAt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }))}` : ""}. Keep this page open.`
              : escapeHtml(g.error || (g.status === "waiting" ? "Getting your location…" : "Location sharing is off."))}</span>
              ${on ? "" : `<button type="button" class="acc-mini-btn ml-auto" data-gps-on>Share location</button>`}</div>`;
            gpsBox.querySelector("[data-gps-on]")?.addEventListener("click", () => gps.start(d.id, paint));
          };
          gps.start(d.id, paint);
        }
        const track = view.body.querySelector("[data-track]");
        if (track) trFollow(track, d, `/api/transport/bookings/${d.id}/track`, transportApi).then((f) => { follow = f; });
        // The map moves with this phone's own position straight away.
        gps.onFix = (pos) => {
          if (follow && bookingView && bookingView.bookingId === d.id) follow.view.addPoint({ lat: pos.coords.latitude, lng: pos.coords.longitude, at: new Date(pos.timestamp).toISOString() });
        };
      }

      // ------------------------------------------------------------ vehicles
      async function loadVehicles() {
        const res = await transportApi("/api/transport/vehicles");
        vehicles = res.data;
        meta.cargo_types = res.cargo_types;
        meta.sizes = res.sizes || [];
        const list = document.getElementById("vehicles-list");
        const label = (k) => (meta.cargo_types.find((c) => c.key === k) || { label: k }).label;
        list.innerHTML = vehicles.length ? vehicles.map((v) => `
          <div class="tp-vehicle">
            ${v.photos[0] ? `<img src="${escapeHtml(v.photos[0].thumb_path)}" alt="${escapeHtml(v.registration)}">` : ""}
            <div class="tp-vehicle-body">
              <div class="flex items-center justify-between gap-2"><b>${escapeHtml(v.registration)}</b><span class="so-pill ${v.status === "active" ? (v.busy_booking ? "so-act" : "so-done") : "so-off"}">${v.status === "active" ? (v.busy_booking ? `On ${escapeHtml(v.busy_booking.reference)}` : "Active") : "Inactive"}</span></div>
              <p class="text-sm text-gray-600 mt-1">${v.size_label ? `<span class="tp-size">${escapeHtml(v.size_label)}</span> ` : ""}${escapeHtml(v.vehicle_type)}${v.capacity_note ? ` · ${escapeHtml(v.capacity_note)}` : ""}</p>
              ${v.size_label ? "" : `<p class="tr-warn-box mt-2">Choose this vehicle's size (Edit), so it can get delivery requests.</p>`}
              ${v.photos.length ? "" : `<p class="tr-note-box mt-2">Add a photo of this vehicle (Edit).</p>`}
              <p class="text-sm text-gray-700 mt-2">${v.cargo.map((c) => `${escapeHtml(label(c.key))}: up to ${c.max}`).join(" · ")}</p>
              <div class="tr-actions mt-3"><button type="button" class="acc-mini-btn" data-edit="${v.id}">Edit</button>
                <button type="button" class="acc-mini-btn" data-toggle="${v.id}">${v.status === "active" ? "Deactivate" : "Activate"}</button></div>
            </div>
          </div>`).join("")
          : `<div class="empty-state"><p class="font-semibold text-gray-800">No vehicles yet</p><p class="text-sm mt-1">Add the vehicles you use, with what each can carry at once.</p></div>`;
        list.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openVehicle(vehicles.find((v) => String(v.id) === b.dataset.edit))));
        list.querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", async () => {
          const v = vehicles.find((x) => String(x.id) === b.dataset.toggle);
          try {
            const res = await transportApi(`/api/transport/vehicles/${v.id}/status`, { method: "PATCH", body: { status: v.status === "active" ? "inactive" : "active" } });
            showNotification(res.message, "success");
            loadVehicles();
          } catch (error) { showNotification(error.message, "error"); }
        }));
        // Owner-drivers have one vehicle; companies can add more.
        document.getElementById("add-vehicle").hidden = me.kind !== "company" && vehicles.length >= 1;
        renderBanner();
      }
      document.getElementById("add-vehicle").addEventListener("click", () => openVehicle(null));

      function openVehicle(v) {
        const view = openAdminView({ title: v ? v.registration : "Add a vehicle", params: {} });
        const cargoOf = (k) => (v ? (v.cargo.find((c) => c.key === k) || {}).max || "" : "");
        view.body.innerHTML = `
          <form class="acc-card max-w-2xl" novalidate>
            <h1 class="admin-view-title">${v ? `Edit ${escapeHtml(v.registration)}` : "Add a vehicle"}</h1>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label class="field-label" for="v-type">Vehicle Name</label><input id="v-type" name="vehicle_type" class="field-input" maxlength="60" value="${escapeHtml(v ? v.vehicle_type : "")}" placeholder="e.g. Toyota Hilux"><p class="field-error hidden" data-error-for="vehicle_type"></p></div>
              <div><label class="field-label" for="v-reg">Registration Number</label><input id="v-reg" name="registration" class="field-input" maxlength="30" value="${escapeHtml(v ? v.registration : "")}" placeholder="e.g. ABC 1234"><p class="field-error hidden" data-error-for="registration"></p></div>
              <div class="sm:col-span-2">
                <p class="field-label">Vehicle Size <span class="text-gray-400 font-normal">(buyers choose a size when they order)</span></p>
                <div class="tp-sizes" role="radiogroup" aria-label="Vehicle size">${meta.sizes.map((x) => `<label class="tp-size-opt"><input type="radio" name="size_class" value="${x.key}" ${v && v.size_class === x.key ? "checked" : ""}><span><b>${escapeHtml(x.label)}</b><small>${escapeHtml(x.hint)}</small></span></label>`).join("")}</div>
                <p class="field-error hidden" data-error-for="size_class"></p>
              </div>
              <div class="sm:col-span-2"><label class="field-label" for="v-cap">Capacity notes <span class="text-gray-400 font-normal">(optional)</span></label><input id="v-cap" name="capacity_note" class="field-input" maxlength="255" value="${escapeHtml(v && v.capacity_note ? v.capacity_note : "")}" placeholder="e.g. Double-deck crate, ventilated"></div>
            </div>
            <p class="field-label mt-5">Load Limits <span class="text-gray-400 font-normal">(optional: leave empty to take any load that fits its size)</span></p>
            <div class="tp-cargo-grid">${meta.cargo_types.map((c) => `<div><label class="field-label !text-xs" for="cg-${c.key}">${escapeHtml(c.label)} (${escapeHtml(c.unit)})</label><input id="cg-${c.key}" name="cargo_${c.key}" type="number" min="1" step="1" class="field-input" value="${cargoOf(c.key)}"><p class="field-error hidden" data-error-for="cargo_${c.key}"></p></div>`).join("")}</div>
            <p class="field-error hidden" data-error-for="cargo"></p>
            <p class="field-label mt-5">Photos <span class="text-gray-400 font-normal">(${v ? "add more, up to 4 at a time" : "1 to 4"})</span></p>
            ${v && v.photos.length ? `<div class="acc-photos mb-2">${v.photos.map((p) => `<span class="relative inline-block"><a href="${escapeHtml(p.image_path)}" target="_blank" rel="noopener"><img src="${escapeHtml(p.thumb_path)}" alt=""></a><button type="button" class="tr-rm" data-rm-file="${p.id}" aria-label="Remove photo">×</button></span>`).join("")}</div>` : ""}
            <div class="acc-ph-grid" data-photos></div>
            <p class="field-error hidden" data-error-for="photos"></p>
            <p class="field-label mt-5">Vehicle papers <span class="text-gray-400 font-normal">(registration book, fitness, insurance: PDF or photo, optional)</span></p>
            ${v && v.documents.length ? `<ul class="tr-qty mb-2">${v.documents.map((f) => `<li><a class="acc-link" href="/api/transport/vehicles/${v.id}/files/${f.id}" target="_blank" rel="noopener">${escapeHtml(f.original_name || "Document")}</a><button type="button" class="acc-mini-btn" data-rm-file="${f.id}">Remove</button></li>`).join("")}</ul>` : ""}
            <input type="file" name="documents" multiple accept="application/pdf,image/jpeg,image/png,image/webp" class="text-sm">
            <div class="acc-actionbar"><button type="submit" class="acc-btn">${v ? "Save vehicle" : "Add vehicle"}</button></div>
          </form>`;
        const form = view.body.querySelector("form");
        const picker = bindPhotoPicker(form.querySelector("[data-photos]"), 4);
        form.querySelectorAll("[data-rm-file]").forEach((b) => b.addEventListener("click", async () => {
          if (!(await confirmAction({ title: "Remove this file?", confirmText: "Remove", variant: "danger" }))) return;
          try {
            await transportApi(`/api/transport/vehicles/${v.id}/files/${b.dataset.rmFile}`, { method: "DELETE" });
            await view.close(true);
            await loadVehicles();
            openVehicle(vehicles.find((x) => x.id === v.id));
          } catch (error) { showNotification(error.message, "error"); }
        }));
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const fd = new FormData();
          ["registration", "vehicle_type", "capacity_note"].forEach((k) => fd.append(k, form[k].value.trim()));
          fd.append("size_class", form.size_class.value || "");
          meta.cargo_types.forEach((c) => fd.append(`cargo_${c.key}`, form[`cargo_${c.key}`].value.trim()));
          picker.files().forEach((f) => fd.append("photos", f));
          [...form.documents.files].forEach((f) => fd.append("documents", f));
          try {
            const res = await withBusy(form.querySelector("button[type=submit]"), "Saving…", () => transportApi(v ? `/api/transport/vehicles/${v.id}` : "/api/transport/vehicles", { method: v ? "PUT" : "POST", body: fd }));
            showNotification(res.message, "success");
            await view.close(true);
            loadVehicles();
          } catch (error) {
            showFieldErrors(form, error);
            showNotification(error.message, "error");
          }
        });
      }

      // ------------------------------------------------------------- drivers
      let driverList = [];
      async function loadDrivers() {
        const list = document.getElementById("drivers-list");
        try { driverList = (await transportApi("/api/transport/drivers")).data; } catch (error) { list.innerHTML = `<p class="text-sm text-red-600">${escapeHtml(error.message)}</p>`; return; }
        list.innerHTML = driverList.length ? driverList.map((x) => `
          <div class="tp-driver">
            <div class="tp-driver-top">
              <span class="acc-av">${escapeHtml(x.name.split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase())}</span>
              <div class="min-w-0 flex-1"><b class="block text-gray-900 truncate">${escapeHtml(x.name)}</b><a class="text-sm acc-link" href="tel:${escapeHtml(x.phone.replace(/[^\d+]/g, ""))}">${escapeHtml(x.phone)}</a></div>
              <span class="so-pill ${!x.is_active ? "so-off" : x.busy_booking ? "so-act" : "so-done"}">${!x.is_active ? "Off" : x.busy_booking ? `On ${escapeHtml(x.busy_booking.reference)}` : "Free"}</span>
            </div>
            <p class="text-sm text-gray-600 mt-3">${!x.has_code ? `<span class="text-amber-700 font-semibold">No sign-in code yet</span>` : x.last_login_at ? `Last signed in ${escapeHtml(timeAgo(x.last_login_at))}` : "Hasn't signed in yet"} · ${x.completed} completed</p>
            <div class="tr-actions mt-3">
              <button type="button" class="acc-mini-btn" data-code="${x.id}">${x.has_code ? "New Sign-In Code" : "Get Sign-In Code"}</button>
              <button type="button" class="acc-mini-btn" data-edit-driver="${x.id}">Edit</button>
              <button type="button" class="acc-mini-btn" data-driver-toggle="${x.id}">${x.is_active ? "Switch Off" : "Switch On"}</button>
            </div>
          </div>`).join("")
          : `<div class="empty-state"><p class="font-semibold text-gray-800">No drivers yet</p><p class="text-sm mt-1">Add your drivers. Each signs in with their phone number and a code you give them.</p></div>`;
        const find = (id) => driverList.find((x) => String(x.id) === String(id));
        list.querySelectorAll("[data-code]").forEach((b) => b.addEventListener("click", async () => {
          const x = find(b.dataset.code);
          if (x.has_code && !(await confirmAction({ title: `New sign-in code for ${x.name}?`, message: "Their current code stops working. They'll need the new one to sign in.", confirmText: "Make New Code" }))) return;
          try {
            const res = await transportApi(`/api/transport/drivers/${x.id}/code`, { method: "POST" });
            showDriverCode(res.data, res.code);
            loadDrivers();
          } catch (error) { showNotification(error.message, "error"); }
        }));
        list.querySelectorAll("[data-edit-driver]").forEach((b) => b.addEventListener("click", () => openDriver(find(b.dataset.editDriver))));
        list.querySelectorAll("[data-driver-toggle]").forEach((b) => b.addEventListener("click", async () => {
          const x = find(b.dataset.driverToggle);
          if (x.is_active && !(await confirmAction({ title: `Switch off ${x.name}?`, message: "They're signed out and can't sign in until you switch them on again.", confirmText: "Switch Off", variant: "danger" }))) return;
          try {
            const res = await transportApi(`/api/transport/drivers/${x.id}/status`, { method: "PATCH", body: { active: !x.is_active } });
            showNotification(res.message, "success");
            loadDrivers();
          } catch (error) { showNotification(error.message, "error"); }
        }));
      }
      document.getElementById("add-driver").addEventListener("click", () => openDriver(null));

      // The sign-in code, shown once, to send to the driver.
      function showDriverCode(x, code) {
        const link = `${location.origin}/transport/login?as=driver`;
        const message = `Hi ${x.name.split(/\s+/)[0]}, sign in to Frontier Transport at ${link} with your phone number ${x.phone} and the code ${code}.`;
        const digits = x.phone.replace(/\D/g, "");
        // Zambian numbers in any form (0977…, 260977…, +260 977…) -> 260 and the last 9 digits.
        const wa = `https://wa.me/${digits.length >= 9 ? `260${digits.slice(-9)}` : digits}?text=${encodeURIComponent(message)}`;
        const view = openAdminView({ title: `${x.name}'s sign-in code`, params: {} });
        view.body.innerHTML = `
          <div class="acc-card max-w-md">
            <h1 class="admin-view-title">Sign-In Code for ${escapeHtml(x.name)}</h1>
            <p class="text-sm text-gray-600">Send it to ${escapeHtml(x.name)}. They sign in with their phone number <b>${escapeHtml(x.phone)}</b> and this code. It's shown only now.</p>
            <div class="tp-code" data-code-text>${escapeHtml(code)}</div>
            <div class="tr-actions"><a class="acc-btn" href="${escapeHtml(wa)}" target="_blank" rel="noopener" style="width:auto">Send by WhatsApp</a><button type="button" class="acc-mini-btn" data-copy>Copy Message</button><button type="button" class="acc-mini-btn" data-done>Done</button></div>
          </div>`;
        view.body.querySelector("[data-copy]").addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(message); showNotification("Copied. Paste it in a message to the driver.", "success"); }
          catch { window.prompt("Copy the message:", message); }
        });
        view.body.querySelector("[data-done]").addEventListener("click", () => view.close(true));
      }

      function openDriver(x) {
        const view = openAdminView({ title: x ? x.name : "Add a driver", params: {} });
        view.body.innerHTML = `
          <form class="acc-card max-w-xl" novalidate>
            <h1 class="admin-view-title">${x ? `Edit ${escapeHtml(x.name)}` : "Add a Driver"}</h1>
            <div class="space-y-4">
              <div><label class="field-label" for="d-name">Full Name</label><input id="d-name" name="name" class="field-input" maxlength="120" value="${escapeHtml(x ? x.name : "")}"><p class="field-error hidden" data-error-for="name"></p></div>
              <div><label class="field-label" for="d-phone">Phone Number</label><input id="d-phone" name="phone" type="tel" inputmode="tel" class="field-input" maxlength="30" placeholder="0977 123 456" value="${escapeHtml(x ? x.phone : "")}"><p class="text-xs text-gray-500 mt-1">They sign in with this number.</p><p class="field-error hidden" data-error-for="phone"></p></div>
              <div><label class="field-label" for="d-lic">Driving Licence No. <span class="ob-opt">(optional)</span></label><input id="d-lic" name="licence_number" class="field-input" maxlength="80" value="${escapeHtml(x && x.licence_number ? x.licence_number : "")}"><p class="field-error hidden" data-error-for="licence_number"></p></div>
            </div>
            <div class="acc-actionbar"><button type="submit" class="acc-btn">${x ? "Save Driver" : "Add Driver"}</button></div>
          </form>`;
        const form = view.body.querySelector("form");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const body = Object.fromEntries(new FormData(form));
            const res = await withBusy(form.querySelector("button[type=submit]"), "Saving…", () => transportApi(x ? `/api/transport/drivers/${x.id}` : "/api/transport/drivers", { method: x ? "PUT" : "POST", body }));
            showNotification(res.message, "success");
            await view.close(true);
            loadDrivers();
            if (res.code) showDriverCode(res.data, res.code);
          } catch (error) { showFieldErrors(form, error); showNotification(error.message, "error"); }
        });
      }

      // ------------------------------------------------------------- ratings
      async function loadRatings() {
        const [rows, s] = await Promise.all([transportApi("/api/transport/ratings").then((r) => r.data), transportApi("/api/transport/summary").then((r) => r.data)]);
        document.getElementById("ratings-list").innerHTML = `
          <div class="acc-card mb-4"><p class="text-sm text-gray-600">Your average from buyers</p><p class="text-2xl mt-1">${trStarsHtml(s.rating, s.ratings)}</p></div>
          ${rows.length ? `<div class="tp-card-list">${rows.map((r) => `<div class="acc-card"><div class="flex justify-between gap-2"><span>${trStarsHtml(r.stars)}</span><span class="text-sm text-gray-500">${escapeHtml(r.reference)} · ${escapeHtml(formatDateShort(r.created_at))}</span></div>${r.feedback ? `<p class="text-sm text-gray-700 mt-2">"${escapeHtml(r.feedback)}"</p>` : ""}</div>`).join("")}</div>`
            : `<div class="empty-state"><p class="font-semibold text-gray-800">No ratings yet</p><p class="text-sm mt-1">Buyers rate you after they confirm a delivery.</p></div>`}`;
      }

      // ------------------------------------------------------- notifications
      async function loadNotifications() {
        const res = await transportApi("/api/transport/notifications");
        const list = document.getElementById("notifications-list");
        list.innerHTML = res.data.length ? `<ul class="nt-list">${res.data.map((n) => `
          <li><a href="${escapeHtml(n.link || "/transport/")}" data-link class="nt-item ${n.read_at ? "" : "is-unread"}">
            <span class="nt-icon nt-order" aria-hidden="true">${uiIcon(n.type === "account" ? "users" : "truck")}</span>
            <span class="nt-text"><span class="nt-title">${escapeHtml(n.title)}</span>${n.body ? `<span class="nt-body">${escapeHtml(n.body)}</span>` : ""}<span class="nt-time">${timeAgo(n.created_at)}</span></span>
            ${n.read_at ? "" : `<span class="nt-new">New</span>`}</a></li>`).join("")}</ul>`
          : `<div class="empty-state"><p class="font-semibold text-gray-800">No notifications yet</p></div>`;
        list.querySelectorAll("[data-link]").forEach((a) => a.addEventListener("click", (e) => {
          const url = new URL(a.href, location.origin);
          if (url.pathname !== "/transport/") return;
          e.preventDefault();
          goTo(Object.fromEntries(url.searchParams));
        }));
        if (res.unread) {
          await transportApi("/api/transport/notifications/read", { method: "POST" }).catch(() => {});
          setBadge("[data-notif-badge]", 0);
        }
      }

      // ------------------------------------------------------------- profile
      function renderDriverProfile() {
        const box = document.getElementById("profile-box");
        box.innerHTML = `
          <div class="space-y-4 min-w-0">
            <div class="acc-card"><h2 class="txd-card-title">You</h2>
              <dl class="sv-facts">
                <div><dt>Name</dt><dd>${escapeHtml(me.driver.name)}</dd></div>
                <div><dt>Phone (you sign in with it)</dt><dd>${escapeHtml(me.driver.phone)}</dd></div>
                <div><dt>Company</dt><dd>${escapeHtml(me.name)}</dd></div>
                <div><dt>Company phone</dt><dd><a class="acc-link" href="tel:${escapeHtml(me.phone.replace(/[^\d+]/g, ""))}">${escapeHtml(me.phone)}</a></dd></div>
              </dl>
              <p class="text-sm text-gray-500 mt-3">To change your name or number, ask your company.</p>
            </div>
          </div>
          <div class="space-y-4 min-w-0">
            <form class="acc-card" data-password novalidate><h2 class="txd-card-title">Choose Your Own Password</h2>
              <div class="space-y-4">
                <div><label class="field-label" for="p-cur">Current sign-in code or password</label><input id="p-cur" name="current_password" type="password" class="field-input" autocomplete="current-password"><p class="field-error hidden" data-error-for="current_password"></p></div>
                <div><label class="field-label" for="p-new">New password</label><input id="p-new" name="new_password" type="password" class="field-input" autocomplete="new-password"><p class="field-error hidden" data-error-for="new_password"></p></div>
              </div>
              <button type="submit" class="acc-btn mt-4">Save Password</button>
            </form>
            <button type="button" class="acc-btn lg:hidden" data-transport-logout>Log out</button>
          </div>`;
        box.querySelector("[data-transport-logout]").addEventListener("click", transportLogout);
        const pw = box.querySelector("[data-password]");
        bindPasswordMeter(pw.new_password, () => ({ phone: me.driver.phone }));
        pw.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const res = await withBusy(pw.querySelector("button[type=submit]"), "Saving…", () => transportApi("/api/transport/me/password", { method: "PATCH", body: { current_password: pw.current_password.value, new_password: pw.new_password.value } }));
            pw.reset();
            showNotification(res.message, "success");
          } catch (error) { showFieldErrors(pw, error); showNotification(error.message, "error"); }
        });
      }

      async function renderProfile() {
        if (isDriver()) return renderDriverProfile();
        const docs = await transportApi("/api/transport/me/documents");
        const box = document.getElementById("profile-box");
        const statusText = { pending: "Waiting for approval", approved: "Approved", rejected: "Not approved", suspended: "Suspended" }[me.status];
        box.innerHTML = `
          <div class="space-y-4 min-w-0">
            <div class="acc-card"><h2 class="txd-card-title">Your account</h2>
              <dl class="sv-facts">
                <div><dt>Name</dt><dd>${escapeHtml(me.name)}${me.kind === "company" ? " (company)" : ""}</dd></div>
                <div><dt>Status</dt><dd>${escapeHtml(statusText)}${me.is_active ? "" : " · deactivated"}</dd></div>
                <div><dt>Area</dt><dd>${escapeHtml(`${me.district}, ${me.province}`)}</dd></div>
                <div><dt>Coverage (confirmed by Frontier)</dt><dd>${me.coverage_active && me.coverage_km ? `${me.coverage_km} km by road from your address` : me.coverage_km ? `${me.coverage_km} km (switched off by Frontier)` : "Not set yet"}</dd></div>
                ${me.licence_number ? `<div><dt>Licence / permit</dt><dd>${escapeHtml(me.licence_number)}</dd></div>` : ""}
                ${me.registration_number ? `<div><dt>Business registration</dt><dd>${escapeHtml(me.registration_number)}</dd></div>` : ""}
              </dl>
              <p class="text-sm text-gray-500 mt-3">Your coverage is measured from your physical address. To change your address or area, please contact Frontier.</p>
            </div>
            <form class="acc-card" data-coverage novalidate><h2 class="txd-card-title">Coverage radius</h2>
              <p class="text-sm text-gray-600">How far you're willing to travel, by road from your address. Frontier confirms a change before it applies to new requests.</p>
              <label class="field-label mt-3" for="p-km">Preferred coverage</label>
              <div class="tr-km-row"><input id="p-km" name="preferred_coverage_km" type="number" min="5" max="1000" step="1" inputmode="numeric" class="field-input" value="${me.preferred_coverage_km ?? me.coverage_km ?? ""}"><span>km</span></div>
              <p class="field-error hidden" data-error-for="preferred_coverage_km"></p>
              ${me.preferred_coverage_km !== null && me.preferred_coverage_km !== me.coverage_km ? `<p class="tr-note-box mt-3">You asked for <b>${me.preferred_coverage_km} km</b>. Waiting for Frontier to confirm${me.coverage_km ? `; until then your coverage stays ${me.coverage_km} km` : ""}.</p>` : ""}
              <button type="submit" class="acc-btn mt-4">Send to Frontier</button>
            </form>
            <form class="acc-card" data-contact novalidate><h2 class="txd-card-title">Contact details</h2>
              <div class="space-y-4">
                ${me.kind === "company" ? `<div><label class="field-label" for="p-cp">Contact person</label><input id="p-cp" name="contact_person" class="field-input" maxlength="120" value="${escapeHtml(me.contact_person || "")}"></div>` : ""}
                <div><label class="field-label" for="p-phone">Phone</label><input id="p-phone" name="phone" class="field-input" maxlength="30" value="${escapeHtml(me.phone)}"><p class="field-error hidden" data-error-for="phone"></p></div>
                <div><label class="field-label" for="p-email">Email</label><input id="p-email" name="email" type="email" class="field-input" maxlength="255" value="${escapeHtml(me.email)}"><p class="field-error hidden" data-error-for="email"></p></div>
                <div><label class="field-label" for="p-addr">Physical address</label><input id="p-addr" name="address" class="field-input" maxlength="255" value="${escapeHtml(me.address)}"><p class="field-error hidden" data-error-for="address"></p></div>
              </div>
              <button type="submit" class="acc-btn mt-4">Save details</button>
            </form>
          </div>
          <div class="space-y-4 min-w-0">
            <div class="acc-card"><h2 class="txd-card-title">Documents</h2>
              ${docs.data.length ? `<ul class="tr-qty">${docs.data.map((d0) => `<li><a class="acc-link" href="/api/transport/me/documents/${d0.id}" target="_blank" rel="noopener">${escapeHtml(d0.original_name || d0.type_label)}</a><span class="text-gray-500">${escapeHtml(d0.type_label)}</span></li>`).join("")}</ul>` : `<p class="text-sm text-gray-600">No documents.</p>`}
              <form data-docs class="mt-4" novalidate>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <select name="doc_types" class="field-input">${Object.entries(docs.types).map(([k, v]) => `<option value="${k}">${escapeHtml(v)}</option>`).join("")}</select>
                  <input type="file" name="documents" accept="application/pdf,image/jpeg,image/png,image/webp" class="text-sm">
                </div>
                <p class="field-error hidden" data-error-for="documents"></p>
                <button type="submit" class="acc-mini-btn mt-3">Upload document</button>
              </form>
            </div>
            <form class="acc-card" data-password novalidate><h2 class="txd-card-title">Change password</h2>
              <div class="space-y-4">
                <div><label class="field-label" for="p-cur">Current password</label><input id="p-cur" name="current_password" type="password" class="field-input" autocomplete="current-password"><p class="field-error hidden" data-error-for="current_password"></p></div>
                <div><label class="field-label" for="p-new">New password</label><input id="p-new" name="new_password" type="password" class="field-input" autocomplete="new-password"><p class="field-error hidden" data-error-for="new_password"></p></div>
              </div>
              <button type="submit" class="acc-btn mt-4">Change password</button>
            </form>
            <button type="button" class="acc-btn lg:hidden" data-transport-logout>Log out</button>
          </div>`;
        box.querySelector("[data-transport-logout]").addEventListener("click", transportLogout);
        const contact = box.querySelector("[data-contact]");
        contact.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const res = await withBusy(contact.querySelector("button[type=submit]"), "Saving…", () => transportApi("/api/transport/me", { method: "PUT", body: Object.fromEntries(new FormData(contact)) }));
            me = { ...me, ...res.data };
            showNotification(res.message, "success");
          } catch (error) { showFieldErrors(contact, error); showNotification(error.message, "error"); }
        });
        const cov = box.querySelector("[data-coverage]");
        cov.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const res = await withBusy(cov.querySelector("button[type=submit]"), "Sending…", () => transportApi("/api/transport/me/coverage", { method: "PATCH", body: { preferred_coverage_km: cov.preferred_coverage_km.value } }));
            me = { ...me, ...res.data };
            showNotification(res.message, "success");
            renderProfile();
          } catch (error) { showFieldErrors(cov, error); showNotification(error.message, "error"); }
        });
        const docForm = box.querySelector("[data-docs]");
        docForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!docForm.documents.files.length) return showFieldErrors(docForm, { errors: { documents: "Choose a file." } });
          try {
            const res = await withBusy(docForm.querySelector("button[type=submit]"), "Uploading…", () => transportApi("/api/transport/me/documents", { method: "POST", body: new FormData(docForm) }));
            showNotification(res.message, "success");
            renderProfile();
          } catch (error) { showFieldErrors(docForm, error); showNotification(error.message, "error"); }
        });
        const pw = box.querySelector("[data-password]");
        bindPasswordMeter(pw.new_password, () => ({ email: me.email, phone: me.phone }));
        pw.addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const res = await withBusy(pw.querySelector("button[type=submit]"), "Saving…", () => transportApi("/api/transport/me/password", { method: "PATCH", body: { current_password: pw.current_password.value, new_password: pw.new_password.value } }));
            pw.reset();
            showNotification(res.message, "success");
          } catch (error) { showFieldErrors(pw, error); showNotification(error.message, "error"); }
        });
      }

      document.getElementById("available").addEventListener("change", async (e) => {
        try {
          const res = await transportApi("/api/transport/me/availability", { method: "PATCH", body: { available: e.target.checked } });
          me = { ...me, ...res.data };
          showNotification(res.message, "success");
          renderBanner();
        } catch (error) {
          e.target.checked = !e.target.checked;
          showNotification(error.message, "error");
        }
      });

      // ------------------------------------------------------- go to / live
      async function goTo(q) {
        setTab(q.tab || (q.booking ? "deliveries" : "requests"));
        if (q.booking) await openBooking(q.booking);
      }

      function listen() {
        if (!window.EventSource) return;
        const es = new EventSource("/api/transport/events");
        es.addEventListener("ready", (e) => setBadge("[data-notif-badge]", JSON.parse(e.data).unread));
        es.addEventListener("notification", async (e) => {
          const { notification, unread } = JSON.parse(e.data);
          setBadge("[data-notif-badge]", unread);
          showNotification(notification.title, "info");
          if (notification.type === "account") { me = { ...me, ...(await transportApi("/api/transport/auth/me")).data }; renderBanner(); }
          if (state.tab === "requests") loadRequests();
          if (state.tab === "deliveries") loadDeliveries();
          if (state.tab === "notifications") loadNotifications();
          loadStats();
        });
        es.addEventListener("transport", (e) => {
          const t = JSON.parse(e.data);
          if (bookingView && bookingView.bookingId === t.booking_id) {
            if (trEditing(bookingView.el)) showNotification("This delivery was just updated. Your form is kept; reopen the delivery after saving to see the change.", "info");
            else openBooking(t.booking_id, { replace: true });
          }
          loadStats();
        });
        es.addEventListener("signed-out", () => { es.close(); window.location.href = "/transport/login"; });
      }

      (async () => {
        try { me = (await transportApi("/api/transport/auth/me")).data; } catch { return; }
        renderTransportShell(me);
        document.getElementById("tp-main").hidden = false;
        setBadge("[data-notif-badge]", me.unread);
        try { vehicles = (await transportApi("/api/transport/vehicles")).data; } catch {}
        renderBanner();
        const q = getQueryParams();
        if (q.welcome) showNotification(me.kind === "company" ? "Thank you for registering. Frontier will review your details. Give your drivers their sign-in codes in the Drivers tab." : "Thank you for registering. Frontier will review your details.", "success");
        await goTo(q);
        listen();
      })().catch((error) => showNotification(error.message, "error"));
    </script>
  </body>
</html>
