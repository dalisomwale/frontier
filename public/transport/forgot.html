<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Reset Password - Frontier Transport</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/transport.js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="page-header"></div>
    <main class="max-w-sm mx-auto px-4 py-10 sm:py-16">
      <div class="bg-white rounded-2xl border border-gray-100 p-6 sm:p-8">
        <h1 class="text-xl font-bold text-gray-900">Forgot your password?</h1>
        <p class="text-sm text-gray-600 mt-2">Enter the email of your transport account and we'll send you a link to choose a new password.</p>
        <form id="form" class="space-y-4 mt-6" novalidate>
          <div id="form-alert" class="hidden alert text-sm mb-0" role="alert"></div>
          <div><label for="email" class="field-label">Email</label><input id="email" name="email" type="email" class="field-input" autocomplete="email" required /></div>
          <button id="submit-btn" type="submit" class="w-full inline-flex justify-center items-center gap-2 bg-blue-600 text-white px-4 py-3 rounded-lg hover:bg-blue-700 font-semibold">Send the link</button>
        </form>
        <p class="text-sm text-gray-600 text-center mt-6"><a href="/transport/login" class="text-blue-700 font-medium hover:underline">Back to sign in</a></p>
      </div>
    </main>
    <script>
      document.getElementById("page-header").innerHTML = transportPageHeader();
      const form = document.getElementById("form");
      const box = document.getElementById("form-alert");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const res = await withBusy(document.getElementById("submit-btn"), "Sending…", () => transportApi("/api/transport/auth/forgot", { method: "POST", body: { email: form.email.value.trim() } }));
          box.className = "alert alert-success text-sm mb-0";
          box.textContent = res.message;
        } catch (error) {
          box.className = "alert alert-error text-sm mb-0";
          box.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
