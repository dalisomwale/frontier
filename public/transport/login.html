<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Transport Sign in - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/transport.js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="page-header"></div>

    <main class="max-w-lg mx-auto px-4 py-8 sm:py-12">
      <a href="/" class="auth-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Back to home</span></a>
      <div class="ob-card ob-auth">
        <div class="ob-head">
          <span class="ob-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
          <h1 class="ob-title">Welcome Back</h1>
          <p class="ob-sub">Sign in to your transport account.</p>
        </div>
        <div class="ob-tabs" role="tablist" aria-label="Sign in as">
          <button type="button" role="tab" aria-selected="true" data-as="owner">Provider</button>
          <button type="button" role="tab" aria-selected="false" data-as="driver">Company Driver</button>
        </div>
        <form id="login-form" class="space-y-4" novalidate>
          <div id="form-alert" class="hidden alert text-sm mb-0" role="alert"></div>
          <div data-owner>
            <label for="email" class="field-label">Email</label>
            <input id="email" name="email" type="email" class="field-input" autocomplete="username" />
          </div>
          <div data-driver hidden>
            <label for="phone" class="field-label">Phone Number</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" class="field-input" autocomplete="tel" placeholder="0977 123 456" />
          </div>
          <div>
            <label for="password" class="field-label" data-password-label>Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" class="field-input pr-12" autocomplete="current-password" />
              <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600" aria-label="Show password"></button>
            </div>
            <p class="text-xs text-gray-500 mt-1" data-driver hidden>The code your company gave you, e.g. ABCD-2345.</p>
          </div>
          <div class="ob-auth-row">
            <label><input id="remember" name="remember" type="checkbox" checked /> Keep me signed in</label>
            <a href="/transport/forgot" data-owner>Forgot Password?</a>
          </div>
          <button id="submit-btn" type="submit" class="ob-btn w-full">Sign In</button>
        </form>
        <p class="ob-foot" data-owner>Don't have an account? <a href="/transport/register">Create One</a></p>
        <p class="ob-foot" data-driver hidden>No code yet? Ask your company for one.</p>
      </div>
    </main>

    <script>
      document.getElementById("page-header").innerHTML = authPageHeader();
      bindPasswordToggles();
      const form = document.getElementById("login-form");
      const alertBox = document.getElementById("form-alert");
      const showAlert = (message, kind = "error") => { alertBox.className = `alert alert-${kind} text-sm mb-0`; alertBox.textContent = message; };
      if (getQueryParams().reset) showAlert("Password updated. You can now sign in.", "success");
      // Sign in as the company / owner-driver (email), or as a company's driver (phone and code).
      let as = getQueryParams().as === "driver" ? "driver" : "owner";
      const paintAs = () => {
        document.querySelectorAll("[data-as]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.as === as)));
        document.querySelectorAll("[data-owner]").forEach((el) => { el.hidden = as !== "owner"; });
        document.querySelectorAll("[data-driver]").forEach((el) => { el.hidden = as !== "driver"; });
        document.querySelector("[data-password-label]").textContent = as === "driver" ? "Sign-In Code or Password" : "Password";
        alertBox.className = "hidden";
      };
      document.querySelectorAll("[data-as]").forEach((b) => b.addEventListener("click", () => { as = b.dataset.as; paintAs(); (as === "driver" ? form.phone : form.email).focus(); }));
      paintAs();
      transportApi("/api/transport/auth/me").then(() => (window.location.href = transportNext())).catch(() => {});
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = form.password.value;
        const remember = form.elements.remember.checked;
        const who = as === "driver" ? form.phone.value.trim() : form.email.value.trim();
        if (!who || !password) return showAlert(as === "driver" ? "Please enter your phone number and sign-in code." : "Please enter your email and password.");
        try {
          await withBusy(document.getElementById("submit-btn"), "Signing in…", () => (as === "driver"
            ? transportApi("/api/transport/auth/driver-login", { method: "POST", body: { phone: who, password, remember } })
            : transportApi("/api/transport/auth/login", { method: "POST", body: { email: who, password, remember } })));
          window.location.href = transportNext();
        } catch (error) {
          showAlert(error.message);
          form.password.value = "";
          form.password.focus();
        }
      });
    </script>
  </body>
</html>
