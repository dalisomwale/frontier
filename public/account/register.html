<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Create an account - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/password-rules.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/buyer.js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="account-header"></div>
    <header class="page-band">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="page-band-title">Create account</h1>
        <span class="page-band-swoosh" aria-hidden="true"></span>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
      <div class="acc-split acc-single">
        <div class="acc-card">
          <form id="register-form" class="space-y-4" novalidate>
            <div id="checkout-note" class="alert alert-info text-sm mb-0" hidden>You need an account to check out. Your cart is kept.</div>
            <div id="form-alert" class="hidden alert text-sm mb-0" role="alert"></div>
            <div>
              <label for="full_name" class="field-label">Full name </label>
              <input id="full_name" name="full_name" class="field-input" autocomplete="name" maxlength="120" required />
              <p class="field-error hidden" data-error-for="full_name"></p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="email" class="field-label">Email </label>
                <input id="email" name="email" type="email" class="field-input" autocomplete="email" required />
                <p class="field-error hidden" data-error-for="email"></p>
              </div>
              <div>
                <label for="phone" class="field-label">Phone number </label>
                <input id="phone" name="phone" type="tel" class="field-input" autocomplete="tel" placeholder="0977 123 456" required />
                <p class="field-error hidden" data-error-for="phone"></p>
              </div>
            </div>
          <div>
            <label for="password" class="field-label">Password </label>
            <div class="relative">
              <input id="password" name="password" type="password" class="field-input pr-12" autocomplete="new-password" required />
              <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600" aria-label="Show password"></button>
            </div>
            <p class="field-error hidden" data-error-for="password"></p>
          </div>
            <label class="co-terms-box">
              <input type="checkbox" name="accept_terms" />
              <span>I accept the <a href="/terms.html" target="_blank" class="acc-link">terms and policies</a></span>
            </label>
            <p class="field-error hidden -mt-2" data-error-for="accept_terms"></p>
            <button id="submit-btn" type="submit" class="acc-btn">Create account</button>
            <p class="text-sm text-gray-600 text-center">Have an account? <a id="login-link2" href="/account/login.html" class="acc-link font-semibold">Log in</a> · <a href="/seller/register.html" class="acc-link font-semibold">Sell with us</a></p>
          </form>
        </div>
      </div>
    </main>

    <script src="/js/app-shell.js"></script>
    <script>
      document.getElementById("account-header").innerHTML = accountHeader(null);
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
      if (typeof renderBottomNav === "function") renderBottomNav("public");
      bindPasswordToggles();
      const alertBox = document.getElementById("form-alert");
      const showAlert = (message, kind = "error") => {
        alertBox.className = `alert alert-${kind} text-sm mb-0`;
        alertBox.textContent = message;
      };
      const form = document.getElementById("register-form");
      const next = buyerNext();
      if (next.startsWith("/checkout")) document.getElementById("checkout-note").hidden = false;
      document.getElementById("login-link2").href = `/account/login.html${location.search}`;
      bindPasswordMeter(form.password, () => ({ email: form.email.value, phone: form.phone.value }));
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = {
          full_name: form.full_name.value.trim(),
          email: form.email.value.trim(),
          phone: form.phone.value.trim(),
          password: form.password.value,
          accept_terms: form.accept_terms.checked,
        };
        try {
          await withBusy(document.getElementById("submit-btn"), "Creating your account…", () =>
            buyerApi("/api/buyer/auth/register", { method: "POST", body }));
          setBuyerHint(true);
          window.location.href = next === "/account/" ? "/account/?welcome=1" : next;
        } catch (error) {
          showFieldErrors(form, error);
          showAlert(error.message);
          alertBox.scrollIntoView({ block: "nearest" });
        }
      });
    </script>
    <div id="app-bottom-nav"></div>
  </body>
</html>
