<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Create an account - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/site-nav.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/password-rules.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/buyer.js"></script>
    <script src="/js/onboarding.js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="account-header"></div>
    <main class="max-w-lg mx-auto px-4 py-8 sm:py-12">
      <section class="page-hero is-bleed auth-hero" style="--page-hero-img:url('/images/hero/hero-reel-1.webp')">
        <div class="page-hero-copy">
          <h1 class="page-hero-title">Create Your <span class="page-hero-accent">Account</span></h1>
          <p class="page-hero-sub">Your customer account: order, pay and track deliveries.</p>
        </div>
      </section>
      <a href="/" class="auth-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Back to home</span></a>
      <div class="ob-card">
        <form id="register-form" novalidate>
          <div id="checkout-note" class="alert alert-info text-sm mb-4" hidden>Create an account to check out. Your cart is kept.</div>
          <div id="form-alert" class="hidden alert text-sm mb-4" role="alert"></div>
          <div data-ob-progress></div>

          <section class="ob-step" data-title="About You">
            <div>
              <label for="full_name" class="field-label">Full Name</label>
              <input id="full_name" name="full_name" class="field-input" autocomplete="name" maxlength="120" required />
              <p class="field-error hidden" data-error-for="full_name"></p>
            </div>
            <div>
              <label for="phone" class="field-label">Phone Number</label>
              <input id="phone" name="phone" type="tel" class="field-input" autocomplete="tel" inputmode="tel" placeholder="0977 123 456" required />
              <p class="field-error hidden" data-error-for="phone"></p>
            </div>
            <div>
              <label for="email" class="field-label">Email</label>
              <input id="email" name="email" type="email" class="field-input" autocomplete="email" inputmode="email" required />
              <p class="field-error hidden" data-error-for="email"></p>
            </div>
          </section>

          <section class="ob-step" data-title="Password" hidden>
            <div>
              <label for="password" class="field-label">Password</label>
              <div class="relative">
                <input id="password" name="password" type="password" class="field-input pr-12" autocomplete="new-password" required />
                <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600" aria-label="Show password"></button>
              </div>
              <p class="field-error hidden" data-error-for="password"></p>
            </div>
            <div>
              <label for="confirm_password" class="field-label">Confirm Password</label>
              <div class="relative">
                <input id="confirm_password" name="confirm_password" type="password" class="field-input pr-12" autocomplete="new-password" required />
                <button type="button" data-toggle-password="confirm_password" class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600" aria-label="Show password"></button>
              </div>
              <p class="field-error hidden" data-error-for="confirm_password"></p>
            </div>
            <label class="co-terms-box">
              <input type="checkbox" name="accept_terms" />
              <span>I accept the <a href="/terms" target="_blank" class="acc-link">Terms</a> and the <a href="/refund-policy" target="_blank" class="acc-link">Refund</a>, <a href="/return-policy" target="_blank" class="acc-link">Return</a> and <a href="/cancellation-policy" target="_blank" class="acc-link">Cancellation</a> policies.</span>
            </label>
            <p class="field-error hidden" data-error-for="accept_terms"></p>
          </section>

          <div class="ob-nav">
            <button type="button" class="ob-btn ob-btn-back" data-ob-back>Back</button>
            <button type="button" class="ob-btn" data-ob-next>Continue</button>
            <button id="submit-btn" type="submit" class="ob-btn" data-ob-submit hidden>Create Account</button>
          </div>
        </form>
        <p class="ob-foot">Already have an account? <a id="login-link2" href="/account/login">Sign In</a></p>
        <p class="ob-foot !mt-2">Start selling with us? <a href="/seller/register">Register as a Seller</a></p>
      </div>
    </main>

    <script src="/js/app-shell.js"></script>
    <script>
      document.getElementById("account-header").innerHTML = authPageHeader();
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
      bindPasswordToggles();
      const alertBox = document.getElementById("form-alert");
      const showAlert = (message, kind = "error") => {
        alertBox.className = `alert alert-${kind} text-sm mb-4`;
        alertBox.textContent = message;
      };
      const form = document.getElementById("register-form");
      const next = buyerNext();
      if (next.startsWith("/checkout")) document.getElementById("checkout-note").hidden = false;
      document.getElementById("login-link2").href = `/account/login${location.search}`;
      const meter = bindPasswordMeter(form.password, () => ({ email: form.email.value, phone: form.phone.value }));
      const steps = obSteps(form, {
        check(i) {
          const e = {};
          if (i === 0) {
            if (form.full_name.value.trim().length < 2) e.full_name = "Please enter your full name.";
            if (!obPhoneOk(form.phone.value)) e.phone = "Please enter your phone number, e.g. 0977 123 456.";
            if (!OB_EMAIL.test(form.email.value.trim())) e.email = "Please enter a valid email address.";
          }
          if (i === 1) {
            if (meter && meter.problem()) e.password = meter.problem();
            else if (!form.password.value) e.password = "Please choose a password.";
            if (form.password.value && form.confirm_password.value !== form.password.value) e.confirm_password = form.confirm_password.value ? "The passwords don't match." : "Please type your password again.";
            if (!form.accept_terms.checked) e.accept_terms = "Please accept the terms to continue.";
          }
          return e;
        },
        onStep: () => alertBox.classList.add("hidden"),
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = {
          full_name: form.full_name.value.trim(),
          email: form.email.value.trim(),
          phone: form.phone.value.trim(),
          password: form.password.value,
          confirm_password: form.confirm_password.value,
          accept_terms: form.accept_terms.checked,
        };
        try {
          await withBusy(document.getElementById("submit-btn"), "Creating your account…", () =>
            buyerApi("/api/buyer/auth/register", { method: "POST", body }));
          setBuyerHint(true);
          window.location.href = next === "/account/" ? "/account/?welcome=1" : next;
        } catch (error) {
          const errs = error.errors || {};
          steps.showErrors(errs);
          if (!Object.keys(errs).some((k) => form.querySelector(`[data-error-for="${k}"]`))) showAlert(error.message);
        }
      });
    </script>
  </body>
</html>
