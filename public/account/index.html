<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>My account - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/site-nav.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/password-rules.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/livestock.js"></script>
    <script src="/js/buyer.js"></script>
    <link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css" />
    <script src="/vendor/leaflet-1.9.4/leaflet.js"></script>
    <script src="/js/transport-ui.js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen account-page">
    <div id="account-header"></div>

    <div class="acc-layout">
      <aside class="acc-nav" id="acc-nav" aria-label="My account">
        <div class="acc-user">
          <span class="acc-av" id="nav-av"></span>
          <div class="min-w-0"><p class="acc-user-name" id="nav-name"></p><p class="acc-user-sub">Buyer account</p></div>
        </div>
        <nav class="acc-links">
          <p class="acc-section">Shopping</p>
          <a href="/account/?tab=orders" data-tab-link="orders"><span data-icon="cart"></span><span>My Orders</span><span class="acc-count" data-badge="orders" hidden></span></a>
          <a href="/#listings" class="acc-shop-link"><span data-icon="listings"></span><span>Shop Livestock</span></a>
          <a href="/#feed" class="acc-shop-link"><span data-icon="feed"></span><span>Shop Feed</span></a>
          <p class="acc-section">Account</p>
          <a href="/account/?tab=notifications" data-tab-link="notifications"><span data-icon="bell"></span><span>Notifications</span><span class="acc-count" data-badge="notifications" hidden></span></a>
          <a href="/account/?tab=profile" data-tab-link="profile"><span data-icon="users"></span><span>Profile</span></a>
          <button type="button" data-logout class="acc-logout-desk"><span data-icon="logout"></span><span>Sign Out</span></button>
        </nav>
      </aside>

      <main id="acc-main" class="acc-main">
        <div id="verify-banner" class="alert alert-warning text-sm mb-4 flex flex-wrap items-center justify-between gap-2" hidden>
          <span>Please confirm your email: check <b id="verify-email"></b>.</span>
          <button type="button" id="resend-btn" class="acc-mini-btn">Send The Link Again</button>
        </div>
        <div class="acc-head">
          <h1 class="admin-view-title !mb-0" id="page-title">My Orders</h1>
        </div>

        <section id="tab-orders">
          <div class="sl-card">
            <div class="sl-toolbar">
              <div class="seg" id="order-tabs"></div>
              <div class="relative md:ml-auto md:w-72">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" data-icon="search"></span>
                <input id="order-search" type="search" placeholder="Search order or listing" class="field-input !py-2 !pl-9 !text-sm" />
              </div>
            </div>
            <div id="orders-list"></div>
          </div>
        </section>

        <section id="tab-notifications" hidden>
          <div class="sl-card"><div id="notifications-list"></div></div>
        </section>

        <section id="tab-profile" hidden>
          <div class="acc-profile">
            <div class="acc-card">
              <h2 class="txd-card-title">Your Details</h2>
              <form id="profile-form" class="space-y-4" novalidate>
                <div id="profile-alert" class="hidden alert text-sm mb-0" role="alert"></div>
                <div>
                  <label for="p_full_name" class="field-label">Full name</label>
                  <input id="p_full_name" name="full_name" class="field-input" autocomplete="name" maxlength="120" />
                  <p class="field-error hidden" data-error-for="full_name"></p>
                </div>
                <div>
                  <label for="p_email" class="field-label">Email</label>
                  <input id="p_email" name="email" type="email" class="field-input" autocomplete="email" />
                  <p class="field-error hidden" data-error-for="email"></p>
                </div>
                <div>
                  <label for="p_phone" class="field-label">Phone number</label>
                  <input id="p_phone" name="phone" type="tel" class="field-input" autocomplete="tel" />
                  <p class="field-error hidden" data-error-for="phone"></p>
                </div>
                <button type="submit" id="profile-btn" class="acc-btn">Save Details</button>
              </form>
            </div>
            <div class="acc-card">
              <h2 class="txd-card-title">Change Password</h2>
              <form id="password-form" class="space-y-4" novalidate>
                <div id="password-alert" class="hidden alert text-sm mb-0" role="alert"></div>
                <div>
                  <label for="current_password" class="field-label">Current password</label>
                  <div class="relative">
                    <input id="current_password" name="current_password" type="password" class="field-input pr-12" autocomplete="current-password" />
                    <button type="button" data-toggle-password="current_password" class="absolute inset-y-0 right-0 px-3 text-gray-400" aria-label="Show password"></button>
                  </div>
                  <p class="field-error hidden" data-error-for="current_password"></p>
                </div>
                <div>
                  <label for="new_password" class="field-label">New password</label>
                  <div class="relative">
                    <input id="new_password" name="new_password" type="password" class="field-input pr-12" autocomplete="new-password" />
                    <button type="button" data-toggle-password="new_password" class="absolute inset-y-0 right-0 px-3 text-gray-400" aria-label="Show password"></button>
                  </div>
                  <p class="field-error hidden" data-error-for="new_password"></p>
                </div>
                <button type="submit" id="password-btn" class="acc-btn">Change Password</button>
              </form>
            </div>
            <button type="button" class="acc-btn acc-logout-phone" data-logout>Sign Out</button>
          </div>
        </section>
      </main>
    </div>
    <footer id="site-footer"></footer>

    <div id="app-bottom-nav"></div>
    <script src="/js/app-shell.js"></script>
    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
      renderBottomNav("buyer");
      bindPasswordToggles();
      let me = null;
      let orders = [];
      let notes = [];
      const TITLES = { orders: "My orders", notifications: "Notifications", profile: "Profile" };
      const STAGES = {
        unpaid: { label: "Not paid", cls: "so-off" },
        paid: { label: "Paid", cls: "so-open" },
        sent: { label: "Confirm receipt", cls: "so-act" },
        received: { label: "Completed", cls: "so-done" },
        completed: { label: "Completed", cls: "so-done" },
        cancelled: { label: "Cancelled", cls: "so-off" },
      };
      const toConfirm = (o) => o.stage === "sent" || Boolean(o.transport && o.transport.status === "awaiting_confirmation");
      const ORDER_TABS = [
        { key: "all", label: "All", test: () => true },
        { key: "confirm", label: "To confirm", test: toConfirm },
        { key: "progress", label: "In progress", test: (o) => o.stage === "paid" && !toConfirm(o) },
        { key: "done", label: "Completed", test: (o) => ["received", "completed"].includes(o.stage) },
        { key: "unpaid", label: "Not paid", test: (o) => ["unpaid", "cancelled"].includes(o.stage) },
      ];
      const filter = { tab: "all", q: "" };
      const thumb = (o, cls = "w-6 h-6") => (o.thumb_path ? `<img src="${escapeHtml(o.thumb_path)}" alt="" loading="lazy">` : livestockFallbackMedia(cls));
      const dateTime = (v) => new Date(v).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

      // ---------------------------------------------------------------- tabs
      function setTab(name, { keepViews = false } = {}) {
        if (!TITLES[name]) name = "orders";
        if (!keepViews) closeAllAdminViews();
        Object.keys(TITLES).forEach((t) => (document.getElementById(`tab-${t}`).hidden = t !== name));
        document.querySelectorAll("[data-tab-link]").forEach((a) => a.classList.toggle("active", a.dataset.tabLink === name));
        document.getElementById("page-title").textContent = TITLES[name];
        const url = new URL(location.href);
        url.searchParams.set("tab", name);
        ["id", "confirm", "welcome", "delivery"].forEach((k) => url.searchParams.delete(k));
        history.replaceState(null, "", url.pathname + url.search);
        if (name === "notifications") loadNotifications();
        if (name === "profile") fillProfile();
      }
      document.querySelectorAll("[data-tab-link]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); setTab(a.dataset.tabLink); }));
      document.querySelectorAll("[data-logout]").forEach((b) => b.addEventListener("click", buyerLogout));

      function setBadge(name, n) {
        document.querySelectorAll(`[data-badge="${name}"]`).forEach((el) => { el.textContent = n > 99 ? "99+" : n; el.hidden = !n; });
      }

      // -------------------------------------------------------------- orders
      // Orders coming by transport show the delivery's status until it's done.
      const stageOf = (o) => (o.transport && !["received", "completed", "cancelled", "unpaid"].includes(o.stage)
        ? { label: o.transport.status === "awaiting_confirmation" ? "Confirm delivery" : o.transport.status_label, cls: o.transport.status === "awaiting_confirmation" ? "so-act" : TR_PILL[o.transport.group] || "so-open" }
        : STAGES[o.stage]);
      function orderRow(o) {
        const st = stageOf(o);
        return `
          <li>
            <button type="button" class="so-row" data-order="${o.id}">
              <span class="so-thumb">${thumb(o)}</span>
              <span class="so-text">
                <span class="min-w-0">
                  <span class="so-title block">${escapeHtml(o.title)}</span>
                  <span class="so-meta block">${escapeHtml(o.reference)} · ${escapeHtml(formatDateShort(o.ordered_at))} · ${kwacha(o.total)}</span>
                </span>
                <span class="so-pill ${st.cls}">${st.label}</span>
              </span>
              <span class="so-chev" aria-hidden="true">${uiIcon("chevronRight")}</span>
            </button>
          </li>`;
      }

      function renderOrders() {
        document.getElementById("order-tabs").innerHTML = ORDER_TABS.map((t) =>
          `<button type="button" data-otab="${t.key}" class="${t.key === filter.tab ? "active" : ""}">${t.label}<span class="count">${orders.filter(t.test).length}</span></button>`).join("");
        document.querySelectorAll("[data-otab]").forEach((b) => b.addEventListener("click", () => { filter.tab = b.dataset.otab; renderOrders(); }));
        const tab = ORDER_TABS.find((t) => t.key === filter.tab);
        const q = filter.q;
        const rows = orders.filter((o) => tab.test(o) && (!q || `${o.reference} ${o.checkout_reference || ""} ${o.title}`.toLowerCase().includes(q)));
        const list = document.getElementById("orders-list");
        if (!orders.length) {
          list.innerHTML = `<div class="empty-state"><p class="font-semibold text-gray-800">No orders yet</p><p class="text-sm mt-1">When you buy livestock or feed, your orders appear here.</p><a href="/#listings" class="acc-btn mt-4" style="width:auto;display:inline-flex">Browse Livestock</a></div>`;
          return;
        }
        list.innerHTML = rows.length
          ? `<ul class="so-list">${rows.map(orderRow).join("")}</ul>`
          : `<div class="empty-state"><p class="font-semibold text-gray-800">Nothing here</p><p class="text-sm mt-1">Try another filter or search.</p></div>`;
        list.querySelectorAll("[data-order]").forEach((b) => b.addEventListener("click", () => openOrder(b.dataset.order)));
        setBadge("orders", orders.filter(toConfirm).length);
      }
      document.getElementById("order-search").addEventListener("input", (e) => { filter.q = e.target.value.trim().toLowerCase(); renderOrders(); });

      async function loadOrders() {
        orders = (await buyerApi("/api/buyer/orders")).data;
        renderOrders();
      }

      // One order on its own page: My orders / FM-1234.
      const photoRow = (list, alt) => (list.length ? `<div class="acc-photos mt-3">${list.map((p) => `<a href="${escapeHtml(p.image_path)}" target="_blank" rel="noopener"><img src="${escapeHtml(p.thumb_path)}" alt="${alt}"></a>`).join("")}</div>` : "");
      const byParty = (o, party) => o.photos.filter((p) => (p.party || "buyer") === party);
      const sentLine = (o) => `${o.sent_method === "delivered" ? "Delivered" : "Collected"} · ${escapeHtml(formatDateShort(o.sent_at))}`;
      const proofHtml = (o) => `
        <p class="font-bold text-green-900">You confirmed · ${escapeHtml(formatDateShort(o.received_at))}</p>
        ${o.received_note ? `<p class="text-sm text-gray-700 mt-1">"${escapeHtml(o.received_note)}"</p>` : ""}
        ${photoRow(byParty(o, "buyer"), "Your photo")}`;

      function nextStepHtml(o) {
        if (o.transport && o.stage !== "unpaid") return `<div data-delivery><div class="acc-card"><span class="btn-spinner chat-spinner"></span></div></div>`;
        switch (o.stage) {
          case "unpaid":
            return `<div class="acc-card"><b>Not paid yet.</b> <span class="text-sm text-gray-600">${o.pay_url ? "You can pay now." : "We'll contact you."}</span></div>`;
          case "paid":
            return `<div class="acc-card"><b>Paid.</b> <span class="text-sm text-gray-600">We'll arrange collection or delivery.</span></div>`;
          case "sent":
            return `<div class="acc-card acc-card-warn"><b>Seller: ${sentLine(o)}</b>${photoRow(byParty(o, "seller"), "Seller's photo")}<p class="text-sm text-gray-700 mt-3">Got it? Confirm with a few photos.</p></div>`;
          case "received":
            return `<div class="acc-card acc-card-ok">${proofHtml(o)}<p class="text-sm text-gray-700 mt-3">This order is complete.</p></div>`;
          case "completed":
            return `<div class="acc-card acc-card-ok">${o.received_at ? proofHtml(o) : ""}<p class="${o.received_at ? "text-sm text-gray-700 mt-3" : "font-bold text-green-900"}">This order is complete.</p></div>`;
          default:
            return `<div class="acc-card"><p class="text-sm text-gray-700">This order was cancelled.</p></div>`;
        }
      }

      function actionHtml(o) {
        if (o.stage === "sent") return `<button type="button" class="acc-btn" data-confirm>${uiIcon("camera")}<span>Confirm I've Received It</span></button>`;
        if (o.stage === "unpaid" && o.pay_url) return `<a class="acc-btn" href="${escapeHtml(o.pay_url)}">Pay ${kwacha(o.total)}</a>`;
        return "";
      }

      let orderView = null;
      async function openOrder(id, { replace = false } = {}) {
        let o = orders.find((x) => String(x.id) === String(id));
        try {
          o = (await buyerApi(`/api/buyer/orders/${id}`)).data;
        } catch (error) {
          return showNotification(error.message, "error");
        }
        if (replace && orderView) {
          paintOrder(orderView, o);
          return;
        }
        orderView = openAdminView({ title: o.reference, params: { id: o.id }, onClose: () => { orderView = null; } });
        orderView.el.classList.add("order-view");
        paintOrder(orderView, o);
      }

      function paintOrder(view, o) {
        view.orderId = o.id;
        const st = stageOf(o);
        const action = actionHtml(o);
        view.body.innerHTML = `
          <div class="sv-head">
            <h1 class="admin-view-title !mb-0">${escapeHtml(o.title)}</h1>
            <span class="so-pill ${st.cls} so-pill-lg">${st.label}</span>
          </div>
          <div class="acc-order">
            <div class="space-y-4 min-w-0">
              ${o.transport && o.stage !== "unpaid" ? "" : orderTrackerHtml({ buyer: true, paid: o.paid || !["unpaid", "cancelled"].includes(o.stage), sent: Boolean(o.sent_at), received: Boolean(o.received_at), completed: ["received", "completed"].includes(o.stage), cancelled: o.stage === "cancelled" })}
              ${nextStepHtml(o)}
            </div>
            <div class="space-y-4">
              <div class="acc-card">
                <dl class="sv-facts">
                  <div><dt>Quantity</dt><dd>${escapeHtml(o.price_unit === "lot" ? `Whole lot (${o.units})` : o.units)}</dd></div>
                  <div><dt>${o.paid ? "Total paid" : "Total"}</dt><dd>${kwacha(o.total)}</dd></div>
                </dl>
                <details class="acc-more">
                  <summary>More details</summary>
                  <dl class="sv-facts">
                    <div><dt>Order</dt><dd>${escapeHtml(o.reference)}</dd></div>
                    ${o.checkout_reference ? `<div><dt>Payment reference</dt><dd>${escapeHtml(o.checkout_reference)}</dd></div>` : ""}
                    ${o.paid ? `<div><dt>Paid with</dt><dd>${escapeHtml(o.paid_with)}</dd></div>` : ""}
                    ${o.location ? `<div><dt>Province</dt><dd>${escapeHtml(o.location)}</dd></div>` : ""}
                    <div><dt>Ordered</dt><dd>${escapeHtml(formatDateShort(o.ordered_at))}</dd></div>
                    ${o.livestock_id ? `<div><dt>Listing</dt><dd><a href="/listing?id=${o.livestock_id}" class="acc-link">View</a></dd></div>` : ""}
                  </dl>
                </details>
              </div>
            </div>
          </div>
          ${action ? `<div class="acc-actionbar">${action}</div>` : ""}`;
        view.body.querySelector("[data-confirm]")?.addEventListener("click", () => openConfirm(o));
        const deliveryBox = view.body.querySelector("[data-delivery]");
        if (deliveryBox) loadDelivery(view, deliveryBox, o);
        // Self-collection: rate Frontier once the order has been received.
        else if (o.platform_rating && !o.platform_rating.rated && ["received", "completed"].includes(o.stage) && o.delivery_option !== "transport") {
          const box = document.createElement("div");
          box.className = "acc-card mt-4";
          view.body.querySelector(".acc-order > div").appendChild(box);
          ratePlatformForm(box, o.checkout_id, o);
        }
      }

      // ---------------------------------------------- transport deliveries
      let follow = null;
      // Big screens: "Delivery details" sits in the right column under the
      // order card. Phones: it stays in the delivery column, above the ratings.
      const wide = window.matchMedia("(min-width: 1024px)");
      let detailsCard = null;
      function placeDetailsCard() {
        if (!detailsCard || !detailsCard.anchor.isConnected) return;
        const { card, anchor, side } = detailsCard;
        if (wide.matches && side) side.appendChild(card);
        else anchor.parentNode.insertBefore(card, anchor);
      }
      wide.addEventListener("change", placeDetailsCard);
      async function loadDelivery(view, box, o) {
        let d;
        try {
          d = (await buyerApi(`/api/buyer/deliveries/${o.transport.id}`)).data;
        } catch (error) {
          box.innerHTML = `<div class="acc-card"><p class="text-sm text-red-600">${escapeHtml(error.message)}</p></div>`;
          return;
        }
        view.deliveryId = d.id;
        const tracking = TR_MOVING.includes(d.status) || ["delivery_submitted", "awaiting_confirmation"].includes(d.status);
        const dispute = d.disputes && d.disputes[0];
        box.innerHTML = `
          <div class="acc-card">
            <h2 class="txd-card-title">Delivery ${escapeHtml(d.reference)}</h2>
            ${trProgressHtml(d.status)}
            ${trProviderHtml(d)}
            ${d.status === "awaiting_confirmation" ? `<div class="acc-card-ok acc-card mt-4"><p class="text-sm text-gray-700">Your order has arrived. Please confirm if everything is okay, or report a problem if not. Thank you for purchasing with Frontier.</p>
              <div class="tr-actions mt-3"><button type="button" class="acc-btn" data-d-confirm>Everything Is Fine</button><button type="button" class="acc-mini-btn" data-d-dispute>Report A Delivery Problem</button></div></div>` : ""}
            ${dispute ? `<div class="${dispute.status === "open" ? "tr-warn-box" : "tr-note-box"} mt-4"><b>${dispute.status === "open" ? "You reported a problem" : `Your report was resolved: ${dispute.resolution === "refund" ? "refund" : "delivered"}`}</b><p class="mt-1">${escapeHtml(dispute.description)}</p>${dispute.resolution_note ? `<p class="mt-1">Frontier: ${escapeHtml(dispute.resolution_note)}</p>` : ""}</div>` : ""}
          </div>
          ${tracking || d.tracking.route ? `<div class="acc-card mt-4 acc-track-card"><h2 class="txd-card-title">Follow Your Delivery</h2><div data-track></div></div>` : ""}
          <div class="acc-card mt-4" data-d-details><h2 class="txd-card-title">Delivery Details</h2>${trFactsHtml(d, { role: "customer", brief: true })}</div>
          <div data-ratings></div>
          <details class="acc-card mt-4 acc-more"><summary>History</summary>${trTimelineHtml(d.events)}</details>`;
        detailsCard = { card: box.querySelector("[data-d-details]"), anchor: box.querySelector("[data-ratings]"), side: view.body.querySelector(".acc-order > div:last-child") };
        placeDetailsCard();
        box.querySelector("[data-d-confirm]")?.addEventListener("click", (e) => completeDelivery(e.currentTarget, o, d));
        box.querySelector("[data-d-dispute]")?.addEventListener("click", () => openDisputeForm(o, d));
        const track = box.querySelector("[data-track]");
        follow = track ? await trFollow(track, d, `/api/buyer/deliveries/${d.id}/track`, buyerApi) : null;
        paintRatings(box.querySelector("[data-ratings]"), d, o);
      }

      function paintRatings(holder, d, o) {
        const parts = [];
        if (d.rating) parts.push(`<div class="acc-card mt-4"><b>You rated ${escapeHtml(d.provider ? d.provider.name : "the provider")}</b><p class="mt-1">${trStarsHtml(d.rating.stars)}</p>${d.rating.feedback ? `<p class="text-sm text-gray-700 mt-1">"${escapeHtml(d.rating.feedback)}"</p>` : ""}</div>`);
        else if (d.can.rate_provider) parts.push(`<div class="acc-card mt-4" data-rate-provider></div>`);
        if (d.platform && d.platform.rated) parts.push(`<div class="acc-card mt-4"><b>You rated Frontier Marketplace</b><p class="mt-1">${trStarsHtml(d.platform.rated.stars)}</p></div>`);
        else if (d.platform && d.platform.eligible) parts.push(`<div class="acc-card mt-4" data-rate-platform></div>`);
        holder.innerHTML = parts.join("");
        const rp = holder.querySelector("[data-rate-provider]");
        if (rp) trRatingForm(rp, {
          title: `Rate the transport provider${d.provider ? `: ${d.provider.name}` : ""}`,
          hint: "How were their reliability, communication, timeliness and handling of your animals or feed?",
          name: "provider_stars",
          onSubmit: async (v) => {
            const res = await buyerApi(`/api/buyer/deliveries/${d.id}/rating`, { method: "POST", body: v });
            showNotification(res.message, "success");
            openOrder(o.id, { replace: true });
          },
        });
        const pp = holder.querySelector("[data-rate-platform]");
        if (pp) ratePlatformForm(pp, d.checkout_id, o);
      }

      function ratePlatformForm(holder, checkoutId, o) {
        const id = checkoutId || o.checkout_id;
        if (!id) return;
        trRatingForm(holder, {
          title: "Rate Frontier Marketplace",
          hint: "How was buying on Frontier Marketplace, from finding your order to receiving it?",
          name: "platform_stars",
          onSubmit: async (v) => {
            const res = await buyerApi(`/api/buyer/checkouts/${id}/rating`, { method: "POST", body: v });
            showNotification(res.message, "success");
            await loadOrders();
            openOrder(o.id, { replace: true });
          },
        });
      }

      // Straight after the buyer confirms: one pop-up to rate the transport
      // provider (if there was one) and Frontier. "Not now" leaves the rating
      // forms on the order page for later.
      async function askForRatings(o, deliveryId = null) {
        let provider = null;
        let platform = null;
        try {
          if (deliveryId) {
            const d = (await buyerApi(`/api/buyer/deliveries/${deliveryId}`)).data;
            if (d.can.rate_provider && !d.rating) provider = { id: d.id, name: d.provider ? d.provider.name : "the transport provider" };
            if (d.platform && d.platform.eligible && !d.platform.rated) platform = d.checkout_id || o.checkout_id;
          } else {
            const fresh = (await buyerApi(`/api/buyer/orders/${o.id}`)).data;
            if (fresh.platform_rating && !fresh.platform_rating.rated) platform = fresh.checkout_id;
          }
        } catch {
          return;
        }
        if (!provider && !platform) return;
        const section = (name, title, hint) => `
          <div class="rate-modal-part" data-part="${name}">
            <p class="font-semibold text-gray-900">${escapeHtml(title)}</p>
            <p class="text-sm text-gray-600">${escapeHtml(hint)}</p>
            ${trStarsInput(name, `pop-${name}`)}
            <p class="field-error hidden" data-error-for="${name}"></p>
            <label class="field-label mt-3" for="pop-${name}-feedback">Comment <span class="text-gray-400 font-normal">(optional)</span></label>
            <textarea id="pop-${name}-feedback" name="${name}_feedback" rows="2" maxlength="1000" class="field-input"></textarea>
          </div>`;
        const overlay = document.createElement("div");
        overlay.className = "fixed inset-0 z-[150] flex items-center justify-center bg-black bg-opacity-50 p-4";
        overlay.innerHTML = `
          <form class="rate-modal bg-white rounded-xl shadow-xl max-w-md w-full p-6" role="dialog" aria-modal="true" aria-labelledby="rate-modal-title" novalidate>
            <h3 id="rate-modal-title" class="text-lg font-bold text-gray-900">How did it go?</h3>
            <p class="text-sm text-gray-600 mt-1">Thank you for purchasing with Frontier. Your rating helps other buyers.</p>
            ${provider ? section("provider_stars", `Rate ${provider.name}`, "Reliability, communication, timeliness and care of your animals or feed.") : ""}
            ${platform ? section("platform_stars", "Rate Frontier Marketplace", "From finding your order to receiving it.") : ""}
            <div class="flex gap-3 justify-end mt-5">
              <button type="button" data-later class="acc-mini-btn">Not Now</button>
              <button type="submit" class="acc-btn">Submit Rating</button>
            </div>
          </form>`;
        document.body.appendChild(overlay);
        const form = overlay.querySelector("form");
        let sent = false;
        const close = () => {
          document.removeEventListener("keydown", onKey, true);
          overlay.remove();
          if (sent && orderView) openOrder(o.id, { replace: true });
        };
        const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
        document.addEventListener("keydown", onKey, true);
        overlay.querySelector("[data-later]").addEventListener("click", close);
        form.querySelectorAll(".tr-stars input").forEach((r) => r.addEventListener("change", () => form.querySelector(`[data-error-for="${r.name}"]`).classList.add("hidden")));
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const parts = [...form.querySelectorAll("[data-part]")];
          const errors = {};
          parts.forEach((p) => { if (!form.querySelector(`input[name="${p.dataset.part}"]:checked`)) errors[p.dataset.part] = "Please choose 1 to 5 stars."; });
          if (Object.keys(errors).length) return showFieldErrors(form, { errors });
          const value = (name) => ({ stars: Number(form.querySelector(`input[name="${name}"]:checked`).value), feedback: form[`${name}_feedback`].value.trim() });
          try {
            await withBusy(form.querySelector("button[type=submit]"), "Sending…", async () => {
              // A part that went through is removed, so a retry only resends what failed.
              if (form.querySelector('[data-part="provider_stars"]')) {
                await buyerApi(`/api/buyer/deliveries/${provider.id}/rating`, { method: "POST", body: value("provider_stars") });
                sent = true;
                form.querySelector('[data-part="provider_stars"]').remove();
              }
              if (form.querySelector('[data-part="platform_stars"]')) {
                await buyerApi(`/api/buyer/checkouts/${platform}/rating`, { method: "POST", body: value("platform_stars") });
                sent = true;
                form.querySelector('[data-part="platform_stars"]').remove();
              }
            });
            showNotification("Thank you for your rating!", "success");
            await loadOrders();
            close();
          } catch (error) {
            showNotification(error.message, "error");
          }
        });
      }

      // "Everything is fine": completes the order at once, then asks for ratings.
      async function completeDelivery(button, o, d) {
        try {
          const res = await withBusy(button, "Completing…", () =>
            buyerApi(`/api/buyer/deliveries/${d.id}/confirm`, { method: "POST", body: new FormData() }));
          showNotification(res.message, "success");
          await loadOrders();
          if (orderView) openOrder(o.id, { replace: true });
          askForRatings(o, d.id);
        } catch (error) {
          showNotification(error.message, "error");
        }
      }

      // Report a delivery problem (with photos).
      function openDisputeForm(o, d) {
        const view = openAdminView({ title: "Report a problem", params: { id: o.id, dispute: 1 } });
        view.el.classList.add("confirm-view");
        const live = d.orders.filter((x) => !x.cancelled);
        const delivered = (x) => { const q = d.quantities.find((r) => r.stage === "provider_delivered" && Number(r.order_id) === Number(x.id)); return q ? `${q.quantity} of ${x.quantity}` : x.units; };
        view.body.innerHTML = `
          <form class="acc-confirm" novalidate>
            <h1 class="admin-view-title">Report A Delivery Problem</h1>
            <div class="acc-card">
              <p class="text-sm text-gray-700">Your order:</p>
              <ul class="tr-qty">${live.map((x) => `<li><span>${escapeHtml(x.title)}</span><b>${escapeHtml(delivered(x))}</b></li>`).join("")}</ul>
            </div>
            <div class="acc-card">
              <p class="field-label">What's wrong?</p>
              <div class="tp-choice">${Object.entries(d.dispute_reasons).map(([k, v]) => `<label><input type="radio" name="reason" value="${k}"><span>${escapeHtml(v)}</span></label>`).join("")}</div>
              <p class="field-error hidden" data-error-for="reason"></p>
              <label class="field-label mt-4" for="dd-desc">Describe the problem</label>
              <textarea id="dd-desc" name="description" rows="3" maxlength="2000" class="field-input"></textarea>
              <p class="field-error hidden" data-error-for="description"></p>
            </div>
            <div class="acc-card">
              <p class="field-label">Photos showing the problem <span class="text-gray-400 font-normal">(1 to 6)</span></p>
              <div class="acc-ph-grid" data-photos></div>
              <p class="field-error hidden" data-error-for="images"></p>
            </div>
            <div class="acc-actionbar"><button type="submit" class="acc-btn" data-submit>Send The Report</button></div>
          </form>`;
        const form = view.body.querySelector("form");
        const picker = bindPhotoPicker(form.querySelector("[data-photos]"), 6, (n) => { if (n) form.querySelector('[data-error-for="images"]').classList.add("hidden"); });
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const errors = {};
          if (!picker.files().length) errors.images = "Please add at least one photo.";
          if (!form.querySelector('input[name="reason"]:checked')) errors.reason = "Please choose one.";
          if (form.description.value.trim().length < 10) errors.description = "Please describe the problem.";
          if (Object.keys(errors).length) return showFieldErrors(form, { errors });
          const fd = new FormData();
          picker.files().forEach((f) => fd.append("images", f));
          fd.append("reason", form.querySelector('input[name="reason"]:checked').value);
          fd.append("description", form.description.value.trim());
          try {
            const res = await withBusy(form.querySelector("[data-submit]"), "Sending…", () =>
              buyerApi(`/api/buyer/deliveries/${d.id}/dispute`, { method: "POST", body: fd }));
            showNotification(res.message, "success");
            await view.close(true);
            await loadOrders();
            if (orderView) openOrder(o.id, { replace: true });
          } catch (error) {
            showFieldErrors(form, error);
            showNotification(error.message, "error");
          }
        });
      }

      // ------------------------------------------- confirm with photos
      const MAX_PHOTOS = 4;
      function openConfirm(o) {
        const view = openAdminView({ title: "Confirm", params: { id: o.id, confirm: 1 } });
        view.el.classList.add("confirm-view");
        const files = [];
        view.body.innerHTML = `
          <form class="acc-confirm" novalidate>
            <h1 class="admin-view-title">Confirm Receipt</h1>
            <div id="confirm-alert" class="hidden alert text-sm" role="alert"></div>
            <div class="acc-card">
              <p class="text-sm text-gray-700"><b>${escapeHtml(o.title)}</b> · ${escapeHtml(o.price_unit === "lot" ? `whole lot (${o.units})` : o.units)}</p>
              <p class="field-label mt-3">How did you get it?</p>
              <div class="ho-choice">
                <label><input type="radio" name="method" value="collected" ${o.sent_method === "collected" ? "checked" : ""}><span>I collected it</span></label>
                <label><input type="radio" name="method" value="delivered" ${o.sent_method === "delivered" ? "checked" : ""}><span>It was delivered</span></label>
              </div>
              <p class="field-error hidden" data-error-for="method"></p>
            </div>
            <div class="acc-card">
              <p class="field-label">Photos of what you received <span class="text-gray-400 font-normal">(1 to ${MAX_PHOTOS})</span></p>
              <div class="acc-ph-grid" id="ph-grid"></div>
              <input type="file" id="ph-input" accept="image/jpeg,image/png,image/webp" multiple hidden />
                            <p class="field-error hidden" data-error-for="images"></p>
            </div>
            <div class="acc-card">
              <label for="c_note" class="field-label">Anything to add? <span class="text-gray-400 font-normal">(optional)</span></label>
              <textarea id="c_note" name="note" rows="2" maxlength="500" class="field-input"></textarea>
              <label class="co-terms-box mt-3">
                <input type="checkbox" name="agree" />
                <span>I've received ${escapeHtml(o.price_unit === "lot" ? `the whole lot (${o.units})` : o.units)}</span>
              </label>
              <p class="field-error hidden" data-error-for="agree"></p>
            </div>
            <div class="acc-actionbar"><button type="submit" class="acc-btn" id="confirm-btn">Confirm I've Received It</button></div>
          </form>`;
        const form = view.body.querySelector("form");
        const grid = view.body.querySelector("#ph-grid");
        const input = view.body.querySelector("#ph-input");
        const alertBox = view.body.querySelector("#confirm-alert");
        const paint = () => {
          grid.innerHTML = files.map((f, i) => `<div class="acc-ph"><img src="${f.url}" alt=""><button type="button" data-rm="${i}" aria-label="Remove photo">×</button></div>`).join("")
            + (files.length < MAX_PHOTOS ? `<button type="button" class="acc-ph-add" id="ph-add">${uiIcon("camera")}<span>Add Photo</span></button>` : "");
          grid.querySelector("#ph-add")?.addEventListener("click", () => input.click());
          grid.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => {
            const [gone] = files.splice(Number(b.dataset.rm), 1);
            URL.revokeObjectURL(gone.url);
            paint();
          }));
        };
        form.querySelectorAll('input[name="method"]').forEach((r) => r.addEventListener("change", () => form.querySelector('[data-error-for="method"]').classList.add("hidden")));
        input.addEventListener("change", () => {
          [...input.files].slice(0, MAX_PHOTOS - files.length).forEach((file) => {
            if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return showNotification("Photos must be JPEG, PNG or WebP.", "error");
            if (file.size > 12 * 1024 * 1024) return showNotification("Each photo must be under 12 MB.", "error");
            files.push({ file, url: URL.createObjectURL(file) });
          });
          input.value = "";
          if (files.length) form.querySelector('[data-error-for="images"]').classList.add("hidden");
          paint();
        });
        paint();
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          alertBox.classList.add("hidden");
          const errors = {};
          if (!form.method.value) errors.method = "Please choose one.";
          if (!files.length) errors.images = "Please add at least one photo.";
          if (!form.agree.checked) errors.agree = "Please tick the box to confirm.";
          if (Object.keys(errors).length) {
            showFieldErrors(form, { errors });
            return;
          }
          const fd = new FormData();
          files.forEach((f) => fd.append("images", f.file));
          fd.append("method", form.method.value);
          fd.append("note", form.note.value.trim());
          fd.append("agree", "1");
          try {
            await withBusy(form.querySelector("#confirm-btn"), "Sending…", () =>
              buyerApi(`/api/buyer/orders/${o.id}/confirm`, { method: "POST", body: fd }));
            showNotification("Thank you! Your order is complete.", "success");
            await view.close(true);
            await loadOrders();
            if (orderView) openOrder(o.id, { replace: true });
            askForRatings(o);
          } catch (error) {
            showFieldErrors(form, error);
            alertBox.textContent = error.message;
            alertBox.className = "alert alert-error text-sm";
            alertBox.scrollIntoView({ block: "nearest" });
          }
        });
      }

      // ------------------------------------------------------ notifications
      async function loadNotifications() {
        const res = await buyerApi("/api/buyer/notifications");
        notes = res.data;
        const list = document.getElementById("notifications-list");
        if (!notes.length) {
          list.innerHTML = `<div class="empty-state"><p class="font-semibold text-gray-800">No notifications yet</p><p class="text-sm mt-1">Updates about your orders appear here.</p></div>`;
        } else {
          list.innerHTML = `<ul class="nt-list">${notes.map((n) => `
            <li><a href="${escapeHtml(n.link || "/account/")}" data-link class="nt-item ${n.read_at ? "" : "is-unread"}">
              <span class="nt-icon nt-order" aria-hidden="true">${uiIcon("cart")}</span>
              <span class="nt-text"><span class="nt-title">${escapeHtml(n.title)}</span>${n.body ? `<span class="nt-body">${escapeHtml(n.body)}</span>` : ""}<span class="nt-time">${timeAgo(n.created_at)}</span></span>
              ${n.read_at ? "" : `<span class="nt-new">New</span>`}
            </a></li>`).join("")}</ul>`;
          list.querySelectorAll("[data-link]").forEach((a) => a.addEventListener("click", (e) => {
            const url = new URL(a.href, location.origin);
            if (url.pathname !== "/account/") return;
            e.preventDefault();
            goTo(Object.fromEntries(url.searchParams));
          }));
        }
        if (res.unread) {
          await buyerApi("/api/buyer/notifications/read", { method: "POST" }).catch(() => {});
          setBadge("notifications", 0);
        }
      }

      // ------------------------------------------------------------ profile
      function fillProfile() {
        const f = document.getElementById("profile-form");
        f.full_name.value = me.full_name;
        f.email.value = me.email;
        f.phone.value = me.phone;
      }
      bindPasswordMeter(document.getElementById("new_password"), () => ({ email: me && me.email, phone: me && me.phone }));
      document.getElementById("profile-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target;
        const box = document.getElementById("profile-alert");
        try {
          const res = await withBusy(document.getElementById("profile-btn"), "Saving…", () => buyerApi("/api/buyer/me", {
            method: "PUT", body: { full_name: f.full_name.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim() },
          }));
          me = res.data;
          paintMe();
          box.className = "alert alert-success text-sm mb-0";
          box.textContent = res.message;
        } catch (error) {
          showFieldErrors(f, error);
          box.className = "alert alert-error text-sm mb-0";
          box.textContent = error.message;
        }
      });
      document.getElementById("password-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target;
        const box = document.getElementById("password-alert");
        try {
          const res = await withBusy(document.getElementById("password-btn"), "Saving…", () => buyerApi("/api/buyer/me/password", {
            method: "PATCH", body: { current_password: f.current_password.value, new_password: f.new_password.value },
          }));
          f.reset();
          box.className = "alert alert-success text-sm mb-0";
          box.textContent = res.message;
        } catch (error) {
          showFieldErrors(f, error);
          box.className = "alert alert-error text-sm mb-0";
          box.textContent = error.message;
        }
      });
      document.getElementById("resend-btn").addEventListener("click", async (e) => {
        try {
          const res = await withBusy(e.currentTarget, "Sending…", () => buyerApi("/api/buyer/auth/resend", { method: "POST" }));
          showNotification(res.message, "success");
        } catch (error) {
          showNotification(error.message, "error");
        }
      });

      function paintMe() {
        document.getElementById("account-header").innerHTML = accountHeader(me);
        renderCartButtons();
        document.getElementById("nav-av").textContent = buyerInitials(me.full_name);
        document.getElementById("nav-name").textContent = me.full_name;
        document.getElementById("verify-banner").hidden = Boolean(me.verified);
        document.getElementById("verify-email").textContent = me.email;
      }

      // ---------------------------------------------------- go to / live
      async function goTo(q) {
        setTab(q.tab || "orders");
        // A delivery link (from a notification or email): open its order.
        if (q.delivery && !q.id) {
          const o = orders.find((x) => x.transport && String(x.transport.id) === String(q.delivery));
          if (o) q = { ...q, id: o.id };
        }
        if ((q.tab || "orders") === "orders" && q.id) {
          await openOrder(q.id);
          const o = orders.find((x) => String(x.id) === String(q.id));
          if (q.confirm && o && o.stage === "sent") openConfirm(o);
        }
      }

      function listen() {
        if (!window.EventSource) return;
        const es = new EventSource("/api/buyer/events");
        es.addEventListener("ready", (e) => setBadge("notifications", JSON.parse(e.data).unread));
        es.addEventListener("notification", (e) => {
          const { notification, unread } = JSON.parse(e.data);
          setBadge("notifications", unread);
          showNotification(notification.title, "info");
          if (!document.getElementById("tab-notifications").hidden) loadNotifications();
        });
        es.addEventListener("transport", async (e) => {
          let data = {};
          try { data = JSON.parse(e.data); } catch { return; }
          if (data.change === "location") {
            if (follow && orderView && orderView.deliveryId === data.booking_id) follow.push();
            return;
          }
          await loadOrders();
          if (orderView && orderView.deliveryId === data.booking_id && !document.querySelector(".confirm-view") && !trEditing(orderView.el)) openOrder(orderView.orderId, { replace: true });
        });
        es.addEventListener("order", async () => {
          await loadOrders();
          if (orderView && !document.querySelector(".confirm-view")) openOrder(orderView.orderId, { replace: true });
        });
      }

      (async function init() {
        try {
          me = (await buyerApi("/api/buyer/auth/me")).data;
        } catch {
          return;
        }
        setBuyerHint(true);
        paintMe();
        setBadge("notifications", me.unread);
        document.body.classList.add("is-ready");
        await loadOrders();
        const q = getQueryParams();
        if (q.welcome) showNotification(`Welcome, ${buyerFirst(me.full_name)}!`, "success");
        await goTo(q);
        listen();
      })();
    </script>
  </body>
</html>
