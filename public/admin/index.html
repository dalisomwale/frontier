<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dashboard - Frontier Marketplace Admin</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/admin.js"></script>
  </head>
  <body class="bg-gray-50 admin-pending">
    <div id="app-sidebar"></div>
    <div id="admin-topbar"></div>

    <main class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Dashboard Overview</h1>
          <p id="greeting" class="text-gray-500 mt-1"></p>
        </div>
        <a href="/admin/livestock.html?new=1" class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-semibold">
          <span class="w-5 h-5" data-icon="plus"></span> Add Livestock
        </a>
      </div>

      <div id="email-alert" class="hidden alert alert-warning flex items-start gap-3"></div>

      <!-- Stats (all live from the database) -->
      <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8"></div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <section class="bg-white rounded-xl border border-gray-100 shadow-sm">
          <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
            <h2 class="text-lg font-bold text-gray-900">Recent Inquiries</h2>
            <a href="/admin/inquiries.html" class="text-sm font-medium text-blue-600 hover:text-blue-700">View all →</a>
          </div>
          <div id="recent-inquiries"></div>
        </section>

        <section class="bg-white rounded-xl border border-gray-100 shadow-sm">
          <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
            <h2 class="text-lg font-bold text-gray-900">Recent Livestock</h2>
            <a href="/admin/livestock.html" class="text-sm font-medium text-blue-600 hover:text-blue-700">View all →</a>
          </div>
          <div id="recent-livestock"></div>
        </section>
      </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));

      const STAT_TILES = [
        { key: "total_livestock", label: "Total Livestock", icon: "listings", tint: "bg-blue-100 text-blue-600", href: "/admin/livestock.html" },
        { key: "published_livestock", label: "Published", icon: "eye", tint: "bg-green-100 text-green-600", href: "/admin/livestock.html?status=published" },
        { key: "unpublished_livestock", label: "Unpublished", icon: "eyeOff", tint: "bg-gray-100 text-gray-600", href: "/admin/livestock.html?status=unpublished" },
        { key: "new_inquiries", label: "New Inquiries", icon: "inbox", tint: "bg-red-100 text-red-600", href: "/admin/inquiries.html?status=new" },
        { key: "total_inquiries", label: "Total Inquiries", icon: "inquire", tint: "bg-purple-100 text-purple-600", href: "/admin/inquiries.html" },
        { key: "categories", label: "Categories", icon: "layers", tint: "bg-amber-100 text-amber-600", href: "/admin/categories.html" },
        { key: "breeds", label: "Breeds", icon: "tag", tint: "bg-emerald-100 text-emerald-600", href: "/admin/breeds.html" },
      ];

      function renderStats(stats) {
        document.getElementById("stats").innerHTML = STAT_TILES.map((t) => `
          <a href="${t.href}" class="stat-tile hover:shadow-md transition !p-4">
            <span class="stat-tile-icon ${t.tint}">${uiIcon(t.icon)}</span>
            <div class="min-w-0">
              <p class="text-gray-600 text-xs sm:text-sm font-medium leading-tight">${t.label}</p>
              <p class="text-2xl sm:text-3xl font-bold ${t.key === "new_inquiries" && stats[t.key] ? "text-red-600" : "text-gray-900"}">${stats[t.key].toLocaleString()}</p>
            </div>
          </a>`).join("");

        const alert = document.getElementById("email-alert");
        if (stats.failed_emails) {
          alert.innerHTML = `<span class="w-5 h-5 flex-shrink-0">${uiIcon("alert")}</span>
            <div><strong>${stats.failed_emails} inquiry notification email${stats.failed_emails > 1 ? "s" : ""} could not be sent.</strong>
            The inquiries are saved below - check the SMTP settings in .env, then use "Resend email" on each inquiry.
            <a class="underline font-medium" href="/admin/inquiries.html">Open inquiries</a></div>`;
          alert.classList.remove("hidden");
        }
      }

      function renderRecentInquiries(items) {
        const box = document.getElementById("recent-inquiries");
        if (!items.length) {
          return renderEmptyState(box, { title: "No inquiries yet", message: "When visitors click Inquire on a listing, their inquiries will appear here.", icon: "inbox" });
        }
        box.innerHTML = `<ul class="divide-y divide-gray-100">${items.map((i) => `
          <li><a href="/admin/inquiries.html?id=${i.id}" class="flex items-center gap-3 px-5 py-3 hover:bg-gray-50">
            <span class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold flex-shrink-0">${escapeHtml(i.full_name.charAt(0).toUpperCase())}</span>
            <div class="min-w-0 flex-1">
              <p class="font-semibold text-gray-900 truncate">${escapeHtml(i.full_name)}</p>
              <p class="text-sm text-gray-500 truncate">${escapeHtml(i.livestock_title)}</p>
            </div>
            <div class="text-right flex-shrink-0">
              ${statusPill(i.status)}
              <p class="text-xs text-gray-400 mt-1">${timeAgo(i.created_at)}</p>
            </div>
          </a></li>`).join("")}</ul>`;
      }

      function renderRecentLivestock(items) {
        const box = document.getElementById("recent-livestock");
        if (!items.length) {
          return renderEmptyState(box, {
            title: "No livestock yet",
            message: "Add your first listing - it stays unpublished until you choose to publish it.",
            icon: "cattle",
            action: `<a href="/admin/livestock.html?new=1" class="inline-block mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-semibold">Add Livestock</a>`,
          });
        }
        box.innerHTML = `<ul class="divide-y divide-gray-100">${items.map((l) => `
          <li><a href="/admin/livestock.html?edit=${l.id}" class="flex items-center gap-3 px-5 py-3 hover:bg-gray-50">
            <span class="w-14 h-11 rounded-md overflow-hidden bg-blue-50 flex-shrink-0">${l.thumb_path ? `<img src="${escapeHtml(l.thumb_path)}" alt="" class="w-full h-full object-cover">` : livestockFallbackMedia("w-7 h-7")}</span>
            <div class="min-w-0 flex-1">
              <p class="font-semibold text-gray-900 truncate">${escapeHtml(l.title)}</p>
              <p class="text-sm text-gray-500 truncate">${escapeHtml([l.category_name, l.breed_name, l.location].filter(Boolean).join(" · "))}</p>
            </div>
            ${statusPill(l.status)}
          </a></li>`).join("")}</ul>`;
      }

      (async () => {
        const admin = await initAdminPage("dashboard");
        const hour = new Date().getHours();
        document.getElementById("greeting").textContent =
          `Good ${hour < 12 ? "morning" : hour < 17 ? "afternoon" : "evening"}, ${admin.name.split(" ")[0]}.`;
        try {
          const { data } = await adminApi("/api/admin/dashboard");
          renderStats(data.stats);
          renderRecentInquiries(data.recentInquiries);
          renderRecentLivestock(data.recentLivestock);
        } catch (error) {
          showNotification(error.message, "error");
        }
      })();
    </script>
  </body>
</html>
