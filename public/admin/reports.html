<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports · Frontier Admin</title>
    <link rel="icon" href="../images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Loaded blocking, in <head>, so the bottom nav below can be painted
         on first render instead of popping in after the page has already
         shown without it. -->
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/species.js"></script>
    <script src="../js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <!-- Desktop sidebar: rendered synchronously right here (not on
         DOMContentLoaded) so it exists before the browser's first paint. -->
    <div id="app-sidebar"></div>
    <script>
      renderSidebar("admin-reports");
    </script>

    <!-- Compact top bar: brand always visible, logout shown on mobile only
         since the sidebar (desktop) and bottom nav (mobile) carry the rest
         of the navigation. -->
    <nav id="page-topnav" class="bg-white border-b border-gray-100 sticky top-0 z-50">
      <div
        class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4"
      >
        <a href="index.html" class="flex items-center gap-3 font-bold">
          <div class="brand-mark-full">
            <img src="../images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
          </div>
        </a>
        <div class="flex items-center gap-4">
          <a
            href="../dashboard.html"
            class="hidden sm:inline lg:hidden text-sm font-medium text-gray-600"
            >User Dashboard</a
          >
          <button
            id="logout-btn"
            class="rounded-lg bg-red-600 px-3 py-2 text-sm font-medium text-white"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="app-content-shifted mx-auto max-w-7xl px-4 py-8">
      <main>
        <div
          class="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"
        >
          <div>
            <h1 class="text-3xl font-bold">Content reports</h1>
            <p class="mt-1 text-gray-600">
              Review reports submitted by marketplace users.
            </p>
          </div>
          <label class="text-sm font-medium"
            >Status
            <select
              id="status-filter"
              class="ml-2 rounded-lg border border-gray-300 px-3 py-2"
            >
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="reviewed">Reviewed</option>
              <option value="resolved">Resolved</option>
            </select>
          </label>
        </div>
        <div class="overflow-x-auto rounded-lg bg-white shadow-sm">
          <table class="w-full text-left text-sm">
            <thead class="border-b bg-gray-50 text-gray-600">
              <tr>
                <th class="p-4">Report</th>
                <th class="p-4">Target</th>
                <th class="p-4">Submitted by</th>
                <th class="p-4">Date</th>
                <th class="p-4">Status</th>
                <th class="p-4">Action</th>
              </tr>
            </thead>
            <tbody id="reports-table">
              <tr>
                <td colspan="6" class="p-8 text-center text-gray-600">
                  Loading reports…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="pagination" class="mt-6"></div>
      </main>
    </div>

    <!-- Mobile app-style bottom navigation: rendered synchronously, right
         here, instead of waiting for DOMContentLoaded. -->
    <div id="app-bottom-nav"></div>
    <script>
      renderBottomNav("admin");
    </script>

    <script>
      let currentPage = 1;
      document.addEventListener("DOMContentLoaded", async () => {
        await checkAuthentication();
        // Re-run after the server round-trip resolves, in case the
        // optimistic localStorage snapshot used for the instant render
        // above was missing or stale.
        renderBottomNav("admin");
        if (getCurrentUser()?.role !== "admin")
          return (window.location.href = "../dashboard.html");
        const query = getQueryParams();
        if (query.status)
          document.getElementById("status-filter").value = query.status;
        document
          .getElementById("status-filter")
          .addEventListener("change", () => loadReports(1));
        document.getElementById("logout-btn").addEventListener("click", logout);
        await loadReports(1);
      });
      async function loadReports(page) {
        currentPage = page;
        const params = new URLSearchParams({ page, limit: 20 });
        const status = document.getElementById("status-filter").value;
        if (status) params.set("status", status);
        try {
          const response = await apiRequest("/api/admin/reports?" + params);
          renderReports(response.data || []);
          const pageHost = document.getElementById("pagination");
          pageHost.innerHTML = "";
          if (response.pagination?.total > 1)
            pageHost.appendChild(
              createPagination(page, response.pagination.total, loadReports),
            );
        } catch (error) {
          document.getElementById("reports-table").innerHTML =
            '<tr><td colspan="6" class="p-8 text-center text-red-700">Reports could not be loaded.</td></tr>';
        }
      }
      function renderReports(reports) {
        const body = document.getElementById("reports-table");
        if (!reports.length) {
          body.innerHTML =
            '<tr><td colspan="6" class="p-8 text-center text-gray-600">No reports require review.</td></tr>';
          return;
        }
        body.innerHTML = reports
          .map(
            (report) =>
              `<tr class="border-b"><td class="p-4"><p class="font-medium">${escapeHtml(report.reason)}</p><p class="text-xs text-gray-500">#${report.id}</p></td><td class="p-4">${escapeHtml(report.listing_title || report.reported_user_name || "Message")}</td><td class="p-4">${escapeHtml(report.reporter_name || "Unknown")}</td><td class="p-4">${formatDateShort(report.created_at)}</td><td class="p-4"><span class="capitalize">${escapeHtml(report.status)}</span></td><td class="p-4"><select onchange="updateReport(${report.id}, this.value)" class="rounded border border-gray-300 px-2 py-1"><option value="">Update…</option><option value="reviewed">Reviewed</option><option value="resolved">Resolved</option></select></td></tr>`,
          )
          .join("");
      }
      async function updateReport(id, status) {
        if (!status) return;
        try {
          const response = await apiRequest("/api/admin/reports/" + id, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          showNotification(response.message, "success");
          await loadReports(currentPage);
        } catch (error) {
          showNotification(error.message || "Unable to update report", "error");
        }
      }
    </script>
  </body>
</html>
