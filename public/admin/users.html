<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - Admin - Frontier Marketplace</title>
    <link rel="icon" href="../images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Loaded blocking, in <head>, so the bottom nav below can be painted
         on first render instead of popping in after the page has already
         shown without it. -->
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/species.js"></script>
    <script src="../js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-3">
              <div class="brand-mark-full">
                <img src="../images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
              </div>
            </a>
          </div>

          <div class="flex items-center gap-4">
            <a
              href="../dashboard.html"
              class="hidden sm:inline text-gray-600 hover:text-gray-900 font-medium"
              >User Dashboard</a
            >
            <button
              id="logout-btn"
              class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Admin Sidebar + Content -->
    <div
      class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-6"
    >
      <!-- Sidebar (desktop only - the bottom nav covers this on mobile) -->
      <div class="hidden lg:block lg:w-64 flex-shrink-0">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 lg:sticky lg:top-20">
          <h2 class="text-lg font-bold text-gray-900 mb-4">Admin Menu</h2>
          <nav class="space-y-2">
            <a
              href="index.html"
              class="flex items-center gap-3 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-lg font-medium"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
              Dashboard
            </a>
            <a
              href="users.html"
              class="flex items-center gap-3 bg-blue-100 text-blue-600 px-4 py-2 rounded-lg font-medium"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.3 14.1c2.5.4 4.2 2.1 4.2 4.9"/></svg>
              Manage Users
            </a>
            <a
              href="listings.html"
              class="flex items-center gap-3 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-lg font-medium"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M8 11h8M8 14.5h8M8 18h5"/></svg>
              Moderate Listings
            </a>
            <a
              href="reports.html"
              class="flex items-center gap-3 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-lg font-medium"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><path d="M5 3v18"/><path d="M5 4h13l-3 4 3 4H5"/></svg>
              View Reports
            </a>
          </nav>
        </div>
      </div>

      <!-- Main Content -->
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-3xl font-bold text-gray-900">Manage Users</h1>
          <a href="index.html" class="text-blue-600 hover:text-blue-700"
            >← Back to Dashboard</a
          >
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label
                for="role-filter"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Role</label
              >
              <select
                id="role-filter"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="">All Roles</option>
                <option value="buyer">Buyer</option>
                <option value="seller">Seller</option>
                <option value="service_provider">Service Provider</option>
              </select>
            </div>

            <div>
              <label
                for="status-filter"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Status</label
              >
              <select
                id="status-filter"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="suspended">Suspended</option>
              </select>
            </div>

            <div>
              <label
                for="search-filter"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Search</label
              >
              <input
                type="text"
                id="search-filter"
                placeholder="Name, email, phone..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
          </div>

          <div class="flex gap-2 mt-4">
            <button
              id="apply-filter"
              class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium"
            >
              Apply Filter
            </button>
            <button
              id="clear-filter"
              class="border border-gray-300 text-gray-900 px-6 py-2 rounded-lg hover:bg-gray-50 font-medium"
            >
              Clear
            </button>
          </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <table class="w-full">
            <thead class="bg-gray-100 border-b">
              <tr>
                <th
                  class="px-6 py-3 text-left text-sm font-semibold text-gray-900"
                >
                  Name
                </th>
                <th
                  class="px-6 py-3 text-left text-sm font-semibold text-gray-900"
                >
                  Email
                </th>
                <th
                  class="px-6 py-3 text-left text-sm font-semibold text-gray-900"
                >
                  Role
                </th>
                <th
                  class="px-6 py-3 text-left text-sm font-semibold text-gray-900"
                >
                  Status
                </th>
                <th
                  class="px-6 py-3 text-left text-sm font-semibold text-gray-900"
                >
                  Joined
                </th>
                <th
                  class="px-6 py-3 text-left text-sm font-semibold text-gray-900"
                >
                  Action
                </th>
              </tr>
            </thead>
            <tbody id="users-table" class="divide-y">
              <tr>
                <td colspan="6" class="px-6 py-8 text-center text-gray-600">
                  Loading users...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div id="pagination-container" class="mt-6"></div>
      </div>
    </div>

    <!-- Status Change Modal -->
    <div
      id="status-modal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
        <h2 class="text-xl font-bold text-gray-900 mb-4">Change User Status</h2>
        <p class="text-gray-600 mb-4">
          User: <strong id="modal-user-name"></strong>
        </p>

        <div class="space-y-3 mb-6">
          <button
            id="status-active"
            class="w-full border border-green-500 text-green-600 px-4 py-2 rounded-lg hover:bg-green-50 font-medium"
          >
            Activate User
          </button>
          <button
            id="status-suspended"
            class="w-full border border-red-500 text-red-600 px-4 py-2 rounded-lg hover:bg-red-50 font-medium"
          >
            Suspend User
          </button>
        </div>

        <button
          id="modal-cancel"
          class="w-full bg-gray-300 text-gray-900 px-4 py-2 rounded-lg hover:bg-gray-400 font-medium"
        >
          Cancel
        </button>
      </div>
    </div>

    <!-- Mobile app-style bottom navigation: rendered synchronously, right
         here, instead of waiting for DOMContentLoaded. -->
    <div id="app-bottom-nav"></div>
    <script>
      renderBottomNav("admin");
    </script>

    <script>
      let currentPage = 1;
      let selectedUserId = null;

      document.addEventListener("DOMContentLoaded", async () => {
        requireAuth();
        await checkAuthentication();
        // Re-run after the server round-trip resolves, in case the
        // optimistic localStorage snapshot used for the instant render
        // above was missing or stale.
        renderBottomNav("admin");

        const user = getCurrentUser();
        if (user?.role !== "admin") {
          showNotification("You do not have admin access", "error");
          setTimeout(() => (window.location.href = "/dashboard.html"), 2000);
          return;
        }

        // Check URL params for filters
        const params = getQueryParams();
        if (params.role) {
          document.getElementById("role-filter").value = params.role;
        }
        if (params.status) {
          document.getElementById("status-filter").value = params.status;
        }

        await loadUsers();

        document
          .getElementById("apply-filter")
          .addEventListener("click", () => {
            currentPage = 1;
            loadUsers();
          });

        document
          .getElementById("clear-filter")
          .addEventListener("click", () => {
            document.getElementById("role-filter").value = "";
            document.getElementById("status-filter").value = "";
            document.getElementById("search-filter").value = "";
            currentPage = 1;
            loadUsers();
          });

        document
          .getElementById("modal-cancel")
          .addEventListener("click", hideStatusModal);
        document
          .getElementById("status-active")
          .addEventListener("click", () => changeUserStatus("active"));
        document
          .getElementById("status-suspended")
          .addEventListener("click", () => changeUserStatus("suspended"));

        document
          .getElementById("logout-btn")
          .addEventListener("click", async () => {
            await logout();
          });
      });

      /**
       * Load users list
       */
      async function loadUsers() {
        const role = document.getElementById("role-filter").value;
        const status = document.getElementById("status-filter").value;
        const search = document.getElementById("search-filter").value;

        const params = new URLSearchParams();
        if (role) params.append("role", role);
        if (status) params.append("status", status);
        if (search) params.append("search", search);
        params.append("page", currentPage);
        params.append("limit", 10);

        try {
          showLoading();
          const response = await apiRequest(
            `/api/admin/users?${params.toString()}`,
          );

          if (response.success) {
            renderUsersTable(response.data);
            renderPagination(response.pagination);
          } else {
            showNotification("Failed to load users", "error");
          }
        } catch (error) {
          console.error("Load users error:", error);
          showNotification("Failed to load users", "error");
        } finally {
          hideLoading();
        }
      }

      /**
       * Render users table
       */
      function renderUsersTable(users) {
        const table = document.getElementById("users-table");

        if (users.length === 0) {
          table.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-8 text-center text-gray-600">No users found</td>
          </tr>
        `;
          return;
        }

        table.innerHTML = users
          .map(
            (user) => `
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm flex-shrink-0">
                ${(user.name || "?").trim().charAt(0).toUpperCase()}
              </div>
              <p class="font-medium text-gray-900">${user.name}</p>
            </div>
          </td>
          <td class="px-6 py-4">
            <p class="text-gray-600">${user.email}</p>
          </td>
          <td class="px-6 py-4">
            <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium">
              ${user.role.replace("_", " ").toUpperCase()}
            </span>
          </td>
          <td class="px-6 py-4">
            <span class="px-3 py-1 ${user.status === "active" ? "bg-green-100 text-green-800" : "bg-red-100 text-red-800"} rounded-full text-sm font-medium">
              ${user.status.toUpperCase()}
            </span>
          </td>
          <td class="px-6 py-4">
            <p class="text-gray-600 text-sm">${formatDateShort(user.created_at)}</p>
          </td>
          <td class="px-6 py-4">
            <button onclick="showStatusModal(${user.id}, '${user.name}')" class="text-blue-600 hover:text-blue-700 font-medium text-sm">
              Manage
            </button>
          </td>
        </tr>
      `,
          )
          .join("");
      }

      /**
       * Render pagination
       */
      function renderPagination(pagination) {
        const container = document.getElementById("pagination-container");
        if (!pagination || pagination.total <= 1) {
          container.innerHTML = "";
          return;
        }

        let html = '<div class="flex justify-center gap-2">';

        if (currentPage > 1) {
          html += `<button onclick="goToPage(${currentPage - 1})" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Previous</button>`;
        }

        for (let i = 1; i <= pagination.total; i++) {
          if (i === currentPage) {
            html += `<button class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">${i}</button>`;
          } else {
            html += `<button onclick="goToPage(${i})" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">${i}</button>`;
          }
        }

        if (currentPage < pagination.total) {
          html += `<button onclick="goToPage(${currentPage + 1})" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Next</button>`;
        }

        html += "</div>";
        container.innerHTML = html;
      }

      /**
       * Go to page
       */
      function goToPage(page) {
        currentPage = page;
        loadUsers();
      }

      /**
       * Show status change modal
       */
      function showStatusModal(userId, userName) {
        selectedUserId = userId;
        document.getElementById("modal-user-name").textContent = userName;
        document.getElementById("status-modal").classList.remove("hidden");
      }

      /**
       * Hide status change modal
       */
      function hideStatusModal() {
        document.getElementById("status-modal").classList.add("hidden");
        selectedUserId = null;
      }

      /**
       * Change user status
       */
      async function changeUserStatus(newStatus) {
        try {
          const response = await apiRequest(
            `/api/admin/users/${selectedUserId}/status`,
            {
              method: "PATCH",
              body: JSON.stringify({ status: newStatus }),
            },
          );

          if (response.success) {
            showNotification(`User status changed to ${newStatus}`, "success");
            hideStatusModal();
            loadUsers();
          } else {
            showNotification(
              response.message || "Failed to update user status",
              "error",
            );
          }
        } catch (error) {
          console.error("Change status error:", error);
          showNotification("Failed to update user status", "error");
        }
      }
    </script>
  </body>
</html>
