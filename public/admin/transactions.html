<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Transactions - Frontier Marketplace Admin</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/livestock.js"></script>
  </head>
  <body class="bg-gray-50 admin-pending">
    <div id="app-sidebar"></div>
    <div id="admin-topbar"></div>

    <main class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div id="detail-view" hidden></div>
      <div id="list-view">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-gray-900">Transactions</h1>
          <p class="text-sm text-gray-500 mt-1">Every payment and each step it went through. This history can't be edited.</p>
        </div>
        <button type="button" id="export" class="tx-export">Download CSV</button>
      </div>

      <div class="tx-totals" id="totals"></div>

      <div class="bg-white rounded-xl border border-gray-100">
        <div class="tx-filters">
          <div class="seg" id="status-tabs"></div>
          <select id="method" class="field-input !py-2 !text-sm tx-select" aria-label="Payment method">
            <option value="">All methods</option>
            <option value="mobile_money">Mobile money</option>
            <option value="card">Visa / Mastercard</option>
          </select>
          <select id="range" class="field-input !py-2 !text-sm tx-select" aria-label="Period">
            <option value="today">Today</option>
            <option value="7d">Last 7 days</option>
            <option value="30d" selected>Last 30 days</option>
            <option value="90d">Last 90 days</option>
            <option value="all">All time</option>
          </select>
          <div class="relative tx-search">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" data-icon="search"></span>
            <input id="search" type="search" placeholder="Order, payment reference, Lipila ID, buyer" class="field-input !py-2 !pl-9 !text-sm" />
          </div>
        </div>
        <div id="list"></div>
        <div id="pagination" class="pb-4"></div>
      </div>
      </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));

      const TABS = [
        { value: "", label: "All" },
        { value: "paid", label: "Paid" },
        { value: "pending", label: "Waiting" },
        { value: "failed", label: "Not completed" },
      ];
      const STATUS = {
        paid: ["Paid", "pay-tag-paid"],
        pending: ["Waiting", "pay-tag-pending"],
        failed: ["Not completed", "pay-tag-failed"],
        unpaid: ["Not started", "pay-tag-pending"],
      };
      const METHOD = { mobile_money: "Mobile money", card: "Visa / Mastercard", bank_transfer: "Bank transfer" };
      const NETWORK = { airtel: "Airtel", mtn: "MTN", zamtel: "Zamtel" };
      const ACTOR = { buyer: "Buyer", lipila: "Lipila", website: "Website", admin: "Admin" };
      const EVENT = {
        order_placed: "Order placed",
        payment_requested: "Payment request sent",
        payment_request_unclear: "Payment request: no clear answer",
        payment_request_failed: "Payment request refused",
        card_page_opened: "Card page opened",
        buyer_returned: "Back from card page",
        lipila_callback: "Message from Lipila",
        status_check_error: "Status check failed",
        payment_confirmed: "Payment confirmed",
        payment_waiting: "Waiting for confirmation",
        payment_failed: "Payment not completed",
        unconfirmed_alert: "Not confirmed after 30 minutes",
        stock_taken: "Stock taken",
        stock_short: "Not enough stock",
        email_sent: "Email sent",
        email_failed: "Email not sent",
        email_skipped: "No email",
        admin_status: "Order status changed",
        admin_marked_paid: "Marked Paid by hand",
        admin_message: "Message to buyer",
        admin_check_payment: "Checked with Lipila",
      };
      const TONE = {
        payment_confirmed: "ok", admin_marked_paid: "ok", stock_taken: "ok", email_sent: "ok",
        payment_failed: "bad", payment_request_failed: "bad", email_failed: "bad", stock_short: "bad",
        status_check_error: "warn", unconfirmed_alert: "warn", payment_request_unclear: "warn",
      };
      const state = { status: "", method: "", range: "30d", q: "", page: 1, open: null };
      const tag = (s) => (STATUS[s] ? `<span class="pay-tag ${STATUS[s][1]}">${STATUS[s][0]}</span>` : escapeHtml(s || ""));
      const how = (t) => `${METHOD[t.payment_method] || t.payment_method || "-"}${t.mobile_operator ? ` · ${NETWORK[t.mobile_operator] || t.mobile_operator}` : ""}`;
      const time = (d) => new Date(d).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      const params = (extra = {}) => {
        const p = new URLSearchParams({ range: state.range, ...extra });
        if (state.status) p.set("status", state.status);
        if (state.method) p.set("method", state.method);
        if (state.q) p.set("q", state.q);
        return p;
      };

      function renderTabs() {
        document.getElementById("status-tabs").innerHTML = TABS.map((t) =>
          `<button type="button" data-status="${t.value}" class="${state.status === t.value ? "active" : ""}">${t.label}</button>`).join("");
        document.querySelectorAll("[data-status]").forEach((b) => b.addEventListener("click", () => {
          state.status = b.dataset.status;
          renderTabs();
          loadList(1);
        }));
      }

      function renderTotals(t) {
        document.getElementById("totals").innerHTML = `
          <div class="tx-total"><span>Received</span><b>${kwacha(t.paid_amount)}</b></div>
          <div class="tx-total"><span>Paid</span><b>${Number(t.paid) || 0}</b></div>
          <div class="tx-total"><span>Waiting</span><b>${Number(t.pending) || 0}</b></div>
          <div class="tx-total"><span>Not completed</span><b>${Number(t.failed) || 0}</b></div>`;
      }

      async function loadList(page = state.page) {
        state.page = page;
        listLoaded = true;
        const list = document.getElementById("list");
        let res;
        try {
          res = await adminApi(`/api/admin/transactions?${params({ page })}`);
        } catch (error) {
          return renderEmptyState(list, { title: "Could not load transactions", message: error.message, icon: "alert" });
        }
        renderTotals(res.totals);
        const pag = document.getElementById("pagination");
        pag.innerHTML = "";
        if (!res.data.length) {
          return renderEmptyState(list, { title: "No transactions", message: "Nothing matches these filters.", icon: "inbox" });
        }
        const cols = 11;
        list.innerHTML = `<div class="tx-table-wrap"><table class="tx-table">
          <thead><tr>
            <th>Date</th><th>Order</th><th>Buyer</th><th>Items</th><th>Method</th><th>Network</th><th>Paying number</th>
            <th class="num">Amount</th><th>Status</th><th>Payment reference</th><th>Lipila ID</th>
          </tr></thead>
          <tbody>${res.data.map((t) => `
            <tr class="tx-tr" data-open="${t.id}">
              <td class="nowrap">${time(t.created_at)}</td>
              <td class="nowrap"><a class="tx-ref-link" href="/admin/transactions.html?id=${t.id}" data-go="${t.id}">${escapeHtml(t.reference)}</a></td>
              <td><span class="tx-buyer">${escapeHtml(t.full_name)}</span><small>${escapeHtml(t.email)}</small></td>
              <td class="tx-items">${escapeHtml(t.titles || "")}</td>
              <td class="nowrap">${escapeHtml(METHOD[t.payment_method] || t.payment_method || "-")}${t.payment_attempts > 1 ? `<small>${t.payment_attempts} attempts</small>` : ""}</td>
              <td class="nowrap">${escapeHtml(NETWORK[t.mobile_operator] || "-")}</td>
              <td class="nowrap">${escapeHtml(t.payment_phone || "-")}</td>
              <td class="num nowrap"><b>${kwacha(t.total)}</b></td>
              <td class="nowrap">${tag(t.payment_status)}${t.alerted && t.payment_status === "pending" ? `<small class="text-amber-700">Check in Lipila</small>` : ""}</td>
              <td class="nowrap mono">${escapeHtml(t.payment_reference || "-")}</td>
              <td class="nowrap mono">${escapeHtml(t.payment_provider_ref || "-")}</td>
            </tr>
            </tr>`).join("")}</tbody></table></div>`;
        list.querySelectorAll("[data-open]").forEach((row) => row.addEventListener("click", (e) => {
          if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
          e.preventDefault();
          openTransaction(Number(row.dataset.open));
        }));
        if (res.pages > 1) pag.appendChild(createPagination(res.page, res.pages, loadList));
      }

      // One transaction on its own page: Transactions / FMC-1023.
      let listLoaded = false;
      function openTransaction(id, push = true) {
        if (push) history.pushState({ id, fromList: true }, "", `/admin/transactions.html?id=${id}`);
        document.getElementById("list-view").hidden = true;
        document.getElementById("detail-view").hidden = false;
        window.scrollTo(0, 0);
        loadDetail(id);
      }
      function showList(push = true) {
        if (push) history.pushState({}, "", "/admin/transactions.html");
        document.getElementById("detail-view").hidden = true;
        document.getElementById("list-view").hidden = false;
        if (!listLoaded) loadList(1);
      }
      window.addEventListener("popstate", () => {
        const id = Number(new URLSearchParams(location.search).get("id"));
        if (id) openTransaction(id, false);
        else showList(false);
      });

      async function loadDetail(id) {
        const view = document.getElementById("detail-view");
        const crumbs = (ref) => `<nav class="tx-crumbs" aria-label="Breadcrumb"><a href="/admin/transactions.html" data-back>Transactions</a><span aria-hidden="true">/</span><b>${escapeHtml(ref)}</b></nav>`;
        view.innerHTML = `${crumbs(`FMC-${1000 + id}`)}<p class="text-sm text-gray-500">Loading…</p>`;
        const bindBack = () => view.querySelector("[data-back]").addEventListener("click", (e) => {
          e.preventDefault();
          if (history.state && history.state.fromList) history.back();
          else showList();
        });
        bindBack();
        const box = view;
        let t;
        try {
          t = (await adminApi(`/api/admin/transactions/${id}`)).data;
        } catch (error) {
          box.innerHTML = `${crumbs(`FMC-${1000 + id}`)}<p class="text-sm text-red-600">${escapeHtml(error.message)}</p>`;
          bindBack();
          return;
        }
        const row = (label, value, copy) => value ? `<div class="txd-row"><dt>${label}</dt><dd>${value}${copy ? `<button type="button" class="txd-copy" data-copy="${escapeHtml(copy)}" aria-label="Copy ${label}">Copy</button>` : ""}</dd></div>` : "";
        const mono = (v) => `<span class="txd-mono">${escapeHtml(v)}</span>`;
        const failedNote = t.payment_status === "failed" && t.payment_failure;
        const payment = [
          row("Method", escapeHtml(METHOD[t.payment_method] || t.payment_method || "-")),
          row("Network", t.mobile_operator ? escapeHtml(NETWORK[t.mobile_operator] || t.mobile_operator) : ""),
          row("Paying number", t.payment_phone ? escapeHtml(t.payment_phone) : ""),
          row("Attempts", t.payment_attempts > 1 ? String(t.payment_attempts) : ""),
          row("Payment reference", t.payment_reference ? mono(t.payment_reference) : "", t.payment_reference),
          row("Lipila ID", t.payment_provider_ref ? mono(t.payment_provider_ref) : "", t.payment_provider_ref),
          row("Paid at", t.paid_at ? formatDate(t.paid_at) : ""),
        ].join("");
        const UNIT = (o) => (o.price_unit === "lot" ? `Whole lot (${o.quantity})` : `${o.quantity}`);
        const items = t.orders.map((o) => `
          <li class="txd-item">
            <div><a href="/admin/orders.html?id=${o.id}" class="txd-item-ref">${escapeHtml(o.reference)}</a>
              <p>${escapeHtml(o.livestock_title)}</p>
              <small>Qty ${escapeHtml(UNIT(o))}${o.seller_name ? ` · ${escapeHtml(o.seller_name)}` : ""}</small></div>
            <b>${kwacha(o.total)}</b>
          </li>`).join("");
        box.innerHTML = `
          ${crumbs(t.reference)}
          <div class="tx-head">
            <div><h1>${escapeHtml(t.reference)}</h1><p>Placed ${formatDate(t.created_at)}</p></div>
            <div class="tx-head-right"><b>${kwacha(t.total)}</b>${tag(t.payment_status)}</div>
          </div>
          ${pathHtml(t)}
          ${failedNote ? `<div class="txd-alert"><b>Not completed:</b> ${escapeHtml(t.payment_failure)}</div>` : ""}
          <div class="txd-grid">
            <section class="txd-card txd-timeline">
              <h2>Timeline</h2>
              ${t.rebuilt ? `<p class="tx-rebuilt">Rebuilt from the order's records: this payment was made before every step was recorded.</p>` : ""}
              ${t.events.length ? `<ol class="tx-timeline">${t.events.map((e) => `
                <li class="tx-ev tx-${TONE[e.event] || "plain"}">
                  <div class="tx-ev-body">
                    <p class="tx-ev-title">${EVENT[e.event] || escapeHtml(e.event)} <span class="tx-actor">${e.actor === "admin" ? escapeHtml(e.admin_name || "Admin") : ACTOR[e.actor] || escapeHtml(e.actor)}</span></p>
                    <p class="tx-ev-meta">${formatDate(e.created_at)}${e.reference ? ` · ${escapeHtml(e.reference)}` : ""}</p>
                    <p class="tx-ev-text">${escapeHtml(e.detail)}</p>
                    ${e.data ? `<details class="tx-raw"><summary>Lipila's full answer</summary><pre>${escapeHtml(pretty(e.data))}</pre></details>` : ""}
                  </div>
                </li>`).join("")}</ol>` : `<p class="text-sm text-gray-500">No steps recorded.</p>`}
            </section>
            <aside class="txd-side">
              <section class="txd-card"><h2>Payment</h2><dl class="txd-list">${payment}</dl></section>
              <section class="txd-card"><h2>Buyer</h2><dl class="txd-list">
                ${row("Name", escapeHtml(t.full_name))}
                ${row("Email", `<a href="mailto:${escapeHtml(t.email)}">${escapeHtml(t.email)}</a>`)}
                ${row("Phone", `<a href="tel:${escapeHtml(String(t.phone).replace(/[^\d+]/g, ""))}">${escapeHtml(t.phone)}</a>`)}
              </dl></section>
              <section class="txd-card"><h2>Items</h2>
                <ul class="txd-items">${items}</ul>
                <div class="txd-total"><span>Total</span><b>${kwacha(t.total)}</b></div>
              </section>
            </aside>
          </div>`;
        box.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch { b.textContent = "Select it"; }
          setTimeout(() => { b.textContent = "Copy"; }, 1500);
        }));
        bindBack();
        document.title = `${t.reference} - Transactions - Frontier Marketplace Admin`;
      }

      // The journey at a glance: each stage done, failed, in progress or not reached.
      function pathHtml(t) {
        const has = (...names) => t.events.some((e) => names.includes(e.event));
        const paid = t.payment_status === "paid";
        const failed = t.payment_status === "failed";
        const card = t.payment_method === "card";
        const requested = has("payment_requested", "card_page_opened", "payment_request_unclear");
        const stages = [
          ["Order placed", "done"],
          [card ? "Card page opened" : "Payment request sent", requested ? "done" : has("payment_request_failed") ? "fail" : paid ? "done" : "todo"],
          has("admin_marked_paid") && !has("payment_confirmed")
            ? ["Confirmed by your team", "done"]
            : [card ? "Card accepted" : "PIN approved", paid ? "done" : failed && requested ? "fail" : requested ? "now" : "todo"],
          ["Paid", paid ? "done" : "todo"],
          ["Stock and emails", has("stock_taken", "email_sent", "admin_marked_paid") || (paid && t.rebuilt) ? "done" : paid ? "now" : "todo"],
        ];
        const mark = { done: "✓", fail: "✕", now: "…", todo: "" };
        return `<ol class="tx-path" aria-label="Payment progress">${stages.map(([label, st], i) => `
          <li class="tx-step is-${st}"><span class="tx-dot">${mark[st] || i + 1}</span><span class="tx-step-label">${label}</span></li>`).join("")}</ol>`;
      }

      function pretty(data) {
        try { return JSON.stringify(JSON.parse(data), null, 2); } catch { return data; }
      }

      // CSV of the current filters, made in the browser.
      async function exportCsv() {
        const btn = document.getElementById("export");
        btn.disabled = true;
        try {
          const { header, lines } = (await adminApi(`/api/admin/transactions/export?${params()}`)).data;
          const cell = (v) => {
            const s = String(v ?? "");
            return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
          };
          const csv = [header, ...lines].map((r) => r.map(cell).join(",")).join("\r\n");
          const url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
          const a = document.createElement("a");
          a.href = url;
          a.download = `frontier-transactions-${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch (error) {
          showNotification(error.message, "error");
        } finally {
          btn.disabled = false;
        }
      }

      (async () => {
        await initAdminPage("transactions");
        const q = new URLSearchParams(location.search).get("q");
        if (q) {
          state.q = q;
          state.range = "all";
          document.getElementById("search").value = q;
          document.getElementById("range").value = "all";
        }
        renderTabs();
        document.getElementById("method").addEventListener("change", (e) => { state.method = e.target.value; loadList(1); });
        document.getElementById("range").addEventListener("change", (e) => { state.range = e.target.value; loadList(1); });
        let timer;
        document.getElementById("search").addEventListener("input", (e) => {
          clearTimeout(timer);
          timer = setTimeout(() => { state.q = e.target.value.trim(); loadList(1); }, 300);
        });
        document.getElementById("export").addEventListener("click", exportCsv);
        const id = Number(new URLSearchParams(location.search).get("id"));
        if (id) openTransaction(id, false);
        else await loadList(1);
      })();
    </script>
  </body>
</html>
