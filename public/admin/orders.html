<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Orders - Frontier Marketplace Admin</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/livestock.js"></script>
  </head>
  <body class="bg-gray-50 admin-pending">
    <div id="app-sidebar"></div>
    <div id="admin-topbar"></div>

    <main class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900">Orders</h1>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 shadow-sm">
        <div class="flex flex-col md:flex-row md:items-center gap-3 p-4 border-b border-gray-100">
          <div class="seg" id="status-tabs"></div>
          <div class="relative md:ml-auto md:w-72">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" data-icon="search"></span>
            <input id="search" type="search" placeholder="Search order, name, phone, listing" class="field-input !py-2 !pl-9 !text-sm" />
          </div>
        </div>
        <div id="list" class="overflow-x-auto"></div>
        <div id="pagination" class="pb-4"></div>
      </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));

      const STATUSES = [
        { value: "new", label: "New" },
        { value: "confirmed", label: "Awaiting payment" },
        { value: "paid", label: "Paid" },
        { value: "completed", label: "Completed" },
        { value: "cancelled", label: "Cancelled" },
      ];
      const TABS = [{ value: "", label: "All" }, ...STATUSES];
      const DELIVERY = { collect: "Collect from farm", deliver: "Deliver to buyer" };
      const PAYMENT = { mobile_money: "Mobile money", bank_transfer: "Bank transfer" };
      const OPERATORS = { airtel: "Airtel Money", mtn: "MTN Mobile Money", zamtel: "Zamtel Kwacha" };
      const state = { status: "", q: "", page: 1, rows: [], open: null, summary: {} };
      const statusLabel = (s) => STATUSES.find((x) => x.value === s)?.label || s;
      const tel = (p) => escapeHtml(String(p || "").replace(/[^\d+]/g, ""));

      function whatsappNumber(phone) {
        let d = String(phone).replace(/\D/g, "");
        if (String(phone).trim().startsWith("+")) return d;
        if (d.startsWith("0")) d = "260" + d.slice(1);
        return d;
      }

      function shortDate(value) {
        const d = new Date(value);
        return `${d.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}, ${d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
      }

      function paymentShort(o) {
        if (o.payment_method === "mobile_money") return OPERATORS[o.mobile_operator] || "Mobile money";
        if (o.payment_method === "bank_transfer") return o.payment_bank || "Bank transfer";
        return "";
      }

      function renderTabs() {
        const s = state.summary;
        document.getElementById("status-tabs").innerHTML = TABS.map((t) => {
          const count = t.value === "" ? s.all : s[t.value];
          return `<button type="button" data-status="${t.value}" class="${t.value === state.status ? "active" : ""}">${t.label}${count ? `<span class="count">${count}</span>` : ""}</button>`;
        }).join("");
        document.querySelectorAll("#status-tabs button").forEach((b) => b.addEventListener("click", () => {
          state.status = b.dataset.status;
          loadList(1);
        }));
      }

      function statusSelect(o) {
        return `<select class="pill-select order-pill" data-status-for="${o.id}" data-value="${o.status}" aria-label="Status of ${escapeHtml(o.reference)}">
          ${STATUSES.map((s) => `<option value="${s.value}" ${s.value === o.status ? "selected" : ""}>${s.label}</option>`).join("")}
        </select>`;
      }

      function rowHtml(o) {
        const isOpen = String(state.open) === String(o.id);
        const units = o.price_unit === "lot" ? `Lot (${o.quantity})` : o.quantity;
        return `
          <tr class="order-row ${o.status === "new" ? "is-new" : ""} ${isOpen ? "is-open" : ""}" data-row="${o.id}" tabindex="0" aria-expanded="${isOpen}">
            <td>
              <p class="font-semibold text-gray-900 whitespace-nowrap">${escapeHtml(o.reference)}</p>
              <p class="text-xs text-gray-500 whitespace-nowrap">${shortDate(o.created_at)}</p>
            </td>
            <td>
              <p class="font-medium text-gray-900">${escapeHtml(o.full_name)}</p>
              <p class="text-xs text-gray-500 whitespace-nowrap hidden sm:block">${escapeHtml(o.phone)}</p>
            </td>
            <td class="hidden md:table-cell">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="order-item-thumb">${o.thumb_path ? `<img src="${escapeHtml(o.thumb_path)}" alt="">` : livestockFallbackMedia("w-5 h-5")}</span>
                <span class="text-sm text-gray-800 line-clamp-2">${escapeHtml(o.livestock_title)}</span>
              </div>
            </td>
            <td class="hidden sm:table-cell text-center">${escapeHtml(String(units))}</td>
            <td class="font-semibold text-gray-900 whitespace-nowrap">${kwacha(o.total)}</td>
            <td class="hidden lg:table-cell text-sm text-gray-700">${escapeHtml(paymentShort(o))}</td>
            <td>${statusSelect(o)}</td>
          </tr>
          ${isOpen ? `<tr class="order-detail-row"><td colspan="7"><div class="order-detail" data-detail="${o.id}"><span class="btn-spinner chat-spinner"></span></div></td></tr>` : ""}`;
      }

      async function loadList(page = state.page) {
        state.page = page;
        const list = document.getElementById("list");
        const params = new URLSearchParams({ page, limit: 25 });
        if (state.status) params.set("status", state.status);
        if (state.q) params.set("q", state.q);
        let res;
        try {
          res = await adminApi(`/api/admin/orders?${params}`);
        } catch (error) {
          return renderEmptyState(list, { title: "Could not load orders", message: error.message, icon: "alert" });
        }
        state.summary = res.summary;
        state.rows = res.data;
        renderTabs();
        setNewOrderBadge(res.summary.new);

        const pag = document.getElementById("pagination");
        pag.innerHTML = "";
        if (!res.data.length) {
          return renderEmptyState(list, state.q || state.status
            ? { title: "No orders here", message: state.q ? "No orders match your search." : "No orders with this status.", icon: "search" }
            : { title: "No orders yet", message: "When buyers press Buy Now on a listing, their orders appear here.", icon: "cart" });
        }
        renderTable();
        if (res.pagination.total > 1) pag.appendChild(createPagination(res.pagination.current, res.pagination.total, loadList));
      }

      function renderTable() {
        const list = document.getElementById("list");
        list.innerHTML = `
          <table class="admin-table orders-table">
            <thead><tr>
              <th>Order</th><th>Buyer</th><th class="hidden md:table-cell">Listing</th><th class="hidden sm:table-cell text-center">Qty</th>
              <th>Total</th><th class="hidden lg:table-cell">Payment</th><th>Status</th>
            </tr></thead>
            <tbody>${state.rows.map(rowHtml).join("")}</tbody>
          </table>`;
        bindTable();
        if (state.open) loadDetail(state.open);
      }

      function toggle(id) {
        state.open = String(state.open) === String(id) ? null : String(id);
        history.replaceState(null, "", state.open ? `${location.pathname}?id=${state.open}` : location.pathname);
        renderTable();
      }

      function bindTable() {
        document.querySelectorAll("#list [data-row]").forEach((tr) => {
          tr.addEventListener("click", (e) => {
            if (e.target.closest("select, a, button")) return;
            toggle(tr.dataset.row);
          });
          tr.addEventListener("keydown", (e) => {
            if ((e.key === "Enter" || e.key === " ") && e.target === tr) { e.preventDefault(); toggle(tr.dataset.row); }
          });
        });
        document.querySelectorAll("#list [data-status-for]").forEach((sel) => sel.addEventListener("change", () => changeStatus(sel)));
      }

      async function changeStatus(sel) {
        const o = state.rows.find((r) => String(r.id) === sel.dataset.statusFor);
        const value = sel.value;
        const note = document.querySelector(`[data-detail="${o.id}"] [data-message]`)?.value.trim() || "";
        const confirmText = {
          confirmed: o.seller_id && !o.seller_notified_at ? "The seller is told about the order." : "",
          paid: o.livestock_id && !o.stock_deducted ? `${o.quantity} will be taken off the listing.` : "",
          completed: o.livestock_id && !o.stock_deducted ? `${o.quantity} will be taken off the listing.` : "",
          cancelled: o.stock_deducted ? `${o.quantity} will be put back on the listing.` : "",
        }[value];
        const ok = await confirmAction({
          title: `Mark ${o.reference} as ${statusLabel(value).toLowerCase()}?`,
          message: ["The buyer is emailed about the change.", confirmText, note ? "Your message is included." : ""].filter(Boolean).join(" "),
          confirmText: `Mark ${statusLabel(value).toLowerCase()}`,
          variant: value === "cancelled" ? "danger" : undefined,
        });
        if (!ok) { sel.value = o.status; return; }
        sel.disabled = true;
        try {
          await update(o, { status: value, message: note || undefined });
        } catch (error) {
          sel.value = o.status;
          sel.disabled = false;
          showNotification(error.message, "error");
        }
      }

      async function update(o, body) {
        const res = await adminApi(`/api/admin/orders/${o.id}`, { method: "PATCH", body });
        showNotification(res.message, res.message.includes("not sent") ? "warning" : "success");
        await loadList(state.page);
      }

      function rows(pairs) {
        return `<dl class="order-dl">${pairs.filter(([, v]) => v !== null && v !== undefined && v !== "")
          .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
      }

      async function loadDetail(id) {
        const box = document.querySelector(`[data-detail="${id}"]`);
        if (!box) return;
        let o;
        try {
          o = (await adminApi(`/api/admin/orders/${id}`)).data;
        } catch (error) {
          box.innerHTML = `<p class="text-sm text-red-600">${escapeHtml(error.message)}</p>`;
          return;
        }
        const row = state.rows.find((r) => String(r.id) === String(id));
        if (row) Object.assign(row, o);
        const lot = o.price_unit === "lot";
        const listingLink = o.livestock_id && o.listing_status === "published"
          ? `<a href="/listing.html?id=${o.livestock_id}" target="_blank" rel="noopener" class="text-blue-700 hover:underline">${escapeHtml(o.livestock_title)}</a>`
          : `${escapeHtml(o.livestock_title)} <span class="text-gray-400">${o.livestock_id ? "(not on the website)" : "(listing deleted)"}</span>`;

        box.innerHTML = `
          <div class="order-detail-grid">
            <section>
              <h3>Buyer</h3>
              <p class="font-semibold text-gray-900">${escapeHtml(o.full_name)}</p>
              <div class="order-contact">
                <a href="https://wa.me/${whatsappNumber(o.phone)}" target="_blank" rel="noopener">WhatsApp ${escapeHtml(o.phone)}</a>
                <a href="tel:${tel(o.phone)}">Call</a>
                <a href="mailto:${escapeHtml(o.email)}?subject=${encodeURIComponent(`Order ${o.reference} - Frontier Marketplace`)}">${escapeHtml(o.email)}</a>
              </div>
            </section>
            <section>
              <h3>Order</h3>
              ${rows([
                ["Listing", listingLink],
                ["Quantity", lot ? `The whole lot (${o.quantity})` : `${o.quantity} × ${kwacha(o.unit_price)}`],
                ["Total", `<strong>${kwacha(o.total)}</strong>`],
                ["Stock", o.livestock_id ? (o.stock_deducted ? `Taken off the listing (${o.listing_quantity} left)` : `${o.listing_quantity} on the listing`) : null],
              ])}
            </section>
            <section>
              <h3>Delivery and payment</h3>
              ${rows([
                ["Delivery", escapeHtml(DELIVERY[o.delivery])],
                ["Address", o.delivery === "deliver" ? escapeHtml(o.delivery_address) : null],
                ["Payment", escapeHtml(PAYMENT[o.payment_method])],
                ["Operator", o.payment_method === "mobile_money" && o.mobile_operator ? escapeHtml(OPERATORS[o.mobile_operator]) : null],
                ["Pay from", o.payment_method === "mobile_money" && o.payment_phone ? `<a href="tel:${tel(o.payment_phone)}" class="hover:underline">${escapeHtml(o.payment_phone)}</a>` : null],
                ["Bank", o.payment_method === "bank_transfer" && o.payment_bank ? escapeHtml(o.payment_bank) : null],
                ["Account", o.payment_method === "bank_transfer" && o.payment_account ? escapeHtml(o.payment_account) : null],
              ])}
            </section>
            <section>
              <h3>Seller</h3>
              ${o.seller_id
                ? `<a href="/admin/sellers.html?id=${o.seller_id}" class="font-semibold text-gray-900 hover:text-blue-700">${escapeHtml(o.seller_name || "Seller")}</a>
                   ${rows([["Phone", o.seller_phone ? `<a href="tel:${tel(o.seller_phone)}" class="hover:underline">${escapeHtml(o.seller_phone)}</a>` : null],
                           ["Told about it", o.seller_notified_at ? formatDate(o.seller_notified_at) : "When you confirm the order"]])}`
                : `<p class="text-sm text-gray-600">${o.seller_name ? `${escapeHtml(o.seller_name)} (removed)` : "Frontier's stock"}</p>`}
            </section>
          </div>
          <div class="order-message">
            <textarea data-message rows="2" maxlength="2000" class="field-input" placeholder="Message ${escapeHtml(o.full_name)}, e.g. payment details"></textarea>
            <button type="button" data-send class="chat-send-btn">Send</button>
          </div>`;

        const input = box.querySelector("[data-message]");
        const send = box.querySelector("[data-send]");
        send.addEventListener("click", async () => {
          const message = input.value.trim();
          if (!message) return input.focus();
          send.disabled = true;
          try {
            await update(o, { message });
          } catch (error) {
            showNotification(error.message, "error");
            send.disabled = false;
          }
        });
        input.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send.click(); });
      }

      let searchTimer;
      document.getElementById("search").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { state.q = e.target.value.trim(); loadList(1); }, 300);
      });

      (async () => {
        await initAdminPage("orders");
        const q = getQueryParams();
        if (q.status) state.status = q.status;
        if (q.q) { state.q = q.q; document.getElementById("search").value = q.q; }
        if (q.id) state.open = String(q.id);
        await loadList(1);
      })();
    </script>
  </body>
</html>
