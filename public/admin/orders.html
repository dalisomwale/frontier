<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Orders - Frontier Marketplace Admin</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/xlsx-lite.js"></script>
    <script src="/js/pdf-lite.js"></script>
    <script src="/js/livestock.js"></script>
  </head>
  <body class="bg-gray-50 admin-pending">
    <div id="app-sidebar"></div>
    <div id="admin-topbar"></div>

    <main class="app-content-shifted tx-page-wide mx-auto px-3 sm:px-4 py-6">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900">Orders</h1>
        <button type="button" id="export" class="tx-export">Export Excel</button>
      </div>

      <div class="tx-totals" id="totals"></div>

      <div class="bg-white rounded-xl border border-gray-100">
        <div class="flex flex-col md:flex-row md:items-center gap-3 p-4 border-b border-gray-100">
          <div class="seg" id="status-tabs"></div>
          <div class="relative md:ml-auto md:w-72">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" data-icon="search"></span>
            <input id="search" type="search" placeholder="Search order, name, phone, listing" class="field-input !py-2 !pl-9 !text-sm" />
          </div>
        </div>
        <div id="list" class="overflow-x-auto"></div>
        <div id="pagination" class="pb-4"></div>
      </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));

      const STATUSES = [
        { value: "new", label: "New" },
        { value: "confirmed", label: "Awaiting payment" },
        { value: "paid", label: "Paid" },
        { value: "completed", label: "Completed" },
        { value: "cancelled", label: "Cancelled" },
      ];
      const TABS = [{ value: "", label: "All" }, ...STATUSES];
      const DELIVERY = { collect: "Collect from farm", deliver: "Deliver to buyer" };
      const PAYMENT = { mobile_money: "Mobile money", bank_transfer: "Bank transfer", card: "Card" };
      const CARDS = { visa: "Visa", mastercard: "Mastercard" };
      const OPERATORS = { airtel: "Airtel Money", mtn: "MTN Mobile Money", zamtel: "Zamtel Kwacha" };
      const state = { status: "", q: "", page: 1, rows: [], open: null, summary: {} };
      const statusLabel = (s) => STATUSES.find((x) => x.value === s)?.label || s;
      const tel = (p) => escapeHtml(String(p || "").replace(/[^\d+]/g, ""));

      function whatsappNumber(phone) {
        let d = String(phone).replace(/\D/g, "");
        if (String(phone).trim().startsWith("+")) return d;
        if (d.startsWith("0")) d = "260" + d.slice(1);
        return d;
      }

      function shortDate(value) {
        const d = new Date(value);
        return `${d.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}, ${d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
      }

      // Website payments (mobile money and card): paid / waiting / not completed.
      const PAY_STATE = { paid: ["Paid", "pay-tag-paid"], pending: ["Waiting for PIN", "pay-tag-pending"], failed: ["Not completed", "pay-tag-failed"] };
      const payTag = (o) => {
        const st = PAY_STATE[o.payment_status];
        if (!st) return "";
        const label = o.payment_status === "pending" && o.payment_method === "card" ? "Waiting for card payment" : st[0];
        return `<span class="pay-tag ${st[1]}">${label}</span>`;
      };
      // Where the order's items stand on the listing.
      function stockText(o) {
        if (!o.livestock_id) return null;
        const on = `${o.listing_quantity ?? 0} on the listing`;
        if (o.stock_deducted) return `Taken off the listing (${o.listing_quantity ?? 0} left)`;
        if (o.status === "cancelled" || o.status === "completed") return `Not taken (${on})`;
        if (Number(o.on_hold)) return `Held while the buyer pays (${on})`;
        return `Not taken yet: comes off when the payment is confirmed (${on})`;
      }

      // One small tag under the status: a failed payment, or where the handover is.
      function stageTag(o) {
        if (o.status === "cancelled") return "";
        const tag = (t, ok) => `<div class="mt-1"><span class="ho-tag ${ok ? "ho-tag-ok" : ""}">${t}</span></div>`;
        if (o.seller_paid_at) return tag("Seller paid", true);
        if (o.handed_over_at && o.seller_id) return tag("Ready to pay seller");
        if (o.handed_over_at) return tag("Handed over", true);
        if (o.received_at) return tag("Buyer confirmed");
        return "";
      }

      function paymentShort(o) {
        if (o.payment_method === "mobile_money") return OPERATORS[o.mobile_operator] || "Mobile money";
        if (o.payment_method === "bank_transfer") return o.payment_bank || "Bank transfer";
        if (o.payment_method === "card") return `${CARDS[o.card_brand] || "Card"}${o.card_last4 ? ` •••• ${o.card_last4}` : ""}`;
        return "";
      }

      function renderTabs() {
        const s = state.summary;
        document.getElementById("status-tabs").innerHTML = TABS.map((t) => {
          const count = t.value === "" ? s.all : s[t.value];
          return `<button type="button" data-status="${t.value}" class="${t.value === state.status ? "active" : ""}">${t.label}${count ? `<span class="count">${count}</span>` : ""}</button>`;
        }).join("");
        document.querySelectorAll("#status-tabs button").forEach((b) => b.addEventListener("click", () => {
          state.status = b.dataset.status;
          loadList(1);
        }));
      }

      function statusSelect(o) {
        return `<select class="pill-select order-pill" data-status-for="${o.id}" data-value="${o.status}" aria-label="Status of ${escapeHtml(o.reference)}">
          ${STATUSES.map((s) => `<option value="${s.value}" ${s.value === o.status ? "selected" : ""}>${s.label}</option>`).join("")}
        </select>`;
      }

      const dateOnly = (v) => new Date(v).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
      const telHref = (p) => `tel:${escapeHtml(String(p).replace(/\s+/g, ""))}`;

      // Has the buyer got the items? Delivered, Collected or Not yet.
      const collectionText = (o) => (o.sent_at ? (o.sent_method === "delivered" ? "Delivered" : "Collected") : o.status === "cancelled" ? "" : "Not yet");
      function collectionTag(o) {
        const t = collectionText(o);
        if (!t) return `<span class="text-gray-400">-</span>`;
        return `<span class="col-tag ${o.sent_at ? "col-tag-done" : ""}">${t}</span>`;
      }

      function rowHtml(o) {
        const units = o.price_unit === "lot" ? `Lot (${o.quantity})` : o.quantity;
        return `
          <tr class="order-row ${o.status === "new" ? "is-new" : ""}" data-row="${o.id}" tabindex="0" aria-expanded="false">
            <td class="whitespace-nowrap text-gray-600">${dateOnly(o.created_at)}</td>
            <td><p class="font-semibold text-gray-900 whitespace-nowrap">${escapeHtml(o.reference)}</p></td>
            <td class="hidden md:table-cell">
              <div class="min-w-0">
                <span class="text-gray-800 line-clamp-2">${escapeHtml(o.livestock_title)}</span>
              </div>
            </td>
            <td class="hidden md:table-cell whitespace-nowrap text-gray-700">${escapeHtml(String(units))}</td>
            <td><span class="font-medium text-gray-900 whitespace-nowrap">${escapeHtml(o.full_name)}</span></td>
            <td class="hidden xl:table-cell">${o.email ? `<a class="tx-contact tx-clip" href="mailto:${escapeHtml(o.email)}" title="${escapeHtml(o.email)}">${escapeHtml(o.email)}</a>` : "-"}</td>
            <td class="hidden sm:table-cell whitespace-nowrap">${o.phone ? `<a class="tx-contact" href="${telHref(o.phone)}">${escapeHtml(o.phone)}</a>` : "-"}</td>
            <td class="hidden lg:table-cell whitespace-nowrap text-gray-700">${escapeHtml(paymentShort(o) || "-")}</td>
            <td class="whitespace-nowrap"><b class="text-gray-900">${kwacha(o.total)}</b></td>
            <td class="hidden sm:table-cell whitespace-nowrap">${collectionTag(o)}</td>
            <td>${statusSelect(o)}${stageTag(o)}${o.sent_at && !stageTag(o) ? `<div class="mt-1 sm:hidden">${collectionTag(o)}</div>` : ""}</td>
          </tr>
`;
      }

      function renderTotals(s) {
        document.getElementById("totals").innerHTML = `
          <div class="tx-total txc-received"><span>Sales</span><b>${kwacha(s.sales || 0)}</b></div>
          <div class="tx-total txc-paid"><span>New</span><b>${Number(s.new) || 0}</b></div>
          <div class="tx-total txc-waiting"><span>Awaiting payment</span><b>${Number(s.confirmed) || 0}</b></div>
          <div class="tx-total txc-failed"><span>Cancelled</span><b>${Number(s.cancelled) || 0}</b></div>`;
      }

      // Excel file of the orders under the current tab and search.
      async function exportExcel() {
        const btn = document.getElementById("export");
        btn.disabled = true;
        try {
          const params = listParams(1);
          params.set("export", "1");
          const res = await adminApi(`/api/admin/orders?${params}`);
          const fmt = (d) => (d ? new Date(d).toLocaleString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }).replace(",", "") : "");
          const header = ["Order", "Date", "Items", "Quantity", "Name", "Email", "Phone", "Delivery", "Payment method", "Amount (ZMW)", "Collection", "Status", "Payment", "Seller", "Delivered / collected", "Buyer confirmed", "Handed over", "Seller paid"];
          const lines = res.data.map((o) => [
            o.reference, fmt(o.created_at), o.livestock_title, Number(o.quantity) || 0,
            o.full_name, o.email || "", o.phone || "", DELIVERY[o.delivery] || "", paymentShort(o),
            Number(o.total).toFixed(2), collectionText(o), statusLabel(o.status), (PAY_STATE[o.payment_status] || [o.payment_status || ""])[0],
            o.seller_name || "Frontier", fmt(o.sent_at), fmt(o.received_at), fmt(o.handed_over_at), fmt(o.seller_paid_at),
          ]);
          downloadXlsx(`frontier-orders-${new Date().toISOString().slice(0, 10)}.xlsx`, "Orders", header, lines, { numberCols: [3, 9] });
        } catch (error) {
          showNotification(error.message, "error");
        } finally {
          btn.disabled = false;
        }
      }
      document.getElementById("export").addEventListener("click", exportExcel);

      function listParams(page) {
        const params = new URLSearchParams({ page, limit: 25 });
        if (state.status) params.set("status", state.status);
        if (state.q) params.set("q", state.q);
        return params;
      }

      // Handover: the seller's delivery or collection (with photos), then the
      // buyer's confirmation (with photos), then "handed over" completes it.
      const proofPhotos = (o, party) => {
        const list = (o.receipt_photos || []).filter((p) => (p.party || "buyer") === party);
        return list.length ? `<div class="order-proof-photos">${list.map((p) => `<a href="${escapeHtml(p.image_path)}" target="_blank" rel="noopener"><img src="${escapeHtml(p.thumb_path)}" alt="${party === "seller" ? "Seller's photo" : party === "payout" ? "Proof of payment" : "Buyer's photo"}"></a>`).join("")}</div>` : "";
      };
      // The order's steps, newest first. Each step opens and closes; the one
      // waiting for action (or else the newest) starts open.
      function orderTimelineHtml(o, checkPay) {
        const paid = o.payment_status === "paid" || ["paid", "confirmed", "completed"].includes(o.status);
        const failed = o.payment_status === "failed" && !paid;
        const how = (m) => (m === "delivered" ? "Delivered" : "Collected");
        const day = (v) => (v ? new Date(v).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "");
        const at = (v) => (v ? new Date(v).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "");
        const by = (name, v) => `<p class="tl-body-line">${v ? `<span class="tl-time">${at(v)}</span>` : ""}${name ? `By ${escapeHtml(name)}` : ""}</p>`;
        const steps = [];
        steps.push({ name: "Order placed", done: true, date: o.created_at,
          body: `${by(o.full_name, o.created_at)}<p class="tl-body-line">${escapeHtml(DELIVERY[o.delivery] || "")}${o.delivery === "deliver" && o.delivery_address ? `: ${escapeHtml(o.delivery_address)}` : ""}</p>` });
        if (o.status === "cancelled") {
          steps.push({ name: "Cancelled", fail: true, date: o.updated_at, body: `<p class="tl-body-line">This order was cancelled.</p>` });
        } else {
          steps.push({ name: paid ? `Paid · ${kwacha(o.total)}` : failed ? "Payment not completed" : "Payment", done: paid, fail: failed, date: o.paid_at,
            body: paid
              ? `<p class="tl-body-line">${o.paid_at ? `<span class="tl-time">${at(o.paid_at)}</span>` : ""}${escapeHtml(payMethodText(o))}</p>`
              : `${failed && o.payment_failure ? `<p class="tl-body-line text-red-700">${escapeHtml(o.payment_failure)}</p>` : `<p class="tl-body-line">Waiting for payment.</p>`}${checkPay}` });
          steps.push({ name: o.sent_at ? how(o.sent_method) : "Delivered or collected", done: Boolean(o.sent_at), date: o.sent_at,
            body: o.sent_at
              ? `${by(o.sent_by || "-", o.sent_at)}${proofPhotos(o, "seller")}`
              : o.can_send
                ? `<form data-sent novalidate>
                     <p class="tl-body-line">${o.seller_id ? "Waiting for the seller. You can also do it here." : "Frontier's stock."}</p>
                     <div class="ho-choice" style="max-width:420px">
                       <label><input type="radio" name="method" value="collected"><span>Collected</span></label>
                       <label><input type="radio" name="method" value="delivered"><span>Delivered</span></label>
                     </div>
                     <p class="field-error hidden" data-error-for="method"></p>
                     <div class="acc-ph-grid mt-3" data-photos style="max-width:520px"></div>
                     <p class="field-error hidden" data-error-for="images"></p>
                     <button type="submit" class="acc-btn mt-3" style="width:auto">Save</button>
                   </form>`
                : paid ? `<p class="tl-body-line">Waiting for the seller.</p>` : "" });
          steps.push({ name: "Buyer confirmed", done: Boolean(o.received_at), date: o.received_at,
            body: o.received_at
              ? `${by(o.full_name, o.received_at)}${o.received_note ? `<p class="tl-body-line">"${escapeHtml(o.received_note)}"</p>` : ""}${proofPhotos(o, "buyer")}`
              : o.sent_at ? `<p class="tl-body-line">${o.buyer_id ? "Waiting for the buyer. They confirm with photos." : "No account: mark the order Completed when it's done."}</p>` : "" });
          steps.push({ name: "Handed over", done: Boolean(o.handed_over_at), date: o.handed_over_at,
            body: o.handed_over_at
              ? by(o.handed_over_by || "-", o.handed_over_at)
              : o.can_hand_over
                ? `<form data-handover><p class="tl-body-line">${o.seller_id ? "Waiting for the seller. You can also do it here." : "Completes the order."}</p><button type="submit" class="acc-btn mt-2" style="width:auto">Mark as handed over</button></form>`
                : "" });
          if (o.seller_id) {
            steps.push({ name: "Seller paid", done: Boolean(o.seller_paid_at), date: o.seller_paid_at,
              body: o.seller_paid_at
                ? `${by(o.seller_paid_by || "-", o.seller_paid_at)}${o.seller_paid_ref ? `<p class="tl-body-line">Ref ${escapeHtml(o.seller_paid_ref)}</p>` : ""}${proofPhotos(o, "payout")}`
                : o.can_pay_seller
                  ? `<form data-pay-seller novalidate>
                       <p class="tl-body-line">Once you've paid ${escapeHtml(o.seller_name || "the seller")}, add the proof of payment.</p>
                       <label class="field-label" for="pay-ref-${o.id}">Payment reference <span class="text-gray-400 font-normal">(optional)</span></label>
                       <input id="pay-ref-${o.id}" name="reference" class="field-input" maxlength="150" style="max-width:320px" placeholder="e.g. bank or mobile money reference">
                       <p class="field-label mt-3">Proof of payment <span class="text-red-500">*</span> <span class="text-gray-400 font-normal">(1 to 4 photos)</span></p>
                       <div class="acc-ph-grid" data-photos style="max-width:520px"></div>
                       <p class="field-error hidden" data-error-for="images"></p>
                       <button type="submit" class="acc-btn mt-3" style="width:auto">Mark seller paid</button>
                     </form>`
                  : "" });
          }
        }
        const nowAt = steps.findIndex((st) => !st.done && !st.fail);
        const lastDone = steps.map((st, i) => (st.done || st.fail ? i : -1)).filter((i) => i >= 0).pop();
        const openAt = nowAt >= 0 && steps[nowAt].body ? nowAt : lastDone;
        const items = steps.map((st, i) => {
          const state = st.done ? "done" : st.fail ? "fail" : i === nowAt ? "now" : "todo";
          const dot = state === "done" ? "✓" : state === "fail" ? "✕" : state === "now" ? "…" : i + 1;
          const head = `<span class="tl-name">${st.name}</span><span class="tl-head-right">${st.date ? `<span class="tl-day">${day(st.date)}</span>` : ""}${st.body ? `<span class="tl-fold-chev" aria-hidden="true"></span>` : ""}</span>`;
          const body = st.body
            ? `<details class="tl-fold"${i === openAt ? " open" : ""}><summary class="tl-head">${head}</summary><div class="tl-body">${st.body}</div></details>`
            : `<div class="tl-head">${head}</div>`;
          return `<li class="tl-stage tl-${state}"><span class="tl-dot">${dot}</span>${body}</li>`;
        });
        return `<ol class="tx-timeline tl">${items.reverse().join("")}</ol>`;
      }

      // Payment history as a one-page PDF receipt.
      function orderPdf(o) {
        const pdf = createPdf();
        const L = 56, R = pdf.width - 56, MID = L + 170;
        let y = 64;
        const when = (v) => (v ? formatDate(v) : "");
        const room = (h) => { if (y + h > pdf.height - 60) { pdf.addPage(); y = 64; } };
        const dashed = () => { pdf.line(L, y, R, y, { color: "#d1d5db", dash: [3, 3] }); y += 22; };
        const heading = (text, color) => { room(40); pdf.text(L, y, text.toUpperCase(), { size: 9.5, font: "bold", color }); y += 20; };
        const row = (label, value, font = "bold") => {
          if (!value) return;
          room(20);
          pdf.text(L, y, label, { size: 10.5, color: "#6b7280" });
          pdf.text(R, y, pdf.fit(value, R - MID, 10.5, font), { size: 10.5, font, align: "right" });
          y += 19;
        };
        const lot = o.price_unit === "lot";
        const PAY = { paid: ["Paid", "#15803d"], pending: ["Waiting", "#b45309"], failed: ["Not completed", "#b91c1c"] };
        const st = o.status === "cancelled" ? ["Cancelled", "#b91c1c"] : PAY[o.payment_status] || [statusLabel(o.status), "#374151"];

        pdf.text(L, y, "Frontier Marketplace", { size: 16, font: "bold", color: "#14532d" });
        pdf.text(R, y, "Payment history", { size: 11, color: "#6b7280", align: "right" });
        y += 16;
        pdf.text(L, y, "marketplace.frontierfc.co.zm", { size: 9.5, color: "#6b7280" });
        y += 24;
        pdf.rect(L, y - 14, R - L, 34, { fill: "#f3f7f1" });
        pdf.text(L + 12, y + 7, o.reference, { size: 13, font: "mono" });
        pdf.text(L + 12 + pdf.measure(o.reference, 13, "mono") + 12, y + 7, when(o.created_at), { size: 10, color: "#6b7280" });
        pdf.text(R - 12, y + 7, st[0], { size: 10.5, font: "bold", color: st[1], align: "right" });
        y += 44;

        heading("Item", "#b45309");
        room(20);
        pdf.text(L, y, pdf.fit(o.livestock_title, R - L, 12, "bold"), { size: 12, font: "bold" });
        y += 20;
        row("Quantity", lot ? `Whole lot (${o.quantity})` : String(o.quantity));
        row("Price", lot ? kwacha(o.total) : `${kwacha(o.unit_price)} each`);
        row(o.delivery === "deliver" ? "Delivery" : "Collection", `${DELIVERY[o.delivery] || ""}${o.delivery === "deliver" && o.delivery_address ? `: ${o.delivery_address}` : ""}`);
        y += 2; dashed();

        heading("Payment", "#15803d");
        row("Method", payMethodText(o));
        row("Paid on", when(o.paid_at));
        row("Checkout", o.checkout_reference || "", "mono");
        row("Payment reference", o.checkout_payment && o.checkout_payment.reference ? o.checkout_payment.reference : "", "mono");
        row("Provider reference", o.payment_provider_ref || "", "mono");
        if (o.payment_status === "failed" && o.payment_failure) row("Why it failed", o.payment_failure);
        y += 2; dashed();

        heading("Buyer", "#0f766e");
        row("Name", o.full_name || "");
        row("Phone", o.phone || "");
        row("Email", o.email || "");
        y += 2; dashed();

        heading("Seller", "#6d28d9");
        row("Name", o.seller_id ? o.seller_name || "Seller" : o.seller_name ? `${o.seller_name} (removed)` : "Frontier's stock");
        if (o.seller_id) row("Phone", o.seller_phone || "");
        if (o.seller_paid_at) row("Seller paid", `${when(o.seller_paid_at)}${o.seller_paid_ref ? ` · Ref ${o.seller_paid_ref}` : ""}`);

        room(50);
        y += 6;
        pdf.line(L, y, R, y, { color: "#111827", width: 1 });
        y += 20;
        pdf.text(L, y, "Total", { size: 12, font: "bold" });
        pdf.text(R, y, kwacha(o.total), { size: 15, font: "bold", align: "right" });
        y += 40;
        pdf.text(L, y, `Downloaded ${formatDate(new Date())}`, { size: 8.5, color: "#9ca3af" });
        pdf.save(`${o.reference}-payment-history.pdf`);
      }
      function bindProof(box, o) {
        const sent = box.querySelector("[data-sent]");
        if (sent) {
          const errorFor = (k) => sent.querySelector(`[data-error-for="${k}"]`);
          const picker = bindPhotoPicker(sent.querySelector("[data-photos]"), 4, (n) => { if (n) errorFor("images").classList.add("hidden"); });
          sent.addEventListener("submit", async (e) => {
            e.preventDefault();
            const errors = {};
            if (!sent.method.value) errors.method = "Please choose one.";
            if (!picker.files().length) errors.images = "Please add at least one photo.";
            if (Object.keys(errors).length) return showFieldErrors(sent, { errors });
            const fd = new FormData();
            fd.append("method", sent.method.value);
            picker.files().forEach((f) => fd.append("images", f));
            try {
              const res = await withBusy(sent.querySelector("button[type=submit]"), "Saving…", () =>
                adminApi(`/api/admin/orders/${o.id}/sent`, { method: "POST", body: fd }));
              showNotification(res.message, "success");
              await loadList(state.page);
            } catch (error) {
              showFieldErrors(sent, error);
              showNotification(error.message, "error");
            }
          });
        }
        const pay = box.querySelector("[data-pay-seller]");
        if (pay) {
          const picker = bindPhotoPicker(pay.querySelector("[data-photos]"), 4, (n) => { if (n) pay.querySelector('[data-error-for="images"]').classList.add("hidden"); });
          pay.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!picker.files().length) return showFieldErrors(pay, { errors: { images: "Please add at least one photo of the proof of payment." } });
            if (!(await confirmAction({ title: "Mark the seller as paid?", message: "The seller will be told and can see the proof of payment. The order will be completed.", confirmText: "Mark seller paid" }))) return;
            const fd = new FormData();
            fd.append("reference", pay.reference.value.trim());
            picker.files().forEach((f) => fd.append("images", f));
            try {
              const res = await withBusy(pay.querySelector("button[type=submit]"), "Saving…", () =>
                adminApi(`/api/admin/orders/${o.id}/seller-paid`, { method: "POST", body: fd }));
              showNotification(res.message, "success");
              await loadList(state.page);
            } catch (error) {
              showFieldErrors(pay, error);
              showNotification(error.message, "error");
            }
          });
        }
        box.querySelector("[data-handover]")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!(await confirmAction({ title: "Mark as handed over?", message: o.seller_id ? "The seller can then be paid." : "The order will be completed.", confirmText: "Mark as handed over" }))) return;
          try {
            const res = await adminApi(`/api/admin/orders/${o.id}/handover`, { method: "POST", body: {} });
            showNotification(res.message, "success");
            await loadList(state.page);
          } catch (error) {
            showNotification(error.message, "error");
          }
        });
      }

      async function loadList(page = state.page, preloaded) {
        state.page = page;
        const list = document.getElementById("list");
        let res = preloaded;
        if (!res) {
          try {
            res = await adminApi(`/api/admin/orders?${listParams(page)}`);
          } catch (error) {
            return renderEmptyState(list, { title: "Could not load orders", message: error.message, icon: "alert" });
          }
        }
        state.summary = res.summary;
        state.rows = res.data;
        renderTabs();
        renderTotals(res.summary);
        setNewOrderBadge(res.summary.new);

        const pag = document.getElementById("pagination");
        pag.innerHTML = "";
        if (!res.data.length) {
          return renderEmptyState(list, state.q || state.status
            ? { title: "No orders here", message: state.q ? "No orders match your search." : "No orders with this status.", icon: "search" }
            : { title: "No orders yet", message: "When buyers press Buy Now on a listing, their orders appear here.", icon: "cart" });
        }
        renderTable();
        if (res.pagination.total > 1) pag.appendChild(createPagination(res.pagination.current, res.pagination.total, loadList));
      }

      function renderTable() {
        const list = document.getElementById("list");
        list.innerHTML = `
          <table class="admin-table orders-table">
            <thead><tr>
              <th>Date</th><th>Order</th><th class="hidden md:table-cell">Items</th><th class="hidden md:table-cell" title="Quantity">Qty</th><th>Name</th>
              <th class="hidden xl:table-cell">Email</th><th class="hidden sm:table-cell">Phone</th><th class="hidden lg:table-cell">Payment Method</th>
              <th>Amount</th><th class="hidden sm:table-cell">Collection</th><th>Status</th>
            </tr></thead>
            <tbody>${state.rows.map(rowHtml).join("")}</tbody>
          </table>`;
        bindTable();
        if (state.open) loadDetail(state.open);
      }

      // One order on its own page: Orders / FM-1234.
      let orderView = null;
      function toggle(id) {
        if (orderView && !orderView.closed) orderView.close(true);
        state.open = String(id);
        const ref = `FM-${1000 + Number(id)}`;
        orderView = openAdminView({ title: ref, params: { id }, onClose: () => { state.open = null; orderView = null; } });
        orderView.body.innerHTML = `
          <div class="sv-head"><h1 class="admin-view-title !mb-0" data-order-title>${escapeHtml(ref)}</h1></div>
          <div class="order-detail order-page" data-detail="${id}"><span class="btn-spinner chat-spinner"></span></div>`;
        loadDetail(id);
      }

      function bindTable() {
        document.querySelectorAll("#list [data-row]").forEach((tr) => {
          tr.addEventListener("click", (e) => {
            if (e.target.closest("select, a, button")) return;
            toggle(tr.dataset.row);
          });
          tr.addEventListener("keydown", (e) => {
            if ((e.key === "Enter" || e.key === " ") && e.target === tr) { e.preventDefault(); toggle(tr.dataset.row); }
          });
        });
        document.querySelectorAll("#list [data-status-for]").forEach((sel) => sel.addEventListener("change", () => changeStatus(sel)));
      }

      async function changeStatus(sel) {
        const o = state.rows.find((r) => String(r.id) === sel.dataset.statusFor);
        const value = sel.value;
        const note = document.querySelector(`[data-detail="${o.id}"] [data-message]`)?.value.trim() || "";
        const confirmText = {
          confirmed: o.seller_id && !o.seller_notified_at ? "The seller is told about the order." : "",
          cancelled: o.stock_deducted ? `${o.quantity} will be put back on the listing.` : "",
        }[value] || (o.status === "cancelled" && o.livestock_id ? `${o.quantity} will be taken off the listing again.` : "");
        const ok = await confirmAction({
          title: `Mark ${o.reference} as ${statusLabel(value).toLowerCase()}?`,
          message: ["The buyer is emailed about the change.", confirmText, note ? "Your message is included." : ""].filter(Boolean).join(" "),
          confirmText: `Mark ${statusLabel(value).toLowerCase()}`,
          variant: value === "cancelled" ? "danger" : undefined,
        });
        if (!ok) { sel.value = o.status; return; }
        sel.disabled = true;
        try {
          await update(o, { status: value, message: note || undefined });
        } catch (error) {
          sel.value = o.status;
          sel.disabled = false;
          showNotification(error.message, "error");
        }
      }

      async function update(o, body) {
        const res = await adminApi(`/api/admin/orders/${o.id}`, { method: "PATCH", body });
        showNotification(res.message, res.message.includes("not sent") ? "warning" : "success");
        await loadList(state.page);
      }

      const OD_ICON = {
        wa: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3Z"/></svg>`,
        call: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>`,
        mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`,
      };
      const initialsOf = (name) => String(name || "?").replace(/\(.*?\)/g, "").trim().split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("").toUpperCase() || "?";
      function payMethodText(o) {
        if (o.payment_method === "card") return `${CARDS[o.card_brand] || "Card"}${o.card_last4 ? ` ending ${o.card_last4}` : ""}`;
        if (o.payment_method === "mobile_money") return [o.mobile_operator ? OPERATORS[o.mobile_operator] : "Mobile money", o.payment_phone].filter(Boolean).join(" · ");
        return PAYMENT[o.payment_method] || "-";
      }

      function rows(pairs) {
        return `<dl class="order-dl">${pairs.filter(([, v]) => v !== null && v !== undefined && v !== "")
          .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
      }

      async function loadDetail(id) {
        const box = document.querySelector(`[data-detail="${id}"]`);
        if (!box) return;
        let o;
        try {
          o = (await adminApi(`/api/admin/orders/${id}`)).data;
        } catch (error) {
          box.innerHTML = `<p class="text-sm text-red-600">${escapeHtml(error.message)}</p>`;
          return;
        }
        const row = state.rows.find((r) => String(r.id) === String(id));
        if (row) Object.assign(row, o);
        const titleEl = document.querySelector("[data-order-title]");
        if (titleEl) titleEl.textContent = `${o.reference} · ${o.livestock_title}`;
        const lot = o.price_unit === "lot";
        const listingLink = o.livestock_id && o.listing_status === "published"
          ? `<a href="/listing.html?id=${o.livestock_id}" target="_blank" rel="noopener" class="text-blue-700 hover:underline">${escapeHtml(o.livestock_title)}</a>`
          : `${escapeHtml(o.livestock_title)} <span class="text-gray-400">${o.livestock_id ? "(not on the website)" : "(listing deleted)"}</span>`;

        const when = (v) => (v ? escapeHtml(formatDate(v)) : "");
        const telLink = (p) => `tel:${tel(p)}`;
        const contactIcons = (phone, email) => `<span class="od-icons">
            ${phone ? `<a href="https://wa.me/${whatsappNumber(phone)}" target="_blank" rel="noopener" class="tbl-icon od-ic-wa" title="WhatsApp" aria-label="WhatsApp">${OD_ICON.wa}</a><a href="${telLink(phone)}" class="tbl-icon" title="Call" aria-label="Call">${OD_ICON.call}</a>` : ""}
            ${email ? `<a href="mailto:${escapeHtml(email)}?subject=${encodeURIComponent(`Order ${o.reference} - Frontier Marketplace`)}" class="tbl-icon" title="Email ${escapeHtml(email)}" aria-label="Email">${OD_ICON.mail}</a>` : ""}
          </span>`;
        const rrow = (label, value) => (value ? `<div class="txd-row"><dt>${label}</dt><dd>${value}</dd></div>` : "");
        const checkPay = o.checkout_payment && o.checkout_payment.can_check && o.payment_status !== "paid" && o.status !== "cancelled"
          ? `<div class="order-check-pay">
               <button type="button" data-check-pay class="btn-secondary" style="padding:.5rem .9rem;font-size:.85rem">Check payment with Lipila</button>
               <span>Asks Lipila now. If it was paid, the order is marked Paid and the buyer and seller are emailed.</span>
             </div>`
          : "";

        box.innerHTML = `
          ${o.status === "cancelled" ? "" : orderTrackerHtml({ paid: o.payment_status === "paid" || ["paid", "confirmed"].includes(o.status), failed: o.payment_status === "failed", sent: Boolean(o.sent_at), received: Boolean(o.received_at), handed: Boolean(o.handed_over_at), paysSeller: Boolean(o.seller_id), sellerPaid: Boolean(o.seller_paid_at), completed: o.status === "completed" && (!o.seller_id || Boolean(o.seller_paid_at) || !o.handed_over_at) })}
          <div class="txd-grid od-layout">
            <div class="od-left">
              <section class="txd-card txd-timeline">
                <h2>Track Timeline Records</h2>
                ${orderTimelineHtml(o, checkPay)}
              </section>
              <div class="order-message">
                <textarea data-message rows="2" maxlength="2000" class="field-input" placeholder="Message ${escapeHtml(o.full_name)}, e.g. payment details"></textarea>
                <button type="button" data-send class="chat-send-btn">Send</button>
              </div>
            </div>
            <div class="txd-sep" aria-hidden="true"></div>
            <section class="txd-card txd-history">
              <h2 class="txd-h2-row"><span>Payment history</span><button type="button" class="txd-pdf" data-pdf title="Download PDF" aria-label="Download PDF">${uiIcon("download")}<span>PDF</span></button></h2>
              <div class="txd-receipt-top"><b>${escapeHtml(o.reference)}</b><span>${when(o.created_at)}</span></div>
              <div class="txd-parts">
                <div class="txd-part txd-c-items"><h3>Item</h3>
                  <p class="od-r-title">${listingLink}</p>
                  <dl class="txd-list">
                    ${rrow("Quantity", lot ? `Whole lot (${escapeHtml(String(o.quantity))})` : escapeHtml(String(o.quantity)))}
                    ${rrow("Price", lot ? kwacha(o.total) : `${kwacha(o.unit_price)} each`)}
                    ${rrow(o.delivery === "deliver" ? "Delivery" : "Collection", escapeHtml(DELIVERY[o.delivery] || "") + (o.delivery === "deliver" && o.delivery_address ? `<span class="od-r-sub">${escapeHtml(o.delivery_address)}</span>` : ""))}
                    ${rrow("Stock", `<span class="od-r-sub od-r-left">${escapeHtml(stockText(o) || "")}</span>`)}
                  </dl>
                </div>
                <div class="txd-part txd-c-payment"><h3>Payment</h3><dl class="txd-list">
                  ${rrow("Status", payTag(o) || escapeHtml(statusLabel(o.status)))}
                  ${rrow("Method", escapeHtml(payMethodText(o)))}
                  ${rrow("Paid on", when(o.paid_at))}
                  ${rrow("Checkout", o.checkout_reference ? `<a href="/admin/transactions.html?id=${Number(o.checkout_id)}" class="txd-mono">${escapeHtml(o.checkout_reference)}</a>${o.checkout_orders && o.checkout_orders.length ? `<span class="od-r-sub">with ${o.checkout_orders.map((x) => `<a href="/admin/orders.html?id=${x.id}">${escapeHtml(x.reference)}</a>`).join(", ")}</span>` : ""}` : "")}
                  ${rrow("Payment reference", o.checkout_payment && o.checkout_payment.reference ? `<span class="txd-mono">${escapeHtml(o.checkout_payment.reference)}</span>` : "")}
                  ${rrow("Provider reference", o.payment_provider_ref ? `<span class="txd-mono od-trunc" title="${escapeHtml(o.payment_provider_ref)}">${escapeHtml(o.payment_provider_ref)}</span>` : "")}
                  ${rrow("Status check", o.checkout_payment && o.checkout_payment.check_error && o.payment_status !== "paid" ? `<span class="text-red-600">${escapeHtml(o.checkout_payment.check_error)}</span>` : "")}
                  ${rrow("Why it failed", o.payment_status === "failed" && o.payment_failure ? escapeHtml(o.payment_failure) : "")}
                  ${rrow("Bank", o.payment_method === "bank_transfer" && o.payment_bank ? escapeHtml(o.payment_bank) : "")}
                  ${rrow("Account", o.payment_method === "bank_transfer" && o.payment_account ? escapeHtml(o.payment_account) : "")}
                </dl></div>
                <div class="txd-part txd-c-buyer"><h3>Buyer</h3><dl class="txd-list">
                  ${rrow("Name", escapeHtml(o.full_name))}
                  ${rrow("Phone", o.phone ? `<a href="${telLink(o.phone)}">${escapeHtml(o.phone)}</a>` : "")}
                  ${rrow("Email", o.email ? `<a href="mailto:${escapeHtml(o.email)}">${escapeHtml(o.email)}</a>` : "")}
                  ${rrow("Contact", contactIcons(o.phone, o.email))}
                </dl></div>
                <div class="txd-part txd-c-seller"><h3>Seller</h3><dl class="txd-list">
                  ${o.seller_id
                    ? `${rrow("Name", `<a href="/admin/sellers.html?id=${o.seller_id}">${escapeHtml(o.seller_name || "Seller")}</a>`)}
                       ${rrow("Phone", o.seller_phone ? `<a href="${telLink(o.seller_phone)}">${escapeHtml(o.seller_phone)}</a>` : "")}
                       ${rrow("Told", o.seller_notified_at ? when(o.seller_notified_at) : "Once the payment is confirmed")}
                       ${rrow("Contact", o.seller_phone || o.seller_email ? contactIcons(o.seller_phone, o.seller_email) : "")}`
                    : rrow("Name", o.seller_name ? `${escapeHtml(o.seller_name)} (removed)` : "Frontier's stock")}
                </dl></div>
                <div class="txd-part txd-part-total"><div class="txd-total"><span>Total</span><b>${kwacha(o.total)}</b></div></div>
              </div>
            </section>
          </div>`;

        box.querySelector("[data-pdf]").addEventListener("click", () => {
          try { orderPdf(o); } catch (error) { showNotification(`Could not make the PDF: ${error.message}`, "error"); }
        });
        bindProof(box, o);
        const checkBtn = box.querySelector("[data-check-pay]");
        if (checkBtn) {
          checkBtn.addEventListener("click", async () => {
            checkBtn.disabled = true;
            const label = checkBtn.textContent;
            checkBtn.innerHTML = `<span class="btn-spinner"></span> Checking…`;
            try {
              const res = await adminApi(`/api/admin/orders/${o.id}/check-payment`, { method: "POST" });
              showNotification(res.message, res.data.payment_status === "paid" ? "success" : "info");
              await loadList(state.page);
            } catch (error) {
              showNotification(error.message, "error");
              checkBtn.disabled = false;
              checkBtn.textContent = label;
            }
          });
        }
        const input = box.querySelector("[data-message]");
        const send = box.querySelector("[data-send]");
        send.addEventListener("click", async () => {
          const message = input.value.trim();
          if (!message) return input.focus();
          send.disabled = true;
          try {
            await update(o, { message });
          } catch (error) {
            showNotification(error.message, "error");
            send.disabled = false;
          }
        });
        input.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send.click(); });
      }

      let searchTimer;
      document.getElementById("search").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { state.q = e.target.value.trim(); loadList(1); }, 300);
      });

      // Keep the list up to date (payments confirmed, new orders) without a
      // page reload. Skipped while the team is typing, picking a status or
      // answering a confirmation, so nothing they're doing is lost.
      function busy() {
        const el = document.activeElement;
        if (el && el.closest && el.closest("#list, .admin-view") && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return true;
        if ([...document.querySelectorAll("#list textarea, #list input, .admin-view textarea, .admin-view input:not([type=file]):not([type=radio]):not([type=checkbox])")].some((f) => f.value.trim())) return true;
        if ([...document.querySelectorAll(".admin-view [data-photos] img")].length) return true;
        if (document.querySelector(".fixed.inset-0.z-\\[150\\]")) return true;
        return false;
      }
      let refreshing = false;
      let missed = false;
      async function refreshQuietly() {
        if (refreshing || document.visibilityState !== "visible" || busy()) { missed = true; return; }
        missed = false;
        refreshing = true;
        const page = state.page;
        const key = `${state.status}|${state.q}|${page}`;
        try {
          const res = await adminApi(`/api/admin/orders?${listParams(page)}`);
          // Only redraw when something changed and the view is still the same.
          const changed = JSON.stringify(res.data) !== JSON.stringify(state.rows) || JSON.stringify(res.summary) !== JSON.stringify(state.summary);
          if (changed && key === `${state.status}|${state.q}|${state.page}` && !busy()) await loadList(page, res);
        } catch {
          // Try again on the next round.
        } finally {
          refreshing = false;
        }
      }
      setInterval(refreshQuietly, 60000);
      // A change that arrived while the team was typing is shown once they're done.
      document.addEventListener("focusout", () => setTimeout(() => { if (missed) refreshQuietly(); }, 400));
      document.addEventListener("input", (e) => {
        if (missed && e.target.closest && e.target.closest("#list") && !e.target.value.trim()) setTimeout(() => { if (missed) refreshQuietly(); }, 400);
      });
      // Live: new orders, payments, handovers and buyer confirmations.
      window.addEventListener("admin:change", (e) => {
        if (["order", "payment"].includes(e.detail.kind)) refreshQuietly();
      });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshQuietly(); });

      (async () => {
        await initAdminPage("orders");
        const q = getQueryParams();
        if (q.status) state.status = q.status;
        if (q.q) { state.q = q.q; document.getElementById("search").value = q.q; }
        await loadList(1);
        if (q.id) toggle(q.id);
      })();
    </script>
  </body>
</html>
