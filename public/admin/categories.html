<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Categories &amp; Purposes - Frontier Marketplace Admin</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/admin.js"></script>
  </head>
  <body class="bg-gray-50 admin-pending">
    <div id="app-sidebar"></div>
    <div id="admin-topbar"></div>

    <main class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="mb-6">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900">Categories &amp; Purposes</h1>
      </div>

      <section class="mb-10" aria-labelledby="animals-h">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <h2 id="animals-h" class="text-lg font-bold text-gray-900">Manage Categories</h2>
          <button id="add-animal-btn" type="button" class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-semibold">
            <span class="w-5 h-5" data-icon="plus"></span> Add Category
          </button>
        </div>
        <div id="animals" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3"></div>
      </section>

      <section aria-labelledby="purposes-h">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <h2 id="purposes-h" class="text-lg font-bold text-gray-900">Manage Production Purposes</h2>
          <button id="add-purpose-btn" type="button" class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-semibold">
            <span class="w-5 h-5" data-icon="plus"></span> Add Purpose
          </button>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm">
          <div class="p-4 border-b border-gray-100"><div class="seg" id="tabs"></div></div>
          <div id="purposes" class="overflow-x-auto"></div>
        </div>
      </section>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
      let animals = [];
      let purposes = [];
      let current = getQueryParams().animal_id || "";
      const statusOptions = [{ value: "active", label: "Active" }, { value: "disabled", label: "Disabled" }];
      const plural = (n, word) => `${n} ${word}${Number(n) === 1 ? "" : "s"}`;

      function renderAnimals() {
        const box = document.getElementById("animals");
        if (!animals.length) {
          return renderEmptyState(box, { title: "No categories yet", message: "Add a category such as Cattle or Goats.", icon: "layers" });
        }
        box.innerHTML = animals.map((a) => `
          <div class="bg-white rounded-xl border ${String(a.id) === String(current) ? "border-blue-500 ring-2 ring-blue-100" : "border-gray-200"} shadow-sm p-4 flex flex-col gap-3">
            <div class="flex items-start justify-between gap-2">
              <button type="button" data-select="${a.id}" class="text-left min-w-0">
                <p class="text-base font-bold text-gray-900 truncate hover:text-blue-600">${escapeHtml(a.name)}</p>
              </button>
              ${a.status === "active" ? "" : statusPill(a.status)}
            </div>
            <div class="flex items-center gap-1 -ml-2 mt-auto">
              <button type="button" data-toggle-animal="${a.id}" class="text-sm font-medium text-gray-600 hover:text-gray-900 px-2 py-1">${a.status === "active" ? "Disable" : "Enable"}</button>
              <button type="button" data-edit-animal="${a.id}" class="inline-flex w-8 h-8 items-center justify-center text-gray-500 hover:text-blue-600" title="Edit"><span class="w-4 h-4">${uiIcon("edit")}</span></button>
              <button type="button" data-delete-animal="${a.id}" class="inline-flex w-8 h-8 items-center justify-center text-gray-500 hover:text-red-600" title="Delete"><span class="w-4 h-4">${uiIcon("trash")}</span></button>
            </div>
          </div>`).join("");

        const find = (id) => animals.find((a) => String(a.id) === id);
        box.querySelectorAll("[data-select]").forEach((b) => b.addEventListener("click", () => selectAnimal(b.dataset.select)));
        box.querySelectorAll("[data-edit-animal]").forEach((b) => b.addEventListener("click", () => openAnimalEditor(find(b.dataset.editAnimal))));
        box.querySelectorAll("[data-toggle-animal]").forEach((b) => b.addEventListener("click", async () => {
          const a = find(b.dataset.toggleAnimal);
          const next = a.status === "active" ? "disabled" : "active";
          const ok = await confirmAction(next === "disabled"
            ? { title: `Disable ${a.name}?`, message: a.livestock_count ? `It will be hidden from the website, along with its ${plural(a.livestock_count, "listing")}.` : "It will be hidden from the website.", confirmText: "Disable", variant: "danger" }
            : { title: `Enable ${a.name}?`, message: "It will be shown on the website again.", confirmText: "Enable" });
          if (!ok) return;
          try {
            await adminApi(`/api/admin/animals/${a.id}`, { method: "PUT", body: { status: next } });
            showNotification(`${a.name} ${next === "active" ? "enabled" : "disabled"}.`, "success");
            load();
          } catch (error) { showNotification(error.message, "error"); }
        }));
        box.querySelectorAll("[data-delete-animal]").forEach((b) => b.addEventListener("click", async () => {
          const a = find(b.dataset.deleteAnimal);
          if (!(await confirmAction({ title: `Delete ${a.name}?`, message: "Categories that still have production purposes can't be deleted - disable them instead.", confirmText: "Delete", variant: "danger" }))) return;
          try {
            await adminApi(`/api/admin/animals/${a.id}`, { method: "DELETE" });
            showNotification("Category deleted.", "success");
            if (String(a.id) === String(current)) current = "";
            load();
          } catch (error) { showNotification(error.message, "error"); }
        }));
      }

      function openAnimalEditor(a = {}) {
        let photo;
        openFormModal({
          title: a.id ? "Edit Category" : "Add Category",
          submitText: a.id ? "Save Changes" : "Add Category",
          body: `
            ${field({ name: "name", label: "Category name", value: a.name, required: true, attrs: 'maxlength="100"' })}
            ${photoField({ current: a.image_path, help: "JPEG, PNG or WebP." })}
            ${field({ name: "status", label: "Status", value: a.status || "active", options: statusOptions })}`,
          onOpen(form) {
            photo = bindPhotoField(form, a.image_path);
          },
          async onSubmit(form) {
            const v = formValues(form);
            if (!v.name.trim()) { const e = new Error("Please enter a name."); e.errors = { name: "Category name is required." }; throw e; }
            const res = await adminApi(a.id ? `/api/admin/animals/${a.id}` : "/api/admin/animals", { method: a.id ? "PUT" : "POST", body: v });
            try {
              await photo.apply(`/api/admin/animals/${a.id || res.data.id}`);
            } catch (error) {
              showNotification(`Category saved, but the photo wasn't: ${error.message} Open it again to retry.`, "warning");
              load();
              return;
            }
            showNotification(a.id ? "Category updated." : "Category added.", "success");
            load();
          },
        });
      }

      function selectAnimal(id) {
        current = id;
        history.replaceState(null, "", id ? `?animal_id=${id}` : location.pathname);
        renderAnimals();
        renderTabs();
        renderPurposes();
      }

      function renderTabs() {
        const counts = {};
        purposes.forEach((p) => (counts[p.animal_id] = (counts[p.animal_id] || 0) + 1));
        document.getElementById("tabs").innerHTML = [{ id: "", name: "All" }, ...animals]
          .map((a) => `<button type="button" data-animal="${a.id}" class="${String(a.id) === String(current) ? "active" : ""}">${escapeHtml(a.name)}<span class="count">${a.id ? counts[a.id] || 0 : purposes.length}</span></button>`)
          .join("");
        document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => selectAnimal(b.dataset.animal)));
      }

      function renderPurposes() {
        const box = document.getElementById("purposes");
        const shown = purposes.filter((p) => !current || String(p.animal_id) === String(current));
        if (!shown.length) {
          return renderEmptyState(box, { title: "No production purposes yet", message: "Add a purpose such as Meat, Dairy or Layers for this category.", icon: "layers" });
        }
        box.innerHTML = `
          <table class="admin-table">
            <thead><tr><th>Purpose</th><th>Category</th><th class="text-center">Breeds</th><th class="text-center hidden sm:table-cell">Listings</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
            <tbody>${shown.map((p) => `
              <tr>
                <td><p class="font-semibold text-gray-900">${escapeHtml(p.name)}</p>${p.description ? `<p class="text-xs text-gray-500 line-clamp-1">${escapeHtml(p.description)}</p>` : ""}</td>
                <td><span class="tag tag-category">${escapeHtml(p.animal_name)}</span></td>
                <td class="text-center"><a href="/admin/breeds.html?animal_id=${p.animal_id}&category_id=${p.id}" class="text-blue-600 font-semibold hover:underline">${p.breed_count}</a></td>
                <td class="text-center hidden sm:table-cell">${p.livestock_count}</td>
                <td>${statusPill(p.status)}</td>
                <td class="text-right whitespace-nowrap">
                  <button type="button" data-toggle="${p.id}" class="text-sm font-medium text-gray-600 hover:text-gray-900 px-2 py-1">${p.status === "active" ? "Disable" : "Enable"}</button>
                  <button type="button" data-edit="${p.id}" class="inline-flex w-8 h-8 items-center justify-center text-gray-500 hover:text-blue-600" title="Edit"><span class="w-4 h-4">${uiIcon("edit")}</span></button>
                  <button type="button" data-delete="${p.id}" class="inline-flex w-8 h-8 items-center justify-center text-gray-500 hover:text-red-600" title="Delete"><span class="w-4 h-4">${uiIcon("trash")}</span></button>
                </td>
              </tr>`).join("")}</tbody>
          </table>`;

        const find = (id) => purposes.find((p) => String(p.id) === id);
        box.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openPurposeEditor(find(b.dataset.edit))));
        box.querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", async () => {
          const p = find(b.dataset.toggle);
          const next = p.status === "active" ? "disabled" : "active";
          const ok = await confirmAction(next === "disabled"
            ? { title: `Disable ${p.name} (${p.animal_name})?`, message: p.livestock_count ? `It will be hidden from the website, along with its ${plural(p.livestock_count, "listing")}.` : "It will be hidden from the website.", confirmText: "Disable", variant: "danger" }
            : { title: `Enable ${p.name} (${p.animal_name})?`, message: "It will be shown on the website again.", confirmText: "Enable" });
          if (!ok) return;
          try {
            await adminApi(`/api/admin/categories/${p.id}`, { method: "PUT", body: { status: next } });
            showNotification(`${p.name} (${p.animal_name}) ${next === "active" ? "enabled" : "disabled"}.`, "success");
            load();
          } catch (error) { showNotification(error.message, "error"); }
        }));
        box.querySelectorAll("[data-delete]").forEach((b) => b.addEventListener("click", async () => {
          const p = find(b.dataset.delete);
          if (!(await confirmAction({ title: `Delete ${p.name} (${p.animal_name})?`, message: "Purposes that still have breeds or listings can't be deleted - disable them instead.", confirmText: "Delete", variant: "danger" }))) return;
          try {
            await adminApi(`/api/admin/categories/${p.id}`, { method: "DELETE" });
            showNotification("Production purpose deleted.", "success");
            load();
          } catch (error) { showNotification(error.message, "error"); }
        }));
      }

      function openPurposeEditor(p = {}) {
        let photo;
        const animalOptions = [{ value: "", label: "Select category" }, ...animals.map((a) => ({ value: a.id, label: a.name }))];
        openFormModal({
          title: p.id ? "Edit Production Purpose" : "Add Production Purpose",
          submitText: p.id ? "Save Changes" : "Add Purpose",
          body: `
            ${field({ name: "animal_id", label: "Category", value: p.animal_id ?? current, required: true, options: animalOptions,
                help: p.livestock_count ? "This purpose is used by listings, so its category can't be changed." : "",
                attrs: p.livestock_count ? "disabled" : "" })}
            ${field({ name: "name", label: "Purpose name", value: p.name, required: true, attrs: 'maxlength="100"' })}
            ${field({ name: "description", label: "Description", type: "textarea", value: p.description, attrs: 'maxlength="2000"' })}
            ${photosField({ help: `Up to ${MAX_PURPOSE_PHOTOS} photos.` })}
            ${field({ name: "status", label: "Status", value: p.status || "active", options: statusOptions })}`,
          onOpen(form) {
            photo = bindPhotosField(form, p.photos || []);
          },
          async onSubmit(form) {
            const v = formValues(form);
            if (p.livestock_count) delete v.animal_id;
            const errors = {};
            if (!p.livestock_count && !v.animal_id) errors.animal_id = "Please choose an animal.";
            if (!v.name.trim()) errors.name = "Purpose name is required.";
            if (Object.keys(errors).length) { const e = new Error("Please correct the highlighted fields."); e.errors = errors; throw e; }
            const res = await adminApi(p.id ? `/api/admin/categories/${p.id}` : "/api/admin/categories", { method: p.id ? "PUT" : "POST", body: v });
            try {
              await photo.apply(`/api/admin/categories/${p.id || res.data.id}`);
            } catch (error) {
              showNotification(`Production purpose saved, but some photos weren't: ${error.message} Open it again to retry.`, "warning");
              load();
              return;
            }
            showNotification(p.id ? "Production purpose updated." : "Production purpose added.", "success");
            load();
          },
        });
      }

      async function load() {
        try {
          [animals, purposes] = await Promise.all([
            adminApi("/api/admin/animals").then((r) => r.data),
            adminApi("/api/admin/categories").then((r) => r.data),
          ]);
        } catch (error) {
          return renderEmptyState(document.getElementById("purposes"), { title: "Could not load", message: error.message, icon: "alert" });
        }
        if (current && !animals.some((a) => String(a.id) === String(current))) current = "";
        renderAnimals();
        renderTabs();
        renderPurposes();
      }

      document.getElementById("add-animal-btn").addEventListener("click", () => openAnimalEditor());
      document.getElementById("add-purpose-btn").addEventListener("click", () => {
        if (!animals.length) return showNotification("Add a category first.", "warning");
        openPurposeEditor();
      });
      (async () => { await initAdminPage("categories"); load(); })();
    </script>
  </body>
</html>
