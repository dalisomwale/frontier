<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Livestock - Frontier Marketplace Admin</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/admin.js"></script>
  </head>
  <body class="bg-gray-50 admin-pending">
    <div id="app-sidebar"></div>
    <div id="admin-topbar"></div>

    <main class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Manage Livestock</h1>
        </div>
        <button id="add-btn" type="button" class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-semibold">
          <span class="w-5 h-5" data-icon="plus"></span> Add Livestock
        </button>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 shadow-sm">
        <div class="flex flex-col md:flex-row md:items-center gap-3 p-4 border-b border-gray-100">
          <div class="seg" id="status-tabs">
            <button type="button" data-status="" class="active">All</button>
            <button type="button" data-status="published">Published</button>
            <button type="button" data-status="unpublished">Unpublished</button>
          </div>
          <div class="flex flex-col sm:flex-row gap-3 md:ml-auto">
            <select id="seller-filter" class="field-input !py-2 !text-sm sm:!w-44" aria-label="Filter by seller"><option value="">All sellers</option><option value="none">No seller</option></select>
            <select id="animal-filter" class="field-input !py-2 !text-sm sm:!w-44" aria-label="Filter by category"><option value="">All categories</option></select>
            <div class="relative sm:flex-1 md:flex-none md:w-64">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" data-icon="search"></span>
              <input id="search" type="search" placeholder="Search title, breed, location" class="field-input !py-2 !pl-9 !text-sm" />
            </div>
          </div>
        </div>
        <div id="list" class="overflow-x-auto"></div>
        <div id="pagination" class="pb-4"></div>
      </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));

      const MAX_PHOTOS = 10;
      const state = { status: "", animal: "", seller: "", q: "", page: 1 };
      let sellers = [];
      let animals = [];
      let purposes = [];
      let breeds = [];

      async function loadList(page = state.page) {
        state.page = page;
        const list = document.getElementById("list");
        const params = new URLSearchParams({ page, limit: 20 });
        if (state.status) params.set("status", state.status);
        if (state.animal) params.set("animal_id", state.animal);
        if (state.seller) params.set("seller_id", state.seller);
        if (state.q) params.set("q", state.q);

        let res;
        try {
          res = await adminApi(`/api/admin/livestock?${params}`);
        } catch (error) {
          return renderEmptyState(list, { title: "Could not load livestock", message: error.message, icon: "alert" });
        }

        if (!res.data.length) {
          const filtered = state.status || state.animal || state.seller || state.q;
          renderEmptyState(list, filtered
            ? { title: "No matching livestock", message: "Try a different filter or search.", icon: "search" }
            : { title: "No livestock yet", message: "Add your first listing. It stays unpublished until you publish it.", icon: "cattle",
                action: `<button type="button" onclick="openEditor()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-semibold">Add Livestock</button>` });
        } else {
          list.innerHTML = `
            <table class="admin-table">
              <thead><tr>
                <th>Listing</th><th class="hidden md:table-cell">Breed</th><th class="hidden lg:table-cell">Seller</th><th class="hidden xl:table-cell">Province</th>
                <th class="hidden sm:table-cell text-center">Inquiries</th><th class="hidden md:table-cell">Date</th>
                <th>Status</th><th class="hidden sm:table-cell">Verification</th><th class="text-right hidden sm:table-cell">Actions</th>
              </tr></thead>
              <tbody>${res.data.map(rowHtml).join("")}</tbody>
            </table>`;
          bindRowActions(list);
        }

        const pag = document.getElementById("pagination");
        pag.innerHTML = "";
        if (res.pagination.total > 1) pag.appendChild(createPagination(res.pagination.current, res.pagination.total, loadList));
      }

      const STATUS_OPTIONS = [{ value: "published", label: "Published" }, { value: "unpublished", label: "Unpublished" }];
      const VERIFICATION_OPTIONS = [{ value: "verified", label: "Verified" }, { value: "unverified", label: "Unverified" }];

      function pillSelect(kind, l, options, value) {
        return `<select class="pill-select" data-kind="${kind}" data-id="${l.id}" data-title="${escapeHtml(l.title)}" data-value="${value}" aria-label="${kind === "status" ? "Listing status" : "Verification"}">
          ${options.map((o) => `<option value="${o.value}" ${o.value === value ? "selected" : ""}>${o.label}</option>`).join("")}
        </select>`;
      }

      function actionsHtml(l) {
        const published = l.status === "published";
        return `
              ${published ? `<a href="/listing.html?id=${l.id}" target="_blank" rel="noopener" class="inline-flex w-8 h-8 items-center justify-center text-gray-500 hover:text-blue-600" title="View on website"><span class="w-4 h-4">${uiIcon("external")}</span></a>` : ""}
              <button type="button" data-edit="${l.id}" class="inline-flex w-8 h-8 items-center justify-center text-gray-500 hover:text-blue-600" title="Edit"><span class="w-4 h-4">${uiIcon("edit")}</span></button>
              <button type="button" data-delete="${l.id}" data-title="${escapeHtml(l.title)}" class="inline-flex w-8 h-8 items-center justify-center text-gray-500 hover:text-red-600" title="Delete"><span class="w-4 h-4">${uiIcon("trash")}</span></button>
            `;
      }

      function rowHtml(l) {
        return `
          <tr>
            <td>
              <div class="flex items-center gap-3 min-w-[200px]">
                <span class="w-16 h-12 rounded-md overflow-hidden bg-blue-50 flex-shrink-0">${l.thumb_path ? `<img src="${escapeHtml(l.thumb_path)}" alt="" class="w-full h-full object-cover" loading="lazy">` : livestockFallbackMedia("w-7 h-7")}</span>
                <div class="min-w-0">
                  <button type="button" data-edit="${l.id}" class="font-semibold text-gray-900 hover:text-blue-600 text-left line-clamp-2">${escapeHtml(l.title)}</button>
                  <p class="text-xs text-gray-500">${[l.livestock_type, l.quantity > 1 ? quantityLabel(l.quantity, l.animal_name) : ""].filter(Boolean).join(", ")}</p>
                  ${l.breed_name ? `<p class="text-xs text-gray-500 md:hidden">${escapeHtml(l.breed_name)}</p>` : ""}
                  ${l.seller_id ? `<a href="/admin/sellers.html?id=${l.seller_id}" class="lg:hidden inline-flex items-center gap-1 text-xs text-blue-700 hover:underline mt-0.5"><span class="w-3.5 h-3.5">${uiIcon("users")}</span>${escapeHtml(l.seller_business_name || l.seller_name)}</a>` : ""}
                  <div class="sm:hidden mt-1.5">${pillSelect("verification", l, VERIFICATION_OPTIONS, l.verification || "unverified")}</div>
                  <div class="sm:hidden -ml-2 mt-1">${actionsHtml(l)}</div>
                </div>
              </div>
            </td>
            <td class="hidden md:table-cell">${l.breed_name ? `<span class="text-gray-700">${escapeHtml(l.breed_name)}</span>` : `<span class="text-xs text-gray-400">Not specified</span>`}</td>
            <td class="hidden lg:table-cell">${l.seller_id
              ? `<a href="/admin/sellers.html?id=${l.seller_id}" class="text-blue-700 font-medium hover:underline" title="${escapeHtml(l.seller_name)}">${escapeHtml(l.seller_business_name || l.seller_name)}</a>`
              : `<span class="text-xs text-gray-400">No seller</span>`}</td>
            <td class="hidden xl:table-cell text-gray-600">${escapeHtml(l.location)}</td>
            <td class="hidden sm:table-cell text-center">${l.inquiry_count ? `<a class="text-blue-600 font-semibold hover:underline" href="/admin/inquiries.html?q=${encodeURIComponent(l.title)}">${l.inquiry_count}</a>` : `<span class="text-gray-400">0</span>`}</td>
            <td class="hidden md:table-cell whitespace-nowrap">${l.status === "published" && l.published_at ? `<span class="text-gray-700">${formatDateShort(l.published_at)}</span>` : `<span class="text-xs text-gray-400">Not published</span>`}</td>
            <td>${pillSelect("status", l, STATUS_OPTIONS, l.status)}</td>
            <td class="hidden sm:table-cell">${pillSelect("verification", l, VERIFICATION_OPTIONS, l.verification || "unverified")}</td>
            <td class="text-right whitespace-nowrap hidden sm:table-cell">${actionsHtml(l)}</td>
          </tr>`;
      }

      function bindRowActions(root) {
        root.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openEditor(b.dataset.edit)));
        root.querySelectorAll(".pill-select").forEach((sel) =>
          sel.addEventListener("change", async () => {
            const value = sel.value;
            const title = sel.dataset.title;
            const isStatus = sel.dataset.kind === "status";
            const confirm = isStatus
              ? value === "published"
                ? { title: "Publish this listing?", message: `"${title}" will be visible on the website.`, confirmText: "Publish" }
                : { title: "Unpublish this listing?", message: `"${title}" will be hidden from the website.`, confirmText: "Unpublish", variant: "danger" }
              : value === "verified"
                ? { title: "Mark as verified?", message: `"${title}" will be marked as verified.`, confirmText: "Mark verified" }
                : { title: "Mark as unverified?", message: `"${title}" will be marked as unverified.`, confirmText: "Mark unverified", variant: "danger" };
            if (!(await confirmAction(confirm))) {
              sel.value = sel.dataset.value;
              return;
            }
            sel.disabled = true;
            try {
              await adminApi(`/api/admin/livestock/${sel.dataset.id}/${isStatus ? "status" : "verification"}`, {
                method: "PATCH",
                body: isStatus ? { status: value } : { verification: value },
              });
              showNotification(isStatus
                ? value === "published" ? "Listing published - it's now live on the website." : "Listing unpublished - it's hidden from the website."
                : value === "verified" ? "Listing marked as verified." : "Listing marked as unverified.", "success");
              loadList();
            } catch (error) {
              showNotification(error.message, "error");
              sel.value = sel.dataset.value;
              sel.disabled = false;
            }
          }),
        );
        root.querySelectorAll("[data-delete]").forEach((b) =>
          b.addEventListener("click", async () => {
            const ok = await confirmAction({
              title: "Delete this listing?",
              message: `"${b.dataset.title}" and its photos will be permanently deleted. Inquiries about it are kept.`,
              confirmText: "Delete",
              variant: "danger",
            });
            if (!ok) return;
            try {
              await adminApi(`/api/admin/livestock/${b.dataset.delete}`, { method: "DELETE" });
              showNotification("Listing deleted.", "success");
              loadList();
            } catch (error) {
              showNotification(error.message, "error");
            }
          }),
        );
      }

      const label = (row) => row.name + (row.status === "disabled" ? " (disabled)" : "");

      function animalOptions(selected) {
        return [{ value: "", label: "Select category" }].concat(
          animals.filter((a) => a.status === "active" || String(a.id) === String(selected)).map((a) => ({ value: a.id, label: label(a) })),
        );
      }

      function purposeOptions(animalId, selected) {
        const list = purposes.filter((p) => String(p.animal_id) === String(animalId) && (p.status === "active" || String(p.id) === String(selected)));
        return [{ value: "", label: animalId ? (list.length ? "Select purpose" : "No purposes for this category") : "Select a category first" }]
          .concat(list.map((p) => ({ value: p.id, label: label(p) })));
      }

      function breedOptions(purposeId, selected) {
        const purpose = purposes.find((p) => String(p.id) === String(purposeId));
        const usable = (b) => b.status === "active" || String(b.id) === String(selected);
        let list;
        if (purpose && isAllBreedsPurpose(purpose.name)) {
          const own = (b) => String(b.category_id) === String(purpose.id);
          list = breeds
            .filter((b) => String(b.animal_id) === String(purpose.animal_id) && usable(b))
            .sort((a, b) => Number(own(b)) - Number(own(a)) || a.category_name.localeCompare(b.category_name) || a.name.localeCompare(b.name))
            .map((b) => ({ value: b.id, label: own(b) ? label(b) : `${label(b)} (${b.category_name})` }));
        } else {
          list = breeds
            .filter((b) => String(b.category_id) === String(purposeId) && usable(b))
            .map((b) => ({ value: b.id, label: label(b) }));
        }
        return [{ value: "", label: purposeId ? (list.length ? "Select breed" : "No breeds for this purpose") : "Select a purpose first" }]
          .concat(list);
      }

      function typeOptions(animalId, selected) {
        const animal = animals.find((a) => String(a.id) === String(animalId));
        const list = livestockTypesFor(animal?.name);
        const values = selected && !list.includes(selected) ? [...list, selected] : list;
        return [{ value: "", label: "Not specified" }, ...values.map((t) => ({ value: t, label: t }))];
      }

      function sellerOptions(selected) {
        const usable = sellers.filter((s) => s.status === "active" || String(s.id) === String(selected));
        return [{ value: "", label: "No seller (Frontier's own stock)" }].concat(
          usable.map((s) => ({
            value: s.id,
            label: `${s.name}${s.business_name ? ` (${s.business_name})` : ""}${s.status === "inactive" ? " - inactive" : ""}`,
          })),
        );
      }

      const optionsHtml = (opts) => opts.map((o) => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join("");

      async function openEditor(id) {
        let item = {};
        if (id) {
          try {
            item = (await adminApi(`/api/admin/livestock/${id}`)).data;
          } catch (error) {
            return showNotification(error.message, "error");
          }
        }
        const photos = (item.images || []).map((im) => ({ id: im.id, src: im.thumb_path || im.image_path }));
        const removed = [];

        const animalId = item.animal_id ?? "";
        const sellerId = id ? item.seller_id ?? "" : getQueryParams().seller_id || "";

        const body = `
          ${field({ name: "title", label: "Title", value: item.title, required: true, attrs: 'maxlength="200"' })}
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${field({ name: "animal_id", label: "Category", value: animalId, required: true, options: animalOptions(animalId) })}
            ${field({ name: "category_id", label: "Production Purpose", value: item.category_id, required: true, options: purposeOptions(animalId, item.category_id) })}
            ${field({ name: "breed_id", label: "Breed", value: item.breed_id, options: breedOptions(item.category_id, item.breed_id) })}
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            ${field({ name: "livestock_type", label: "Type", value: item.livestock_type, options: typeOptions(animalId, item.livestock_type) })}
            ${field({ name: "quantity", label: "Quantity", type: "number", value: item.quantity ?? 1, attrs: 'min="1" step="1" inputmode="numeric"' })}
            ${field({ name: "age_months", label: "Age (months)", type: "number", value: item.age_months, attrs: 'min="0" max="600" step="1" inputmode="numeric"' })}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${field({ name: "seller_id", label: "Seller", value: sellerId, options: sellerOptions(sellerId),
                help: sellers.length ? "Only admins see the seller. Customers' inquiries still come to Frontier." : "Add sellers on the Sellers page." })}
            ${field({ name: "location", label: "Province", value: ZAMBIA_PROVINCES.includes(item.location) ? item.location : "", required: true,
                help: item.location && !ZAMBIA_PROVINCES.includes(item.location) ? `Previously "${item.location}" - choose its province.` : "",
                options: [{ value: "", label: "Select province" }, ...ZAMBIA_PROVINCES.map((p) => ({ value: p, label: p }))] })}
          </div>
          ${field({ name: "description", label: "Description", type: "textarea", value: item.description, rows: 5, attrs: 'maxlength="5000"' })}

          <div>
            <div class="flex items-baseline justify-between mb-2">
              <span class="field-label !mb-0">Photos</span>
              <span id="photo-count" class="text-xs text-gray-500"></span>
            </div>
            <div id="photo-grid" class="photo-grid"></div>
            <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
            <p class="text-xs text-gray-500 mt-2">Up to ${MAX_PHOTOS} photos. The first one is the cover.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${field({ name: "status", label: "Status", value: item.status || "unpublished", options: STATUS_OPTIONS,
                help: item.status === "published" && item.published_at ? `Published ${formatDateShort(item.published_at)}` : "" })}
            ${field({ name: "verification", label: "Verification", value: item.verification || "unverified", options: VERIFICATION_OPTIONS })}
          </div>`;

        openFormModal({
          title: id ? "Edit Livestock" : "Add Livestock",
          submitText: id ? "Save Changes" : "Create Listing",
          wide: true,
          body,
          onOpen(form) {
            const animalSelect = form.elements.animal_id;
            const purposeSelect = form.elements.category_id;
            const breedSelect = form.elements.breed_id;
            const typeSelect = form.elements.livestock_type;
            animalSelect.addEventListener("change", () => {
              purposeSelect.innerHTML = optionsHtml(purposeOptions(animalSelect.value));
              breedSelect.innerHTML = optionsHtml(breedOptions(""));
              typeSelect.innerHTML = optionsHtml(typeOptions(animalSelect.value));
            });
            purposeSelect.addEventListener("change", () => {
              breedSelect.innerHTML = optionsHtml(breedOptions(purposeSelect.value));
            });

            const grid = form.querySelector("#photo-grid");
            const input = form.querySelector("#photo-input");
            const renderPhotos = () => {
              form.querySelector("#photo-count").textContent = `${photos.length} / ${MAX_PHOTOS}`;
              grid.innerHTML = photos.map((p, i) => `
                <div class="photo-item ${i === 0 ? "is-cover" : ""}">
                  <img src="${escapeHtml(p.src)}" alt="Photo ${i + 1}">
                  ${i === 0 ? '<span class="cover-badge">Cover</span>' : ""}
                  <div class="photo-actions">
                    ${i === 0 ? "<span></span>" : `<button type="button" data-cover="${i}">Make cover</button>`}
                    <button type="button" data-remove="${i}" aria-label="Remove photo">Remove</button>
                  </div>
                </div>`).join("") +
                (photos.length < MAX_PHOTOS
                  ? `<label class="photo-drop" for="photo-input" tabindex="0">${uiIcon("camera")}<span>Add photos</span></label>`
                  : "");
              grid.querySelectorAll("[data-cover]").forEach((b) => b.addEventListener("click", () => {
                photos.unshift(photos.splice(Number(b.dataset.cover), 1)[0]);
                form.dispatchEvent(new Event("input"));
                renderPhotos();
              }));
              grid.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", async () => {
                if (photos[Number(b.dataset.remove)]?.id && !(await confirmRemovePhoto())) return;
                const [p] = photos.splice(Number(b.dataset.remove), 1);
                if (p.id) removed.push(p.id);
                if (p.url) URL.revokeObjectURL(p.url);
                form.dispatchEvent(new Event("input"));
                renderPhotos();
              }));
              const drop = grid.querySelector(".photo-drop");
              if (drop) {
                drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
                ["dragover", "dragenter"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("dragover"); }));
                ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("dragover")));
                drop.addEventListener("drop", (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); });
              }
            };
            const addFiles = async (fileList) => {
              const files = [...fileList].filter((f) => /^image\/(jpeg|png|webp)$/.test(f.type));
              if (files.length < fileList.length) showNotification("Only JPEG, PNG and WebP photos can be added.", "warning");
              const room = MAX_PHOTOS - photos.length;
              if (files.length > room) showNotification(`Only ${room} more photo${room === 1 ? "" : "s"} can be added.`, "warning");
              for (const f of files.slice(0, room)) {
                const file = await shrinkImage(f);
                const url = URL.createObjectURL(file);
                photos.push({ file, src: url, url });
              }
              form.dispatchEvent(new Event("input"));
              renderPhotos();
            };
            input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
            renderPhotos();
          },
          async onSubmit(form) {
            const v = formValues(form);
            const errors = {};
            if (!v.title.trim()) errors.title = "Title is required.";
            if (!v.animal_id) errors.animal_id = "Please choose a category.";
            if (!v.category_id) errors.category_id = "Please choose a production purpose.";
            if (!v.location) errors.location = "Please choose a province.";
            if (Object.keys(errors).length) {
              const e = new Error("Please correct the highlighted fields.");
              e.errors = errors;
              throw e;
            }

            const fd = new FormData();
            for (const key of ["title", "animal_id", "category_id", "breed_id", "seller_id", "livestock_type", "quantity", "age_months", "location", "description"]) fd.append(key, v[key] ?? "");
            fd.append("status", v.status);
            fd.append("verification", v.verification);
            fd.append("remove_image_ids", JSON.stringify(removed));
            fd.append("image_order", JSON.stringify(photos.filter((p) => p.id).map((p) => p.id)));
            const newPhotos = photos.filter((p) => p.file);
            newPhotos.forEach((p) => fd.append("images", p.file, p.file.name));

            const res = await adminApi(id ? `/api/admin/livestock/${id}` : "/api/admin/livestock", { method: id ? "PUT" : "POST", body: fd });

            if (photos[0]?.file && res.data.images.length > 1) {
              const firstNewIndex = res.data.images.length - newPhotos.length;
              const coverId = res.data.images[firstNewIndex].id;
              const order = [coverId, ...res.data.images.filter((im) => im.id !== coverId).map((im) => im.id)];
              const fd2 = new FormData();
              for (const key of ["title", "category_id", "breed_id", "livestock_type", "quantity", "age_months", "location", "description", "status"]) fd2.append(key, res.data[key] ?? "");
              fd2.append("image_order", JSON.stringify(order));
              await adminApi(`/api/admin/livestock/${res.data.id}`, { method: "PUT", body: fd2 });
            }
            photos.forEach((p) => p.url && URL.revokeObjectURL(p.url));
            showNotification(id ? "Listing updated." : (res.data.status === "published" ? "Listing created and published." : "Listing saved as unpublished."), "success");
            loadList(id ? state.page : 1);
          },
        });
      }

      document.querySelectorAll("#status-tabs button").forEach((b) =>
        b.addEventListener("click", () => {
          document.querySelectorAll("#status-tabs button").forEach((x) => x.classList.toggle("active", x === b));
          state.status = b.dataset.status;
          loadList(1);
        }),
      );
      document.getElementById("animal-filter").addEventListener("change", (e) => { state.animal = e.target.value; loadList(1); });
      document.getElementById("seller-filter").addEventListener("change", (e) => { state.seller = e.target.value; loadList(1); });
      let searchTimer;
      document.getElementById("search").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { state.q = e.target.value.trim(); loadList(1); }, 300);
      });
      document.getElementById("add-btn").addEventListener("click", () => openEditor());

      (async () => {
        await initAdminPage("livestock");
        [animals, purposes, breeds, sellers] = await Promise.all([
          adminApi("/api/admin/animals").then((r) => r.data),
          adminApi("/api/admin/categories").then((r) => r.data),
          adminApi("/api/admin/breeds").then((r) => r.data),
          adminApi("/api/admin/sellers").then((r) => r.data),
        ]);
        document.getElementById("seller-filter").innerHTML += sellers.map((s) => `<option value="${s.id}">${escapeHtml(s.business_name || s.name)}</option>`).join("");
        document.getElementById("animal-filter").innerHTML += animals.map((a) => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");

        const q = getQueryParams();
        if (q.seller_id) { state.seller = q.seller_id; document.getElementById("seller-filter").value = q.seller_id; }
        if (q.status) document.querySelector(`#status-tabs [data-status="${q.status}"]`)?.click();
        else await loadList(1);
        if (q.new) openEditor();
        if (q.edit) openEditor(q.edit);
      })();
    </script>
  </body>
</html>
