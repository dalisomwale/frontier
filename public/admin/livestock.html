<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Livestock - Frontier Marketplace Admin</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/xlsx-lite.js"></script>
    <script src="/js/livestock.js"></script>
  </head>
  <body class="bg-gray-50 admin-pending">
    <div id="app-sidebar"></div>
    <div id="admin-topbar"></div>

    <main class="app-content-shifted tx-page-wide mx-auto px-3 sm:px-4 py-6">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <div>
          <h1 id="page-title" class="text-xl sm:text-2xl font-bold text-gray-900">Manage Livestock</h1>
          <a id="other-pending" href="#" class="hidden text-sm text-amber-700 hover:underline mt-1"></a>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" id="export" class="tx-export">Export Excel</button>
          <button id="add-btn" type="button" class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-semibold">
            <span class="w-5 h-5" data-icon="plus"></span> <span id="add-label">Add Livestock</span>
          </button>
        </div>
      </div>

      <div class="tx-totals" id="totals"></div>

      <div class="bg-white rounded-xl border border-gray-100">
        <div class="flex flex-col md:flex-row md:items-center gap-3 p-4 border-b border-gray-100">
          <div class="seg" id="status-tabs">
            <button type="button" data-status="" class="active">All</button>
            <button type="button" data-status="published">Published</button>
            <button type="button" data-status="unpublished">Unpublished</button>
            <button type="button" data-status="review">Pending review<span id="review-count" class="count"></span></button>
          </div>
          <div class="flex flex-col sm:flex-row gap-3 md:ml-auto">
            <select id="seller-filter" class="field-input !py-2 !text-sm sm:!w-44" aria-label="Filter by seller"><option value="">All sellers</option><option value="none">Frontier's stock</option></select>
            <select id="animal-filter" class="field-input !py-2 !text-sm sm:!w-44" aria-label="Filter by category"><option value="">All categories</option></select>
            <div class="relative sm:flex-1 md:flex-none md:w-64">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" data-icon="search"></span>
              <input id="search" type="search" placeholder="Search title, breed, location" class="field-input !py-2 !pl-9 !text-sm" />
            </div>
          </div>
        </div>
        <div id="list" class="overflow-x-auto"></div>
        <div id="pagination" class="pb-4"></div>
      </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));

      const MAX_PHOTOS = 10;
      // Admin > Livestock and Admin > Feed share this page (?kind=feed).
      const KIND = getQueryParams().kind === "feed" ? "feed" : "livestock";
      const FEED = KIND === "feed";
      const NOUN = FEED ? "Feed" : "Livestock";
      const noun = FEED ? "feed" : "livestock";
      document.title = `${NOUN} - Frontier Marketplace Admin`;
      document.getElementById("page-title").textContent = `Manage ${NOUN}`;
      document.getElementById("add-label").textContent = `Add ${NOUN}`;
      document.getElementById("animal-filter").options[0].textContent = FEED ? "All feed types" : "All categories";
      document.getElementById("search").placeholder = FEED ? "Search title, stage, location" : "Search title, breed, location";
      const state = { status: "", animal: "", seller: "", q: "", page: 1 };
      let sellers = [];
      let animals = [];
      let purposes = [];
      let breeds = [];

      function listParams(page) {
        const params = new URLSearchParams({ page, limit: 20, kind: KIND });
        if (state.status === "review") params.set("review", "pending");
        else if (state.status) params.set("status", state.status);
        if (state.animal) params.set("animal_id", state.animal);
        if (state.seller) params.set("seller_id", state.seller);
        if (state.q) params.set("q", state.q);
        return params;
      }

      function renderTotals(s = {}) {
        document.getElementById("totals").innerHTML = `
          <div class="tx-total txc-received"><span>Listings</span><b>${Number(s.total) || 0}</b></div>
          <div class="tx-total txc-paid"><span>Published</span><b>${Number(s.published) || 0}</b></div>
          <div class="tx-total txc-waiting"><span>Pending review</span><b>${Number(s.pending) || 0}</b></div>
          <div class="tx-total txc-muted"><span>Unpublished</span><b>${Number(s.unpublished) || 0}</b></div>`;
      }

      const dateOnly = (v) => (v ? new Date(v).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "");
      const priceCell = (l) => (Number(l.price) > 0 ? `${kwacha(l.price)} <span class="text-xs text-gray-500">${escapeHtml(priceUnitLabel(l, true))}</span>` : `<span class="text-xs text-gray-400">On request</span>`);

      // Excel file of the listings under the current filters.
      async function exportExcel() {
        const btn = document.getElementById("export");
        btn.disabled = true;
        try {
          const params = listParams(1);
          params.set("export", "1");
          const res = await adminApi(`/api/admin/livestock?${params}`);
          const header = ["Date added", "Title", FEED ? "Feed type" : "Animal", FEED ? "Stage" : "Purpose", ...(FEED ? [] : ["Breed", "Age (months)"]),
            "Quantity", "Price (ZMW)", "Price for", "Negotiable", "Seller", "Province", "Inquiries", "Status", "Published on", "Verification", "Review"];
          const lines = res.data.map((l) => [
            dateOnly(l.created_at), l.title, l.animal_name, l.category_name, ...(FEED ? [] : [l.breed_name || "", l.age_months ?? ""]),
            l.quantity, Number(l.price) > 0 ? Number(l.price).toFixed(2) : "", Number(l.price) > 0 ? priceUnitLabel(l) : "Price on request",
            l.price_negotiable ? "Yes" : "No", l.seller_id ? l.seller_business_name || l.seller_name : "Frontier's stock", l.location || "",
            Number(l.inquiry_count) || 0, l.status === "published" ? "Published" : "Unpublished", dateOnly(l.published_at),
            l.verification === "verified" ? "Verified" : "Unverified", l.review_status || "",
          ]);
          const priceCol = header.indexOf("Price (ZMW)");
          downloadXlsx(`frontier-${noun}-${new Date().toISOString().slice(0, 10)}.xlsx`, NOUN, header, lines,
            { numberCols: [priceCol, priceCol - 1, header.indexOf("Inquiries")] });
        } catch (error) {
          showNotification(error.message, "error");
        } finally {
          btn.disabled = false;
        }
      }
      document.getElementById("export").addEventListener("click", exportExcel);

      async function loadList(page = state.page) {
        state.page = page;
        const list = document.getElementById("list");
        const params = listParams(page);

        let res;
        try {
          res = await adminApi(`/api/admin/livestock?${params}`);
        } catch (error) {
          return renderEmptyState(list, { title: `Could not load ${noun}`, message: error.message, icon: "alert" });
        }

        renderTotals(res.summary);
        const reviewCount = document.getElementById("review-count");
        reviewCount.textContent = res.summary?.pending ? res.summary.pending : "";
        const otherKind = FEED ? "livestock" : "feed";
        const otherPending = res.summary?.pending_by_kind?.[otherKind] || 0;
        const other = document.getElementById("other-pending");
        other.classList.toggle("hidden", !otherPending);
        other.classList.toggle("inline-block", Boolean(otherPending));
        other.href = `/admin/livestock.html?${FEED ? "" : "kind=feed&"}review=pending`;
        other.textContent = `${otherPending} ${otherKind} listing${otherPending === 1 ? "" : "s"} waiting for review`;

        if (!res.data.length) {
          if (state.status === "review") {
            renderEmptyState(list, { title: "Nothing waiting for review", message: "Listings that sellers submit or change will appear here.", icon: "check" });
            document.getElementById("pagination").innerHTML = "";
            return;
          }
          const filtered = state.status || state.animal || state.seller || state.q;
          renderEmptyState(list, filtered
            ? { title: `No matching ${noun}`, message: "Try a different filter or search.", icon: "search" }
            : { title: `No ${noun} listings yet`, message: "Add your first listing. It stays unpublished until you publish it.", icon: "cattle",
                action: `<button type="button" onclick="openEditor()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-semibold">Add ${NOUN}</button>` });
        } else {
          list.innerHTML = `
            <table class="admin-table">
              <thead><tr>
                <th class="hidden md:table-cell">Date</th><th>Listing</th><th class="hidden lg:table-cell col-xw">${FEED ? "Feed type" : "Animal"}</th>
                <th class="hidden md:table-cell">${FEED ? "Stage" : "Breed"}</th><th class="hidden lg:table-cell col-w text-center">Quantity</th><th class="hidden md:table-cell">Price</th>
                <th class="hidden lg:table-cell">Seller</th><th class="hidden xl:table-cell col-xw">Province</th>
                <th>Status</th><th class="hidden sm:table-cell">Verification</th><th class="text-right hidden sm:table-cell">Actions</th>
              </tr></thead>
              <tbody>${res.data.map(rowHtml).join("")}</tbody>
            </table>`;
          bindRowActions(list);
        }

        const pag = document.getElementById("pagination");
        pag.innerHTML = "";
        if (res.pagination.total > 1) pag.appendChild(createPagination(res.pagination.current, res.pagination.total, loadList));
      }

      const STATUS_OPTIONS = [{ value: "published", label: "Published" }, { value: "unpublished", label: "Unpublished" }];
      const VERIFICATION_OPTIONS = [{ value: "verified", label: "Verified" }, { value: "unverified", label: "Unverified" }];

      function pillSelect(kind, l, options, value) {
        return `<select class="pill-select" data-kind="${kind}" data-id="${l.id}" data-title="${escapeHtml(l.title)}" data-value="${value}" aria-label="${kind === "status" ? "Listing status" : "Verification"}">
          ${options.map((o) => `<option value="${o.value}" ${o.value === value ? "selected" : ""}>${o.label}</option>`).join("")}
        </select>`;
      }

      function listingState(l) {
        if (l.review_status === "pending") return "review";
        if (l.review_status === "rejected") return "changes";
        return l.status;
      }

      function stateSelect(l) {
        const current = listingState(l);
        const options = [
          ...(current === "review" ? [{ value: "review", label: "In review" }] : []),
          { value: "published", label: "Published" },
          { value: "unpublished", label: "Unpublished" },
          ...(l.seller_id ? [{ value: "changes", label: "Changes requested" }] : []),
        ];
        const tip = current === "changes" && l.review_note ? ` title="${escapeHtml(l.review_note)}"` : current === "review" && l.submitted_at ? ` title="Submitted ${formatDate(l.submitted_at)}"` : "";
        return `<select class="pill-select" data-kind="state" data-id="${l.id}" data-title="${escapeHtml(l.title)}" data-value="${current}" aria-label="Listing status"${tip}>
          ${options.map((o) => `<option value="${o.value}" ${o.value === current ? "selected" : ""}>${o.label}</option>`).join("")}
        </select>`;
      }

      function actionsHtml(l) {
        const published = l.status === "published";
        return `
              ${published ? `<a href="/listing.html?id=${l.id}" target="_blank" rel="noopener" class="tbl-icon" title="View on website" aria-label="View on website">${uiIcon("external")}</a>` : ""}
              <button type="button" data-edit="${l.id}" class="tbl-icon" title="Edit" aria-label="Edit">${uiIcon("edit")}</button>
              <button type="button" data-delete="${l.id}" data-title="${escapeHtml(l.title)}" class="tbl-icon tbl-icon-danger" title="Delete" aria-label="Delete">${uiIcon("trash")}</button>
            `;
      }

      function rowHtml(l) {
        return `
          <tr>
            <td class="hidden md:table-cell whitespace-nowrap text-gray-600">${dateOnly(l.created_at)}</td>
            <td>
              <div class="min-w-[150px]">
                <div class="min-w-0">
                  <button type="button" data-edit="${l.id}" class="font-semibold text-gray-900 hover:text-blue-600 text-left line-clamp-2">${escapeHtml(l.title)}</button>
                  <p class="text-xs text-gray-500 hidden lg:block col-xw-in">${escapeHtml([l.animal_name, FEED ? "" : l.category_name].filter(Boolean).join(", "))}</p>
                  <p class="text-xs text-gray-500 col-w-in">${[l.livestock_type, l.quantity > 1 ? quantityLabel(l.quantity, l.animal_name, l.animal_kind) : ""].filter(Boolean).join(", ")}</p>
                  ${FEED ? `<p class="text-xs text-gray-500 md:hidden">${escapeHtml(l.animal_name)}: ${escapeHtml(l.category_name)}</p>` : l.breed_name ? `<p class="text-xs text-gray-500 md:hidden">${escapeHtml(l.breed_name)}</p>` : ""}
                  <p class="text-xs text-gray-700 md:hidden">${priceCell(l)}</p>
                  ${l.seller_id ? `<a href="/admin/sellers.html?id=${l.seller_id}" class="lg:hidden inline-flex text-xs text-blue-700 hover:underline mt-0.5">${escapeHtml(l.seller_business_name || l.seller_name)}</a>` : ""}
                  <div class="sm:hidden mt-1.5">${pillSelect("verification", l, VERIFICATION_OPTIONS, l.verification || "unverified")}</div>
                  <div class="sm:hidden mt-1.5">${actionsHtml(l)}</div>
                </div>
              </div>
            </td>
            <td class="hidden lg:table-cell col-xw text-gray-700">${escapeHtml(l.animal_name)}${!FEED && l.category_name ? `<span class="block text-xs text-gray-500">${escapeHtml(l.category_name)}</span>` : ""}</td>
            <td class="hidden md:table-cell">${FEED ? `<span class="text-gray-700">${escapeHtml(l.category_name)}</span>` : l.breed_name ? `<span class="text-gray-700">${escapeHtml(l.breed_name)}</span>` : `<span class="text-xs text-gray-400">Not specified</span>`}</td>
            <td class="hidden lg:table-cell col-w text-center text-gray-700">${escapeHtml(String(l.quantity ?? ""))}</td>
            <td class="hidden md:table-cell whitespace-nowrap font-semibold text-gray-900">${priceCell(l)}</td>
            <td class="hidden lg:table-cell">${l.seller_id
              ? `<a href="/admin/sellers.html?id=${l.seller_id}" class="text-blue-700 font-medium hover:underline" title="${escapeHtml(l.seller_name)}">${escapeHtml(l.seller_business_name || l.seller_name)}</a>`
              : `<span class="text-xs text-gray-500 whitespace-nowrap">Frontier's stock</span>`}${l.location ? `<span class="col-xw-in text-xs text-gray-500">${escapeHtml(l.location)}</span>` : ""}</td>
            <td class="hidden xl:table-cell col-xw text-gray-600">${escapeHtml(l.location)}</td>
            <td>${stateSelect(l)}</td>
            <td class="hidden sm:table-cell">${pillSelect("verification", l, VERIFICATION_OPTIONS, l.verification || "unverified")}</td>
            <td class="text-right whitespace-nowrap hidden sm:table-cell">${actionsHtml(l)}</td>
          </tr>`;
      }

      function bindRowActions(root) {
        root.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openEditor(b.dataset.edit)));
        root.querySelectorAll('.pill-select[data-kind="state"]').forEach((sel) => sel.addEventListener("change", async () => {
          const current = sel.dataset.value;
          const value = sel.value;
          let done = false;
          if (value === "changes") done = await reviewListing(sel.dataset.id, "reject", sel.dataset.title);
          else if (value === "published" && (current === "review" || current === "changes")) done = await reviewListing(sel.dataset.id, "approve", sel.dataset.title);
          else done = await setStatus(sel, value);
          if (!done) sel.value = current;
        }));
        root.querySelectorAll('.pill-select[data-kind="verification"]').forEach((sel) =>
          sel.addEventListener("change", async () => {
            const value = sel.value;
            const title = sel.dataset.title;
            const isStatus = false;
            const confirm = isStatus
              ? value === "published"
                ? { title: "Publish this listing?", message: `"${title}" will be visible on the website.`, confirmText: "Publish" }
                : { title: "Unpublish this listing?", message: `"${title}" will be hidden from the website.`, confirmText: "Unpublish", variant: "danger" }
              : value === "verified"
                ? { title: "Mark as verified?", message: `"${title}" will be marked as verified.`, confirmText: "Mark verified" }
                : { title: "Mark as unverified?", message: `"${title}" will be marked as unverified.`, confirmText: "Mark unverified", variant: "danger" };
            if (!(await confirmAction(confirm))) {
              sel.value = sel.dataset.value;
              return;
            }
            sel.disabled = true;
            try {
              await adminApi(`/api/admin/livestock/${sel.dataset.id}/${isStatus ? "status" : "verification"}`, {
                method: "PATCH",
                body: isStatus ? { status: value } : { verification: value },
              });
              showNotification(isStatus
                ? value === "published" ? "Listing published - it's now live on the website." : "Listing unpublished - it's hidden from the website."
                : value === "verified" ? "Listing marked as verified." : "Listing marked as unverified.", "success");
              loadList();
            } catch (error) {
              showNotification(error.message, "error");
              sel.value = sel.dataset.value;
              sel.disabled = false;
            }
          }),
        );
        root.querySelectorAll("[data-delete]").forEach((b) =>
          b.addEventListener("click", async () => {
            const ok = await confirmAction({
              title: "Delete this listing?",
              message: `"${b.dataset.title}" and its photos will be permanently deleted. Inquiries about it are kept.`,
              confirmText: "Delete",
              variant: "danger",
            });
            if (!ok) return;
            try {
              await adminApi(`/api/admin/livestock/${b.dataset.delete}`, { method: "DELETE" });
              showNotification("Listing deleted.", "success");
              loadList();
            } catch (error) {
              showNotification(error.message, "error");
            }
          }),
        );
      }

      // After publishing, show the All tab (and drop ?review= / ?status= from the address).
      function showAll() {
        const url = new URL(location.href);
        url.searchParams.delete("review");
        url.searchParams.delete("status");
        history.replaceState(history.state, "", url);
        const tab = document.querySelector('#status-tabs [data-status=""]');
        if (state.status) tab.click();
        else loadList(state.page);
      }

      async function setStatus(sel, value) {
        const title = sel.dataset.title;
        const fromReview = sel.dataset.value === "review" || sel.dataset.value === "changes";
        const ok = await confirmAction(value === "published"
          ? { title: "Publish this listing?", message: `"${title}" will be visible on the website.`, confirmText: "Publish" }
          : { title: fromReview ? "Keep this listing unpublished?" : "Unpublish this listing?", message: fromReview ? `"${title}" will leave the review queue and stay hidden from the website.` : `"${title}" will be hidden from the website.`, confirmText: "Unpublish", variant: "danger" });
        if (!ok) return false;
        sel.disabled = true;
        try {
          await adminApi(`/api/admin/livestock/${sel.dataset.id}/status`, { method: "PATCH", body: { status: value } });
          showNotification(value === "published" ? "Listing published - it's now live on the website." : "Listing unpublished - it's hidden from the website.", "success");
          if (value === "published") showAll();
          else loadList();
          return true;
        } catch (error) {
          showNotification(error.message, "error");
          sel.disabled = false;
          return false;
        }
      }

      async function reviewListing(id, action, title, after) {
        const done = (res) => {
          showNotification(`${action === "approve" ? "Approved and published" : "Changes requested"}.${res.emailed ? " The seller has been emailed." : ""}`, "success");
          if (action === "approve") showAll();
          else loadList();
          if (after) after();
        };
        if (action === "approve") {
          const ok = await confirmAction({ title: "Approve this listing?", message: `"${title}" will be published on the website. Verification is set separately.`, confirmText: "Approve and publish" });
          if (!ok) return false;
          try {
            done(await adminApi(`/api/admin/livestock/${id}/review`, { method: "POST", body: { action } }));
            return true;
          } catch (error) {
            showNotification(error.message, "error");
            return false;
          }
        }
        openFormModal({
          title: "Request changes",
          submitText: "Send to seller",
          body: `
            <p class="text-sm text-gray-600">"${escapeHtml(title)}" is hidden from the website until the seller updates it. They see your note in their dashboard and by email.</p>
            ${field({ name: "note", label: "What needs to change?", type: "textarea", rows: 4, required: true, placeholder: "e.g. Please add a clear photo of the animals and the age.", attrs: 'maxlength="500"' })}`,
          async onSubmit(form) {
            const note = formValues(form).note.trim();
            if (!note) {
              const e = new Error("Please say what the seller needs to change.");
              e.errors = { note: "Required." };
              throw e;
            }
            done(await adminApi(`/api/admin/livestock/${id}/review`, { method: "POST", body: { action, note } }));
          },
        });
        return false;
      }

      const label = (row) => row.name + (row.status === "disabled" ? " (disabled)" : "");

      function animalOptions(selected) {
        return [{ value: "", label: FEED ? "Select feed type" : "Select category" }].concat(
          animals.filter((a) => ((a.kind || "livestock") === KIND && a.status === "active") || String(a.id) === String(selected))
            .map((a) => ({ value: a.id, label: label(a) })),
        );
      }

      function purposeOptions(animalId, selected) {
        const list = purposes.filter((p) => String(p.animal_id) === String(animalId) && (p.status === "active" || String(p.id) === String(selected)));
        return [{ value: "", label: animalId ? (list.length ? "Select purpose" : "No purposes for this category") : "Select a category first" }]
          .concat(list.map((p) => ({ value: p.id, label: label(p) })));
      }

      function breedOptions(purposeId, selected) {
        const purpose = purposes.find((p) => String(p.id) === String(purposeId));
        const usable = (b) => b.status === "active" || String(b.id) === String(selected);
        let list;
        if (purpose && isAllBreedsPurpose(purpose.name)) {
          const own = (b) => String(b.category_id) === String(purpose.id);
          list = breeds
            .filter((b) => String(b.animal_id) === String(purpose.animal_id) && usable(b))
            .sort((a, b) => Number(own(b)) - Number(own(a)) || a.category_name.localeCompare(b.category_name) || a.name.localeCompare(b.name))
            .map((b) => ({ value: b.id, label: own(b) ? label(b) : `${label(b)} (${b.category_name})` }));
        } else {
          list = breeds
            .filter((b) => String(b.category_id) === String(purposeId) && usable(b))
            .map((b) => ({ value: b.id, label: label(b) }));
        }
        return [{ value: "", label: purposeId ? (list.length ? "Select breed" : "No breeds for this purpose") : "Select a purpose first" }]
          .concat(list);
      }

      function typeOptions(animalId, selected) {
        const animal = animals.find((a) => String(a.id) === String(animalId));
        const list = livestockTypesFor(animal?.name);
        const values = selected && !list.includes(selected) ? [...list, selected] : list;
        return [{ value: "", label: "Not specified" }, ...values.map((t) => ({ value: t, label: t }))];
      }

      function sellerOptions(selected) {
        const usable = sellers.filter((s) => s.status === "active" || String(s.id) === String(selected));
        return [{ value: "", label: "Frontier's stock" }].concat(
          usable.map((s) => ({
            value: s.id,
            label: `${s.name}${s.business_name ? ` (${s.business_name})` : ""}${s.status === "inactive" ? " - inactive" : ""}`,
          })),
        );
      }

      const optionsHtml = (opts) => opts.map((o) => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join("");

      async function openEditor(id) {
        let item = {};
        if (id) {
          try {
            item = (await adminApi(`/api/admin/livestock/${id}`)).data;
          } catch (error) {
            return showNotification(error.message, "error");
          }
        }
        const photos = (item.images || []).map((im) => ({ id: im.id, src: im.thumb_path || im.image_path }));
        const removed = [];

        const animalId = item.animal_id ?? "";
        const sellerId = id ? item.seller_id ?? "" : getQueryParams().seller_id || "";

        const reviewNotice = item.review_status === "pending"
          ? `<div class="alert alert-warning text-sm mb-0">Submitted by ${escapeHtml(item.seller_business_name || item.seller_name || "a seller")}${item.submitted_at ? ` on ${formatDate(item.submitted_at)}` : ""} and waiting for review. Setting the status to Published approves it.</div>`
          : item.review_status === "rejected"
            ? `<div class="alert alert-error text-sm mb-0">Changes requested: ${escapeHtml(item.review_note || "")}</div>`
            : "";
        const body = `
          ${reviewNotice}
          ${field({ name: "title", label: "Title", value: item.title, required: true, attrs: 'maxlength="200"' })}
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${field({ name: "animal_id", label: FEED ? "Feed Type" : "Category", value: animalId, required: true, options: animalOptions(animalId) })}
            ${field({ name: "category_id", label: "Production Purpose", value: item.category_id, required: true, options: purposeOptions(animalId, item.category_id) })}
            ${field({ name: "breed_id", label: "Breed", value: item.breed_id, required: !id, options: breedOptions(item.category_id, item.breed_id) })}
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            ${field({ name: "livestock_type", label: "Type", value: item.livestock_type, options: typeOptions(animalId, item.livestock_type) })}
            ${field({ name: "quantity", label: "Quantity", type: "number", value: item.quantity ?? "", required: !id, attrs: 'min="1" step="1" inputmode="numeric"' })}
            ${field({ name: "age_months", label: "Age (months)", type: "number", value: item.age_months, required: !id, attrs: 'min="0" max="600" step="1" inputmode="numeric"' })}
          </div>
          ${priceFields(item, !id)}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${field({ name: "seller_id", label: "Seller", value: sellerId, options: sellerOptions(sellerId),
                help: sellers.length ? "Only admins see the seller. Customers' inquiries still come to Frontier." : "Add sellers on the Sellers page." })}
            ${field({ name: "location", label: "Province", value: ZAMBIA_PROVINCES.includes(item.location) ? item.location : "", required: true,
                help: item.location && !ZAMBIA_PROVINCES.includes(item.location) ? `Previously "${item.location}" - choose its province.` : "",
                options: [{ value: "", label: "Select province" }, ...ZAMBIA_PROVINCES.map((p) => ({ value: p, label: p }))] })}
          </div>
          ${field({ name: "description", label: "Description", type: "textarea", value: item.description, rows: 3, attrs: 'maxlength="5000"' })}

          <div>
            <div class="flex items-baseline justify-between mb-2">
              <span class="field-label !mb-0">Photos</span>
              <span id="photo-count" class="text-xs text-gray-500"></span>
            </div>
            <div id="photo-grid" class="photo-grid"></div>
            <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
            <p class="text-xs text-gray-500 mt-2">Up to ${MAX_PHOTOS} photos. The first one is the cover.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${field({ name: "status", label: "Status", value: item.status || "unpublished", options: STATUS_OPTIONS,
                help: item.status === "published" && item.published_at ? `Published ${formatDateShort(item.published_at)}` : "" })}
            ${field({ name: "verification", label: "Verification", value: item.verification || "unverified", options: VERIFICATION_OPTIONS })}
          </div>`;

        openFormModal({
          title: `${id ? "Edit" : "Add"} ${NOUN}`,
          crumb: id ? item.title : `Add ${NOUN}`,
          params: id ? { edit: id } : { new: 1 },
          submitText: id ? "Save Changes" : "Create Listing",
          wide: true,
          body,
          onOpen(form) {
            const animalSelect = form.elements.animal_id;
            const purposeSelect = form.elements.category_id;
            const breedSelect = form.elements.breed_id;
            const typeSelect = form.elements.livestock_type;
            bindWordLimit(form.elements.description);
            const kindOf = (id) => (animals.find((a) => String(a.id) === String(id)) || {}).kind || "livestock";
            applyListingKind(form, kindOf(animalSelect.value));
            animalSelect.addEventListener("change", () => {
              purposeSelect.innerHTML = optionsHtml(purposeOptions(animalSelect.value));
              breedSelect.innerHTML = optionsHtml(breedOptions(""));
              typeSelect.innerHTML = optionsHtml(typeOptions(animalSelect.value));
              applyListingKind(form, kindOf(animalSelect.value));
            });
            purposeSelect.addEventListener("change", () => {
              breedSelect.innerHTML = optionsHtml(breedOptions(purposeSelect.value));
            });

            const grid = form.querySelector("#photo-grid");
            const input = form.querySelector("#photo-input");
            const renderPhotos = () => {
              form.querySelector("#photo-count").textContent = `${photos.length} / ${MAX_PHOTOS}`;
              grid.innerHTML = photos.map((p, i) => `
                <div class="photo-item ${i === 0 ? "is-cover" : ""}">
                  <img src="${escapeHtml(p.src)}" alt="Photo ${i + 1}">
                  ${i === 0 ? '<span class="cover-badge">Cover</span>' : ""}
                  <div class="photo-actions">
                    ${i === 0 ? "<span></span>" : `<button type="button" data-cover="${i}">Make cover</button>`}
                    <button type="button" data-remove="${i}" aria-label="Remove photo">Remove</button>
                  </div>
                </div>`).join("") +
                (photos.length < MAX_PHOTOS
                  ? `<label class="photo-drop" for="photo-input" tabindex="0">${uiIcon("camera")}<span>Add photos</span></label>`
                  : "");
              grid.querySelectorAll("[data-cover]").forEach((b) => b.addEventListener("click", () => {
                photos.unshift(photos.splice(Number(b.dataset.cover), 1)[0]);
                form.dispatchEvent(new Event("input"));
                renderPhotos();
              }));
              grid.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", async () => {
                if (photos[Number(b.dataset.remove)]?.id && !(await confirmRemovePhoto())) return;
                const [p] = photos.splice(Number(b.dataset.remove), 1);
                if (p.id) removed.push(p.id);
                if (p.url) URL.revokeObjectURL(p.url);
                form.dispatchEvent(new Event("input"));
                renderPhotos();
              }));
              const drop = grid.querySelector(".photo-drop");
              if (drop) {
                drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
                ["dragover", "dragenter"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("dragover"); }));
                ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("dragover")));
                drop.addEventListener("drop", (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); });
              }
            };
            const addFiles = async (fileList) => {
              const files = [...fileList].filter((f) => /^image\/(jpeg|png|webp)$/.test(f.type));
              if (files.length < fileList.length) showNotification("Only JPEG, PNG and WebP photos can be added.", "warning");
              const room = MAX_PHOTOS - photos.length;
              if (files.length > room) showNotification(`Only ${room} more photo${room === 1 ? "" : "s"} can be added.`, "warning");
              for (const f of files.slice(0, room)) {
                const file = await shrinkImage(f);
                const url = URL.createObjectURL(file);
                photos.push({ file, src: url, url });
              }
              form.dispatchEvent(new Event("input"));
              renderPhotos();
            };
            input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
            renderPhotos();
          },
          async onSubmit(form) {
            const v = formValues(form);
            const errors = {};
            if (!v.title.trim()) errors.title = "Title is required.";
            if (!v.animal_id) errors.animal_id = FEED ? "Please choose a feed type." : "Please choose a category.";
            if (!v.category_id) errors.category_id = FEED ? "Please choose a feed stage." : "Please choose a production purpose.";
            if (!v.location) errors.location = "Please choose a province.";
            if (countWords(v.description) > MAX_DESCRIPTION_WORDS) errors.description = `Description must be ${MAX_DESCRIPTION_WORDS} words or fewer.`;
            if (Object.keys(errors).length) {
              const e = new Error("Please correct the highlighted fields.");
              e.errors = errors;
              throw e;
            }

            const fd = new FormData();
            for (const key of ["title", "animal_id", "category_id", "breed_id", "seller_id", "livestock_type", "quantity", "age_months", "location", "description"]) fd.append(key, v[key] ?? "");
            appendPriceFields(fd, form);
            fd.append("status", v.status);
            fd.append("verification", v.verification);
            fd.append("remove_image_ids", JSON.stringify(removed));
            fd.append("image_order", JSON.stringify(photos.filter((p) => p.id).map((p) => p.id)));
            const newPhotos = photos.filter((p) => p.file);
            newPhotos.forEach((p) => fd.append("images", p.file, p.file.name));

            const res = await adminApi(id ? `/api/admin/livestock/${id}` : "/api/admin/livestock", { method: id ? "PUT" : "POST", body: fd });

            if (photos[0]?.file && res.data.images.length > 1) {
              const firstNewIndex = res.data.images.length - newPhotos.length;
              const coverId = res.data.images[firstNewIndex].id;
              const order = [coverId, ...res.data.images.filter((im) => im.id !== coverId).map((im) => im.id)];
              const fd2 = new FormData();
              for (const key of ["title", "category_id", "breed_id", "livestock_type", "quantity", "age_months", "location", "description", "status"]) fd2.append(key, res.data[key] ?? "");
              fd2.append("image_order", JSON.stringify(order));
              await adminApi(`/api/admin/livestock/${res.data.id}`, { method: "PUT", body: fd2 });
            }
            photos.forEach((p) => p.url && URL.revokeObjectURL(p.url));
            showNotification(id ? "Listing updated." : (res.data.status === "published" ? "Listing created and published." : "Listing saved as unpublished."), "success");
            if (res.data.status === "published" && (!id || item.status !== "published")) showAll();
            else loadList(id ? state.page : 1);
          },
        });
      }

      document.querySelectorAll("#status-tabs button").forEach((b) =>
        b.addEventListener("click", () => {
          document.querySelectorAll("#status-tabs button").forEach((x) => x.classList.toggle("active", x === b));
          state.status = b.dataset.status;
          loadList(1);
        }),
      );
      document.getElementById("animal-filter").addEventListener("change", (e) => { state.animal = e.target.value; loadList(1); });
      document.getElementById("seller-filter").addEventListener("change", (e) => { state.seller = e.target.value; loadList(1); });
      let searchTimer;
      document.getElementById("search").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { state.q = e.target.value.trim(); loadList(1); }, 300);
      });
      document.getElementById("add-btn").addEventListener("click", () => openEditor());

      (async () => {
        await initAdminPage(KIND);
        [animals, purposes, breeds, sellers] = await Promise.all([
          adminApi("/api/admin/animals").then((r) => r.data),
          adminApi("/api/admin/categories").then((r) => r.data),
          adminApi("/api/admin/breeds").then((r) => r.data),
          adminApi("/api/admin/sellers").then((r) => r.data),
        ]);
        document.getElementById("seller-filter").innerHTML += sellers.map((s) => `<option value="${s.id}">${escapeHtml(s.business_name || s.name)}</option>`).join("");
        document.getElementById("animal-filter").innerHTML += animals.filter((a) => (a.kind || "livestock") === KIND).map((a) => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");

        const q = getQueryParams();
        if (q.seller_id) { state.seller = q.seller_id; document.getElementById("seller-filter").value = q.seller_id; }
        if (q.review === "pending") document.querySelector('#status-tabs [data-status="review"]')?.click();
        else if (q.status) document.querySelector(`#status-tabs [data-status="${q.status}"]`)?.click();
        else await loadList(1);
        if (q.new) openEditor();
        if (q.edit) openEditor(q.edit);
      })();
    </script>
  </body>
</html>
