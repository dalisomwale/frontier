<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moderate Listings - Admin - Frontier Marketplace</title>
    <link rel="icon" href="../images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Loaded blocking, in <head>, so the bottom nav below can be painted
         on first render instead of popping in after the page has already
         shown without it. -->
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/species.js"></script>
    <script src="../js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Desktop sidebar: rendered synchronously right here (not on
         DOMContentLoaded) so it exists before the browser's first paint. -->
    <div id="app-sidebar"></div>
    <script>
      renderSidebar("admin-listings");
    </script>

    <!-- Compact top bar: brand always visible, logout shown on mobile only
         since the sidebar (desktop) and bottom nav (mobile) carry the rest
         of the navigation. -->
    <nav id="page-topnav" class="bg-white border-b border-gray-100 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-3">
              <div class="brand-mark-full">
                <img src="../images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
              </div>
            </a>
          </div>

          <div class="flex items-center gap-4">
            <a
              href="../dashboard.html"
              class="hidden sm:inline lg:hidden text-gray-600 hover:text-gray-900 font-medium"
              >User Dashboard</a
            >
            <button
              id="logout-btn"
              class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-3xl font-bold text-gray-900">Moderate Listings</h1>
          <a href="index.html" class="text-blue-600 hover:text-blue-700"
            >← Back to Dashboard</a
          >
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                for="status-filter"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Status</label
              >
              <select
                id="status-filter"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="paused">Paused</option>
                <option value="deactivated">Deactivated</option>
                <option value="sold">Sold</option>
              </select>
            </div>

            <div>
              <label
                for="search-filter"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Search</label
              >
              <input
                type="text"
                id="search-filter"
                placeholder="Title, seller..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
          </div>

          <div class="flex gap-2 mt-4">
            <button
              id="apply-filter"
              class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium"
            >
              Apply Filter
            </button>
            <button
              id="clear-filter"
              class="border border-gray-300 text-gray-900 px-6 py-2 rounded-lg hover:bg-gray-50 font-medium"
            >
              Clear
            </button>
          </div>
        </div>

        <!-- Listings Grid -->
        <div
          id="listings-container"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6"
        >
          <div class="col-span-full text-center py-8">
            <p class="text-gray-600">Loading listings...</p>
          </div>
        </div>

        <!-- Pagination -->
        <div id="pagination-container"></div>
    </div>

    <!-- Review Modal -->
    <div
      id="review-modal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 overflow-y-auto"
    >
      <div class="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 my-8">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-2xl font-bold text-gray-900">Review Listing</h2>
          <button
            id="review-close"
            class="text-2xl text-gray-600 hover:text-gray-900"
          >
            ×
          </button>
        </div>

        <div
          id="review-content"
          class="space-y-4 mb-6 max-h-96 overflow-y-auto"
        >
          <!-- Content will be populated here -->
        </div>

        <div id="actions-container" class="flex gap-3 border-t pt-4">
          <!-- Actions will be populated based on status -->
        </div>
      </div>
    </div>

    <!-- Mobile app-style bottom navigation: rendered synchronously, right
         here, instead of waiting for DOMContentLoaded. -->
    <div id="app-bottom-nav"></div>
    <script>
      renderBottomNav("admin");
    </script>

    <script>
      let currentPage = 1;
      let selectedListingId = null;

      document.addEventListener("DOMContentLoaded", async () => {
        requireAuth();
        await checkAuthentication();
        // Re-run after the server round-trip resolves, in case the
        // optimistic localStorage snapshot used for the instant render
        // above was missing or stale.
        renderBottomNav("admin");

        const user = getCurrentUser();
        if (user?.role !== "admin") {
          showNotification("You do not have admin access", "error");
          setTimeout(() => (window.location.href = "/dashboard.html"), 2000);
          return;
        }

        // Check URL params for filters
        const params = getQueryParams();
        if (params.status) {
          document.getElementById("status-filter").value = params.status;
        }

        await loadListings();

        document
          .getElementById("apply-filter")
          .addEventListener("click", () => {
            currentPage = 1;
            loadListings();
          });

        document
          .getElementById("clear-filter")
          .addEventListener("click", () => {
            document.getElementById("status-filter").value = "";
            document.getElementById("search-filter").value = "";
            currentPage = 1;
            loadListings();
          });

        document
          .getElementById("review-close")
          .addEventListener("click", closeReviewModal);

        document
          .getElementById("logout-btn")
          .addEventListener("click", async () => {
            await logout();
          });
      });

      /**
       * Load listings
       */
      async function loadListings() {
        const status = document.getElementById("status-filter").value;
        const search = document.getElementById("search-filter").value;

        const params = new URLSearchParams();
        if (status) params.append("status", status);
        if (search) params.append("search", search);
        params.append("page", currentPage);
        params.append("limit", 12);

        try {
          showLoading();
          const response = await apiRequest(
            `/api/admin/listings?${params.toString()}`,
          );

          if (response.success) {
            renderListingsGrid(response.data);
            renderPagination(response.pagination);
          } else {
            showNotification("Failed to load listings", "error");
          }
        } catch (error) {
          console.error("Load listings error:", error);
          showNotification("Failed to load listings", "error");
        } finally {
          hideLoading();
        }
      }

      /**
       * Render listings grid
       */
      function renderListingsGrid(listings) {
        const container = document.getElementById("listings-container");

        if (listings.length === 0) {
          container.innerHTML = `
          <div class="col-span-full bg-gray-50 rounded-lg p-8 text-center">
            <p class="text-gray-600">No listings found</p>
          </div>
        `;
          return;
        }

        container.innerHTML = listings
          .map((listing) => {
            const imageUrl =
              listing.media && listing.media.length > 0
                ? listing.media[0].file_path
                : null;
            const statusColor =
              {
                active: "green",
                paused: "gray",
                deactivated: "red",
                sold: "blue",
              }[listing.status] || "gray";

            return `
          <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden hover:shadow-lg transition cursor-pointer" onclick="openReviewModal(${listing.id})">
            <div class="bg-gray-300 h-40 flex items-center justify-center relative">
              ${imageUrl ? `<img src="${imageUrl}" alt="Listing" class="w-full h-full object-cover">` : speciesFallbackMedia(listing.species)}
              <span class="absolute top-2 right-2 px-3 py-1 bg-${statusColor}-100 text-${statusColor}-800 rounded-full text-sm font-semibold">
                ${listing.status.toUpperCase()}
              </span>
            </div>
            <div class="p-4">
              <h3 class="font-bold text-gray-900 line-clamp-2">${listing.title}</h3>
              <p class="text-gray-600 text-sm mt-1">${listing.species}</p>
              <p class="text-gray-700 font-semibold mt-2">K${parseFloat(listing.price).toLocaleString()}</p>
              <p class="text-gray-600 text-sm">Seller: ${listing.seller_name}</p>
              <p class="text-gray-500 text-xs mt-2">${formatDateShort(listing.created_at)}</p>
            </div>
          </div>
        `;
          })
          .join("");
      }

      /**
       * Render pagination
       */
      function renderPagination(pagination) {
        const container = document.getElementById("pagination-container");
        if (!pagination || pagination.total <= 1) {
          container.innerHTML = "";
          return;
        }

        let html = '<div class="flex justify-center gap-2">';

        if (currentPage > 1) {
          html += `<button onclick="goToPage(${currentPage - 1})" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Previous</button>`;
        }

        for (let i = 1; i <= pagination.total; i++) {
          if (i === currentPage) {
            html += `<button class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">${i}</button>`;
          } else {
            html += `<button onclick="goToPage(${i})" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">${i}</button>`;
          }
        }

        if (currentPage < pagination.total) {
          html += `<button onclick="goToPage(${currentPage + 1})" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Next</button>`;
        }

        html += "</div>";
        container.innerHTML = html;
      }

      /**
       * Go to page
       */
      function goToPage(page) {
        currentPage = page;
        loadListings();
        window.scrollTo(0, 0);
      }

      /**
       * Open review modal
       */
      async function openReviewModal(listingId) {
        selectedListingId = listingId;

        try {
          showLoading();
          const response = await apiRequest(`/api/admin/listings/${listingId}`);

          if (response.success) {
            const listing = response.data;
            renderReviewModal(listing);
            document.getElementById("review-modal").classList.remove("hidden");
          } else {
            showNotification("Failed to load listing details", "error");
          }
        } catch (error) {
          console.error("Open review error:", error);
          showNotification("Failed to load listing details", "error");
        } finally {
          hideLoading();
        }
      }

      /**
       * Render review modal
       */
      function renderReviewModal(listing) {
        const content = document.getElementById("review-content");
        const imageUrl =
          listing.media && listing.media.length > 0
            ? listing.media[0].file_path
            : null;

        content.innerHTML = `
        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            ${imageUrl ? `<img src="${imageUrl}" alt="Listing" class="w-full h-48 object-cover rounded-lg">` : `<div class="h-48 rounded-lg overflow-hidden">${speciesFallbackMedia(listing.species)}</div>`}
          </div>

          <div>
            <p class="text-gray-600 text-sm">Title</p>
            <p class="font-semibold text-gray-900">${listing.title}</p>
          </div>

          <div>
            <p class="text-gray-600 text-sm">Status</p>
            <p class="font-semibold text-gray-900">${listing.status.toUpperCase()}</p>
          </div>

          <div>
            <p class="text-gray-600 text-sm">Species</p>
            <p class="font-semibold text-gray-900">${listing.species}</p>
          </div>

          <div>
            <p class="text-gray-600 text-sm">Price</p>
            <p class="font-semibold text-gray-900">K${parseFloat(listing.price).toLocaleString()}</p>
          </div>

          <div>
            <p class="text-gray-600 text-sm">Location</p>
            <p class="font-semibold text-gray-900">${listing.location}</p>
          </div>

          <div class="col-span-2">
            <p class="text-gray-600 text-sm">Seller Email</p>
            <p class="font-semibold text-gray-900">${listing.seller_email}</p>
          </div>
        </div>
      `;

        document.getElementById("actions-container").innerHTML = `
          <button onclick="closeReviewModal()" class="flex-1 bg-gray-50 text-gray-700 border border-gray-200 px-4 py-2 rounded-lg hover:bg-gray-100 font-medium">
            Close
          </button>
        `;
      }

      /**
       * Close review modal
       */
      function closeReviewModal() {
        document.getElementById("review-modal").classList.add("hidden");
        selectedListingId = null;
      }
    </script>
  </body>
</html>
