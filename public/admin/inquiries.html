<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Inquiries - Frontier Marketplace Admin</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/admin.js"></script>
  </head>
  <body class="bg-gray-50 admin-pending">
    <div id="app-sidebar"></div>
    <div id="admin-topbar"></div>

    <main class="app-content-shifted inbox-main">
      <div class="inbox-shell" id="inbox">
        <aside class="inbox-list-pane">
          <div class="inbox-list-head">
            <div class="flex items-center justify-between gap-2">
              <h1 class="text-lg font-bold text-gray-900">Inquiries</h1>
              <select id="tab-select" class="inbox-select" aria-label="Show inquiries"></select>
            </div>
            <div class="relative mt-3">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" data-icon="search"></span>
              <input id="search" type="search" placeholder="Search name, phone, email, listing" class="field-input !py-2 !pl-9 !text-sm" />
            </div>
            <select id="seller-filter" class="field-input !py-2 !text-sm mt-2" aria-label="Filter by seller"><option value="">All sellers</option><option value="none">Frontier's stock</option></select>
          </div>
          <div id="list" class="inbox-list"></div>
        </aside>

        <section class="inbox-chat-pane" id="chat" aria-live="polite"></section>
      </div>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));

      const STATUSES = [
        { value: "new", label: "New" },
        { value: "contacted", label: "Contacted" },
        { value: "in_progress", label: "In Progress" },
        { value: "resolved", label: "Resolved" },
      ];
      const TABS = [{ value: "", label: "All" }, ...STATUSES, { value: "archived", label: "Archived" }];
      const state = { tab: "", q: "", seller: "", page: 1, pages: 1, rows: [], selected: null };
      const statusLabel = (s) => STATUSES.find((x) => x.value === s)?.label || s;
      const inbox = document.getElementById("inbox");
      const chat = document.getElementById("chat");

      function whatsappNumber(phone) {
        let d = phone.replace(/\D/g, "");
        if (phone.trim().startsWith("+")) return d;
        if (d.startsWith("0")) d = "260" + d.slice(1);
        return d;
      }

      const initials = (name) => escapeHtml(String(name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase());

      function shortTime(value) {
        const d = new Date(value);
        const now = new Date();
        if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        if (now - d < 6 * 86400000) return d.toLocaleDateString("en-GB", { weekday: "short" });
        return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      }

      function renderTabs(summary = {}) {
        const total = STATUSES.reduce((n, s) => n + (summary[s.value] || 0), 0);
        document.getElementById("tab-select").innerHTML = TABS.map((t) => {
          const count = t.value === "" ? total : summary[t.value];
          return `<option value="${t.value}" ${t.value === state.tab ? "selected" : ""}>${t.label}${count !== undefined ? ` (${count})` : ""}</option>`;
        }).join("");
      }

      function listItem(i) {
        const unread = i.status === "new" && !i.is_archived;
        return `
          <button type="button" class="inbox-item ${unread ? "is-unread" : ""} ${String(state.selected) === String(i.id) ? "is-active" : ""}" data-open="${i.id}">
            <span class="inbox-avatar">${initials(i.full_name)}</span>
            <span class="min-w-0 flex-1 self-center">
              <span class="inbox-name block truncate">${escapeHtml(i.full_name)}</span>
              <span class="block text-xs text-gray-500 mt-0.5">${formatDate(i.created_at)}</span>
            </span>
            ${unread ? `<span class="inbox-unread-dot" aria-label="New"></span>` : ""}
          </button>`;
      }

      function bindListItem(el) {
        el.addEventListener("click", () => openInquiry(el.dataset.open));
      }

      async function loadList(page = 1, { append = false } = {}) {
        state.page = page;
        const list = document.getElementById("list");
        const params = new URLSearchParams({ page, limit: 30 });
        if (state.tab === "archived") params.set("archived", "1");
        else if (state.tab) params.set("status", state.tab);
        if (state.q) params.set("q", state.q);
        if (state.seller) params.set("seller_id", state.seller);

        let res;
        try {
          res = await adminApi(`/api/admin/inquiries?${params}`);
        } catch (error) {
          return renderEmptyState(list, { title: "Could not load inquiries", message: error.message, icon: "alert" });
        }
        renderTabs(res.summary);
        setNewInquiryBadge(res.summary.new);
        state.pages = res.pagination.total;
        state.rows = append ? [...state.rows, ...res.data] : res.data;

        if (!state.rows.length) {
          return renderEmptyState(list, state.q || state.tab || state.seller
            ? { title: "No inquiries here", message: state.q ? "No inquiries match your search." : state.seller ? "No inquiries for this seller." : "No inquiries with this status.", icon: "inbox" }
            : { title: "No inquiries yet", message: "When visitors contact a seller from a listing, their messages appear here.", icon: "inbox" });
        }
        list.innerHTML = state.rows.map(listItem).join("") +
          (state.page < state.pages ? `<div class="p-3"><button type="button" id="load-more" class="w-full text-sm font-medium text-blue-700 py-2 rounded-lg hover:bg-blue-50">Load more</button></div>` : "");
        list.querySelectorAll("[data-open]").forEach(bindListItem);
        document.getElementById("load-more")?.addEventListener("click", () => loadList(state.page + 1, { append: true }));
      }

      function markActive() {
        document.querySelectorAll("#list [data-open]").forEach((b) => b.classList.toggle("is-active", b.dataset.open === String(state.selected)));
      }

      function placeholder() {
        chat.innerHTML = `
          <div class="inbox-placeholder">
            <span class="w-12 h-12 text-gray-300 block">${uiIcon("inbox")}</span>
            <p class="font-semibold text-gray-700 mt-3">Select an inquiry</p>
            <p class="text-sm text-gray-500 mt-1">The conversation with the customer and the seller shows here.</p>
          </div>`;
      }

      function closeChat() {
        state.selected = null;
        inbox.classList.remove("has-selection");
        history.replaceState(null, "", location.pathname);
        markActive();
        placeholder();
      }

      function bubble({ side, tone, who, text, time, foot = "" }) {
        return `
          <div class="chat-row ${side === "right" ? "chat-right" : ""}">
            <div class="chat-bubble chat-${tone}">
              <p class="chat-who">${who}</p>
              <p class="chat-text">${escapeHtml(text)}</p>
              <p class="chat-time">${time}${foot ? ` · ${foot}` : ""}</p>
            </div>
          </div>`;
      }

      function renderChat(i) {
        const sellerName = i.seller_current_name || i.seller_name;
        const hasSeller = Boolean(i.seller_id && sellerName);
        const hasAccount = i.seller_account_status === "approved" && i.seller_status === "active";
        const canSend = hasSeller && (hasAccount || i.seller_email);
        const sellerPhone = i.seller_phone || "";
        const tel = (p) => escapeHtml(p.replace(/[^\d+]/g, ""));
        const mailSubject = encodeURIComponent(`Your inquiry about ${i.livestock_title} - Frontier Marketplace`);
        const listingLink = i.livestock_id && i.livestock_status === "published"
          ? `<a href="/listing.html?id=${i.livestock_id}" target="_blank" rel="noopener" class="text-blue-700 hover:underline">${escapeHtml(i.livestock_title)}</a>`
          : `${escapeHtml(i.livestock_title)} <span class="text-gray-400">${i.livestock_id ? "(unpublished)" : "(listing deleted)"}</span>`;
        const iconLink = (href, icon, label, tone, extra = "") =>
          `<a href="${href}" ${extra} class="chat-icon-btn" title="${label}" aria-label="${label}"><span class="w-[18px] h-[18px] block ${tone}">${uiIcon(icon)}</span></a>`;

        const seenAt = i.seller_seen_at ? new Date(i.seller_seen_at) : null;
        const adminFoot = (m) => [
          m.to_customer ? (m.customer_emailed ? "Emailed to customer" : "Customer email not sent") : "",
          m.to_seller ? (hasAccount ? (seenAt && seenAt >= new Date(m.created_at) ? "Seen by seller" : "Sent to seller") : m.seller_emailed ? "Emailed to seller" : "Seller email not sent") : "",
        ].filter(Boolean).join(" · ");
        const timeline = [
          `<div class="chat-day">${formatDate(i.created_at)}</div>`,
          bubble({ side: "left", tone: "customer", who: `${escapeHtml(i.full_name)} <span class="font-normal text-gray-500">via the website</span>`, text: i.message, time: shortTime(i.created_at) }),
          i.email_status === "failed"
            ? `<div class="chat-note chat-note-warn">Notification email failed${i.email_error ? `: ${escapeHtml(i.email_error)}` : ""} <button type="button" data-resend class="font-semibold underline ml-1">Resend</button></div>`
            : "",
          ...(i.messages || []).map((m) => m.sender === "admin"
            ? bubble({ side: "right", tone: "admin", who: `Frontier to the customer${m.to_seller ? ` and ${escapeHtml(sellerName || "the seller")}` : ""}`, text: m.body, time: shortTime(m.created_at), foot: adminFoot(m) })
            : bubble({ side: "left", tone: "seller", who: `${escapeHtml(sellerName || "Seller")} <span class="font-normal text-gray-500">seller</span>`, text: m.body, time: shortTime(m.created_at) })),
        ].join("");

        const sendsTo = canSend
          ? `Sends to ${escapeHtml(i.full_name)} by email and to ${escapeHtml(sellerName)}${hasAccount ? " in their dashboard" : ""}${hasAccount && i.seller_email ? " and" : ""}${i.seller_email ? " by email" : ""}. The seller doesn't see the customer's contact details.`
          : hasSeller
            ? `Sends to ${escapeHtml(i.full_name)} by email. ${escapeHtml(sellerName)} has no account or email, so contact them on WhatsApp or by phone.`
            : `Sends to ${escapeHtml(i.full_name)} by email.`;
        const composer = `
          <div class="chat-composer">
            <textarea id="reply-message" rows="2" maxlength="3000" class="chat-input" placeholder="Write a reply"></textarea>
            <div class="flex flex-wrap items-center gap-2 mt-2">
              <p class="text-xs text-gray-500 flex-1 min-w-[200px]">${sendsTo}</p>
              ${hasSeller && sellerPhone ? `<a href="https://wa.me/${whatsappNumber(sellerPhone)}" target="_blank" rel="noopener" class="chat-alt-btn"><span class="w-4 h-4 text-green-600">${uiIcon("inquire")}</span>WhatsApp seller</a>` : ""}
              <button type="button" data-reply class="chat-send-btn">Send reply</button>
            </div>
          </div>`;

        chat.innerHTML = `
          <header class="chat-head">
            <button type="button" data-back class="chat-back" aria-label="Back to inquiries"><span class="w-5 h-5 block">${uiIcon("chevronRight")}</span></button>
            <span class="inbox-avatar">${initials(i.full_name)}</span>
            <div class="min-w-0 flex-1">
              <p class="font-semibold text-gray-900 truncate">${escapeHtml(i.full_name)}</p>
              <p class="text-xs text-gray-500 truncate">${escapeHtml(i.phone)} · ${escapeHtml(i.email)}</p>
            </div>
            <div class="flex items-center gap-1 flex-shrink-0">
              ${iconLink(`tel:${tel(i.phone)}`, "phone", "Call customer", "text-blue-600")}
              ${iconLink(`https://wa.me/${whatsappNumber(i.phone)}`, "inquire", "WhatsApp customer", "text-green-600", 'target="_blank" rel="noopener"')}
              ${iconLink(`mailto:${escapeHtml(i.email)}?subject=${mailSubject}`, "mail", "Email customer", "text-blue-600")}
            </div>
          </header>

          <div class="chat-meta">
            <div class="min-w-0">
              <p class="text-sm text-gray-900 truncate">${listingLink}</p>
              <p class="text-xs text-gray-500 truncate">${escapeHtml([i.animal_name, i.category_name, i.breed_name].filter(Boolean).join(", "))}${hasSeller
                ? ` · Seller: <a href="/admin/sellers.html?id=${i.seller_id}" class="text-blue-700 hover:underline">${escapeHtml(sellerName)}</a>${sellerPhone ? ` (${escapeHtml(sellerPhone)})` : ""}`
                : i.seller_name ? ` · Seller: ${escapeHtml(i.seller_name)} (removed)` : " · Frontier's stock"}</p>
            </div>
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <select id="status-select" class="pill-select" data-value="${i.status}" aria-label="Inquiry status">
                ${STATUSES.map((s) => `<option value="${s.value}" ${s.value === i.status ? "selected" : ""}>${s.label}</option>`).join("")}
              </select>
              <button type="button" data-archive class="chat-icon-btn" title="${i.is_archived ? "Restore from archive" : "Archive"}" aria-label="${i.is_archived ? "Restore from archive" : "Archive"}"><span class="w-[18px] h-[18px] block text-gray-500">${uiIcon("archive")}</span></button>
              <button type="button" data-delete class="chat-icon-btn" title="Delete" aria-label="Delete"><span class="w-[18px] h-[18px] block text-red-500">${uiIcon("trash")}</span></button>
            </div>
          </div>

          <div class="chat-body" id="chat-body">${timeline}</div>
          ${composer}`;

        const body = document.getElementById("chat-body");
        body.scrollTop = body.scrollHeight;
        bindChat(i);
      }

      async function openInquiry(id) {
        state.selected = String(id);
        inbox.classList.add("has-selection");
        markActive();
        history.replaceState(null, "", `${location.pathname}?id=${id}`);
        chat.innerHTML = `<div class="inbox-placeholder"><span class="btn-spinner chat-spinner"></span></div>`;
        try {
          const i = (await adminApi(`/api/admin/inquiries/${id}`)).data;
          if (state.selected !== String(id)) return;
          renderChat(i);
        } catch (error) {
          showNotification(error.message, "error");
          closeChat();
        }
      }

      function refreshRow(change) {
        const idx = state.rows.findIndex((r) => String(r.id) === String(change.id));
        if (idx < 0) return;
        state.rows[idx] = { ...state.rows[idx], ...change };
        const el = document.querySelector(`#list [data-open="${change.id}"]`);
        if (!el) return;
        el.outerHTML = listItem(state.rows[idx]);
        bindListItem(document.querySelector(`#list [data-open="${change.id}"]`));
      }

      async function loadCounts() {
        try {
          const res = await adminApi("/api/admin/inquiries?limit=1");
          renderTabs(res.summary);
          setNewInquiryBadge(res.summary.new);
        } catch {
        }
      }

      function bindChat(i) {
        chat.querySelector("[data-back]").addEventListener("click", closeChat);

        const statusSel = document.getElementById("status-select");
        statusSel.addEventListener("change", async () => {
          const value = statusSel.value;
          statusSel.disabled = true;
          try {
            await adminApi(`/api/admin/inquiries/${i.id}`, { method: "PATCH", body: { status: value } });
            i.status = value;
            statusSel.dataset.value = value;
            refreshRow({ id: i.id, status: value });
            showNotification(`Marked as ${statusLabel(value)}.`, "success");
            loadCounts();
          } catch (error) {
            statusSel.value = i.status;
            showNotification(error.message, "error");
          } finally {
            statusSel.disabled = false;
          }
        });

        chat.querySelector("[data-archive]").addEventListener("click", async () => {
          const ok = await confirmAction(i.is_archived
            ? { title: "Restore this inquiry?", message: "It will move back to the inbox.", confirmText: "Restore" }
            : { title: "Archive this inquiry?", message: "It will move out of the inbox. You can find it under Archived.", confirmText: "Archive" });
          if (!ok) return;
          try {
            await adminApi(`/api/admin/inquiries/${i.id}`, { method: "PATCH", body: { is_archived: !i.is_archived } });
            showNotification(i.is_archived ? "Inquiry restored." : "Inquiry archived.", "success");
            closeChat();
            loadList(1);
          } catch (error) {
            showNotification(error.message, "error");
          }
        });

        chat.querySelector("[data-delete]").addEventListener("click", async () => {
          if (!(await confirmAction({ title: "Delete this inquiry?", message: "This permanently removes it. Archive it instead if you may need it later.", confirmText: "Delete", variant: "danger" }))) return;
          try {
            await adminApi(`/api/admin/inquiries/${i.id}`, { method: "DELETE" });
            showNotification("Inquiry deleted.", "success");
            closeChat();
            loadList(1);
          } catch (error) {
            showNotification(error.message, "error");
          }
        });

        chat.querySelector("[data-resend]")?.addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          if (!(await confirmAction({ title: "Resend the email?", message: "The notification for this inquiry will be emailed to the team again.", confirmText: "Resend" }))) return;
          btn.disabled = true;
          btn.textContent = "Sending…";
          try {
            await adminApi(`/api/admin/inquiries/${i.id}/resend-email`, { method: "POST" });
            showNotification("Notification email sent.", "success");
            refreshRow({ id: i.id, email_status: "sent" });
            openInquiry(i.id);
          } catch (error) {
            showNotification(error.message, "error");
            btn.disabled = false;
            btn.textContent = "Resend";
          }
        });

        const input = document.getElementById("reply-message");
        chat.querySelector("[data-reply]").addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          const message = input.value.trim();
          if (!message) return input.focus();
          btn.disabled = true;
          try {
            const res = await adminApi(`/api/admin/inquiries/${i.id}/reply`, { method: "POST", body: { message } });
            const parts = [res.customer_emailed ? "emailed to the customer" : "customer email not sent"];
            if (res.to_seller) parts.push(res.seller_in_dashboard ? "sent to the seller" : res.seller_emailed ? "emailed to the seller" : "seller email not sent");
            showNotification(`Reply ${parts.join(", ")}.`, res.customer_emailed ? "success" : "warning");
            refreshRow({ id: i.id, status: i.status === "resolved" ? "resolved" : "contacted" });
            loadCounts();
            openInquiry(i.id);
          } catch (error) {
            showNotification(error.message, "error");
            btn.disabled = false;
          }
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) chat.querySelector("[data-reply]").click();
        });
      }

      document.getElementById("tab-select").addEventListener("change", (e) => { state.tab = e.target.value; loadList(1); });
      let searchTimer;
      document.getElementById("search").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { state.q = e.target.value.trim(); loadList(1); }, 300);
      });
      document.getElementById("seller-filter").addEventListener("change", (e) => { state.seller = e.target.value; loadList(1); });

      (async () => {
        placeholder();
        await initAdminPage("inquiries");
        const q = getQueryParams();
        try {
          const sellers = (await adminApi("/api/admin/sellers")).data;
          document.getElementById("seller-filter").innerHTML += sellers.map((s) => `<option value="${s.id}">${escapeHtml(s.business_name || s.name)}</option>`).join("");
        } catch {}
        if (q.seller_id) { state.seller = q.seller_id; document.getElementById("seller-filter").value = q.seller_id; }
        if (q.status) state.tab = q.status;
        if (q.q) { state.q = q.q; document.getElementById("search").value = q.q; }
        renderTabs();
        await loadList(1);
        if (q.id) openInquiry(q.id);
        else if (window.matchMedia("(min-width: 1024px)").matches && state.rows.length) openInquiry(state.rows[0].id);
      })();
    </script>
  </body>
</html>
