<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Checkout - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/livestock.js"></script>
    <script src="/js/cart.js"></script>
  </head>
  <body class="bg-gray-50">
    <nav id="page-topnav" class="bg-white shadow-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <a href="/" class="flex items-center gap-3" aria-label="Frontier Marketplace home">
            <div class="brand-mark-full"><img src="/images/logo-full.jpg" alt="Frontier Farms &amp; Consult" /></div>
            <span class="hidden sm:block font-bold text-gray-900">Frontier Marketplace</span>
          </a>
          <div class="header-auth">
            <a id="login-link" href="/seller/login.html" class="header-login-link">Login</a>
            <a id="seller-link" href="/seller/register.html" class="header-seller-link">Register</a>
          </div>
        </div>
      </div>
    </nav>

    <main id="checkout" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <div class="checkout-loading"><span class="inline-block h-8 w-56 bg-gray-200 rounded animate-pulse"></span></div>
    </main>

    <script>
      // Checkout: the buyer's details and a last look at the order. Placing it
      // reserves the items and takes the buyer to the payment page.
      const root = document.getElementById("checkout");
      let quote = null;
      let ops = [];
      let methods = [];
      const METHOD_NAMES = {
        mobile_money: ["Mobile money", "Airtel Money, MTN MoMo or Zamtel Kwacha"],
        card: ["Visa / Mastercard", "Pay by card on a secure page"],
        bank_transfer: ["Bank transfer", "Pay into Frontier's bank account"],
      };
      const lockSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>`;
      const bankSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18L12 4 3 10Z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>`;
      const OP_NAMES = { airtel: "Airtel Money", mtn: "MTN MoMo", zamtel: "Zamtel Kwacha" };
      const phoneSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></svg>`;

      function summaryLine(item) {
        const lot = item.price_unit === "lot";
        return `<li class="co-line">
          <span class="co-thumb">${item.thumb_path ? `<img src="${escapeHtml(item.thumb_path)}" alt="">` : livestockFallbackMedia("w-6 h-6")}</span>
          <span class="co-info"><b>${escapeHtml(item.title)}</b><small>${lot ? "The whole lot · " : ""}${escapeHtml(cartUnits(item, item.quantity))}</small></span>
          <span class="co-price">${kwacha(item.line_total)}</span>
        </li>`;
      }

      async function load() {
        const lines = readCart();
        if (!lines.length) { window.location.replace("/cart.html"); return; }
        try {
          quote = (await apiRequest("/api/checkout/quote", { method: "POST", body: { items: lines } })).data;
        } catch (error) {
          root.innerHTML = `<div class="alert alert-error text-sm">${escapeHtml(error.message)}</div>`;
          return;
        }
        if (quote.items.some((i) => !i.available) || !quote.items.length) { window.location.replace("/cart.html"); return; }
        quote.items.forEach((i) => { if (i.adjusted) setCartQty(i.id, i.quantity); });
        ops = (quote.payment && quote.payment.operators) || [];
        methods = (quote.payment && quote.payment.methods) || [];
        render();
      }

      function render() {
        root.innerHTML = `
          ${checkoutSteps(1)}
          <h1 class="text-xl sm:text-2xl font-bold text-gray-900 mb-5">Checkout</h1>
          <form id="checkout-form" class="checkout" novalidate>
            <div class="checkout-main">
              <div id="co-alert" class="hidden alert alert-error text-sm" role="alert"></div>
              <section class="checkout-section">
                <h2>Your details</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label for="co-name" class="field-label">Full name</label>
                    <input id="co-name" name="full_name" type="text" class="field-input" autocomplete="name" maxlength="120" required>
                    <p class="field-error hidden" data-error-for="full_name"></p>
                  </div>
                  <div>
                    <label for="co-phone" class="field-label">WhatsApp Number</label>
                    <input id="co-phone" name="phone" type="tel" class="field-input" autocomplete="tel" inputmode="tel" maxlength="25" required placeholder="0977 123 456">
                    <p class="field-error hidden" data-error-for="phone"></p>
                  </div>
                  <div class="sm:col-span-2">
                    <label for="co-email" class="field-label">Email</label>
                    <input id="co-email" name="email" type="email" class="field-input" autocomplete="email" inputmode="email" maxlength="255" required>
                    <p class="field-error hidden" data-error-for="email"></p>
                  </div>
                </div>
              </section>

              <section class="checkout-section">
                <h2>Payment</h2>
                ${methods.length > 1 ? `
                <div class="pm-choices" role="radiogroup" aria-label="How you'd like to pay">
                  ${methods.map((m, n) => `<label class="pm-choice"><input type="radio" name="payment_method" value="${m}" ${n === 0 ? "checked" : ""}>
                    <span class="pm-dot" aria-hidden="true"></span>
                    <span class="pm-text"><b>${METHOD_NAMES[m][0]}</b><small>${METHOD_NAMES[m][1]}</small></span></label>`).join("")}
                </div>
                <p class="field-error hidden" data-error-for="payment_method"></p>` : ""}

                ${methods.includes("mobile_money") ? `
                <div data-method-panel="mobile_money" class="pm-panel">
                  <p class="field-label" id="co-op-label">Your network</p>
                  <div class="operator-grid ${ops.length === 2 ? "co-ops" : ""}" role="radiogroup" aria-labelledby="co-op-label">
                    ${ops.map((v) => `<label class="operator-card op-${v}"><input type="radio" name="mobile_operator" value="${v}"><span class="op-tick" aria-hidden="true"></span><span>${OP_NAMES[v]}</span></label>`).join("")}
                  </div>
                  <p class="field-error hidden" data-error-for="mobile_operator"></p>
                  <label for="co-pay-phone" class="field-label mt-4">Mobile money number</label>
                  <input id="co-pay-phone" name="payment_phone" type="tel" class="field-input" inputmode="tel" autocomplete="tel" maxlength="25" placeholder="0977 123 456">
                  <p class="field-error hidden" data-error-for="payment_phone"></p>
                  <p class="co-pay-note">${phoneSvg}<span>When you tap Pay, a payment request goes straight to this phone. Enter your mobile money PIN on the phone to approve it. We never see your PIN.</span></p>
                </div>` : ""}

                ${methods.includes("card") ? `
                <div data-method-panel="card" class="pm-panel" hidden>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                      <label for="co-address" class="field-label">Address</label>
                      <input id="co-address" name="address" type="text" class="field-input" autocomplete="street-address" maxlength="120" placeholder="e.g. Plot 12, Kabulonga Road">
                      <p class="field-error hidden" data-error-for="address"></p>
                    </div>
                    <div>
                      <label for="co-city" class="field-label">Town / city</label>
                      <input id="co-city" name="city" type="text" class="field-input" autocomplete="address-level2" maxlength="60" placeholder="e.g. Lusaka">
                      <p class="field-error hidden" data-error-for="city"></p>
                    </div>
                  </div>
                  <p class="co-pay-note" data-card-note>${lockSvg}<span>When you tap Pay, you'll enter your card details on Lipila's secure card page, then come back here. Your card details never reach Frontier.</span></p>
                  <div data-card-slot></div>
                </div>` : ""}

                ${methods.includes("bank_transfer") ? `
                <div data-method-panel="bank_transfer" class="pm-panel" hidden>
                  <p class="co-pay-note">${bankSvg}<span>After you place the order we'll show Frontier's bank details, and email them to you. Pay the total using your order number as the reference. Your items stay reserved while we wait for the transfer, and we'll confirm once it arrives.</span></p>
                </div>` : ""}

                ${!methods.length ? `<p class="text-sm text-gray-600">Our team will contact you on WhatsApp to arrange payment.</p>` : ""}
              </section>

              <p class="text-xs text-gray-500">By placing this order you agree to our <a href="/terms.html" class="underline">Terms</a>, <a href="/refund-policy.html" class="underline">Refund</a>, <a href="/return-policy.html" class="underline">Return</a> and <a href="/cancellation-policy.html" class="underline">Cancellation</a> policies.</p>
              <div class="honeypot" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
              <button type="submit" class="btn-checkout btn-lg w-full checkout-submit-mobile" data-submit></button>
            </div>

            <aside class="cart-summary">
              <div class="flex items-center justify-between mb-3">
                <h2 class="!mb-0">Your order</h2>
                <a href="/cart.html" class="text-sm font-semibold text-green-800 hover:underline">Edit cart</a>
              </div>
              <ul class="co-lines">${quote.items.map(summaryLine).join("")}</ul>
              <div class="buy-total"><span>Total</span><strong>${kwacha(quote.total)}</strong></div>
              <button type="submit" class="btn-checkout btn-lg w-full checkout-submit-desktop" data-submit></button>
            </aside>
          </form>`;
        const form = root.querySelector("#checkout-form");
        const submits = root.querySelectorAll("[data-submit]");
        const method = () => (form.elements.payment_method ? form.elements.payment_method.value : methods[0]) || "";
        const labelFor = (m) => ({
          mobile_money: `Pay ${kwacha(quote.total)}`,
          card: `Pay ${kwacha(quote.total)}`,
          bank_transfer: `Place order · ${kwacha(quote.total)}`,
        }[m] || `Place order · ${kwacha(quote.total)}`);
        let label = labelFor(method());
        // Show the fields for the chosen way to pay.
        const showPanel = () => {
          const m = method();
          form.querySelectorAll("[data-method-panel]").forEach((panel) => { panel.hidden = panel.dataset.methodPanel !== m; });
          label = labelFor(m);
          submits.forEach((b) => { if (!b.disabled) b.textContent = label; });
        };
        form.querySelectorAll('input[name="payment_method"]').forEach((r) => r.addEventListener("change", showPanel));
        showPanel();
        // The mobile money number starts as the WhatsApp number.
        const wa = form.elements.phone;
        const pp = form.elements.payment_phone;
        if (pp) {
          form.querySelectorAll('input[name="mobile_operator"]').forEach((r) => r.addEventListener("change", () => {
            form.querySelector('[data-error-for="mobile_operator"]').classList.add("hidden");
          }));
          wa.addEventListener("input", () => { if (!pp.dataset.edited) pp.value = wa.value; });
          pp.addEventListener("input", () => { pp.dataset.edited = "1"; });
        }
        submits.forEach((b) => { b.textContent = label; });
        form.addEventListener("submit", (e) => { e.preventDefault(); place(form, submits, label, method()); });
      }

      function showErrors(form, errors) {
        form.querySelectorAll("[data-error-for]").forEach((el) => {
          const msg = errors[el.dataset.errorFor];
          const input = form.elements[el.dataset.errorFor];
          el.textContent = msg || "";
          el.classList.toggle("hidden", !msg);
          if (input && input.classList) { input.classList.toggle("has-error", Boolean(msg)); input.setAttribute("aria-invalid", msg ? "true" : "false"); }
        });
        const first = Object.keys(errors).find((k) => form.elements[k]);
        if (first) {
          const el = form.elements[first];
          (el.focus ? el : el[0]).focus();
        }
      }

      function check(v) {
        const e = {};
        if (v.full_name.length < 2) e.full_name = "Please enter your full name.";
        if (v.phone.replace(/\D/g, "").length < 9) e.phone = "Please enter a valid WhatsApp number, e.g. 0977 123 456.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) e.email = "Please enter a valid email address.";
        if (v.payment_method === "mobile_money") {
          if (!v.mobile_operator) e.mobile_operator = "Please choose your mobile money network.";
          if (v.payment_phone.replace(/\D/g, "").length < 9) e.payment_phone = "Please enter your mobile money number, e.g. 0977 123 456.";
        }
        if (v.payment_method === "card") {
          if (v.address.length < 3) e.address = "Please enter your address.";
          if (v.city.length < 2) e.city = "Please enter your town or city.";
        }
        return e;
      }

      async function place(form, submits, label, chosen) {
        const alertBox = root.querySelector("#co-alert");
        alertBox.classList.add("hidden");
        const values = {
          full_name: form.elements.full_name.value.trim(),
          phone: form.elements.phone.value.trim(),
          email: form.elements.email.value.trim(),
          payment_method: chosen || "",
          mobile_operator: chosen === "mobile_money" ? (form.elements.mobile_operator.value || "") : "",
          payment_phone: chosen === "mobile_money" ? form.elements.payment_phone.value.trim() : "",
          address: chosen === "card" ? form.elements.address.value.trim() : "",
          city: chosen === "card" ? form.elements.city.value.trim() : "",
        };
        const errors = check(values);
        showErrors(form, errors);
        if (Object.keys(errors).length) return;
        const busy = { mobile_money: "Sending the payment request…", card: "Opening the secure card page…" }[chosen] || "Placing your order…";
        submits.forEach((b) => { b.disabled = true; b.innerHTML = `<span class="btn-spinner"></span> ${busy}`; });
        try {
          const res = await apiRequest("/api/checkout", {
            method: "POST",
            body: { ...values, items: readCart(), website: form.elements.website.value },
          });
          clearCart();
          const d = res.data;
          if (chosen === "card" && d.card_url && d.card_embed) return showCardForm(form, submits, d);
          window.location.href = d.pay_url;
        } catch (error) {
          if (error.errors) showErrors(form, error.errors);
          alertBox.innerHTML = escapeHtml(error.message || "Your order could not be placed. Please try again.")
            + (error.status === 409 ? ` <a href="/cart.html" class="underline font-semibold">Review your cart</a>` : "");
          alertBox.classList.remove("hidden");
          alertBox.scrollIntoView({ behavior: "smooth", block: "center" });
          submits.forEach((b) => { b.disabled = false; b.textContent = label; });
        }
      }

      // Order placed: Lipila's card form opens under the address and town. The
      // details above are locked, since the order now exists.
      function showCardForm(form, submits, d) {
        form.querySelectorAll("input, select, textarea").forEach((el) => { el.disabled = true; });
        submits.forEach((b) => { b.style.display = "none"; });
        const note = form.querySelector("[data-card-note]");
        if (note) note.remove();
        const slot = form.querySelector("[data-card-slot]");
        slot.innerHTML = `<p class="co-pay-note">${lockSvg}<span>Order <b>${escapeHtml(d.reference)}</b>: your items are held for you for 10 minutes. Enter your card details below to pay.</span></p>${cardFrame(d.card_url, d.total)}`;
        slot.scrollIntoView({ behavior: "smooth", block: "start" });
        watchCardPayment(d.id, d.token, () => { window.location.href = d.page_url; });
      }

      document.addEventListener("DOMContentLoaded", load);
    </script>

    <footer id="site-footer" class="mt-10"></footer>
  </body>
</html>
