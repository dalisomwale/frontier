<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Checkout - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/site-nav.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/livestock.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/buyer.js"></script>
    <link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css" />
    <script src="/vendor/leaflet-1.9.4/leaflet.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/zambia-districts.js"></script>
    <script src="/js/transport-ui.js"></script>
  </head>
  <body class="bg-gray-50">
    <nav id="page-topnav" class="site-topnav sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <a href="/" class="flex items-center gap-3" aria-label="Frontier Marketplace home">
            <div class="brand-mark-full"><img src="/images/logo-full.jpg" alt="Frontier Farms &amp; Consult" /></div>
            <span class="hidden sm:block font-bold site-topnav-name">Frontier Marketplace</span>
          </a>
          <div class="site-nav ml-4 mr-auto" data-site-nav aria-label="Categories"></div>
          <div class="header-auth">
            <a id="login-link" href="/account/login" class="header-login-link">Sign In</a>
            <a id="seller-link" href="/account/register" class="header-seller-link">Create Account</a>
          </div>
        </div>
      </div>
    </nav>

    <main id="checkout" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <div class="checkout-loading"><span class="inline-block h-8 w-56 bg-gray-200 rounded animate-pulse"></span></div>
    </main>

    <script>
      // Checkout: the buyer's details and a last look at the order. Placing it
      // reserves the items and takes the buyer to the payment page.
      const root = document.getElementById("checkout");
      let quote = null;
      let ops = [];
      let methods = [];
      const lockSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>`;
      const OP_NAMES = { airtel: "Airtel Money", mtn: "MTN MoMo" };
      // The ways to pay, side by side: each mobile money network, then card.
      // One radio group (mobile_operator); "card" means Visa / Mastercard.
      const payTiles = () => [
        ...(methods.includes("mobile_money") ? ops.map((v) => [v, OP_NAMES[v]]) : []),
        ...(methods.includes("card") ? [["card", "Visa / Mastercard"]] : []),
      ];

      function summaryLine(item) {
        const lot = item.price_unit === "lot";
        return `<li class="co-line">
          <span class="co-thumb">${item.thumb_path ? `<img src="${escapeHtml(item.thumb_path)}" alt="">` : livestockFallbackMedia("w-6 h-6")}</span>
          <span class="co-info"><b>${escapeHtml(item.title)}</b><small>${lot ? "The whole lot · " : ""}${escapeHtml(cartUnits(item, item.quantity))}</small></span>
          <span class="co-price">${kwacha(item.line_total)}</span>
        </li>`;
      }

      let buyer = null;
      const toLogin = () => window.location.replace(`/account/login?next=${encodeURIComponent("/checkout")}`);

      async function load() {
        const lines = readCart();
        if (!lines.length) { window.location.replace("/cart"); return; }
        // A buyer account is needed to check out; the cart is kept meanwhile.
        try {
          buyer = (await buyerApi("/api/buyer/auth/me")).data;
          setBuyerHint(true);
        } catch {
          toLogin();
          return;
        }
        try {
          quote = (await apiRequest("/api/checkout/quote", { method: "POST", body: { items: lines } })).data;
        } catch (error) {
          root.innerHTML = `<div class="alert alert-error text-sm">${escapeHtml(error.message)}</div>`;
          return;
        }
        if (quote.items.some((i) => !i.available) || !quote.items.length) { window.location.replace("/cart"); return; }
        quote.items.forEach((i) => { if (i.adjusted) setCartQty(i.id, i.quantity); });
        ops = (quote.payment && quote.payment.operators) || [];
        methods = (quote.payment && quote.payment.methods) || [];
        render();
      }

      // Include transport: the delivery details, the road-distance quote, and
      // whether the quote still matches what's in the form.
      // size: the vehicle size the buyer picked (or the smallest the quote offered).
      const tstate = { quote: null, sig: "", busy: false, picker: null, timer: null, size: null };
      let transportOn = false;

      function render() {
        transportOn = Boolean(quote.transport && quote.transport.offered);
        root.innerHTML = `
          ${pageHeroHtml({ title: "Secure", accent: "Checkout", bleed: true })}
          ${checkoutSteps(1)}
          <form id="checkout-form" class="checkout" novalidate>
            <div class="checkout-main">
              <div id="co-alert" class="hidden alert alert-error text-sm" role="alert"></div>
              <div class="co-card">
              <section class="checkout-section">
                <div class="co-who">
                  <span class="acc-av">${escapeHtml(buyerInitials(buyer.full_name))}</span>
                  <div class="min-w-0 flex-1">
                    <p class="font-bold text-gray-900 truncate">${escapeHtml(buyer.full_name)}</p>
                    <p class="text-sm text-gray-600 truncate" data-who-phone>${escapeHtml(buyer.phone || buyer.email)}</p>
                  </div>
                  <button type="button" class="acc-link text-sm" data-change-phone>Change</button>
                </div>
                <input type="hidden" name="full_name" value="${escapeHtml(buyer.full_name)}">
                <input type="hidden" name="email" value="${escapeHtml(buyer.email)}">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4 co-fields">
                  <div data-phone-box ${buyer.phone ? "hidden" : ""}>
                    <label for="co-phone" class="field-label">Phone Number</label>
                    <input id="co-phone" name="phone" type="tel" class="field-input" autocomplete="tel" inputmode="tel" maxlength="25" required>
                    <p class="field-error hidden" data-error-for="phone"></p>
                  </div>
                </div>
              </section>

              <section class="checkout-section co-delivery">
                <h2>Mode Of Collection</h2>
                <div class="co-opts" role="radiogroup" aria-label="Mode of collection">
                  <label class="co-opt"><input type="radio" name="delivery_option" value="collect" checked><span class="co-opt-dot" aria-hidden="true"></span>
                    <span class="co-opt-body"><span class="co-opt-art">${trCollectArt()}</span><span class="co-opt-name">Self-Collection</span></span></label>
                  <label class="co-opt${transportOn ? "" : " is-off"}"${transportOn ? "" : ` title="${escapeHtml(quote.transport.reason || "Not available right now")}"`}><input type="radio" name="delivery_option" value="transport" ${transportOn ? "" : "disabled"}><span class="co-opt-dot" aria-hidden="true"></span>
                    <span class="co-opt-body"><span class="co-opt-art">${trVehicleArt("small")}</span><span class="co-opt-name">Book Delivery${transportOn ? "" : `<small class="co-off">${escapeHtml(quote.transport.reason || "Not available right now")}</small>`}</span></span></label>
                </div>
                <p class="field-error hidden" data-error-for="delivery_option"></p>
                <div class="co-delivery-panel" data-transport-panel hidden>
                  <div class="grid grid-cols-2 gap-3 sm:gap-4">
                    <div>
                      <label for="co-dprov" class="field-label">Province</label>
                      <select id="co-dprov" name="dest_province" class="field-input">
                        <option value="">Choose…</option>${ZAMBIA_PROVINCES.map((p) => `<option>${p}</option>`).join("")}
                      </select>
                      <p class="field-error hidden" data-error-for="dest_province"></p>
                    </div>
                    <div>
                      <label for="co-ddist" class="field-label">District</label>
                      <input id="co-ddist" name="dest_district" class="field-input" maxlength="80">
                      <p class="field-error hidden" data-error-for="dest_district"></p>
                    </div>
                    <div class="col-span-2">
                      <label for="co-daddr" class="field-label">Address</label>
                      <input id="co-daddr" name="dest_address" class="field-input" maxlength="255">
                      <p class="field-error hidden" data-error-for="dest_address"></p>
                    </div>
                    <div>
                      <label for="co-cname" class="field-label">Receiver</label>
                      <input id="co-cname" name="contact_name" class="field-input" maxlength="120" autocomplete="name">
                      <p class="field-error hidden" data-error-for="contact_name"></p>
                    </div>
                    <div>
                      <label for="co-cphone" class="field-label">Receiver's Phone</label>
                      <input id="co-cphone" name="contact_phone" type="tel" class="field-input" maxlength="25" inputmode="tel">
                      <p class="field-error hidden" data-error-for="contact_phone"></p>
                    </div>
                  </div>
                  <div>
                    <div data-dest-map></div>
                    <p class="field-error hidden" data-error-for="dest_point"></p>
                  </div>
                  <div data-journeys></div>
                </div>
              </section>

              <section class="checkout-section">
                <h2>Choose Payment Method</h2>
                ${methods.length ? `
                <div class="co-opts co-pay-opts" data-logo-group role="radiogroup" aria-label="Payment method">
                  ${payTiles().map(([key, name]) => `<label class="co-opt op-${key}" title="${escapeHtml(name)}"><input type="radio" name="mobile_operator" value="${key}"><span class="co-opt-dot" aria-hidden="true"></span>
                    <span class="co-opt-body"><span class="op-mark">${(key === "card" ? ["visa", "mastercard"] : [key]).map((l) => payLogo(l, "", "op-logo")).join("")}</span><span class="co-opt-name">${escapeHtml(key === "card" ? "Visa / Mastercard" : name)}</span></span></label>`).join("")}
                </div>
                <p class="field-error hidden" data-error-for="mobile_operator"></p>` : `<p class="text-sm text-gray-600">Our team will contact you to arrange payment.</p>`}

                ${methods.includes("mobile_money") ? `
                <div data-method-panel="mobile_money" class="pm-panel" hidden>
                  <label for="co-pay-phone" class="field-label">Mobile Money Number</label>
                  <input id="co-pay-phone" name="payment_phone" type="tel" class="field-input" inputmode="tel" autocomplete="tel" maxlength="25">
                  <p class="field-error hidden" data-error-for="payment_phone"></p>
                </div>` : ""}

                ${methods.includes("card") ? `
                <div data-method-panel="card" class="pm-panel" hidden>
                  <div data-card-slot></div>
                </div>` : ""}
              </section>
              </div>

              <div class="co-terms">
                <label class="co-terms-box">
                  <input type="checkbox" name="accept_terms" value="1">
                  <span>I accept the <a href="/terms" target="_blank" rel="noopener">Terms</a></span>
                </label>
                <p class="field-error hidden" data-error-for="accept_terms"></p>
              </div>
              <div class="honeypot" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
              <button type="submit" class="btn-checkout btn-lg w-full checkout-submit-mobile" data-submit></button>
            </div>

            <aside class="cart-summary">
              <div class="flex items-center justify-between mb-3">
                <h2 class="!mb-0">Your Order</h2>
                <a href="/cart" class="text-sm font-semibold text-green-800 hover:underline">Edit Cart</a>
              </div>
              <ul class="co-lines">${quote.items.map(summaryLine).join("")}</ul>
              <div class="co-breakdown" data-breakdown hidden></div>
              <div class="buy-total" data-total-line><span>Total</span><strong>${kwacha(quote.total)}</strong></div>
              <button type="submit" class="btn-checkout btn-lg w-full checkout-submit-desktop" data-submit></button>
            </aside>
          </form>`;
        fitPageHero();
        const form = root.querySelector("#checkout-form");
        const submits = root.querySelectorAll("[data-submit]");
        const picked = () => (form.querySelector('input[name="mobile_operator"]:checked') || {}).value || "";
        const method = () => (picked() === "card" ? "card" : methods.includes("mobile_money") ? "mobile_money" : methods[0] || "");
        const delivery = () => (form.elements.delivery_option.value || "collect");
        const payable = () => (delivery() === "transport" && tstate.quote && tstate.quote.available ? tstate.quote.grand_total : quote.total);
        const labelFor = (m) => {
          if (delivery() === "transport" && !(tstate.quote && tstate.quote.available && tstate.sig === destSig(form))) return "Add The Delivery Address";
          return {
            mobile_money: `Pay ${kwacha(payable())}`,
            card: "Enter card details",
          }[m] || `Place order · ${kwacha(payable())}`;
        };
        let label = labelFor(method());
        const paintSubmit = () => {
          label = labelFor(method());
          const blocked = delivery() === "transport" && !(tstate.quote && tstate.quote.available && tstate.sig === destSig(form));
          submits.forEach((b) => { if (!b.dataset.busy) { b.textContent = label; b.disabled = blocked; } });
        };
        // Delivery: self-collection, or transport with the delivery details.
        const panel = form.querySelector("[data-transport-panel]");
        const paintTotals = () => {
          const box = form.querySelector("[data-breakdown]");
          const totalLine = form.querySelector("[data-total-line]");
          const tq = tstate.quote;
          if (delivery() === "transport" && tq && tq.available) {
            box.innerHTML = `<div><span>Products</span><span>${kwacha(tq.product_total)}</span></div>
              <div><span>Transport</span><span>${kwacha(tq.transport_total)}</span></div>
              <div class="co-grand"><span>Total to pay</span><span>${kwacha(tq.grand_total)}</span></div>`;
            box.hidden = false;
            totalLine.hidden = true;
          } else {
            box.hidden = true;
            totalLine.hidden = false;
          }
          paintSubmit();
        };
        const paintJourneys = (msg) => {
          const box = form.querySelector("[data-journeys]");
          const tq = tstate.quote;
          if (msg) { box.innerHTML = `<p class="co-quote-state">${msg}</p>`; return; }
          if (!tq) { box.innerHTML = ""; return; }
          box.innerHTML = `
            ${tq.available && (tq.size_options || []).length ? `
              <p class="field-label">Vehicle Size</p>
              <div class="co-sizes" role="radiogroup" aria-label="Vehicle size">${tq.size_options.filter((o) => o.available).map((o) => `
                <label class="co-size${o.available ? "" : " is-off"}" title="${escapeHtml(o.hint)}">
                  <input type="radio" name="vehicle_size" value="${o.key}" ${o.key === tq.vehicle_size ? "checked" : ""} ${o.available ? "" : "disabled"}>
                  <span>${trVehicleArt(o.key)}<b>${escapeHtml(o.label)}</b><em>${o.available ? kwacha(o.fee_total) : "Unavailable"}</em></span>
                </label>`).join("")}</div>` : ""}
            ${tq.journeys.length > 1 || tq.journeys.some((j) => j.problem) ? `<ul class="co-journeys">${tq.journeys.map((j) => `
              <li class="co-journey${j.problem ? " is-problem" : ""}">
                <span><b>${escapeHtml(j.seller)}</b>${j.distance_km !== null ? `<small>${trKm(j.distance_km)}</small>` : ""}${j.problem ? `<small>${escapeHtml(j.problem)}</small>` : ""}</span>
                <b>${j.fee !== null ? kwacha(j.fee) : "-"}</b>
              </li>`).join("")}</ul>` : ""}
            ${!tq.available ? `<p class="tr-warn-box mt-3">${escapeHtml(tq.reason || "Transport isn't available for this order.")} Choose Self-Collection instead.</p>` : ""}`;
        };
        const requote = () => {
          clearTimeout(tstate.timer);
          if (delivery() !== "transport") return paintTotals();
          const v = destValues(form, tstate);
          const ready = v.dest_province && v.dest_district.length >= 2 && v.dest_address.length >= 3 && v.dest_lat;
          if (!ready) { tstate.quote = null; tstate.sig = ""; paintJourneys(); return paintTotals(); }
          const sig = destSig(form);
          if (sig === tstate.sig && tstate.quote) return paintTotals();
          paintJourneys(`<span class="btn-spinner"></span> Getting the price…`);
          paintSubmit();
          tstate.timer = setTimeout(async () => {
            try {
              const res = await apiRequest("/api/checkout/transport-quote", { method: "POST", body: { items: readCart(), ...v } });
              if (sig !== destSig(form)) return;
              tstate.quote = res.data;
              // The size used for the price: the buyer's pick, or the smallest one free.
              tstate.size = res.data.vehicle_size || null;
              tstate.sig = destSig(form);
              paintJourneys();
              form.querySelectorAll('input[name="vehicle_size"]').forEach((r) => r.addEventListener("change", () => {
                tstate.size = r.value;
                requote();
              }));
            } catch (error) {
              tstate.quote = null;
              tstate.sig = "";
              if (error.errors) showErrors(form, error.errors);
              paintJourneys(escapeHtml(error.message));
            }
            paintTotals();
          }, 500);
        };
        const showDelivery = async () => {
          const on = delivery() === "transport";
          panel.hidden = !on;
          if (on && !tstate.picker) {
            trPlaceFields({ province: form.elements.dest_province, district: form.elements.dest_district, address: form.elements.dest_address, picker: () => tstate.picker });
            form.elements.contact_name.value = buyer.full_name || "";
            form.elements.contact_phone.value = buyer.phone || "";
            paintJourneys();
            tstate.picker = await trPointPicker(form.querySelector("[data-dest-map]"), {
              kind: "dest", label: "Delivery point",
              hint: "Drag the pin to the exact spot.",
              onChange: () => { form.querySelector('[data-error-for="dest_point"]').classList.add("hidden"); requote(); },
            });
          }
          if (on && tstate.picker && tstate.picker.map) setTimeout(() => tstate.picker.map.invalidateSize(), 50);
          requote();
        };
        tstate.requote = requote;
        // Enter (a phone keyboard's Go key) in a field moves to the next one:
        // only the Pay button places the order and sends the payment prompt.
        form.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" || e.defaultPrevented) return;
          const el = e.target;
          if (el.tagName !== "INPUT" || ["checkbox", "radio", "submit", "button"].includes(el.type)) return;
          e.preventDefault();
          const fields = [...form.querySelectorAll("input, select, textarea")].filter((f) => !f.disabled && f.type !== "hidden" && f.offsetParent !== null && !f.closest(".honeypot"));
          const next = fields[fields.indexOf(el) + 1];
          if (next) next.focus();
          else el.blur();
        });
        form.querySelectorAll('input[name="delivery_option"]').forEach((r) => r.addEventListener("change", showDelivery));
        ["dest_province", "dest_district", "dest_address"].forEach((n) => form.elements[n].addEventListener(n === "dest_province" ? "change" : "input", requote));
        // Show the fields for the chosen way to pay.
        // The number shows once a network is picked; card shows nothing until the order is placed.
        const showPanel = () => {
          const m = picked() ? method() : "";
          form.querySelectorAll("[data-method-panel]").forEach((panel) => { panel.hidden = panel.dataset.methodPanel !== m; });
          paintSubmit();
        };
        form.querySelectorAll('input[name="mobile_operator"]').forEach((r) => r.addEventListener("change", showPanel));
        showPanel();
        showPayLogos(form);
        form.elements.accept_terms.addEventListener("change", () => {
          if (form.elements.accept_terms.checked) form.querySelector('[data-error-for="accept_terms"]').classList.add("hidden");
        });
        if (form.elements.payment_phone) {
          linkNetworkAndNumber(form, (msg) => {
            const el = form.querySelector('[data-error-for="payment_phone"]');
            el.textContent = msg;
            el.classList.toggle("hidden", !msg);
          });
        }
        // The mobile money number starts as the phone number; the buyer can change it.
        const ph = form.elements.phone;
        const pp = form.elements.payment_phone;
        ph.value = buyer.phone || "";
        if (pp) {
          pp.value = ph.value;
          pp.dispatchEvent(new Event("input"));
          delete pp.dataset.edited;
        }
        if (pp) {
          form.querySelectorAll('input[name="mobile_operator"]').forEach((r) => r.addEventListener("change", () => {
            form.querySelector('[data-error-for="mobile_operator"]').classList.add("hidden");
          }));
          ph.addEventListener("input", () => {
            if (pp.dataset.edited) return;
            pp.value = ph.value;
            pp.dispatchEvent(new Event("input"));
            delete pp.dataset.edited;
          });
          pp.addEventListener("input", () => { pp.dataset.edited = "1"; });
        }
        // The phone from the account; "Change" opens the field.
        const phoneBox = form.querySelector("[data-phone-box]");
        form.querySelector("[data-change-phone]").addEventListener("click", () => { phoneBox.hidden = false; ph.focus(); });
        ph.addEventListener("input", () => { form.querySelector("[data-who-phone]").textContent = ph.value || buyer.email; });
        // The terms tick sits right above whichever Pay button is showing.
        const terms = form.querySelector(".co-terms");
        const wide = window.matchMedia("(min-width: 1024px)");
        const placeTerms = () => form.querySelector(wide.matches ? ".checkout-submit-desktop" : ".checkout-submit-mobile").before(terms);
        placeTerms();
        wide.addEventListener("change", placeTerms);
        paintTotals();
        form.addEventListener("submit", (e) => { e.preventDefault(); place(form, submits, labelFor(method()), method(), delivery()); });
      }

      function destValues(form, st) {
        const p = st && st.picker ? st.picker.get() : null;
        return {
          dest_province: form.elements.dest_province.value,
          dest_district: form.elements.dest_district.value.trim(),
          dest_address: form.elements.dest_address.value.trim(),
          contact_name: form.elements.contact_name.value.trim(),
          contact_phone: form.elements.contact_phone.value.trim(),
          dest_lat: p ? p.lat : "",
          dest_lng: p ? p.lng : "",
          vehicle_size: st && st.size ? st.size : "",
        };
      }
      // What the transport quote depends on.
      function destSig(form) {
        const v = destValues(form, tstate);
        return [v.dest_province, v.dest_district, v.dest_address, v.dest_lat, v.dest_lng, v.vehicle_size].join("|");
      }

      function showErrors(form, errors) {
        form.querySelectorAll("[data-error-for]").forEach((el) => {
          const msg = errors[el.dataset.errorFor];
          const input = form.elements[el.dataset.errorFor];
          el.textContent = msg || "";
          el.classList.toggle("hidden", !msg);
          if (input && input.classList) { input.classList.toggle("has-error", Boolean(msg)); input.setAttribute("aria-invalid", msg ? "true" : "false"); }
        });
        if (errors.phone) { const box = form.querySelector("[data-phone-box]"); if (box) box.hidden = false; }
        const first = Object.keys(errors).find((k) => form.elements[k]);
        if (first) {
          const el = form.elements[first];
          (el.focus ? el : el[0]).focus();
        }
      }

      function check(v) {
        const e = {};
        if (v.full_name.length < 2) e.full_name = "Please enter your full name.";
        if (v.phone.replace(/\D/g, "").length < 9) e.phone = "Please enter your phone number, e.g. 0977 123 456.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) e.email = "Please enter a valid email address.";
        if (!v.accept_terms) e.accept_terms = "Please accept the Terms.";
        if (v.payment_method === "mobile_money") {
          if (!v.mobile_operator) e.mobile_operator = "Please choose how you'll pay.";
          const numberProblem = mmCheck(v.payment_phone, v.mobile_operator);
          if (numberProblem) e.payment_phone = numberProblem;
        }
        return e;
      }

      async function place(form, submits, label, chosen, deliveryOption = "collect") {
        const alertBox = root.querySelector("#co-alert");
        alertBox.classList.add("hidden");
        const values = {
          full_name: form.elements.full_name.value.trim(),
          phone: form.elements.phone.value.trim(),
          email: form.elements.email.value.trim(),
          payment_method: chosen || "",
          mobile_operator: chosen === "mobile_money" ? (form.elements.mobile_operator.value || "") : "",
          payment_phone: chosen === "mobile_money" ? form.elements.payment_phone.value.trim() : "",
          accept_terms: form.elements.accept_terms.checked,
        };
        Object.assign(values, { delivery_option: deliveryOption }, deliveryOption === "transport" ? destValues(form, tstate) : {});
        const errors = check(values);
        if (deliveryOption === "transport") {
          if (!values.dest_province) errors.dest_province = "Please choose the province.";
          if (values.dest_district.length < 2) errors.dest_district = "Please enter the district.";
          if (values.dest_address.length < 3) errors.dest_address = "Please enter the delivery address or directions.";
          if (values.contact_name.length < 2) errors.contact_name = "Please enter who is receiving it.";
          if (values.contact_phone.replace(/\D/g, "").length < 9) errors.contact_phone = "Please enter their phone number.";
          if (!values.dest_lat) errors.dest_point = "Please mark the delivery point on the map.";
          if (!errors.dest_point && !(tstate.quote && tstate.quote.available)) errors.dest_point = "Transport isn't available for this delivery point. Choose self-collection, or try another point.";
        }
        showErrors(form, errors);
        if (Object.keys(errors).length) return;
        const busy = { mobile_money: "Sending the payment request…", card: "Opening the secure card page…" }[chosen] || "Placing your order…";
        submits.forEach((b) => { b.disabled = true; b.dataset.busy = "1"; b.innerHTML = `<span class="btn-spinner"></span> ${busy}`; });
        try {
          const res = await apiRequest("/api/checkout", {
            method: "POST",
            body: { ...values, items: readCart(), website: form.elements.website.value },
          });
          clearCart();
          const d = res.data;
          if (chosen === "card" && d.card_url && d.card_embed) return showCardForm(form, submits, d);
          window.location.href = d.pay_url;
        } catch (error) {
          if (error.status === 401) return toLogin();
          if (error.errors) showErrors(form, error.errors);
          alertBox.innerHTML = escapeHtml(error.message || "Your order could not be placed. Please try again.")
            + (error.status === 409 ? ` <a href="/cart" class="underline font-semibold">Review your cart</a>` : "");
          alertBox.classList.remove("hidden");
          alertBox.scrollIntoView({ behavior: "smooth", block: "center" });
          // Transport changed meanwhile (prices, providers): ask for a new quote.
          if (error.errors && Object.keys(error.errors).some((k) => k.startsWith("dest_") || k.startsWith("contact_"))) { tstate.quote = null; tstate.sig = ""; }
          if (error.status === 409 && deliveryOption === "transport") { tstate.quote = null; tstate.sig = ""; if (tstate.requote) tstate.requote(); }
          submits.forEach((b) => { delete b.dataset.busy; b.disabled = false; b.textContent = label; });
        }
      }

      // Order placed: Lipila's card form opens under the ways to pay. The
      // details above are locked, since the order now exists.
      function showCardForm(form, submits, d) {
        form.querySelectorAll("input, select, textarea").forEach((el) => { el.disabled = true; });
        submits.forEach((b) => { b.style.display = "none"; });
        const note = form.querySelector("[data-card-note]");
        if (note) note.remove();
        const slot = form.querySelector("[data-card-slot]");
        slot.innerHTML = `<p class="co-pay-note">${lockSvg}<span>Order <b>${escapeHtml(d.reference)}</b>: your items are held for you for 10 minutes. Enter your card details below to pay.</span></p>${cardFrame(d.card_url, d.total)}`;
        slot.scrollIntoView({ behavior: "smooth", block: "start" });
        watchCardPayment(d.id, d.token, () => { window.location.href = d.page_url; });
      }


      document.addEventListener("DOMContentLoaded", load);
    </script>

    <footer id="site-footer" class="mt-10"></footer>
  </body>
</html>
