<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Frontier Marketplace</title>
    <link rel="icon" href="images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Needed only for the embedded-tab detection so this page's own
         header collapses correctly when it's reached inside another page's
         tab-frame iframe (e.g. an unauthenticated Chat/Account tap). -->
    <script src="/js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Navigation -->
    <nav id="page-topnav" class="bg-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <div class="brand-mark-full">
              <img
                src="images/logo-full.jpg"
                alt="Frontier Farms &amp; Consult"
              />
            </div>
          </div>
          <a href="/" class="text-gray-600 hover:text-gray-900 font-medium"
            >Back to Home</a
          >
        </div>
      </div>
    </nav>

    <!-- Register Section -->
    <div class="min-h-[calc(100vh-64px)] flex">
      <!-- Photo panel (hidden on small screens) -->
      <div
        class="hidden lg:flex lg:w-2/5 hero-photo items-center justify-center p-12 flex-shrink-0"
        style="
          background-image: url(&quot;images/livestock/hero-pasture.jpg&quot;);
        "
      >
        <div class="max-w-sm text-white text-center">
          <div
            class="w-24 h-24 mx-auto mb-6 rounded-2xl bg-white shadow-lg p-2"
          >
            <img
              src="images/logo-full.jpg"
              alt="Frontier Farms &amp; Consult"
              class="w-full h-full object-contain rounded-xl"
            />
          </div>
          <h2 class="text-2xl font-bold mb-3">Join the marketplace</h2>
          <p class="text-blue-100">
            Create an account to browse cattle, goats, sheep, pigs and poultry,
            list your own animals, and connect directly with trusted buyers and
            sellers.
          </p>
        </div>
      </div>

      <div class="flex-1 py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl mx-auto">
          <div class="bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">
              Create Your Account
            </h2>

            <form id="register-form" class="space-y-4">
              <!-- Name -->
              <div>
                <label
                  for="name"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Full Name</label
                >
                <input
                  type="text"
                  id="name"
                  name="name"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="Your full name"
                />
                <div
                  id="name-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <!-- Email -->
              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Email Address</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="your@email.com"
                />
                <div
                  id="email-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <!-- Phone -->
              <div>
                <label
                  for="phone"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Phone Number</label
                >
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="+260 XXX XXX XXX"
                />
              </div>

              <!-- Location -->
              <div>
                <label
                  for="location"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Location</label
                >
                <input
                  type="text"
                  id="location"
                  name="location"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="e.g., Lusaka, Kitwe"
                />
                <div
                  id="location-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <!-- Role -->
              <div>
                <label
                  for="role"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >I am a</label
                >
                <select
                  id="role"
                  name="role"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
                  <option value="">Select your role</option>
                  <option value="member">Buyer / Seller</option>
                  <option value="service_provider">Service Provider</option>
                </select>
                <div
                  id="role-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <!-- Password -->
              <div>
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Password</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="••••••••"
                />
                <p class="text-gray-500 text-sm mt-1">At least 8 characters</p>
                <div
                  id="password-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <!-- Confirm Password -->
              <div>
                <label
                  for="confirmPassword"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Confirm Password</label
                >
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="••••••••"
                />
                <div
                  id="confirmPassword-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <!-- Terms acceptance: required by the backend (register.js
                   checks accepted_terms) so the checkbox must be ticked to
                   create an account. Links open in a new tab so the user
                   doesn't lose the form they've just filled in. -->
              <div>
                <label class="flex items-start gap-2 text-sm text-gray-700">
                  <input
                    type="checkbox"
                    id="accept-terms"
                    name="accept-terms"
                    required
                    class="mt-1"
                  />
                  <span>
                    I have read and agree to the
                    <a
                      href="terms.html"
                      target="_blank"
                      class="text-blue-600 hover:underline font-medium"
                      >Terms of Service</a
                    >
                    and
                    <a
                      href="privacy.html"
                      target="_blank"
                      class="text-blue-600 hover:underline font-medium"
                      >Privacy Policy</a
                    >.
                  </span>
                </label>
                <div
                  id="accept-terms-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <!-- Submit Button -->
              <button
                type="submit"
                class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium transition"
              >
                Create Account
              </button>
            </form>

            <!-- Sign In Link -->
            <div class="mt-6 text-center">
              <p class="text-gray-600">
                Already have an account?
                <a
                  href="login.html"
                  class="text-blue-600 hover:text-blue-700 font-semibold"
                  >Sign in here</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        redirectIfAuthenticated();

        const form = document.getElementById("register-form");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const phone = document.getElementById("phone").value.trim();
          const location = document.getElementById("location").value.trim();
          const role = document.getElementById("role").value;
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const acceptedTerms = document.getElementById("accept-terms").checked;

          // Clear previous errors
          document.querySelectorAll('[id$="-error"]').forEach((el) => {
            el.classList.add("hidden");
          });

          // Validation
          let hasError = false;

          if (!validateField("name", name)) {
            document.getElementById("name-error").textContent =
              "Name must be at least 2 characters";
            document.getElementById("name-error").classList.remove("hidden");
            hasError = true;
          }

          if (!validateEmail(email)) {
            document.getElementById("email-error").textContent =
              "Please enter a valid email";
            document.getElementById("email-error").classList.remove("hidden");
            hasError = true;
          }

          if (!location) {
            document.getElementById("location-error").textContent =
              "Location is required";
            document
              .getElementById("location-error")
              .classList.remove("hidden");
            hasError = true;
          }

          if (!role) {
            document.getElementById("role-error").textContent =
              "Please select a role";
            document.getElementById("role-error").classList.remove("hidden");
            hasError = true;
          }

          if (password.length < 8) {
            document.getElementById("password-error").textContent =
              "Password must be at least 8 characters";
            document
              .getElementById("password-error")
              .classList.remove("hidden");
            hasError = true;
          }

          if (password !== confirmPassword) {
            document.getElementById("confirmPassword-error").textContent =
              "Passwords do not match";
            document
              .getElementById("confirmPassword-error")
              .classList.remove("hidden");
            hasError = true;
          }

          if (!acceptedTerms) {
            document.getElementById("accept-terms-error").textContent =
              "You must accept the Terms of Service and Privacy Policy";
            document
              .getElementById("accept-terms-error")
              .classList.remove("hidden");
            hasError = true;
          }

          if (hasError) {
            return;
          }

          // Show loading
          const submitBtn = form.querySelector('button[type="submit"]');
          const originalText = submitBtn.textContent;
          submitBtn.disabled = true;
          submitBtn.textContent = "Creating account...";

          // Attempt registration
          const success = await register({
            name,
            email,
            phone: phone || null,
            location,
            role,
            password,
            confirmPassword,
            accepted_terms: acceptedTerms,
          });

          if (!success) {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        });
      });
    </script>
  </body>
</html>
