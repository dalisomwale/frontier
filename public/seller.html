<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Profile - Frontier Marketplace</title>
    <link rel="icon" href="images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Loaded blocking, in <head>, so the sidebar/bottom-nav below can be
         painted on first render instead of popping in after the page has
         already shown without them. -->
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/species.js"></script>
    <script src="/js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Desktop sidebar: rendered synchronously right here (not on
         DOMContentLoaded) so it exists before the browser's first paint. -->
    <div id="app-sidebar"></div>
    <script>
      renderSidebar(null);
    </script>

    <nav id="page-topnav" class="bg-white border-b border-gray-100 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-3">
              <div class="brand-mark-full">
                <img src="images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
              </div>
            </a>
          </div>

          <div class="flex items-center gap-4">
            <button
              id="logout-btn"
              class="lg:hidden bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div id="tab-self-content">
    <!-- Main Content -->
    <div class="app-content-shifted max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <a
        href="index.html"
        class="text-blue-600 hover:text-blue-700 mb-4 inline-block"
        >← Back to Home</a
      >

      <div id="seller-profile-card" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mt-4">
        <div class="text-center mb-6">
          <div
            id="seller-avatar"
            class="w-24 h-24 bg-blue-100 text-blue-700 text-3xl font-bold rounded-full mx-auto mb-4 flex items-center justify-center"
          ></div>
          <h1 id="seller-name" class="text-2xl font-bold text-gray-900"></h1>
          <p id="seller-role" class="text-gray-600 text-sm mt-1"></p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
          <div class="bg-gray-50 p-4 rounded-lg">
            <p class="text-gray-600 text-sm">Location</p>
            <p id="seller-location" class="font-semibold text-gray-900">-</p>
          </div>
          <div class="bg-gray-50 p-4 rounded-lg">
            <p class="text-gray-600 text-sm">Member Since</p>
            <p id="seller-created" class="font-semibold text-gray-900">-</p>
          </div>
        </div>

        <div id="seller-description-section" class="mb-6 hidden">
          <h2 class="text-sm font-medium text-gray-600 mb-2">About</h2>
          <p id="seller-description" class="text-gray-700 leading-relaxed"></p>
        </div>

        <button
          id="message-seller-btn"
          class="w-full bg-blue-600 text-white px-4 py-3 rounded-lg hover:bg-blue-700 font-medium transition"
        >
          Message Seller
        </button>
      </div>
    </div>
    </div>
    <div id="tab-frame-host" class="tab-frame-host hidden"></div>

    <!-- Mobile app-style bottom navigation: rendered synchronously, right
         here, instead of waiting for DOMContentLoaded. -->
    <div id="app-bottom-nav"></div>
    <script>
      renderBottomNav("app");
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if (!requireAuth("seller-profile")) return;
        await checkAuthentication();
        // Re-run after the server round-trip resolves, in case the
        // optimistic localStorage snapshot used for the instant render
        // above was missing or stale.
        renderAppShell({ active: null, bottomNavVariant: "app" });

        const { id } = getQueryParams();
        if (!id) {
          showNotification("Choose a seller to view", "error");
          setTimeout(() => (window.location.href = "index.html"), 2000);
          return;
        }

        await loadSellerProfile(id);

        document
          .getElementById("logout-btn")
          .addEventListener("click", async () => {
            await logout();
          });
      });

      async function loadSellerProfile(id) {
        showLoading();
        try {
          const response = await apiRequest(`/api/users/${id}`);
          if (response.success) {
            renderSellerProfile(response.data);
          } else {
            showNotification("Seller not found", "error");
            setTimeout(() => (window.location.href = "index.html"), 2000);
          }
        } catch (error) {
          console.error("Load seller profile error:", error);
          showNotification("Failed to load seller profile", "error");
        } finally {
          hideLoading();
        }
      }

      function renderSellerProfile(seller) {
        document.getElementById("seller-name").textContent = seller.name;
        document.getElementById("seller-avatar").textContent = (
          seller.name || "?"
        )
          .trim()
          .charAt(0)
          .toUpperCase();
        document.getElementById("seller-role").textContent = seller.role
          .replace("_", " ")
          .toUpperCase();
        document.getElementById("seller-location").textContent =
          seller.location || "-";
        document.getElementById("seller-created").textContent = formatDate(
          seller.created_at,
        );

        if (seller.role === "service_provider" && seller.service_description) {
          document
            .getElementById("seller-description-section")
            .classList.remove("hidden");
          document.getElementById("seller-description").textContent =
            seller.service_description;
        }

        document
          .getElementById("message-seller-btn")
          .addEventListener("click", () => {
            window.location.href = `messages.html?seller=${seller.id}`;
          });

        const currentUser = getCurrentUser();
        if (currentUser?.id === seller.id) {
          document.getElementById("message-seller-btn").classList.add("hidden");
        }
      }
    </script>
  </body>
</html>
