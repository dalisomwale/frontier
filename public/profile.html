<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Frontier Marketplace</title>
    <link rel="icon" href="images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/species.js"></script>
    <script src="/js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50">
    <div id="app-sidebar"></div>
    <script>
      renderSidebar("profile");
    </script>

    <nav
      id="page-topnav"
      class="bg-white border-b border-gray-100 sticky top-0 z-50"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-3">
              <div class="brand-mark-full">
                <img
                  src="images/logo-full.jpg"
                  alt="Frontier Farms &amp; Consult"
                />
              </div>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div id="tab-self-content">
      <div
        class="app-content-shifted max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8"
      >
        <div class="flex items-center justify-between mb-8">
          <h1 class="text-3xl font-bold text-gray-900">My Profile</h1>
          <button
            type="button"
            id="edit-profile-btn"
            aria-label="Edit profile"
            class="w-10 h-10 flex items-center justify-center text-gray-600 hover:text-gray-900 flex-shrink-0"
          ></button>
        </div>

        <div id="profile-view">
          <div
            class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 text-center mb-6"
          >
            <div
              id="profile-avatar"
              class="w-24 h-24 bg-blue-100 text-blue-700 text-3xl font-bold rounded-full mx-auto mb-4 flex items-center justify-center"
            ></div>
            <h2 id="profile-name" class="text-xl font-bold text-gray-900"></h2>
            <p id="profile-role" class="text-gray-600 text-sm mt-1"></p>
          </div>

          <div
            class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-6 space-y-4"
          >
            <div>
              <p class="text-sm text-gray-600">Email</p>
              <p id="view-email" class="font-semibold text-gray-900"></p>
            </div>
            <div>
              <p class="text-sm text-gray-600">Phone</p>
              <p id="view-phone" class="font-semibold text-gray-900">-</p>
            </div>
            <div>
              <p class="text-sm text-gray-600">Location</p>
              <p id="view-location" class="font-semibold text-gray-900"></p>
            </div>
            <div id="view-service-description-field" class="hidden">
              <p class="text-sm text-gray-600">Service description</p>
              <p
                id="view-service-description"
                class="font-semibold text-gray-900 whitespace-pre-wrap"
              ></p>
            </div>
          </div>

          <button
            type="button"
            id="change-password-btn"
            class="w-full mb-3 bg-white border border-gray-300 text-gray-900 px-4 py-3 rounded-lg hover:bg-gray-50 font-medium"
          >
            Change Password
          </button>

          <!-- Phone-only logout: on desktop the sidebar footer already carries
             a logout button, so this duplicate is hidden at lg and up. -->
          <button
            id="logout-btn"
            class="lg:hidden w-full bg-red-600 text-white px-4 py-3 rounded-lg hover:bg-red-700 font-medium"
          >
            Logout
          </button>
        </div>

        <div id="profile-edit" class="hidden">
          <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
            <h2 class="text-lg font-bold text-gray-900 mb-6">Edit Profile</h2>

            <form id="profile-form" class="space-y-6">
              <div>
                <label
                  for="name"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Full Name</label
                >
                <input
                  type="text"
                  id="name"
                  name="name"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <div
                  id="name-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Email Address</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  disabled
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-600 cursor-not-allowed"
                />
                <p class="text-gray-500 text-sm mt-1">
                  Email cannot be changed
                </p>
              </div>

              <div>
                <label
                  for="phone"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Phone Number</label
                >
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <div
                  id="phone-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <div>
                <label
                  for="location"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Location</label
                >
                <input
                  type="text"
                  id="location"
                  name="location"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <div
                  id="location-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <div id="service-description-field" class="hidden">
                <label
                  for="service-description"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Service description</label
                >
                <textarea
                  id="service-description"
                  name="service-description"
                  maxlength="1000"
                  rows="4"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg"
                  placeholder="Describe the services and contact support you provide."
                ></textarea>
              </div>

              <div class="flex gap-3">
                <button
                  type="submit"
                  class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium"
                >
                  Save Changes
                </button>
                <button
                  type="button"
                  id="cancel-btn"
                  class="flex-1 border border-gray-300 text-gray-900 px-4 py-2 rounded-lg hover:bg-gray-50 font-medium"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>

        <div id="password-view" class="hidden">
          <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
            <h2 class="text-lg font-bold text-gray-900 mb-2">
              Change Password
            </h2>
            <p class="text-sm text-gray-600 mb-6">
              You'll stay signed in on this device after changing your password.
            </p>

            <form id="password-form" class="space-y-6">
              <div>
                <label
                  for="current-password"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Current password</label
                >
                <input
                  type="password"
                  id="current-password"
                  autocomplete="current-password"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <div
                  id="current-password-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <div>
                <label
                  for="new-password"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >New password</label
                >
                <input
                  type="password"
                  id="new-password"
                  autocomplete="new-password"
                  required
                  minlength="8"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <p class="text-gray-500 text-sm mt-1">At least 8 characters</p>
                <div
                  id="new-password-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <div>
                <label
                  for="confirm-new-password"
                  class="block text-sm font-medium text-gray-700 mb-2"
                  >Confirm new password</label
                >
                <input
                  type="password"
                  id="confirm-new-password"
                  autocomplete="new-password"
                  required
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <div
                  id="confirm-new-password-error"
                  class="text-red-500 text-sm mt-1 hidden"
                ></div>
              </div>

              <div class="flex gap-3">
                <button
                  type="submit"
                  class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium"
                >
                  Update Password
                </button>
                <button
                  type="button"
                  id="password-cancel-btn"
                  class="flex-1 border border-gray-300 text-gray-900 px-4 py-2 rounded-lg hover:bg-gray-50 font-medium"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div id="tab-frame-host" class="tab-frame-host hidden"></div>

    <div id="app-bottom-nav"></div>
    <script>
      renderBottomNav("app");
    </script>

    <script>
      let currentUser = null;

      document.addEventListener("DOMContentLoaded", async () => {
        if (!requireAuth("profile")) return;
        await checkAuthentication();
        renderAppShell({ active: "profile", bottomNavVariant: "app" });

        currentUser = getCurrentUser();
        if (!currentUser) return;

        document.getElementById("edit-profile-btn").innerHTML = uiIcon("edit");

        await loadProfile();

        document
          .getElementById("edit-profile-btn")
          .addEventListener("click", showEditMode);
        document
          .getElementById("profile-form")
          .addEventListener("submit", saveProfile);
        document.getElementById("cancel-btn").addEventListener("click", () => {
          loadProfile();
          showViewMode();
        });
        document
          .getElementById("change-password-btn")
          .addEventListener("click", showPasswordMode);
        document
          .getElementById("password-form")
          .addEventListener("submit", savePassword);
        document
          .getElementById("password-cancel-btn")
          .addEventListener("click", () => {
            document.getElementById("password-form").reset();
            hideAllErrors();
            showViewMode();
          });
        document
          .getElementById("logout-btn")
          .addEventListener("click", async () => {
            await logout();
          });
      });

      function hideAllErrors() {
        document
          .querySelectorAll('[id$="-error"]')
          .forEach((el) => el.classList.add("hidden"));
      }

      function showViewMode() {
        document.getElementById("profile-edit").classList.add("hidden");
        document.getElementById("password-view").classList.add("hidden");
        document.getElementById("profile-view").classList.remove("hidden");
      }

      function showEditMode() {
        document.getElementById("profile-view").classList.add("hidden");
        document.getElementById("password-view").classList.add("hidden");
        document.getElementById("profile-edit").classList.remove("hidden");
      }

      function showPasswordMode() {
        document.getElementById("profile-view").classList.add("hidden");
        document.getElementById("profile-edit").classList.add("hidden");
        document.getElementById("password-view").classList.remove("hidden");
        document.getElementById("current-password").focus();
      }

      async function loadProfile() {
        try {
          const response = await apiRequest("/api/users/profile");

          if (response.success) {
            const user = response.data;

            document.getElementById("profile-name").textContent = user.name;
            document.getElementById("profile-avatar").textContent = (
              user.name || "?"
            )
              .trim()
              .charAt(0)
              .toUpperCase();
            document.getElementById("profile-role").textContent = user.role
              .replace("_", " ")
              .toUpperCase();

            document.getElementById("name").value = user.name || "";
            document.getElementById("email").value = user.email || "";
            document.getElementById("phone").value = user.phone || "";
            document.getElementById("location").value = user.location || "";

            document.getElementById("view-email").textContent = user.email;
            document.getElementById("view-phone").textContent =
              user.phone || "-";
            document.getElementById("view-location").textContent =
              user.location || "-";

            if (user.role === "service_provider") {
              document
                .getElementById("service-description-field")
                .classList.remove("hidden");
              document.getElementById("service-description").value =
                user.service_description || "";

              document
                .getElementById("view-service-description-field")
                .classList.remove("hidden");
              document.getElementById("view-service-description").textContent =
                user.service_description || "Not provided yet.";
            }
          }
        } catch (error) {
          console.error("Load profile error:", error);
          showNotification("Failed to load profile", "error");
        }
      }

      async function saveProfile(e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const location = document.getElementById("location").value.trim();
        const serviceDescription =
          currentUser?.role === "service_provider"
            ? document.getElementById("service-description").value.trim()
            : undefined;

        hideAllErrors();

        let hasError = false;

        if (!validateField("name", name)) {
          document.getElementById("name-error").textContent =
            "Name must be at least 2 characters";
          document.getElementById("name-error").classList.remove("hidden");
          hasError = true;
        }

        if (phone && phone.length < 7) {
          document.getElementById("phone-error").textContent =
            "Phone must be at least 7 characters";
          document.getElementById("phone-error").classList.remove("hidden");
          hasError = true;
        }

        if (!location) {
          document.getElementById("location-error").textContent =
            "Location is required";
          document.getElementById("location-error").classList.remove("hidden");
          hasError = true;
        }

        if (hasError) return;

        const confirmed = await confirmAction({
          title: "Save profile changes?",
          message:
            "Your updated details will be visible to other marketplace users.",
          confirmText: "Save changes",
        });
        if (!confirmed) return;

        try {
          const response = await apiRequest("/api/users/profile", {
            method: "PUT",
            body: JSON.stringify({
              name,
              phone: phone || null,
              location,
              serviceDescription,
            }),
          });

          if (response.success) {
            showNotification("Profile updated successfully", "success");
            await loadProfile();
            showViewMode();
          } else {
            showNotification(
              response.message || "Failed to update profile",
              "error",
            );
          }
        } catch (error) {
          console.error("Save profile error:", error);
          showNotification("Failed to save profile", "error");
        }
      }

      async function savePassword(e) {
        e.preventDefault();

        const currentPassword =
          document.getElementById("current-password").value;
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById(
          "confirm-new-password",
        ).value;

        hideAllErrors();

        let hasError = false;
        if (!currentPassword) {
          document.getElementById("current-password-error").textContent =
            "Enter your current password";
          document
            .getElementById("current-password-error")
            .classList.remove("hidden");
          hasError = true;
        }
        if (newPassword.length < 8) {
          document.getElementById("new-password-error").textContent =
            "Password must be at least 8 characters";
          document
            .getElementById("new-password-error")
            .classList.remove("hidden");
          hasError = true;
        }
        if (newPassword !== confirmPassword) {
          document.getElementById("confirm-new-password-error").textContent =
            "Passwords do not match";
          document
            .getElementById("confirm-new-password-error")
            .classList.remove("hidden");
          hasError = true;
        }
        if (hasError) return;

        const confirmed = await confirmAction({
          title: "Change your password?",
          message: "You'll stay signed in on this device.",
          confirmText: "Change password",
        });
        if (!confirmed) return;

        try {
          const response = await apiRequest("/api/users/password", {
            method: "PUT",
            body: JSON.stringify({
              currentPassword,
              newPassword,
              confirmPassword,
            }),
          });
          if (response.success) {
            showNotification("Password updated successfully", "success");
            document.getElementById("password-form").reset();
            showViewMode();
          } else {
            showNotification(
              response.message || "Failed to update password",
              "error",
            );
          }
        } catch (error) {
          console.error("Save password error:", error);
          showNotification(
            error.message || "Failed to update password",
            "error",
          );
        }
      }
    </script>
  </body>
</html>
