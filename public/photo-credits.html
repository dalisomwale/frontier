<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Credits - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/livestock.js"></script>
  </head>
  <body class="bg-gray-50">
    <nav class="bg-white shadow-md">
      <div class="max-w-4xl mx-auto px-4 h-16 flex items-center">
        <a href="/" class="flex items-center gap-3">
          <div class="brand-mark-full"><img src="/images/logo-full.jpg" alt="Frontier Farms &amp; Consult" /></div>
          <span class="font-bold text-gray-900">Frontier Marketplace</span>
        </a>
      </div>
    </nav>
    <main class="max-w-4xl mx-auto px-4 py-10">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Photo Credits</h1>
      <p class="text-gray-600 mb-6">
        The homepage photography is real, unedited camera work from photographers on
        <a class="text-blue-600 underline" href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>, used under the
        <a class="text-blue-600 underline" href="https://unsplash.com/license" target="_blank" rel="noopener">Unsplash License</a>
        (free for commercial use). Listing photos are uploaded by the Frontier Marketplace team.
      </p>
      <ul id="credits" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></ul>
    </main>
    <script>
      document.getElementById("credits").innerHTML = HERO_PHOTOS.map(
        (p) => `
        <li class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
          <img src="${unsplashUrl(p.id, 640, 400)}" alt="${escapeHtml(p.alt)}" loading="lazy" class="w-full aspect-[16/10] object-cover bg-gray-200">
          <div class="p-4 text-sm">
            <p class="font-semibold text-gray-900">${escapeHtml(p.place)}</p>
            <p class="text-gray-600">Photo by ${escapeHtml(p.author)} · <a class="text-blue-600 underline" href="${p.page}" target="_blank" rel="noopener">View on Unsplash</a></p>
          </div>
        </li>`,
      ).join("");
    </script>
  </body>
</html>
