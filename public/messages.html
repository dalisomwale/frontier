<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages - Frontier Marketplace</title>
    <link rel="icon" href="images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/species.js"></script>
    <script src="/js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50">
    <div id="app-sidebar"></div>
    <script>
      renderSidebar("messages");
    </script>

    <nav
      id="page-topnav"
      class="bg-white border-b border-gray-100 sticky top-0 z-50"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-3">
              <div class="brand-mark-full">
                <img
                  src="images/logo-full.jpg"
                  alt="Frontier Farms &amp; Consult"
                />
              </div>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div id="tab-self-content">
      <div
        class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8"
      >
        <h1 class="text-3xl font-bold text-gray-900 mb-8">My Messages</h1>

        <div class="h-[calc(100vh-252px)] flex gap-4">
          <div
            id="conversations-panel"
            class="w-full lg:w-80 lg:flex bg-white rounded-xl border border-gray-100 shadow-sm flex-col"
          >
            <div class="border-b flex">
              <button
                type="button"
                id="chats-subtab-btn"
                class="flex-1 min-w-0 flex items-center justify-center gap-2 px-2 py-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600 transition"
              >
                <span class="truncate">My Chats</span>
                <span
                  id="chats-count-badge"
                  class="bg-blue-100 text-blue-700 text-xs font-bold min-w-[20px] px-1.5 py-0.5 rounded-full flex-shrink-0"
                  >0</span
                >
              </button>
              <button
                type="button"
                id="inquiries-subtab-btn"
                class="flex-1 min-w-0 flex items-center justify-center gap-2 px-2 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition"
              >
                <span class="truncate">Inquiries</span>
                <span
                  id="inquiries-count-badge"
                  class="bg-gray-100 text-gray-600 text-xs font-bold min-w-[20px] px-1.5 py-0.5 rounded-full flex-shrink-0"
                  >0</span
                >
              </button>
            </div>

            <div id="conversations-list" class="flex-1 overflow-y-auto">
              <div class="p-4">
                <p class="text-gray-600 text-center">
                  Loading conversations...
                </p>
              </div>
            </div>
          </div>

          <div
            id="message-area"
            class="hidden flex-1 bg-white rounded-xl border border-gray-100 shadow-sm flex flex-col"
          >
            <div class="border-b p-4 flex items-center gap-3">
              <button
                id="close-chat"
                class="text-gray-600 hover:text-gray-900 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 flex-shrink-0"
                aria-label="Back to chats"
              ></button>
              <div
                class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold flex-shrink-0"
                id="conversation-avatar"
              ></div>
              <div class="min-w-0">
                <h3
                  id="conversation-title"
                  class="text-lg font-bold text-gray-900 truncate"
                ></h3>
                <p id="user-status" class="text-sm text-gray-600"></p>
              </div>
            </div>

            <!-- Inquiry context: shown only when the open conversation is tied
               to an inquiry. Seller sees action buttons (mark responded /
               close); buyer sees the same context read-only. -->
            <div
              id="inquiry-banner"
              class="hidden border-b border-yellow-200 bg-yellow-50 px-4 py-3"
            >
              <div class="flex items-start gap-3">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap mb-1">
                    <span
                      class="text-[10px] font-bold text-yellow-800 uppercase tracking-wider"
                      >Inquiry</span
                    >
                    <span
                      id="inquiry-status-badge"
                      class="text-[10px] font-semibold rounded-full px-2 py-0.5 capitalize"
                    ></span>
                  </div>
                  <a
                    id="inquiry-listing-link"
                    href="#"
                    class="text-sm font-semibold text-gray-900 hover:text-blue-600 truncate block mb-1"
                  ></a>
                  <p
                    id="inquiry-message"
                    class="text-sm text-gray-700 italic leading-snug"
                  ></p>
                </div>
                <div
                  id="inquiry-actions"
                  class="flex flex-col gap-1 flex-shrink-0"
                >
                  <!-- Buttons injected here based on user role + inquiry status -->
                </div>
              </div>
            </div>

            <div
              id="messages-container"
              class="flex-1 overflow-y-auto p-4 bg-gray-50"
            ></div>

            <div class="border-t p-4 bg-white">
              <form id="message-form" class="flex gap-2">
                <input
                  id="message-input"
                  type="text"
                  placeholder="Type a message..."
                  class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <button
                  type="submit"
                  class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium"
                >
                  Send
                </button>
              </form>
            </div>
          </div>

          <div
            id="empty-state"
            class="max-lg:hidden flex-1 flex items-center justify-center"
          >
            <div class="text-center">
              <p class="text-gray-600 text-lg">
                Select a conversation to start messaging
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="tab-frame-host" class="tab-frame-host hidden"></div>

    <div id="app-bottom-nav"></div>
    <script>
      renderBottomNav("app");
    </script>

    <script>
      let socket = null;
      let currentUserId = null;
      let selectedConversationUser = null;
      // Tracks which inquiry the currently open conversation is anchored to
      // (set when opening from the Inquiries subtab, or inferred when there's
      // exactly one active inquiry between the two users). Null when the
      // conversation has no inquiry context.
      let selectedInquiryId = null;
      let conversationMessages = [];
      let conversationsData = [];
      let inquiriesData = [];
      let activeSubtab = "chats";

      // Colors for the inquiry status pill in the banner and list.
      const INQUIRY_STATUS_STYLES = {
        pending: "bg-yellow-100 text-yellow-800",
        responded: "bg-blue-100 text-blue-800",
        closed: "bg-gray-200 text-gray-600",
      };

      document.addEventListener("DOMContentLoaded", async () => {
        if (!requireAuth("chat")) return;
        await checkAuthentication();
        renderAppShell({ active: "messages", bottomNavVariant: "app" });

        currentUserId = getCurrentUser().id;
        document.getElementById("close-chat").innerHTML = uiIcon("chevronLeft");

        initializeSocket();
        await Promise.all([loadConversations(), loadInquiries()]);

        document
          .getElementById("message-form")
          .addEventListener("submit", sendMessage);
        document
          .getElementById("close-chat")
          .addEventListener("click", closeConversation);
        document
          .getElementById("chats-subtab-btn")
          .addEventListener("click", () => setActiveSubtab("chats"));
        document
          .getElementById("inquiries-subtab-btn")
          .addEventListener("click", () => setActiveSubtab("inquiries"));

        const params = getQueryParams();
        if (params.seller) await selectConversation(params.seller);
      });

      function initializeSocket() {
        socket = io();
        socket.on("connect", () => {
          console.log("Connected to messaging server");
          socket.emit("user_join", { userId: currentUserId });
        });
        socket.on("receive_message", (data) => {
          if (data.sender_id === selectedConversationUser) {
            conversationMessages.push(data);
            renderMessages();
            scrollToBottom();
          }
          loadConversations();
        });
        socket.on("user_online", (data) => {
          if (data.userId === selectedConversationUser)
            updateUserStatus("Online");
        });
        socket.on("user_offline", (data) => {
          if (data.userId === selectedConversationUser)
            updateUserStatus("Offline");
        });
        // Another tab (or the other party) changed an inquiry we're involved
        // in. Refresh our list so the banner and badges stay consistent.
        socket.on("inquiry_updated", () => {
          loadInquiries().then(() => {
            if (selectedInquiryId) renderInquiryBanner();
          });
        });
        socket.on("disconnect", () => {
          console.log("Disconnected from messaging server");
        });
      }

      function setActiveSubtab(tab) {
        activeSubtab = tab;
        const isChats = tab === "chats";
        const chatsBtn = document.getElementById("chats-subtab-btn");
        const inquiriesBtn = document.getElementById("inquiries-subtab-btn");
        chatsBtn.classList.toggle("border-blue-600", isChats);
        chatsBtn.classList.toggle("text-blue-600", isChats);
        chatsBtn.classList.toggle("border-transparent", !isChats);
        chatsBtn.classList.toggle("text-gray-500", !isChats);
        inquiriesBtn.classList.toggle("border-blue-600", !isChats);
        inquiriesBtn.classList.toggle("text-blue-600", !isChats);
        inquiriesBtn.classList.toggle("border-transparent", isChats);
        inquiriesBtn.classList.toggle("text-gray-500", isChats);
        if (isChats) renderConversations();
        else renderInquiries();
      }

      async function loadConversations() {
        try {
          const response = await apiRequest("/api/messages");
          if (response.success) {
            conversationsData = response.data || [];
            document.getElementById("chats-count-badge").textContent =
              conversationsData.length;
            if (activeSubtab === "chats") renderConversations();
            if (typeof refreshUnreadBadge === "function") refreshUnreadBadge();
          }
        } catch (error) {
          console.error("Load conversations error:", error);
          showNotification("Failed to load conversations", "error");
        }
      }

      function renderConversations() {
        const conversationsList = document.getElementById("conversations-list");
        if (conversationsData.length === 0) {
          conversationsList.innerHTML = `
              <div class="p-4">
                <p class="text-gray-600 text-center">No conversations yet</p>
                <p class="text-gray-500 text-sm text-center mt-2">Contact sellers by sending them inquiries or messages</p>
              </div>
            `;
          return;
        }

        conversationsList.innerHTML = conversationsData
          .map(
            (conv) => `
            <div class="flex items-center gap-3 px-4 py-3 border-b border-l-4 hover:bg-gray-50 cursor-pointer transition ${selectedConversationUser === conv.other_user_id ? "bg-blue-50 border-l-blue-600" : "border-l-transparent"}"
              onclick="selectConversation(${conv.other_user_id})">
              <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-lg flex-shrink-0">
                ${escapeHtml((conv.user_name || "?").trim().charAt(0).toUpperCase())}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                  <h4 class="font-semibold text-gray-900 truncate">${escapeHtml(conv.user_name)}</h4>
                  <span class="text-xs text-gray-500 flex-shrink-0">${formatDateShort(conv.last_message_time || conv.created_at)}</span>
                </div>
                <div class="flex items-center justify-between gap-2 mt-0.5">
                  <p class="text-sm text-gray-600 truncate">${escapeHtml(conv.last_message || "No messages yet")}</p>
                  ${conv.unread_count ? `<span class="bg-blue-600 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full flex-shrink-0">${conv.unread_count}</span>` : ""}
                </div>
              </div>
            </div>
          `,
          )
          .join("");
      }

      async function loadInquiries() {
        try {
          const response = await apiRequest("/api/inquiries");
          if (response.success) {
            inquiriesData = response.data || [];
            const openCount = inquiriesData.filter(
              (inquiry) => inquiry.status !== "closed",
            ).length;
            document.getElementById("inquiries-count-badge").textContent =
              openCount;
            if (activeSubtab === "inquiries") renderInquiries();
          }
        } catch (error) {
          console.error("Load inquiries error:", error);
          showNotification("Failed to load inquiries", "error");
        }
      }

      function renderInquiries() {
        const conversationsList = document.getElementById("conversations-list");
        if (inquiriesData.length === 0) {
          conversationsList.innerHTML = `
              <div class="p-4">
                <p class="text-gray-600 text-center">No inquiries yet</p>
                <p class="text-gray-500 text-sm text-center mt-2">Buying inquiries on your listings, and any you've sent, will appear here</p>
              </div>
            `;
          return;
        }

        // The inquiry list now passes the inquiry id through to
        // selectConversation, so the banner knows exactly which inquiry the
        // chat is anchored to even when the same buyer has inquired about
        // more than one listing.
        conversationsList.innerHTML = inquiriesData
          .map((inquiry) => {
            const otherUserId =
              inquiry.buyer_id === currentUserId
                ? inquiry.seller_id
                : inquiry.buyer_id;
            const isMineAsSeller = inquiry.seller_id === currentUserId;
            const counterpartName = isMineAsSeller
              ? escapeHtml(inquiry.sender_name || "Buyer")
              : "You";
            return `
            <div class="flex items-start gap-3 px-4 py-3 border-b hover:bg-gray-50 cursor-pointer transition ${selectedInquiryId === inquiry.id ? "bg-blue-50" : ""}"
              onclick="selectConversation(${otherUserId}, ${inquiry.id})">
              <div class="w-10 h-10 rounded-full bg-green-100 text-green-700 flex items-center justify-center flex-shrink-0">
                ${uiIcon("messages")}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2 mb-0.5">
                  <h4 class="font-semibold text-gray-900 truncate text-sm">${escapeHtml(inquiry.listing_title)}</h4>
                  <span class="text-[10px] text-gray-500 flex-shrink-0">${formatDateShort(inquiry.created_at)}</span>
                </div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[10px] text-gray-500">From: ${counterpartName}</span>
                  <span class="text-[10px] font-semibold rounded-full px-2 py-0.5 capitalize ${INQUIRY_STATUS_STYLES[inquiry.status] || "bg-gray-100 text-gray-600"}">${inquiry.status}</span>
                </div>
                <p class="text-xs text-gray-600 line-clamp-2">${escapeHtml(inquiry.message)}</p>
              </div>
            </div>
          `;
          })
          .join("");
      }

      async function selectConversation(userId, inquiryId = null) {
        selectedConversationUser = userId;
        selectedInquiryId = inquiryId;
        conversationMessages = [];

        document.getElementById("message-area").classList.remove("hidden");
        document.getElementById("empty-state").classList.add("hidden");
        document.getElementById("conversations-panel").classList.add("hidden");

        await loadConversations();
        await loadMessages(userId);

        // If we came in without an explicit inquiry id (from the Chats tab),
        // try to infer the active one between these two users so the banner
        // still shows. Prefer pending > responded > closed, newest first.
        if (!selectedInquiryId) {
          selectedInquiryId = inferActiveInquiryId(userId);
        }

        renderInquiryBanner();
        document.getElementById("message-input").focus();

        // Mark any pending inquiry from this buyer as responded since the
        // seller opened the thread - matches the mental model of "opened
        // means handling it". The server-side PATCH emits inquiry_updated
        // which refreshes badges and the list.
        const pendingInquiry = inquiriesData.find(
          (inq) =>
            inq.status === "pending" &&
            inq.seller_id === currentUserId &&
            Number(inq.buyer_id) === Number(userId),
        );
        if (pendingInquiry) {
          try {
            await apiRequest(`/api/inquiries/${pendingInquiry.id}`, {
              method: "PATCH",
              body: JSON.stringify({ status: "responded" }),
            });
            await loadInquiries();
            renderInquiryBanner();
          } catch {
            // Silent - inquiry remains pending, user can still respond.
          }
        }
      }

      function inferActiveInquiryId(otherUserId) {
        const candidates = inquiriesData.filter(
          (inq) =>
            (Number(inq.buyer_id) === Number(currentUserId) &&
              Number(inq.seller_id) === Number(otherUserId)) ||
            (Number(inq.seller_id) === Number(currentUserId) &&
              Number(inq.buyer_id) === Number(otherUserId)),
        );
        if (!candidates.length) return null;
        // Sort priority: pending (0) < responded (1) < closed (2), then newest.
        const order = { pending: 0, responded: 1, closed: 2 };
        candidates.sort((a, b) => {
          const oa = order[a.status] ?? 3;
          const ob = order[b.status] ?? 3;
          if (oa !== ob) return oa - ob;
          return new Date(b.created_at) - new Date(a.created_at);
        });
        return candidates[0].id;
      }

      // Renders the inquiry banner above the messages. Called from
      // selectConversation and from the socket inquiry_updated handler.
      function renderInquiryBanner() {
        const banner = document.getElementById("inquiry-banner");
        const actions = document.getElementById("inquiry-actions");
        if (!banner || !actions) return;

        if (!selectedInquiryId) {
          banner.classList.add("hidden");
          return;
        }
        const inquiry = inquiriesData.find(
          (inq) => inq.id === selectedInquiryId,
        );
        if (!inquiry) {
          banner.classList.add("hidden");
          return;
        }

        banner.classList.remove("hidden");

        const statusBadge = document.getElementById("inquiry-status-badge");
        statusBadge.textContent = inquiry.status;
        statusBadge.className = `text-[10px] font-semibold rounded-full px-2 py-0.5 capitalize ${INQUIRY_STATUS_STYLES[inquiry.status] || "bg-gray-100 text-gray-600"}`;

        const listingLink = document.getElementById("inquiry-listing-link");
        listingLink.textContent =
          inquiry.listing_title || `Listing #${inquiry.listing_id}`;
        listingLink.href = `listing.html?id=${inquiry.listing_id}`;

        document.getElementById("inquiry-message").textContent =
          `"${inquiry.message}"`;

        // Only the seller can transition status; the buyer sees the same
        // banner but no buttons. Matches the permission check on the server.
        const isSeller = inquiry.seller_id === currentUserId;
        if (!isSeller) {
          actions.innerHTML = "";
          return;
        }

        const buttons = [];
        if (inquiry.status === "pending") {
          buttons.push({
            label: "Mark responded",
            class:
              "text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md",
            action: "responded",
          });
        }
        if (inquiry.status !== "closed") {
          buttons.push({
            label: "Close inquiry",
            class:
              "text-xs font-medium bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-1 rounded-md",
            action: "closed",
          });
        }

        actions.innerHTML = buttons
          .map(
            (b) => `
          <button type="button" data-inquiry-action="${b.action}" class="${b.class}">${b.label}</button>
        `,
          )
          .join("");

        actions.querySelectorAll("[data-inquiry-action]").forEach((btn) => {
          btn.addEventListener("click", () =>
            updateInquiryStatus(inquiry.id, btn.dataset.inquiryAction),
          );
        });
      }

      async function updateInquiryStatus(inquiryId, status) {
        try {
          const response = await apiRequest(`/api/inquiries/${inquiryId}`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          if (response.success) {
            showNotification(`Inquiry marked ${status}`, "success");
            await loadInquiries();
            renderInquiryBanner();
          } else {
            showNotification(
              response.message || "Unable to update inquiry",
              "error",
            );
          }
        } catch (error) {
          showNotification(
            error.message || "Unable to update inquiry",
            "error",
          );
        }
      }

      async function loadMessages(userId) {
        try {
          const response = await apiRequest(`/api/messages/${userId}`);
          if (response.success) {
            conversationMessages = response.data || [];
            const userResponse = await apiRequest(`/api/users/${userId}`);
            if (userResponse.success) {
              document.getElementById("conversation-title").textContent =
                userResponse.data.name;
              document.getElementById("conversation-avatar").textContent = (
                userResponse.data.name || "?"
              )
                .trim()
                .charAt(0)
                .toUpperCase();
              updateUserStatus("Online");
            }
            renderMessages();
            scrollToBottom();
            if (typeof refreshUnreadBadge === "function") refreshUnreadBadge();
          }
        } catch (error) {
          console.error("Load messages error:", error);
          showNotification("Failed to load messages", "error");
        }
      }

      function renderMessages() {
        const container = document.getElementById("messages-container");
        if (conversationMessages.length === 0) {
          container.innerHTML = `
          <div class="flex items-center justify-center h-full">
            <div class="text-center text-gray-600">
              <p>No messages yet. Start the conversation!</p>
            </div>
          </div>
        `;
          return;
        }

        container.innerHTML = conversationMessages
          .map(
            (msg) => `
        <div class="mb-4 flex ${msg.sender_id === currentUserId ? "justify-end" : "justify-start"}">
          <div class="${msg.sender_id === currentUserId ? "bg-blue-600 text-white" : "bg-gray-200 text-gray-900"} px-4 py-2 rounded-lg max-w-xs">
            <p class="text-sm">${escapeHtml(msg.message)}</p>
            <p class="text-xs ${msg.sender_id === currentUserId ? "text-blue-100" : "text-gray-600"} mt-1">
              ${formatDate(msg.created_at)}
            </p>
          </div>
        </div>
      `,
          )
          .join("");
      }

      async function sendMessage(e) {
        e.preventDefault();
        if (!selectedConversationUser) return;

        const messageInput = document.getElementById("message-input");
        const message = messageInput.value.trim();
        if (!message) return;

        // The inquiry banner needs to know which listing the message is
        // about so it appears in the thread context. Prefer the open
        // inquiry's listing, else omit and the message is a general chat.
        const activeInquiry = selectedInquiryId
          ? inquiriesData.find((inq) => inq.id === selectedInquiryId)
          : null;

        try {
          const response = await apiRequest("/api/messages", {
            method: "POST",
            body: JSON.stringify({
              recipient_id: selectedConversationUser,
              message,
              listing_id: activeInquiry ? activeInquiry.listing_id : undefined,
            }),
          });

          if (response.success) {
            messageInput.value = "";
            conversationMessages.push({
              sender_id: currentUserId,
              recipient_id: selectedConversationUser,
              listing_id: activeInquiry ? activeInquiry.listing_id : null,
              message,
              created_at: new Date().toISOString(),
              is_read: false,
            });
            renderMessages();
            scrollToBottom();

            // Auto-transition: the first seller reply on a pending inquiry
            // moves it to "responded". Subsequent replies don't re-patch.
            if (
              activeInquiry &&
              activeInquiry.status === "pending" &&
              activeInquiry.seller_id === currentUserId
            ) {
              try {
                await apiRequest(`/api/inquiries/${activeInquiry.id}`, {
                  method: "PATCH",
                  body: JSON.stringify({ status: "responded" }),
                });
                await loadInquiries();
                renderInquiryBanner();
              } catch {
                // Non-fatal: the message went through, only the auto-
                // transition failed. The user can still mark it manually.
              }
            }
          } else {
            showNotification(
              response.message || "Failed to send message",
              "error",
            );
          }
        } catch (error) {
          console.error("Send message error:", error);
          showNotification("Failed to send message", "error");
        }
      }

      function closeConversation() {
        selectedConversationUser = null;
        selectedInquiryId = null;
        conversationMessages = [];
        document.getElementById("message-area").classList.add("hidden");
        document.getElementById("empty-state").classList.remove("hidden");
        document
          .getElementById("conversations-panel")
          .classList.remove("hidden");
        document.getElementById("inquiry-banner").classList.add("hidden");
        loadConversations();
        loadInquiries();
      }

      function updateUserStatus(status) {
        const userStatusEl = document.getElementById("user-status");
        if (userStatusEl)
          userStatusEl.textContent = status === "Online" ? "Online" : "Offline";
      }

      function scrollToBottom() {
        const container = document.getElementById("messages-container");
        container.scrollTop = container.scrollHeight;
      }
    </script>
  </body>
</html>
