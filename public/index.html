<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier Marketplace - Trade on Zambia's No.1 Livestock Marketplace</title>
    <meta
      name="description"
      content="Cattle, goats, sheep, pigs and poultry for sale across Zambia from Frontier Farms & Consult."
    />
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/livestock.js"></script>
    <script src="/js/inquiry.js"></script>
  </head>
  <body class="bg-gray-50">
    <nav id="page-topnav" class="site-header sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap md:flex-nowrap items-center gap-x-3 gap-y-2 py-2 md:py-0 md:h-16 lg:h-[72px]">
          <a href="/" class="flex items-center gap-3 flex-shrink-0" aria-label="Frontier Marketplace home">
            <div class="brand-mark-full">
              <img src="/images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
            </div>
            <span class="hidden sm:block md:hidden xl:block font-bold text-gray-900">Frontier Marketplace</span>
          </a>

          <div class="flex items-center gap-1 ml-auto md:ml-2 lg:ml-6">
            <div class="nav-menu" id="menu-animals">
              <button type="button" class="nav-menu-btn" aria-haspopup="true" aria-expanded="false">
                Browse Categories <span class="nav-menu-caret" data-icon="chevronRight"></span>
              </button>
              <div class="nav-dropdown"></div>
            </div>
            <div class="nav-menu" id="menu-province">
              <button type="button" class="nav-menu-btn" aria-haspopup="true" aria-expanded="false">
                Province <span class="nav-menu-caret" data-icon="chevronRight"></span>
              </button>
              <div class="nav-dropdown"></div>
            </div>
          </div>

          <form id="site-search" class="site-search" role="search" autocomplete="off">
            <span class="site-search-icon" data-icon="search"></span>
            <input id="search-input" type="search" name="q" maxlength="100" enterkeyhint="search"
              placeholder="Search livestock, breeds, provinces" aria-label="Search livestock listings"
              aria-controls="search-results" aria-expanded="false">
            <button type="button" id="search-clear" class="site-search-clear" aria-label="Clear search" hidden><span class="w-4 h-4" data-icon="close"></span></button>
            <div id="search-results" class="search-results" hidden></div>
          </form>

          <span class="header-row-break" aria-hidden="true"></span>
          <a id="seller-link" href="/seller/register.html" class="header-seller-link">Register</a>

          <div hidden aria-hidden="true">
            <select id="filter-animal"><option value="" disabled hidden selected></option></select>
            <select id="filter-purpose" disabled><option value="" disabled hidden selected></option></select>
            <select id="filter-breed" disabled><option value="" disabled hidden selected></option></select>
            <select id="filter-location"><option value="" disabled hidden selected></option></select>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <section class="hero" aria-labelledby="hero-heading">
        <div id="hero-ambient" class="hero-ambient" aria-hidden="true"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-14 lg:py-20">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
            <div class="lg:col-span-5">
              <h1 id="hero-heading" class="text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight text-balance text-white">
                Trade on Zambia's No.1 Livestock <span class="hero-accent">Marketplace</span>
              </h1>
              <div class="mt-7 flex flex-wrap gap-3">
                <a href="#listings" class="hero-btn hero-btn-primary">Browse Livestock</a>
                <a href="/seller/register.html" class="hero-btn hero-btn-ghost">Start Selling</a>
              </div>
            </div>
            <div class="lg:col-span-7">
              <div class="hero-frame">
                <div id="hero-slides" class="hero-slides" aria-hidden="true"></div>
                <div class="hero-frame-foot">
                  <span id="hero-caption" class="hero-caption"></span>
                  <div id="hero-dots" class="hero-dots" role="tablist" aria-label="Hero photos"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="categories" class="anchor-section py-12 bg-white" aria-labelledby="categories-heading">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="mb-6">
            <button type="button" id="tiles-back" class="hidden mb-2 items-center gap-1 text-sm font-medium text-blue-600 hover:text-blue-700"><span class="w-4 h-4" data-icon="chevronLeft"></span>All animals</button>
            <h2 id="categories-heading" class="text-xl sm:text-2xl font-bold text-gray-900">Browse by Category</h2>
          </div>
          <div id="animal-tiles" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>
        </div>
      </section>

      <section id="listings" class="anchor-section bg-gray-50 py-10 border-t border-gray-100" aria-labelledby="listings-heading">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex flex-wrap items-end justify-between gap-2 mb-4">
            <div>
              <h2 id="listings-heading" class="text-xl sm:text-2xl font-bold text-gray-900">Livestock Listings</h2>
            </div>
          </div>

          <div id="listings-container" class="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-6 mb-6"></div>
          <div id="pagination-container"></div>
        </div>
      </section>

    </main>

    <footer class="bg-white border-t border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-gray-500">
        <p>© <span id="footer-year"></span> Frontier Farms &amp; Consult. All rights reserved.</p>
        <nav class="flex flex-wrap gap-x-5 gap-y-2">
          <a href="/seller/login.html" class="hover:text-gray-700">Seller sign in</a>
          <a href="/terms.html" class="hover:text-gray-700">Terms of Service</a>
          <a href="/privacy.html" class="hover:text-gray-700">Privacy Policy</a>
        </nav>
      </div>
    </footer>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
    </script>

    <script>
      const HERO_INTERVAL_MS = 6000;
      const PAGE_SIZE = 12;
      const els = {
        animal: document.getElementById("filter-animal"),
        purpose: document.getElementById("filter-purpose"),
        breed: document.getElementById("filter-breed"),
        location: document.getElementById("filter-location"),
      };
      let animals = [];
      let tilesFor = null;
      let currentPage = 1;
      let optionsRequest = 0;

      function initHero() {
        const host = document.getElementById("hero-slides");
        const dots = document.getElementById("hero-dots");
        let index = 0;
        let timer;

        host.innerHTML = HERO_PHOTOS.map((p) => `<div class="hero-slide" role="img" aria-label="${escapeHtml(p.alt)}"></div>`).join("");
        dots.innerHTML = HERO_PHOTOS.map((p, i) => `<button type="button" aria-label="Show photo ${i + 1}: ${escapeHtml(p.label)}"></button>`).join("");
        const slides = host.querySelectorAll(".hero-slide");
        const dotBtns = dots.querySelectorAll("button");

        function load(i) {
          if (slides[i].dataset.loaded) return;
          const url = HERO_PHOTOS[i].src;
          const img = new Image();
          img.onload = () => {
            slides[i].style.backgroundImage = `url("${url}")`;
            slides[i].dataset.loaded = "1";
          };
          img.src = url;
        }
        function show(i) {
          index = i;
          load(i);
          load((i + 1) % slides.length);
          slides.forEach((s, n) => s.classList.toggle("active", n === i));
          dotBtns.forEach((d, n) => d.classList.toggle("active", n === i));
          document.getElementById("hero-caption").textContent = HERO_PHOTOS[i].label;
          document.getElementById("hero-ambient").style.backgroundImage = `url("${HERO_PHOTOS[i].src}")`;
        }
        function start() {
          clearInterval(timer);
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          timer = setInterval(() => show((index + 1) % slides.length), HERO_INTERVAL_MS);
        }
        dotBtns.forEach((d, n) => d.addEventListener("click", () => { show(n); start(); }));
        show(0);
        start();
      }

      async function loadAnimals() {
        const tiles = document.getElementById("animal-tiles");
        try {
          animals = (await apiRequest("/api/animals")).data;
        } catch (error) {
          renderEmptyState(tiles, { title: "Animals unavailable", message: error.message, icon: "layers" });
          return;
        }

        els.animal.innerHTML =
          placeholderOption("Select animal") +
          animals.map((a) => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");
        els.animal.value = "";

        tilesFor = null;
        syncTiles();
      }

      function tileHtml({ id, attr, name, subtitle = "", more = false, src, slides = null, alt, active = false }) {
        const fallback = "this.onerror=null;this.src='/images/livestock/cattle-fallback.webp'";
        const media = slides && slides.length > 1
          ? `<div class="tile-slides" aria-hidden="true">${slides.map((url, i) => `
              <img src="${escapeHtml(url)}" alt="" class="${i === 0 ? "active" : ""}" ${i === 0 ? "" : 'loading="lazy"'} decoding="async" onerror="${fallback}">`).join("")}
              <div class="tile-dots">${slides.map((_, i) => `<span class="${i === 0 ? "active" : ""}"></span>`).join("")}</div>
            </div>`
          : `<img src="${escapeHtml(slides?.[0] || src)}" alt="${escapeHtml(alt)}" loading="lazy" decoding="async" onerror="${fallback}">`;
        return `
          <a href="#listings" class="cat-tile group ${active ? "ring-4 ring-blue-500 ring-offset-2" : ""}" ${attr}="${id}" aria-label="${escapeHtml(alt)}">
            ${media}
            <div class="absolute inset-x-0 bottom-0 p-5">
              <div class="flex items-end justify-between gap-3">
                <h3 class="text-xl font-bold">${escapeHtml(name)}</h3>
                ${more ? `<span class="inline-flex items-center gap-1 text-sm font-semibold whitespace-nowrap pb-1 group-hover:translate-x-1 transition">See more <span class="w-4 h-4">${uiIcon("chevronRight")}</span></span>` : ""}
              </div>
              ${subtitle ? `<p class="text-sm text-blue-100 mt-1 line-clamp-2">${escapeHtml(subtitle)}</p>` : ""}
            </div>
          </a>`;
      }

      const TILE_SLIDE_MS = 4000;
      let tileTimers = [];

      function stopTileSlides() {
        tileTimers.forEach(clearTimeout);
        tileTimers.forEach(clearInterval);
        tileTimers = [];
      }

      function startTileSlides() {
        stopTileSlides();
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        document.querySelectorAll("#animal-tiles .tile-slides").forEach((box, n) => {
          const imgs = box.querySelectorAll("img");
          const dots = box.querySelectorAll(".tile-dots span");
          let index = 0;
          const advance = () => {
            imgs[index].classList.remove("active");
            dots[index]?.classList.remove("active");
            index = (index + 1) % imgs.length;
            imgs[index].classList.add("active");
            dots[index]?.classList.add("active");
          };
          tileTimers.push(setTimeout(() => {
            advance();
            tileTimers.push(setInterval(advance, TILE_SLIDE_MS));
          }, TILE_SLIDE_MS + n * 700));
        });
      }

      async function syncTiles() {
        const animalId = els.animal.value || "";
        if (tilesFor === animalId) return paintPurposeTiles();
        tilesFor = animalId;
        stopTileSlides();
        const tiles = document.getElementById("animal-tiles");
        const heading = document.getElementById("categories-heading");
        const back = document.getElementById("tiles-back");

        if (!animalId) {
          heading.textContent = "Browse by Category";
          back.classList.add("hidden");
          back.classList.remove("inline-flex");
          if (!animals.length) {
            renderEmptyState(tiles, { title: "No animals yet", message: "", icon: "layers" });
            return;
          }
          tiles.innerHTML = animals.map((a) => {
            const photo = animalPhoto(a);
            return tileHtml({
              id: a.id, attr: "data-animal", name: a.name, more: true,
              src: a.image_path || a.cover_image || photo.src(),
              alt: a.image_path || a.cover_image ? `${a.name} for sale` : photo.alt,
            });
          }).join("");
          tiles.querySelectorAll("[data-animal]").forEach((tile) =>
            tile.addEventListener("click", (event) => {
              event.preventDefault();
              selectAnimal(tile.dataset.animal, { scroll: false });
              document.getElementById("categories").scrollIntoView({ behavior: "smooth" });
            }),
          );
          return;
        }

        const animal = animals.find((a) => String(a.id) === String(animalId));
        heading.textContent = "Filter by Production purpose";
        back.classList.remove("hidden");
        back.classList.add("inline-flex");
        let purposes = [];
        try {
          purposes = (await apiRequest(`/api/categories?animal_id=${encodeURIComponent(animalId)}`)).data;
        } catch (error) {
          renderEmptyState(tiles, { title: "Purposes unavailable", message: error.message, icon: "layers" });
          return;
        }
        if (tilesFor !== animalId) return;
        if (!purposes.length) {
          renderEmptyState(tiles, { title: "No production purposes yet", message: "", icon: "layers" });
          return;
        }
        const fallback = animal ? animal.image_path || animalPhoto(animal).src() : "/images/livestock/cattle-fallback.webp";
        tiles.innerHTML = purposes.map((p) => tileHtml({
          id: p.id, attr: "data-purpose", name: p.name, subtitle: p.description,
          slides: p.photos.length ? p.photos : p.listing_photos.length ? p.listing_photos : [fallback],
          alt: `${p.animal_name} - ${p.name}`,
        })).join("");
        tiles.querySelectorAll("[data-purpose]").forEach((tile) =>
          tile.addEventListener("click", async (event) => {
            event.preventDefault();
            els.purpose.value = tile.dataset.purpose;
            els.breed.value = "";
            await refreshOptions();
            applyFilters({ scroll: true });
          }),
        );
        paintPurposeTiles();
        startTileSlides();
      }

      function paintPurposeTiles() {
        document.querySelectorAll("#animal-tiles [data-purpose]").forEach((tile) => {
          const on = tile.dataset.purpose === els.purpose.value;
          tile.classList.toggle("ring-4", on);
          tile.classList.toggle("ring-blue-500", on);
          tile.classList.toggle("ring-offset-2", on);
        });
      }

      document.getElementById("tiles-back").addEventListener("click", () => selectAnimal(""));

      async function selectAnimal(id, { scroll = false } = {}) {
        els.animal.value = id;
        els.purpose.value = "";
        els.breed.value = "";
        els.location.value = "";
        await refreshOptions();
        applyFilters({ scroll });
      }

      function placeholderOption(text) {
        return `<option value="" disabled hidden selected>${escapeHtml(text)}</option>`;
      }

      function fillSelect(select, placeholder, options, keep) {
        const optionHtml = (o) => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`;
        let body = "";
        if (options.some((o) => o.group)) {
          const groups = new Map();
          options.forEach((o) => {
            if (!groups.has(o.group)) groups.set(o.group, []);
            groups.get(o.group).push(o);
          });
          groups.forEach((list, group) => {
            body += `<optgroup label="${escapeHtml(group)}">${list.map(optionHtml).join("")}</optgroup>`;
          });
        } else {
          body = options.map(optionHtml).join("");
        }
        select.innerHTML = placeholderOption(placeholder) + body;
        select.value = options.some((o) => String(o.value) === String(keep)) ? keep : "";
      }

      const withCount = (name, count) => `${name}${count ? ` (${count})` : ""}`;

      async function refreshOptions() {
        const request = ++optionsRequest;
        const params = new URLSearchParams();
        if (els.animal.value) params.set("animal_id", els.animal.value);
        if (els.animal.value && els.purpose.value) params.set("category_id", els.purpose.value);
        if (els.animal.value && els.purpose.value && els.breed.value) params.set("breed_id", els.breed.value);

        let data;
        try {
          data = (await apiRequest(`/api/livestock/filters?${params}`)).data;
        } catch {
          return;
        }
        if (request !== optionsRequest) return;

        if (!els.animal.value) {
          els.purpose.disabled = true;
          fillSelect(els.purpose, "Choose animal first", [], "");
        } else {
          els.purpose.disabled = false;
          fillSelect(
            els.purpose,
            data.purposes.length ? "Select purpose" : "No purposes for this animal",
            data.purposes.map((p) => ({ value: p.id, label: withCount(p.name, p.count) })),
            els.purpose.value,
          );
        }

        if (!els.purpose.value) {
          els.breed.disabled = true;
          fillSelect(els.breed, els.animal.value ? "Choose purpose first" : "Choose animal first", [], "");
        } else {
          els.breed.disabled = false;
          fillSelect(
            els.breed,
            data.breeds.length ? "Select breed" : "No breeds for this purpose",
            data.breeds.map((b) => ({ value: b.id, label: withCount(b.name, b.count), group: b.group_name })),
            els.breed.value,
          );
        }

        fillSelect(els.location, "Select province", data.locations.map((l) => ({ value: l.value, label: withCount(l.value, l.count) })), els.location.value);
        syncTiles();
      }

      els.animal.addEventListener("change", () => {
        els.purpose.value = "";
        els.breed.value = "";
        refreshOptions();
      });
      els.purpose.addEventListener("change", () => {
        els.breed.value = "";
        refreshOptions();
      });
      els.breed.addEventListener("change", refreshOptions);

      function currentFilters() {
        const params = new URLSearchParams();
        if (els.animal.value) params.set("animal_id", els.animal.value);
        if (els.purpose.value) params.set("category_id", els.purpose.value);
        if (els.breed.value) params.set("breed_id", els.breed.value);
        if (els.location.value) params.set("location", els.location.value);
        if (searchQuery) params.set("q", searchQuery);
        return params;
      }

      function applyFilters({ scroll = true } = {}) {
        currentPage = 1;
        const params = currentFilters();
        const url = `${location.pathname}${params.toString() ? `?${params}` : ""}${scroll ? "#listings" : location.hash}`;
        history.replaceState(null, "", url);
        loadListings(1);
        if (scroll) document.getElementById("listings").scrollIntoView({ behavior: "smooth" });
      }

      async function loadListings(page = 1) {
        const container = document.getElementById("listings-container");
        document.getElementById("listings-heading").textContent = searchQuery ? `Results for "${searchQuery}"` : "Livestock Listings";
        renderSkeletonCards(container, 6);
        const params = currentFilters();
        params.set("page", page);
        params.set("limit", PAGE_SIZE);

        try {
          const res = await apiRequest(`/api/livestock?${params}`);
          if (!res.data.length && page > 1) {
            setPageInUrl(1);
            return loadListings(1);
          }
          if (!res.data.length) {
            const filtered = [...currentFilters().keys()].length > 0;
            renderEmptyState(container, filtered
              ? { title: searchQuery ? `No livestock matches "${searchQuery}"` : "No livestock matches these filters", message: "", icon: "search",
                  action: `<button type="button" onclick="clearFilters()" class="mt-4 text-sm font-semibold text-blue-600 hover:text-blue-700">Clear all filters</button>` }
              : { title: "No livestock listed yet", message: "Please check back soon.", icon: "cattle" });
          } else {
            container.innerHTML = res.data.map(renderLivestockCard).join("");
            bindInquireButtons(container, res.data);
          }
          renderPagination(res.pagination);
        } catch (error) {
          renderEmptyState(container, { title: "Listings could not be loaded", message: error.message, icon: "alert" });
          document.getElementById("pagination-container").innerHTML = "";
        }
      }

      function pageList(current, total) {
        const pages = new Set([1, total, current, current - 1, current + 1]);
        if (current <= 3) [2, 3, 4].forEach((n) => pages.add(n));
        if (current >= total - 2) [total - 1, total - 2, total - 3].forEach((n) => pages.add(n));
        const sorted = [...pages].filter((n) => n >= 1 && n <= total).sort((x, y) => x - y);
        const out = [];
        sorted.forEach((n, i) => {
          if (i && n - sorted[i - 1] > 1) out.push(n - sorted[i - 1] === 2 ? n - 1 : "gap");
          out.push(n);
        });
        return out;
      }

      function setPageInUrl(page) {
        const url = new URL(location.href);
        if (page > 1) url.searchParams.set("page", page);
        else url.searchParams.delete("page");
        history.replaceState(null, "", url.pathname + url.search + url.hash);
      }

      function renderPagination(pagination) {
        const container = document.getElementById("pagination-container");
        if (!pagination || pagination.total <= 1) {
          container.innerHTML = "";
          return;
        }
        const { current, total } = pagination;
        const arrow = (dir) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${dir === "prev" ? "m15 18-6-6 6-6" : "m9 18 6-6-6-6"}"/></svg>`;
        container.innerHTML = `
          <nav class="pager" aria-label="Listings pages">
            <button type="button" class="pager-btn pager-step" data-page="${current - 1}" ${current <= 1 ? "disabled" : ""} aria-label="Previous page">${arrow("prev")}<span>Previous</span></button>
            <div class="pager-pages">
              ${pageList(current, total).map((n) => n === "gap"
                ? `<span class="pager-gap" aria-hidden="true">…</span>`
                : `<button type="button" class="pager-btn ${n === current ? "is-current" : ""}" data-page="${n}" ${n === current ? 'aria-current="page"' : ""} aria-label="Page ${n}">${n}</button>`).join("")}
            </div>
            <button type="button" class="pager-btn pager-step" data-page="${current + 1}" ${current >= total ? "disabled" : ""} aria-label="Next page"><span>Next</span>${arrow("next")}</button>
          </nav>`;
        container.querySelectorAll("[data-page]").forEach((btn) => btn.addEventListener("click", () => {
          const page = Number(btn.dataset.page);
          if (!page || page === current) return;
          currentPage = page;
          setPageInUrl(page);
          document.getElementById("listings").scrollIntoView({ behavior: "smooth" });
          loadListings(page);
        }));
      }

      const menuCache = { purposes: {}, breeds: {} };
      const getPurposes = (animalId) =>
        (menuCache.purposes[animalId] ??= apiRequest(`/api/categories?animal_id=${encodeURIComponent(animalId)}`).then((r) => r.data));
      const getBreeds = (animalId, purposeId) =>
        (menuCache.breeds[`${animalId}:${purposeId}`] ??= apiRequest(
          `/api/livestock/filters?animal_id=${encodeURIComponent(animalId)}&category_id=${encodeURIComponent(purposeId)}`,
        ).then((r) => r.data.breeds));
      const menus = [...document.querySelectorAll(".nav-menu")];

      function navLink({ label, count, attrs = "", sub = false, active = false }) {
        return `<li class="nav-item">
          <button type="button" class="nav-link ${active ? "is-active" : ""}" ${attrs}>
            <span class="nav-label">${escapeHtml(label)}</span>
            ${sub ? `<span class="nav-caret">${uiIcon("chevronRight")}</span>` : ""}
          </button>
          ${sub ? `<div class="nav-flyout" data-sub></div>` : ""}
        </li>`;
      }

      const animalItems = () => animals.map((a) => navLink({
        label: a.name, count: a.livestock_count, sub: true,
        attrs: `data-animal="${a.id}"`, active: els.animal.value === String(a.id),
      })).join("");

      const purposeHeading = (animalId) =>
        "Filter by Production purpose";

      async function purposeItems(animalId, { heading = true } = {}) {
        const list = await getPurposes(animalId);
        const head = heading ? `<li class="nav-heading">${escapeHtml(purposeHeading(animalId))}</li>` : "";
        if (!list.length) return head + `<li class="nav-empty">No production purposes yet</li>`;
        return head + list.map((p) => navLink({
          label: p.name, count: p.livestock_count, sub: true,
          attrs: `data-animal="${animalId}" data-purpose="${p.id}"`, active: els.purpose.value === String(p.id),
        })).join("");
      }

      async function breedHeading(animalId, purposeId) {
        const animal = animals.find((a) => String(a.id) === String(animalId));
        const purpose = (await getPurposes(animalId)).find((p) => String(p.id) === String(purposeId));
        return `Breed for ${purpose ? `${purpose.name} ` : ""}${animal?.name || ""}`;
      }

      async function breedItems(animalId, purposeId, { heading = true } = {}) {
        const list = await getBreeds(animalId, purposeId);
        const head = heading ? `<li class="nav-heading">${escapeHtml(await breedHeading(animalId, purposeId))}</li>` : "";
        if (!list.length) return head + `<li class="nav-empty">No breeds yet</li>`;
        let html = head;
        let group = null;
        list.forEach((b) => {
          if (b.group_name && b.group_name !== group) {
            group = b.group_name;
            html += `<li class="nav-group">${escapeHtml(group)}</li>`;
          }
          html += navLink({
            label: b.name, count: b.count,
            attrs: `data-animal="${animalId}" data-purpose="${purposeId}" data-breed="${b.id}"`,
            active: els.breed.value === String(b.id),
          });
        });
        return html;
      }

      function provinceItems() {
        return [...els.location.options].filter((o) => o.value).map((o) => {
          const m = o.text.match(/^(.*?)(?: \((\d+)\))?$/);
          return navLink({ label: m[1], count: m[2], attrs: `data-province="${escapeHtml(o.value)}"`, active: els.location.value === o.value });
        }).join("");
      }

      function toggleFlyout(item) {
        const willOpen = !item.classList.contains("is-open");
        item.parentElement.querySelectorAll(":scope > .nav-item.is-open").forEach((sib) => {
          sib.classList.remove("is-open");
          sib.querySelectorAll(".nav-item.is-open").forEach((x) => x.classList.remove("is-open"));
        });
        if (willOpen) {
          item.classList.add("is-open");
          fillFlyout(item);
        }
      }

      async function fillFlyout(item) {
        const sub = item.querySelector(":scope > [data-sub]");
        if (!sub || sub.dataset.loaded) return;
        sub.dataset.loaded = "1";
        const link = item.querySelector(":scope > .nav-link");
        sub.innerHTML = `<ul class="nav-list"><li class="nav-empty">Loading...</li></ul>`;
        try {
          const html = link.dataset.purpose
            ? await breedItems(link.dataset.animal, link.dataset.purpose)
            : await purposeItems(link.dataset.animal);
          sub.innerHTML = `<ul class="nav-list ${link.dataset.purpose ? "nav-scroll" : ""}">${html}</ul>`;
        } catch {
          delete sub.dataset.loaded;
          sub.innerHTML = `<ul class="nav-list"><li class="nav-empty">Could not load</li></ul>`;
        }
      }

      function openMenu(menu) {
        menus.forEach((m) => m !== menu && closeMenu(m));
        menu.classList.add("open");
        menu.querySelector(".nav-menu-btn").setAttribute("aria-expanded", "true");
        const panel = menu.querySelector(".nav-dropdown");
        panel.innerHTML = `<ul class="nav-list">${menu.id === "menu-province" ? provinceItems() : animalItems()}</ul>`;
        panel.style.top = window.innerWidth < 1024
          ? `${Math.round(document.getElementById("page-topnav").getBoundingClientRect().bottom) + 6}px`
          : "";
        hideSearchResults();
      }

      function closeMenu(menu) {
        menu.classList.remove("open");
        menu.querySelector(".nav-menu-btn").setAttribute("aria-expanded", "false");
      }
      const closeMenus = () => menus.forEach(closeMenu);

      menus.forEach((menu) => {
        const btn = menu.querySelector(".nav-menu-btn");
        const panel = menu.querySelector(".nav-dropdown");
        btn.addEventListener("click", () => (menu.classList.contains("open") ? closeMenu(menu) : openMenu(menu)));
        panel.addEventListener("click", (e) => {
          const link = e.target.closest(".nav-link");
          if (!link) return;
          const d = link.dataset;
          if (d.province !== undefined) return pickProvince(d.province);
          if (d.breed) return pickAnimal(d.animal, d.purpose, d.breed);
          pickAnimal(d.animal, d.purpose, null, { close: false });
          toggleFlyout(link.closest(".nav-item"));
        });
      });

      document.addEventListener("click", (e) => {
        if (!e.composedPath().some((el) => el.classList?.contains("nav-menu"))) closeMenus();
      });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenus(); });

      async function pickAnimal(animalId, purposeId, breedId, { close = true } = {}) {
        if (close) closeMenus();
        els.animal.value = animalId || "";
        els.purpose.value = "";
        els.breed.value = "";
        await refreshOptions();
        if (purposeId) { els.purpose.value = purposeId; await refreshOptions(); }
        if (breedId) { els.breed.value = breedId; await refreshOptions(); }
        applyFilters({ scroll: true });
      }

      async function pickProvince(value) {
        closeMenus();
        els.location.value = value;
        await refreshOptions();
        applyFilters({ scroll: true });
      }

      let searchQuery = "";
      const searchForm = document.getElementById("site-search");
      if (window.matchMedia("(max-width: 767px)").matches) document.getElementById("search-input").placeholder = "Search livestock";
      const searchInput = document.getElementById("search-input");
      const searchResults = document.getElementById("search-results");
      const searchClear = document.getElementById("search-clear");
      let searchTimer;
      let searchRequest = 0;

      function setSearch(value) {
        searchQuery = value.trim();
        searchInput.value = searchQuery;
        searchClear.hidden = !searchInput.value;
      }

      function hideSearchResults() {
        searchResults.hidden = true;
        searchInput.setAttribute("aria-expanded", "false");
      }

      async function showSuggestions() {
        const term = searchInput.value.trim();
        if (term.length < 2) return hideSearchResults();
        const request = ++searchRequest;
        let res;
        try {
          res = await apiRequest(`/api/livestock?q=${encodeURIComponent(term)}&limit=6`);
        } catch {
          return hideSearchResults();
        }
        if (request !== searchRequest || searchInput.value.trim() !== term) return;
        const total = res.pagination.totalItems;
        searchResults.innerHTML = res.data.length
          ? `<ul>${res.data.map((l) => `
              <li><a href="${listingUrl(l.id)}" class="search-result">
                <span class="search-thumb">${l.thumb_path ? `<img src="${escapeHtml(l.thumb_path)}" alt="" loading="lazy">` : livestockFallbackMedia("w-5 h-5")}</span>
                <span class="min-w-0">
                  <span class="block font-semibold text-gray-900 truncate">${escapeHtml(l.title)}</span>
                  <span class="block text-xs text-gray-500 truncate">${escapeHtml([l.breed_name || l.animal_name, l.category_name, l.location].filter(Boolean).join(", "))}</span>
                </span>
              </a></li>`).join("")}</ul>
             <button type="submit" class="search-all">See all ${total} result${total === 1 ? "" : "s"} for "${escapeHtml(term)}"</button>`
          : `<p class="search-empty">No listings match "${escapeHtml(term)}"</p>`;
        searchResults.hidden = false;
        searchInput.setAttribute("aria-expanded", "true");
      }

      searchInput.addEventListener("input", () => {
        searchClear.hidden = !searchInput.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(showSuggestions, 220);
      });
      searchInput.addEventListener("focus", () => { if (searchInput.value.trim().length >= 2) showSuggestions(); });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { hideSearchResults(); searchInput.blur(); }
        if (e.key === "ArrowDown") { const first = searchResults.querySelector("a"); if (first && !searchResults.hidden) { e.preventDefault(); first.focus(); } }
      });
      searchResults.addEventListener("keydown", (e) => {
        const links = [...searchResults.querySelectorAll("a, .search-all")];
        const i = links.indexOf(document.activeElement);
        if (e.key === "ArrowDown" && i < links.length - 1) { e.preventDefault(); links[i + 1].focus(); }
        if (e.key === "ArrowUp") { e.preventDefault(); (i > 0 ? links[i - 1] : searchInput).focus(); }
        if (e.key === "Escape") { hideSearchResults(); searchInput.focus(); }
      });
      searchClear.addEventListener("click", () => {
        const hadSearch = Boolean(searchQuery);
        setSearch("");
        hideSearchResults();
        searchInput.focus();
        if (hadSearch) applyFilters({ scroll: false });
      });
      searchForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const term = searchInput.value.trim();
        if (!term) return;
        clearTimeout(searchTimer);
        hideSearchResults();
        searchInput.blur();
        closeMenus();
        Object.values(els).forEach((s) => (s.value = ""));
        setSearch(term);
        await refreshOptions();
        applyFilters({ scroll: true });
      });
      document.addEventListener("click", (e) => { if (!searchForm.contains(e.target)) hideSearchResults(); });

      async function clearFilters() {
        Object.values(els).forEach((s) => (s.value = ""));
        setSearch("");
        await refreshOptions();
        applyFilters({ scroll: false });
      }

      document.addEventListener("DOMContentLoaded", async () => {
        initHero();
        await loadAnimals();

        const q = getQueryParams();
        if (q.animal_id) els.animal.value = q.animal_id;
        await refreshOptions();
        if (q.category_id) { els.purpose.value = q.category_id; await refreshOptions(); }
        if (q.breed_id) { els.breed.value = q.breed_id; await refreshOptions(); }
        if (q.location) els.location.value = q.location;
        if (q.q) setSearch(q.q);
        currentPage = Math.max(1, Number.parseInt(q.page, 10) || 1);
        await loadListings(currentPage);
        if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
      });
    </script>
  </body>
</html>
