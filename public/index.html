<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier Marketplace - Find the Right Livestock</title>
    <meta
      name="description"
      content="Cattle, goats, sheep, pigs and poultry for sale across Zambia from Frontier Farms & Consult."
    />
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/livestock.js"></script>
    <script src="/js/inquiry.js"></script>
  </head>
  <body class="bg-gray-50">
    <nav id="page-topnav" class="bg-white shadow-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <a href="/" class="flex items-center gap-3" aria-label="Frontier Marketplace home">
            <div class="brand-mark-full">
              <img src="/images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
            </div>
            <span class="hidden sm:block font-bold text-gray-900">Frontier Marketplace</span>
          </a>
        </div>
      </div>
    </nav>

    <main>
      <section class="hero-photo text-white pt-14 pb-10 md:pt-24 md:pb-14" aria-labelledby="hero-heading">
        <div id="hero-slides" class="hero-slides" aria-hidden="true"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="max-w-2xl mb-8 md:mb-12">
            <h1 id="hero-heading" class="text-4xl md:text-6xl font-bold leading-tight">
              Find the Right Livestock for Your Needs
            </h1>
          </div>

          <form id="filter-form" class="filter-glass rounded-xl p-5 sm:p-6 max-w-6xl mx-auto" role="search" aria-label="Filter livestock">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
              <div>
                <label for="filter-animal" class="block text-sm font-medium text-white mb-2">Animal Category</label>
                <select id="filter-animal" class="filter-select w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 bg-white">
                  <option value="" disabled hidden selected>Select animal</option>
                </select>
              </div>
              <div>
                <label for="filter-purpose" class="block text-sm font-medium text-white mb-2">Production Purpose</label>
                <select id="filter-purpose" class="filter-select w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 bg-white" disabled>
                  <option value="" disabled hidden selected>Select an animal first</option>
                </select>
              </div>
              <div>
                <label for="filter-breed" class="block text-sm font-medium text-white mb-2">Breed / Strain</label>
                <select id="filter-breed" class="filter-select w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 bg-white" disabled>
                  <option value="" disabled hidden selected>Select a purpose first</option>
                </select>
              </div>
              <div>
                <label for="filter-location" class="block text-sm font-medium text-white mb-2">Province</label>
                <select id="filter-location" class="filter-select w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-900 bg-white">
                  <option value="" disabled hidden selected>Select province</option>
                </select>
              </div>
            </div>
            <div class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3">
              <button type="button" id="clear-filters-btn" class="text-sm font-medium text-blue-100 hover:text-white self-center sm:self-auto">
                Clear all filters
              </button>
              <button type="submit" id="search-btn" class="w-full sm:w-auto inline-flex justify-center items-center gap-2 bg-blue-600 text-white px-8 py-2.5 rounded-lg hover:bg-blue-700 font-medium">
                <span class="w-4 h-4" data-icon="search"></span>
                <span id="search-btn-label">Show Livestock</span>
              </button>
            </div>
          </form>

          <div class="mt-6 flex items-center justify-center gap-4">
            <div id="hero-dots" class="hero-dots" role="tablist" aria-label="Hero photos"></div>
          </div>
        </div>
      </section>

      <section id="categories" class="py-12 bg-white" style="scroll-margin-top: 72px" aria-labelledby="categories-heading">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="mb-6">
            <button type="button" id="tiles-back" class="hidden mb-2 items-center gap-1 text-sm font-medium text-blue-600 hover:text-blue-700"><span class="w-4 h-4" data-icon="chevronLeft"></span>All animals</button>
            <h2 id="categories-heading" class="text-3xl font-bold text-gray-900">Browse by Animal</h2>
          </div>
          <div id="animal-tiles" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>
        </div>
      </section>

      <section id="listings" class="bg-gray-50 py-10 border-t border-gray-100" style="scroll-margin-top: 72px" aria-labelledby="listings-heading">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex flex-wrap items-end justify-between gap-2 mb-4">
            <div>
              <h2 id="listings-heading" class="text-3xl font-bold text-gray-900">Livestock Listings</h2>
            </div>
          </div>

          <div id="category-chips" class="flex flex-wrap gap-2 mb-5"></div>

          <div id="listings-container" class="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-6 mb-6"></div>
          <div id="pagination-container"></div>
        </div>
      </section>

    </main>

    <footer class="bg-white border-t border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-gray-500">
        <p>© <span id="footer-year"></span> Frontier Farms &amp; Consult. All rights reserved.</p>
        <nav class="flex flex-wrap gap-x-5 gap-y-2">
          <a href="/terms.html" class="hover:text-gray-700">Terms of Service</a>
          <a href="/privacy.html" class="hover:text-gray-700">Privacy Policy</a>
        </nav>
      </div>
    </footer>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
    </script>

    <script>
      const HERO_INTERVAL_MS = 6000;
      const PAGE_SIZE = 12;
      const els = {
        animal: document.getElementById("filter-animal"),
        purpose: document.getElementById("filter-purpose"),
        breed: document.getElementById("filter-breed"),
        location: document.getElementById("filter-location"),
      };
      let animals = [];
      let tilesFor = null;
      let currentPage = 1;
      let optionsRequest = 0;

      function initHero() {
        const host = document.getElementById("hero-slides");
        const dots = document.getElementById("hero-dots");
        const width = viewportImageWidth();
        let index = 0;
        let timer;

        host.innerHTML = HERO_PHOTOS.map((p) => `<div class="hero-slide" role="img" aria-label="${escapeHtml(p.alt)}"></div>`).join("");
        dots.innerHTML = HERO_PHOTOS.map((p, i) => `<button type="button" aria-label="Show photo ${i + 1}: ${escapeHtml(p.place)}"></button>`).join("");
        const slides = host.querySelectorAll(".hero-slide");
        const dotBtns = dots.querySelectorAll("button");

        function load(i) {
          if (slides[i].dataset.loaded) return;
          const url = unsplashUrl(HERO_PHOTOS[i].id, width);
          const img = new Image();
          img.onload = () => {
            slides[i].style.backgroundImage = `url("${url}")`;
            slides[i].dataset.loaded = "1";
          };
          img.src = url;
        }
        function show(i) {
          index = i;
          load(i);
          load((i + 1) % slides.length);
          slides.forEach((s, n) => s.classList.toggle("active", n === i));
          dotBtns.forEach((d, n) => d.classList.toggle("active", n === i));
        }
        function start() {
          clearInterval(timer);
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          timer = setInterval(() => show((index + 1) % slides.length), HERO_INTERVAL_MS);
        }
        dotBtns.forEach((d, n) => d.addEventListener("click", () => { show(n); start(); }));
        show(0);
        start();
      }

      async function loadAnimals() {
        const tiles = document.getElementById("animal-tiles");
        try {
          animals = (await apiRequest("/api/animals")).data;
        } catch (error) {
          renderEmptyState(tiles, { title: "Animals unavailable", message: error.message, icon: "layers" });
          return;
        }

        els.animal.innerHTML =
          placeholderOption("Select animal") +
          animals.map((a) => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");
        els.animal.value = "";

        tilesFor = null;
        syncTiles();
        renderAnimalChips();
      }

      function tileHtml({ id, attr, name, subtitle = "", src, slides = null, alt, active = false }) {
        const fallback = "this.onerror=null;this.src='/images/livestock/cattle-fallback.webp'";
        const media = slides && slides.length > 1
          ? `<div class="tile-slides" aria-hidden="true">${slides.map((url, i) => `
              <img src="${escapeHtml(url)}" alt="" class="${i === 0 ? "active" : ""}" ${i === 0 ? "" : 'loading="lazy"'} decoding="async" onerror="${fallback}">`).join("")}
              <div class="tile-dots">${slides.map((_, i) => `<span class="${i === 0 ? "active" : ""}"></span>`).join("")}</div>
            </div>`
          : `<img src="${escapeHtml(slides?.[0] || src)}" alt="${escapeHtml(alt)}" loading="lazy" decoding="async" onerror="${fallback}">`;
        return `
          <a href="#listings" class="cat-tile group ${active ? "ring-4 ring-blue-500 ring-offset-2" : ""}" ${attr}="${id}" aria-label="${escapeHtml(alt)}">
            ${media}
            <div class="absolute inset-x-0 bottom-0 p-5">
              <h3 class="text-2xl font-bold">${escapeHtml(name)}</h3>
              ${subtitle ? `<p class="text-sm text-blue-100 mt-1 line-clamp-2">${escapeHtml(subtitle)}</p>` : ""}
            </div>
          </a>`;
      }

      const TILE_SLIDE_MS = 4000;
      let tileTimers = [];

      function stopTileSlides() {
        tileTimers.forEach(clearTimeout);
        tileTimers.forEach(clearInterval);
        tileTimers = [];
      }

      function startTileSlides() {
        stopTileSlides();
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        document.querySelectorAll("#animal-tiles .tile-slides").forEach((box, n) => {
          const imgs = box.querySelectorAll("img");
          const dots = box.querySelectorAll(".tile-dots span");
          let index = 0;
          const advance = () => {
            imgs[index].classList.remove("active");
            dots[index]?.classList.remove("active");
            index = (index + 1) % imgs.length;
            imgs[index].classList.add("active");
            dots[index]?.classList.add("active");
          };
          tileTimers.push(setTimeout(() => {
            advance();
            tileTimers.push(setInterval(advance, TILE_SLIDE_MS));
          }, TILE_SLIDE_MS + n * 700));
        });
      }

      async function syncTiles() {
        const animalId = els.animal.value || "";
        if (tilesFor === animalId) return paintPurposeTiles();
        tilesFor = animalId;
        stopTileSlides();
        const tiles = document.getElementById("animal-tiles");
        const heading = document.getElementById("categories-heading");
        const back = document.getElementById("tiles-back");

        if (!animalId) {
          heading.textContent = "Browse by Animal";
          back.classList.add("hidden");
          back.classList.remove("inline-flex");
          if (!animals.length) {
            renderEmptyState(tiles, { title: "No animals yet", message: "", icon: "layers" });
            return;
          }
          tiles.innerHTML = animals.map((a) => {
            const photo = animalPhoto(a);
            return tileHtml({
              id: a.id, attr: "data-animal", name: a.name,
              src: a.image_path || a.cover_image || photo.src(),
              alt: a.image_path || a.cover_image ? `${a.name} for sale` : photo.alt,
            });
          }).join("");
          tiles.querySelectorAll("[data-animal]").forEach((tile) =>
            tile.addEventListener("click", (event) => {
              event.preventDefault();
              selectAnimal(tile.dataset.animal, { scroll: false });
              document.getElementById("categories").scrollIntoView({ behavior: "smooth" });
            }),
          );
          return;
        }

        const animal = animals.find((a) => String(a.id) === String(animalId));
        heading.textContent = animal ? animal.name : "Production purposes";
        back.classList.remove("hidden");
        back.classList.add("inline-flex");
        let purposes = [];
        try {
          purposes = (await apiRequest(`/api/categories?animal_id=${encodeURIComponent(animalId)}`)).data;
        } catch (error) {
          renderEmptyState(tiles, { title: "Purposes unavailable", message: error.message, icon: "layers" });
          return;
        }
        if (tilesFor !== animalId) return;
        if (!purposes.length) {
          renderEmptyState(tiles, { title: "No production purposes yet", message: "", icon: "layers" });
          return;
        }
        const fallback = animal ? animal.image_path || animalPhoto(animal).src() : "/images/livestock/cattle-fallback.webp";
        tiles.innerHTML = purposes.map((p) => tileHtml({
          id: p.id, attr: "data-purpose", name: p.name, subtitle: p.description,
          slides: p.photos.length ? p.photos : p.listing_photos.length ? p.listing_photos : [fallback],
          alt: `${p.animal_name} - ${p.name}`,
        })).join("");
        tiles.querySelectorAll("[data-purpose]").forEach((tile) =>
          tile.addEventListener("click", async (event) => {
            event.preventDefault();
            els.purpose.value = tile.dataset.purpose;
            els.breed.value = "";
            await refreshOptions();
            applyFilters({ scroll: true });
          }),
        );
        paintPurposeTiles();
        startTileSlides();
      }

      function paintPurposeTiles() {
        document.querySelectorAll("#animal-tiles [data-purpose]").forEach((tile) => {
          const on = tile.dataset.purpose === els.purpose.value;
          tile.classList.toggle("ring-4", on);
          tile.classList.toggle("ring-blue-500", on);
          tile.classList.toggle("ring-offset-2", on);
        });
      }

      document.getElementById("tiles-back").addEventListener("click", () => selectAnimal(""));

      function renderAnimalChips() {
        const chips = document.getElementById("category-chips");
        chips.innerHTML = [{ id: "", name: "All" }, ...animals]
          .map((a) => `<button type="button" data-value="${a.id}" class="species-chip justify-center px-3"><span>${escapeHtml(a.name)}</span></button>`)
          .join("");
        chips.querySelectorAll("button").forEach((btn) =>
          btn.addEventListener("click", () => selectAnimal(btn.dataset.value)),
        );
        paintChips();
      }

      function paintChips() {
        document.querySelectorAll("#category-chips button").forEach((btn) => {
          const on = btn.dataset.value === els.animal.value;
          btn.classList.toggle("active", on);
          btn.setAttribute("aria-pressed", String(on));
        });
      }

      async function selectAnimal(id, { scroll = false } = {}) {
        els.animal.value = id;
        els.purpose.value = "";
        els.breed.value = "";
        els.location.value = "";
        await refreshOptions();
        applyFilters({ scroll });
      }

      function placeholderOption(text) {
        return `<option value="" disabled hidden selected>${escapeHtml(text)}</option>`;
      }

      function fillSelect(select, placeholder, options, keep) {
        const optionHtml = (o) => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`;
        let body = "";
        if (options.some((o) => o.group)) {
          const groups = new Map();
          options.forEach((o) => {
            if (!groups.has(o.group)) groups.set(o.group, []);
            groups.get(o.group).push(o);
          });
          groups.forEach((list, group) => {
            body += `<optgroup label="${escapeHtml(group)}">${list.map(optionHtml).join("")}</optgroup>`;
          });
        } else {
          body = options.map(optionHtml).join("");
        }
        select.innerHTML = placeholderOption(placeholder) + body;
        select.value = options.some((o) => String(o.value) === String(keep)) ? keep : "";
      }

      const withCount = (name, count) => `${name}${count ? ` (${count})` : ""}`;

      async function refreshOptions() {
        const request = ++optionsRequest;
        const params = new URLSearchParams();
        if (els.animal.value) params.set("animal_id", els.animal.value);
        if (els.animal.value && els.purpose.value) params.set("category_id", els.purpose.value);
        if (els.animal.value && els.purpose.value && els.breed.value) params.set("breed_id", els.breed.value);

        let data;
        try {
          data = (await apiRequest(`/api/livestock/filters?${params}`)).data;
        } catch {
          return;
        }
        if (request !== optionsRequest) return;

        if (!els.animal.value) {
          els.purpose.disabled = true;
          fillSelect(els.purpose, "Select an animal first", [], "");
        } else {
          els.purpose.disabled = false;
          fillSelect(
            els.purpose,
            data.purposes.length ? "Select production purpose" : "No purposes for this animal",
            data.purposes.map((p) => ({ value: p.id, label: withCount(p.name, p.count) })),
            els.purpose.value,
          );
        }

        if (!els.purpose.value) {
          els.breed.disabled = true;
          fillSelect(els.breed, els.animal.value ? "Select a purpose first" : "Select an animal first", [], "");
        } else {
          els.breed.disabled = false;
          fillSelect(
            els.breed,
            data.breeds.length ? "Select breed / strain" : "No breeds for this purpose",
            data.breeds.map((b) => ({ value: b.id, label: withCount(b.name, b.count), group: b.group_name })),
            els.breed.value,
          );
        }

        fillSelect(els.location, "Select province", data.locations.map((l) => ({ value: l.value, label: withCount(l.value, l.count) })), els.location.value);
        paintChips();
        syncTiles();
      }

      els.animal.addEventListener("change", () => {
        els.purpose.value = "";
        els.breed.value = "";
        refreshOptions();
      });
      els.purpose.addEventListener("change", () => {
        els.breed.value = "";
        refreshOptions();
      });
      els.breed.addEventListener("change", refreshOptions);

      function currentFilters() {
        const params = new URLSearchParams();
        if (els.animal.value) params.set("animal_id", els.animal.value);
        if (els.purpose.value) params.set("category_id", els.purpose.value);
        if (els.breed.value) params.set("breed_id", els.breed.value);
        if (els.location.value) params.set("location", els.location.value);
        return params;
      }

      function applyFilters({ scroll = true } = {}) {
        currentPage = 1;
        const params = currentFilters();
        const url = `${location.pathname}${params.toString() ? `?${params}` : ""}${scroll ? "#listings" : location.hash}`;
        history.replaceState(null, "", url);
        loadListings(1);
        paintChips();
        if (scroll) document.getElementById("listings").scrollIntoView({ behavior: "smooth" });
      }

      async function loadListings(page = 1) {
        const container = document.getElementById("listings-container");
        renderSkeletonCards(container, 6);
        const params = currentFilters();
        params.set("page", page);
        params.set("limit", PAGE_SIZE);

        try {
          const res = await apiRequest(`/api/livestock?${params}`);
          if (!res.data.length) {
            const filtered = [...currentFilters().keys()].length > 0;
            renderEmptyState(container, filtered
              ? { title: "No livestock matches these filters", message: "", icon: "search",
                  action: `<button type="button" onclick="document.getElementById('clear-filters-btn').click()" class="mt-4 text-sm font-semibold text-blue-600 hover:text-blue-700">Clear all filters</button>` }
              : { title: "No livestock listed yet", message: "Please check back soon.", icon: "cattle" });
          } else {
            container.innerHTML = res.data.map(renderLivestockCard).join("");
            bindInquireButtons(container, res.data);
          }
          renderPagination(res.pagination);
        } catch (error) {
          renderEmptyState(container, { title: "Listings could not be loaded", message: error.message, icon: "alert" });
          document.getElementById("pagination-container").innerHTML = "";
        }
      }

      function renderPagination(pagination) {
        const container = document.getElementById("pagination-container");
        container.innerHTML = "";
        if (pagination.total <= 1) return;
        container.appendChild(
          createPagination(pagination.current, pagination.total, (page) => {
            currentPage = page;
            document.getElementById("listings").scrollIntoView({ behavior: "smooth" });
            loadListings(page);
          }),
        );
      }

      document.getElementById("filter-form").addEventListener("submit", (event) => {
        event.preventDefault();
        applyFilters();
      });
      document.getElementById("clear-filters-btn").addEventListener("click", async () => {
        Object.values(els).forEach((s) => (s.value = ""));
        await refreshOptions();
        applyFilters({ scroll: false });
      });

      document.addEventListener("DOMContentLoaded", async () => {
        initHero();
        await loadAnimals();

        const q = getQueryParams();
        if (q.animal_id) els.animal.value = q.animal_id;
        await refreshOptions();
        if (q.category_id) { els.purpose.value = q.category_id; await refreshOptions(); }
        if (q.breed_id) { els.breed.value = q.breed_id; await refreshOptions(); }
        if (q.location) els.location.value = q.location;
        paintChips();
        await loadListings(1);
        if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
      });
    </script>
  </body>
</html>
