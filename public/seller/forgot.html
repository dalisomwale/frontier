<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Forgot Password - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/seller.js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="seller-header"></div>

    <main class="max-w-lg mx-auto px-4 py-8 sm:py-12">
      <a href="/" class="auth-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Back to home</span></a>
      <div class="ob-card ob-auth">
        <div class="ob-head">
          <span class="ob-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg></span>
          <h1 class="ob-title">Forgot Your Password?</h1>
          <p class="ob-sub">We'll email you a link to choose a new one.</p>
        </div>
        <form id="forgot-form" class="space-y-4" novalidate>
          <div id="form-alert" class="hidden alert text-sm mb-0" role="alert"></div>
          <div>
            <label for="email" class="field-label">Email</label>
            <input id="email" name="email" type="email" class="field-input" autocomplete="email" inputmode="email" required />
            <p class="field-error hidden" data-error-for="email"></p>
          </div>
          <button id="submit-btn" type="submit" class="ob-btn w-full">Send Reset Link</button>
        </form>
        <p class="ob-foot"><a href="/seller/login">Back to Sign In</a></p>
      </div>
    </main>

    <script>
      document.getElementById("seller-header").innerHTML = authPageHeader();
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
      bindPasswordToggles();
      const form = document.getElementById("forgot-form");
      const alertBox = document.getElementById("form-alert");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = form.email.value.trim();
        try {
          const res = await withBusy(document.getElementById("submit-btn"), "Sending…", () =>
            sellerApi("/api/seller/auth/forgot", { method: "POST", body: { email } }));
          alertBox.className = "alert alert-success text-sm mb-0";
          alertBox.textContent = res.message;
          form.reset();
        } catch (error) {
          alertBox.className = "alert alert-error text-sm mb-0";
          alertBox.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
