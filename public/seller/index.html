<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>My Dashboard - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/seller.js"></script>
  </head>
  <body class="bg-gray-50">
    <div id="app-sidebar"></div>
    <div id="seller-topbar"></div>

    <main id="seller-main" class="app-content-shifted max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" hidden>
      <div class="flex flex-wrap items-start justify-between gap-3 mb-6">
        <div>
          <h1 id="page-title" class="text-xl sm:text-2xl font-bold text-gray-900">Dashboard Overview</h1>
          <p id="welcome-line" class="text-gray-500 mt-1"></p>
        </div>
        <div class="flex items-center gap-2">
          <button id="add-btn" type="button" class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-semibold disabled:opacity-50 disabled:cursor-not-allowed" hidden>
            <span class="w-5 h-5" data-icon="plus"></span> Add Listing
          </button>
        </div>
      </div>

      <div id="account-banner"></div>

      <section id="tab-overview">
        <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <section class="bg-white rounded-xl border border-gray-100 shadow-sm">
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
              <h2 class="text-base font-bold text-gray-900">Recent Messages</h2>
              <a href="/seller/?tab=messages" data-tab-link="messages" class="text-sm font-medium text-blue-600 hover:text-blue-700">View all</a>
            </div>
            <div id="recent-messages"></div>
          </section>
          <section class="bg-white rounded-xl border border-gray-100 shadow-sm">
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
              <h2 class="text-base font-bold text-gray-900">My Listings</h2>
              <a href="/seller/?tab=listings" data-tab-link="listings" class="text-sm font-medium text-blue-600 hover:text-blue-700">View all</a>
            </div>
            <div id="recent-listings"></div>
          </section>
        </div>
      </section>

      <section id="tab-listings" hidden></section>
      <section id="tab-messages" hidden>
        <div class="inbox-shell seller-inbox" id="seller-inbox">
          <aside class="inbox-list-pane"><div id="msg-list" class="inbox-list"></div></aside>
          <section class="inbox-chat-pane" id="msg-chat"></section>
        </div>
      </section>
      <section id="tab-notifications" hidden>
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <div id="notifications-list"></div>
        </div>
      </section>
      <section id="tab-profile" hidden>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <form id="profile-form" class="bg-white rounded-xl border border-gray-100 shadow-sm p-5 space-y-4" novalidate>
            <h2 class="font-semibold text-gray-900">Your details</h2>
            <div data-alert class="hidden alert text-sm mb-0" role="alert"></div>
            <div data-fields class="space-y-4"></div>
            <button type="submit" class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-semibold">Save details</button>
          </form>
          <form id="password-form" class="bg-white rounded-xl border border-gray-100 shadow-sm p-5 space-y-4 self-start" novalidate>
            <h2 class="font-semibold text-gray-900">Change password</h2>
            <div data-alert class="hidden alert text-sm mb-0" role="alert"></div>
            <div>
              <label for="current_password" class="field-label">Current password</label>
              <div class="relative">
                <input id="current_password" name="current_password" type="password" class="field-input pr-12" autocomplete="current-password" />
                <button type="button" data-toggle-password="current_password" class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600" aria-label="Show password"></button>
              </div>
            </div>
            <div>
              <label for="new_password" class="field-label">New password</label>
              <div class="relative">
                <input id="new_password" name="new_password" type="password" class="field-input pr-12" autocomplete="new-password" />
                <button type="button" data-toggle-password="new_password" class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600" aria-label="Show password"></button>
              </div>
              <p class="text-xs text-gray-500 mt-1">At least 8 characters.</p>
            </div>
            <button type="submit" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 font-semibold">Update password</button>
          </form>
        </div>
      </section>
    </main>

    <div id="app-bottom-nav"></div>

    <script>
      const MAX_PHOTOS = 10;
      let seller = null;
      let taxonomy = { animals: [], purposes: [], breeds: [] };
      let listings = [];
      let messages = [];

      const approved = () => seller?.account_status === "approved";

      function renderBanner() {
        const box = document.getElementById("account-banner");
        if (seller.account_status === "pending") {
          box.innerHTML = `<div class="alert alert-warning text-sm mb-5"><strong>Your account is waiting for approval.</strong> Our team will check your details and email you. You can add listings once you're approved.</div>`;
        } else if (seller.account_status === "rejected") {
          box.innerHTML = `<div class="alert alert-error text-sm mb-5"><strong>Your seller account was not approved.</strong> ${seller.account_note ? escapeHtml(seller.account_note) + " " : ""}Please contact Frontier if you have questions.</div>`;
        } else {
          box.innerHTML = "";
        }
        const add = document.getElementById("add-btn");
        add.disabled = !approved();
        add.title = approved() ? "" : "Available once your account is approved";
      }

      async function loadSummary() {
        const { data } = await sellerApi("/api/seller/summary");
        const stat = (label, value, tab, tone = "") => `
          <a href="/seller/?tab=${tab}" data-tab-link="${tab}" class="stat-tile hover:shadow-md transition !p-4">
            <div class="min-w-0">
              <p class="text-gray-600 text-xs sm:text-sm font-medium leading-tight">${label}</p>
              <p class="text-xl sm:text-2xl font-bold ${tone || "text-gray-900"}">${Number(value).toLocaleString()}</p>
            </div>
          </a>`;
        document.getElementById("stats").innerHTML =
          stat("Live", data.listings.live, "listings", data.listings.live ? "text-green-700" : "") +
          stat("In review", data.listings.in_review, "listings", data.listings.in_review ? "text-amber-700" : "") +
          stat("Changes needed", data.listings.changes_needed, "listings", data.listings.changes_needed ? "text-red-600" : "") +
          stat("Unread messages", data.messages.unread, "messages", data.messages.unread ? "text-blue-700" : "");
        setUnreadBadge(data.messages.unread);
      }

      const stateHelp = {
        pending: "Our team is checking this listing. It will go live once approved.",
        rejected: "Please update this listing and save it to send it for review again.",
        published: "Visible on the website.",
        unpublished: "Not on the website. Submit it for review to bring it back.",
      };

      function listingCard(l) {
        const st = sellerState(l);
        const detail = [l.breed_name, l.category_name, l.animal_name].filter(Boolean).join(" · ");
        return `
          <article class="bg-white rounded-xl border border-gray-100 shadow-sm p-3 sm:p-4 flex gap-3 sm:gap-4">
            <div class="w-24 h-20 sm:w-32 sm:h-24 rounded-lg bg-gray-100 overflow-hidden flex-shrink-0">
              ${l.thumb_path ? `<img src="${escapeHtml(l.thumb_path)}" alt="" class="w-full h-full object-cover" loading="lazy">` : ""}
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-start justify-between gap-2">
                <h3 class="font-semibold text-gray-900 leading-snug">${escapeHtml(l.title)}</h3>
                ${statusPill(st.key, st.label)}
              </div>
              <p class="text-xs text-gray-500 mt-0.5">${escapeHtml(detail)} · ${escapeHtml(l.location)} · Qty ${Number(l.quantity)}</p>
              <p class="text-xs text-gray-500 mt-1">${escapeHtml(stateHelp[st.key])}${st.key === "published" && l.published_at ? ` Since ${formatDateShort(l.published_at)}.` : ""}</p>
              ${st.key === "rejected" && l.review_note ? `<div class="mt-2 text-sm rounded-lg bg-red-50 text-red-800 px-3 py-2"><strong>Frontier:</strong> ${escapeHtml(l.review_note)}</div>` : ""}
              <div class="flex flex-wrap gap-2 mt-3">
                ${approved() ? `<button type="button" data-edit="${l.id}" class="seller-action">Edit</button>` : ""}
                ${st.key === "published" ? `<a href="/listing.html?id=${l.id}" target="_blank" class="seller-action">View</a>` : ""}
                ${approved() && st.key === "unpublished" ? `<button type="button" data-resubmit="${l.id}" class="seller-action">Submit for review</button>` : ""}
              </div>
            </div>
          </article>`;
      }

      async function loadListings() {
        const box = document.getElementById("tab-listings");
        listings = (await sellerApi("/api/seller/listings")).data;
        if (!listings.length) {
          box.innerHTML = `<div class="bg-white rounded-xl border border-gray-100 shadow-sm"><div class="empty-state">
            <p class="font-semibold text-gray-800">No listings yet</p>
            <p class="text-sm mt-1">${approved() ? "Add your first listing. Our team will review it before it goes live." : "You can add listings once your account is approved."}</p>
            ${approved() ? `<button type="button" data-add class="mt-4 inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-semibold">Add Listing</button>` : ""}
          </div></div>`;
          box.querySelector("[data-add]")?.addEventListener("click", () => openEditor());
          return;
        }
        box.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-3">${listings.map(listingCard).join("")}</div>`;
        box.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openEditor(b.dataset.edit)));
        box.querySelectorAll("[data-resubmit]").forEach((b) => b.addEventListener("click", async () => {
          await runAction(() => sellerApi(`/api/seller/listings/${b.dataset.resubmit}/resubmit`, { method: "POST" }), "Sent for review.");
        }));
      }

      async function runAction(task, message) {
        try {
          await task();
          showNotification(message, "success");
          await Promise.all([loadListings(), loadSummary()]);
        } catch (error) {
          showNotification(error.message, "error");
        }
      }

      const optionsHtml = (opts) => opts.map((o) => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join("");

      function animalOptions() {
        return [{ value: "", label: "Select category" }, ...taxonomy.animals.map((a) => ({ value: a.id, label: a.name }))];
      }
      function purposeOptions(animalId) {
        const list = taxonomy.purposes.filter((p) => String(p.animal_id) === String(animalId));
        return [{ value: "", label: animalId ? "Select purpose" : "Select a category first" }, ...list.map((p) => ({ value: p.id, label: p.name }))];
      }
      function breedOptions(purposeId) {
        const purpose = taxonomy.purposes.find((p) => String(p.id) === String(purposeId));
        let list = [];
        if (purpose && isAllBreedsPurpose(purpose.name)) {
          list = taxonomy.breeds.filter((b) => String(b.animal_id) === String(purpose.animal_id))
            .map((b) => ({ value: b.id, label: String(b.category_id) === String(purpose.id) ? b.name : `${b.name} (${b.category_name})` }));
        } else if (purpose) {
          list = taxonomy.breeds.filter((b) => String(b.category_id) === String(purpose.id)).map((b) => ({ value: b.id, label: b.name }));
        }
        return [{ value: "", label: purposeId ? (list.length ? "Select breed" : "No breeds listed") : "Select a purpose first" }, ...list];
      }
      function typeOptions(animalId, selected) {
        const animal = taxonomy.animals.find((a) => String(a.id) === String(animalId));
        const list = livestockTypesFor(animal?.name);
        const values = selected && !list.includes(selected) ? [...list, selected] : list;
        return [{ value: "", label: "Not specified" }, ...values.map((t) => ({ value: t, label: t }))];
      }

      async function openEditor(id) {
        let item = {};
        if (id) {
          try {
            item = (await sellerApi(`/api/seller/listings/${id}`)).data;
          } catch (error) {
            return showNotification(error.message, "error");
          }
        }
        const photos = (item.images || []).map((im) => ({ id: im.id, src: im.thumb_path || im.image_path }));
        const removed = [];
        const animalId = item.animal_id ?? "";
        const live = item.status === "published";

        const body = `
          ${id ? `<div class="alert alert-info text-sm mb-0">${live ? "Saving changes made for this listing will be on the website when our team approves it." : "Saving sends this listing to our team for review."}</div>` : ""}
          ${field({ name: "title", label: "Title", value: item.title, required: true, placeholder: "e.g. 10 Boran heifers, in calf", attrs: 'maxlength="200"' })}
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${field({ name: "animal_id", label: "Category", value: animalId, required: true, options: animalOptions() })}
            ${field({ name: "category_id", label: "Production Purpose", value: item.category_id, required: true, options: purposeOptions(animalId) })}
            ${field({ name: "breed_id", label: "Breed", value: item.breed_id, options: breedOptions(item.category_id) })}
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            ${field({ name: "livestock_type", label: "Type", value: item.livestock_type, options: typeOptions(animalId, item.livestock_type) })}
            ${field({ name: "quantity", label: "Quantity", type: "number", value: item.quantity ?? 1, attrs: 'min="1" step="1" inputmode="numeric"' })}
            ${field({ name: "age_months", label: "Age (months)", type: "number", value: item.age_months, attrs: 'min="0" max="600" step="1" inputmode="numeric"' })}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-start">
            ${field({ name: "location", label: "Province", value: item.location || seller.province || "", required: true,
                options: [{ value: "", label: "Select province" }, ...ZAMBIA_PROVINCES.map((p) => ({ value: p, label: p }))] })}
            <div class="sm:col-span-2">
              ${field({ name: "description", label: "Description", type: "textarea", value: item.description, rows: 2,
                  placeholder: "Condition, vaccinations, feeding, price guide, anything a buyer should know", attrs: 'maxlength="5000"' })}
            </div>
          </div>
          <div>
            <div class="flex items-baseline justify-between mb-2">
              <span class="field-label !mb-0">Photos <span class="text-red-500">*</span></span>
              <span id="photo-count" class="text-xs text-gray-500"></span>
            </div>
            <div id="photo-grid" class="photo-grid"></div>
            <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
            <p class="text-xs text-gray-500 mt-2">Up to ${MAX_PHOTOS} clear photos. The first one is the cover.</p>
            <p class="field-error hidden" data-error-for="images"></p>
          </div>`;

        openFormModal({
          title: id ? "Edit Listing" : "Add Listing",
          submitText: id ? "Save and send for review" : "Submit for review",
          wide: true,
          body,
          onOpen(form) {
            const animalSelect = form.elements.animal_id;
            const purposeSelect = form.elements.category_id;
            const breedSelect = form.elements.breed_id;
            const typeSelect = form.elements.livestock_type;
            bindWordLimit(form.elements.description);
            animalSelect.addEventListener("change", () => {
              purposeSelect.innerHTML = optionsHtml(purposeOptions(animalSelect.value));
              breedSelect.innerHTML = optionsHtml(breedOptions(""));
              typeSelect.innerHTML = optionsHtml(typeOptions(animalSelect.value));
            });
            purposeSelect.addEventListener("change", () => {
              breedSelect.innerHTML = optionsHtml(breedOptions(purposeSelect.value));
            });

            const grid = form.querySelector("#photo-grid");
            const input = form.querySelector("#photo-input");
            const renderPhotos = () => {
              form.querySelector("#photo-count").textContent = `${photos.length} / ${MAX_PHOTOS}`;
              grid.innerHTML = photos.map((p, i) => `
                <div class="photo-item ${i === 0 ? "is-cover" : ""}">
                  <img src="${escapeHtml(p.src)}" alt="Photo ${i + 1}">
                  ${i === 0 ? '<span class="cover-badge">Cover</span>' : ""}
                  <div class="photo-actions">
                    ${i === 0 ? "<span></span>" : `<button type="button" data-cover="${i}">Make cover</button>`}
                    <button type="button" data-remove="${i}" aria-label="Remove photo">Remove</button>
                  </div>
                </div>`).join("") +
                (photos.length < MAX_PHOTOS
                  ? `<label class="photo-drop" for="photo-input" tabindex="0">${uiIcon("camera")}<span>Add photos</span></label>`
                  : "");
              grid.querySelectorAll("[data-cover]").forEach((b) => b.addEventListener("click", () => {
                photos.unshift(photos.splice(Number(b.dataset.cover), 1)[0]);
                form.dispatchEvent(new Event("input"));
                renderPhotos();
              }));
              grid.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", async () => {
                if (photos[Number(b.dataset.remove)]?.id && !(await confirmRemovePhoto())) return;
                const [p] = photos.splice(Number(b.dataset.remove), 1);
                if (p.id) removed.push(p.id);
                if (p.url) URL.revokeObjectURL(p.url);
                form.dispatchEvent(new Event("input"));
                renderPhotos();
              }));
              const drop = grid.querySelector(".photo-drop");
              if (drop) {
                drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
                ["dragover", "dragenter"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("dragover"); }));
                ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("dragover")));
                drop.addEventListener("drop", (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); });
              }
            };
            const addFiles = async (fileList) => {
              const files = [...fileList].filter((f) => /^image\/(jpeg|png|webp)$/.test(f.type));
              if (files.length < fileList.length) showNotification("Only JPEG, PNG and WebP photos can be added.", "warning");
              const room = MAX_PHOTOS - photos.length;
              if (files.length > room) showNotification(`Only ${room} more photo${room === 1 ? "" : "s"} can be added.`, "warning");
              for (const f of files.slice(0, room)) {
                const file = await shrinkImage(f);
                const url = URL.createObjectURL(file);
                photos.push({ file, src: url, url });
              }
              form.dispatchEvent(new Event("input"));
              renderPhotos();
            };
            input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
            renderPhotos();
          },
          async onSubmit(form) {
            const v = formValues(form);
            const errors = {};
            if (!v.title.trim()) errors.title = "Title is required.";
            if (!v.animal_id) errors.animal_id = "Please choose a category.";
            if (!v.category_id) errors.category_id = "Please choose a production purpose.";
            if (!v.location) errors.location = "Please choose a province.";
            if (countWords(v.description) > MAX_DESCRIPTION_WORDS) errors.description = `Description must be ${MAX_DESCRIPTION_WORDS} words or fewer.`;
            if (!photos.length) errors.images = "Please add at least one photo of the animals.";
            if (Object.keys(errors).length) {
              const e = new Error("Please correct the highlighted fields.");
              e.errors = errors;
              throw e;
            }

            const fd = new FormData();
            for (const key of ["title", "animal_id", "category_id", "breed_id", "livestock_type", "quantity", "age_months", "location", "description"]) fd.append(key, v[key] ?? "");
            fd.append("remove_image_ids", JSON.stringify(removed));
            fd.append("image_order", JSON.stringify(photos.filter((p) => p.id).map((p) => p.id)));
            const newPhotos = photos.filter((p) => p.file);
            newPhotos.forEach((p) => fd.append("images", p.file, p.file.name));

            const res = await sellerApi(id ? `/api/seller/listings/${id}` : "/api/seller/listings", { method: id ? "PUT" : "POST", body: fd });

            if (photos[0]?.file && res.data.images.length > 1) {
              const firstNewIndex = res.data.images.length - newPhotos.length;
              const coverId = res.data.images[firstNewIndex].id;
              const order = [coverId, ...res.data.images.filter((im) => im.id !== coverId).map((im) => im.id)];
              const fd2 = new FormData();
              for (const key of ["title", "animal_id", "category_id", "breed_id", "livestock_type", "quantity", "age_months", "location", "description"]) fd2.append(key, res.data[key] ?? "");
              fd2.append("image_order", JSON.stringify(order));
              await sellerApi(`/api/seller/listings/${res.data.id}`, { method: "PUT", body: fd2 });
            }
            photos.forEach((p) => p.url && URL.revokeObjectURL(p.url));
            showNotification("Sent for review. We'll email you when it's approved.", "success");
            await Promise.all([loadListings(), loadSummary()]);
          },
        });
      }

      let selectedMsg = null;

      function shortTime(value) {
        const d = new Date(value);
        const now = new Date();
        if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        if (now - d < 6 * 86400000) return d.toLocaleDateString("en-GB", { weekday: "short" });
        return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      }

      const lastOf = (m) => (m.messages || [])[(m.messages || []).length - 1];
      const thumbHtml = (m, cls = "msg-thumb") => `<span class="${cls}">${m.cover_thumb ? `<img src="${escapeHtml(m.cover_thumb)}" alt="">` : livestockFallbackMedia("w-5 h-5")}</span>`;

      function msgListItem(m) {
        const last = lastOf(m);
        const unread = !m.seller_seen_at;
        return `
          <button type="button" class="inbox-item ${unread ? "is-unread" : ""} ${String(selectedMsg) === String(m.id) ? "is-active" : ""}" data-msg="${m.id}">
            ${thumbHtml(m)}
            <span class="min-w-0 flex-1">
              <span class="flex items-baseline justify-between gap-2">
                <span class="inbox-name truncate">${escapeHtml(m.livestock_title)}</span>
                <span class="text-xs text-gray-400 flex-shrink-0">${last ? shortTime(last.created_at) : ""}</span>
              </span>
              <span class="block text-sm text-gray-600 truncate">${last ? `${last.sender === "seller" ? "You: " : ""}${escapeHtml(last.body)}` : ""}</span>
            </span>
            ${unread ? `<span class="inbox-unread-dot" aria-label="New"></span>` : ""}
          </button>`;
      }

      function renderMsgList() {
        const list = document.getElementById("msg-list");
        list.innerHTML = messages.map(msgListItem).join("");
        list.querySelectorAll("[data-msg]").forEach((b) => b.addEventListener("click", () => openConversation(b.dataset.msg)));
      }

      function msgPlaceholder() {
        document.getElementById("msg-chat").innerHTML = `
          <div class="inbox-placeholder">
            <span class="w-12 h-12 text-gray-300 block">${uiIcon("inbox")}</span>
            <p class="font-semibold text-gray-700 mt-3">Select a conversation</p>
          </div>`;
      }

      async function openConversation(id) {
        const m = messages.find((x) => String(x.id) === String(id));
        if (!m) return;
        selectedMsg = String(id);
        document.getElementById("seller-inbox").classList.add("has-selection");
        const chat = document.getElementById("msg-chat");
        const bubble = (x) => x.sender === "seller"
          ? `<div class="chat-row chat-right"><div class="chat-bubble chat-admin"><p class="chat-text">${escapeHtml(x.body)}</p><p class="chat-time">${shortTime(x.created_at)}</p></div></div>`
          : `<div class="chat-row"><div class="chat-bubble chat-customer"><p class="chat-who">Frontier</p><p class="chat-text">${escapeHtml(x.body)}</p><p class="chat-time">${shortTime(x.created_at)}</p></div></div>`;
        chat.innerHTML = `
          <header class="chat-head">
            <button type="button" data-back class="chat-back" aria-label="Back to messages"><span class="w-5 h-5 block">${uiIcon("chevronRight")}</span></button>
            ${thumbHtml(m, "chat-listing-thumb")}
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-gray-900 truncate">${m.livestock_id ? `<a href="/listing.html?id=${m.livestock_id}" target="_blank" class="hover:underline">${escapeHtml(m.livestock_title)}</a>` : escapeHtml(m.livestock_title)}</p>
              <p class="text-xs text-gray-500">Conversation with Frontier</p>
            </div>
          </header>
          <div class="chat-body" id="msg-body">
            ${(m.messages || []).length ? `<div class="chat-day">${formatDateShort(m.messages[0].created_at)}</div>` : ""}
            ${(m.messages || []).map(bubble).join("")}
          </div>
          <form class="chat-composer chat-composer-row" id="msg-form" novalidate>
            <textarea name="reply" rows="1" maxlength="2000" class="chat-input" placeholder="Reply to Frontier" aria-label="Reply to Frontier"></textarea>
            <button type="submit" class="chat-send-btn">Send</button>
          </form>`;
        const body = document.getElementById("msg-body");
        body.scrollTop = body.scrollHeight;
        renderMsgList();
        chat.querySelector("[data-back]").addEventListener("click", () => {
          selectedMsg = null;
          document.getElementById("seller-inbox").classList.remove("has-selection");
          renderMsgList();
          msgPlaceholder();
        });
        const form = document.getElementById("msg-form");
        const input = form.reply;
        const grow = () => { input.style.height = "auto"; input.style.height = `${Math.min(input.scrollHeight + 2, 140)}px`; };
        input.addEventListener("input", grow);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit(); });
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const reply = input.value.trim();
          if (!reply) return input.focus();
          const btn = form.querySelector("button");
          btn.disabled = true;
          try {
            const res = await sellerApi(`/api/seller/messages/${m.id}/reply`, { method: "POST", body: { reply } });
            Object.assign(m, res.data);
            messages = [m, ...messages.filter((x) => x !== m)];
            openConversation(m.id);
          } catch (error) {
            showNotification(error.message, "error");
            btn.disabled = false;
          }
        });
        if (!m.seller_seen_at) {
          m.seller_seen_at = new Date().toISOString();
          renderMsgList();
          sellerApi(`/api/seller/messages/${m.id}/seen`, { method: "POST" }).then(() => loadSummary()).catch(() => {});
        }
      }

      async function loadMessages() {
        const box = document.getElementById("seller-inbox");
        messages = (await sellerApi("/api/seller/messages")).data;
        if (!messages.length) {
          box.classList.remove("has-selection");
          document.getElementById("msg-list").innerHTML = `<div class="empty-state"><p class="font-semibold text-gray-800">No messages yet</p><p class="text-sm mt-1">When a buyer is interested in your livestock, Frontier will message you here and by email.</p></div>`;
          msgPlaceholder();
          return;
        }
        renderMsgList();
        if (selectedMsg && messages.some((m) => String(m.id) === selectedMsg)) openConversation(selectedMsg);
        else if (window.matchMedia("(min-width: 1024px)").matches) openConversation(messages[0].id);
        else msgPlaceholder();
      }

      function renderProfile() {
        const form = document.getElementById("profile-form");
        form.querySelector("[data-fields]").innerHTML = `
          ${field({ name: "name", label: "Full name", value: seller.name, required: true, attrs: 'maxlength="120" autocomplete="name"' })}
          ${field({ name: "business_name", label: "Farm or business name", value: seller.business_name, attrs: 'maxlength="150" autocomplete="organization"' })}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${field({ name: "phone", label: "WhatsApp Number", type: "tel", value: seller.phone, required: true, attrs: 'maxlength="30" autocomplete="tel"' })}
            ${field({ name: "email", label: "Email", type: "email", value: seller.email, required: true, attrs: 'maxlength="255" autocomplete="email"' })}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${field({ name: "province", label: "Province", value: seller.province, required: true, options: [{ value: "", label: "Select province" }, ...ZAMBIA_PROVINCES.map((p) => ({ value: p, label: p }))] })}
            ${field({ name: "address", label: "Town / farm location", value: seller.address, attrs: 'maxlength="255"' })}
          </div>`;
      }

      const TAB_TITLES = { overview: "Dashboard Overview", listings: "My Listings", messages: "Messages", notifications: "Notifications", profile: "Profile" };

      function setTab(name) {
        if (!TAB_TITLES[name]) name = "overview";
        Object.keys(TAB_TITLES).forEach((t) => (document.getElementById(`tab-${t}`).hidden = t !== name));
        document.getElementById("page-title").textContent = TAB_TITLES[name];
        document.getElementById("welcome-line").hidden = name !== "overview";
        document.getElementById("add-btn").hidden = name !== "listings";
        setSellerNavActive(name);
        const url = new URL(location.href);
        if (name === "overview") url.searchParams.delete("tab");
        else url.searchParams.set("tab", name);
        url.searchParams.delete("welcome");
        history.replaceState(null, "", url);
        window.scrollTo({ top: 0 });
        if (name === "messages") loadMessages().catch((e) => showNotification(e.message, "error"));
        if (name === "overview") loadOverview().catch(() => {});
        if (name === "notifications") {
          sellerNotifications.render();
          setTimeout(() => sellerNotifications.markAllRead(), 1500);
        }
      }

      document.addEventListener("click", (e) => {
        const link = e.target.closest("[data-tab-link]");
        if (!link || e.ctrlKey || e.metaKey || e.shiftKey) return;
        e.preventDefault();
        setTab(link.dataset.tabLink);
      });

      async function loadOverview() {
        const recentListings = document.getElementById("recent-listings");
        recentListings.innerHTML = listings.length
          ? listings.slice(0, 5).map((l) => {
              const st = sellerState(l);
              return `
                <a href="/seller/?tab=listings" data-tab-link="listings" class="flex items-center gap-3 px-5 py-3 border-b border-gray-50 last:border-0 hover:bg-gray-50">
                  <span class="w-14 h-10 rounded-md overflow-hidden bg-blue-50 flex-shrink-0">${l.thumb_path ? `<img src="${escapeHtml(l.thumb_path)}" alt="" class="w-full h-full object-cover" loading="lazy">` : ""}</span>
                  <span class="min-w-0 flex-1">
                    <span class="block font-semibold text-gray-900 truncate">${escapeHtml(l.title)}</span>
                    <span class="block text-xs text-gray-500 truncate">${escapeHtml([l.breed_name, l.category_name, l.location].filter(Boolean).join(", "))}</span>
                  </span>
                  ${statusPill(st.key, st.label)}
                </a>`;
            }).join("")
          : `<div class="empty-state"><p class="font-semibold text-gray-800">No listings yet</p><p class="text-sm mt-1">${approved() ? "Add your first listing from My Listings." : "You can add listings once your account is approved."}</p></div>`;

        const recentMessages = document.getElementById("recent-messages");
        const list = (await sellerApi("/api/seller/messages")).data;
        recentMessages.innerHTML = list.length
          ? list.slice(0, 5).map((m) => {
              const last = (m.messages || [])[m.messages.length - 1];
              return `
                <a href="/seller/?tab=messages" data-tab-link="messages" class="flex items-start gap-3 px-5 py-3 border-b border-gray-50 last:border-0 hover:bg-gray-50">
                  <span class="min-w-0 flex-1">
                    <span class="block font-semibold text-gray-900 truncate">${escapeHtml(m.livestock_title)}</span>
                    <span class="block text-sm text-gray-600 truncate">${last ? `${last.sender === "seller" ? "You: " : ""}${escapeHtml(last.body)}` : ""}</span>
                  </span>
                  <span class="flex flex-col items-end gap-1 flex-shrink-0">
                    <span class="text-xs text-gray-400">${last ? timeAgo(last.created_at) : ""}</span>
                    ${m.seller_seen_at ? "" : `<span class="status-pill st-new">New</span>`}
                  </span>
                </a>`;
            }).join("")
          : `<div class="empty-state"><p class="font-semibold text-gray-800">No messages yet</p><p class="text-sm mt-1">When a buyer is interested, Frontier will message you here.</p></div>`;
      }

      document.getElementById("add-btn").addEventListener("click", () => openEditor());

      document.getElementById("profile-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const alertBox = form.querySelector("[data-alert]");
        alertBox.classList.add("hidden");
        try {
          const res = await withBusy(form.querySelector("[type=submit]"), "Saving…", () =>
            sellerApi("/api/seller/me", { method: "PUT", body: formValues(form) }));
          seller = res.data;
          showFieldErrors(form, {});
          showNotification("Details saved.", "success");
        } catch (error) {
          showFieldErrors(form, error);
          alertBox.className = "alert alert-error text-sm mb-0";
          alertBox.textContent = error.message;
        }
      });

      document.getElementById("password-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const alertBox = form.querySelector("[data-alert]");
        try {
          await withBusy(form.querySelector("[type=submit]"), "Saving…", () =>
            sellerApi("/api/seller/me/password", { method: "PATCH", body: formValues(form) }));
          form.reset();
          alertBox.className = "alert alert-success text-sm mb-0";
          alertBox.textContent = "Password updated.";
        } catch (error) {
          alertBox.className = "alert alert-error text-sm mb-0";
          alertBox.textContent = error.message;
        }
      });

      async function refreshAfterNotice(notice) {
        try {
          if (notice.type === "account") {
            seller = (await sellerApi("/api/seller/auth/me")).data;
            renderBanner();
          }
          await Promise.all([loadSummary(), loadListings()]);
          if (notice.type === "message" && !document.getElementById("tab-messages").hidden) await loadMessages();
          if (!document.getElementById("tab-overview").hidden) await loadOverview();
        } catch {
        }
      }

      (async () => {
        document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
        bindPasswordToggles();
        seller = (await sellerApi("/api/seller/auth/me")).data;
        setSellerHint(true);
        renderSellerShell(seller);
        initSellerNotifications({ onNotification: refreshAfterNotice });
        window.addEventListener("seller:navigate", (e) => setTab(e.detail.tab || "overview"));
        const hour = new Date().getHours();
        document.getElementById("welcome-line").textContent = `${hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening"}, ${seller.name.split(" ")[0]}.`;
        document.getElementById("seller-main").hidden = false;
        renderBanner();
        renderProfile();
        const [tax] = await Promise.all([sellerApi("/api/seller/taxonomy"), loadSummary(), loadListings()]);
        taxonomy = tax.data;
        setTab(getQueryParams().tab || "overview");
      })().catch((error) => showNotification(error.message, "error"));
    </script>
  </body>
</html>
