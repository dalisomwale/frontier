<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Register as a Seller - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/password-rules.js"></script>
    <link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css" />
    <script src="/vendor/leaflet-1.9.4/leaflet.js"></script>
    <script src="/js/zambia-districts.js"></script>
    <script src="/js/transport-ui.js"></script>
    <script src="/js/onboarding.js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="seller-header"></div>

    <main class="max-w-lg mx-auto px-4 py-8 sm:py-12">
      <a href="/" class="auth-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Back to home</span></a>
      <div class="ob-card ob-blue">
        <div class="ob-head">
          <h1 class="ob-title">Sell on Frontier</h1>
          <p class="ob-sub">List your livestock and feed in three quick steps.</p>
        </div>
        <form id="register-form" novalidate>
          <div id="form-alert" class="hidden alert alert-error text-sm mb-4" role="alert"></div>
          <div data-ob-progress></div>

          <section class="ob-step" data-title="About You">
            <div>
              <label for="name" class="field-label">Full Name</label>
              <input id="name" name="name" type="text" class="field-input" autocomplete="name" required maxlength="120" />
              <p class="field-error hidden" data-error-for="name"></p>
            </div>
            <div>
              <label for="business_name" class="field-label">Farm or Business Name <span class="ob-opt">(optional)</span></label>
              <input id="business_name" name="business_name" type="text" class="field-input" autocomplete="organization" maxlength="150" />
              <p class="field-error hidden" data-error-for="business_name"></p>
            </div>
            <div>
              <label for="phone" class="field-label">WhatsApp Number</label>
              <input id="phone" name="phone" type="tel" class="field-input" autocomplete="tel" inputmode="tel" required maxlength="30" placeholder="0977 123 456" />
              <p class="field-error hidden" data-error-for="phone"></p>
            </div>
            <div>
              <label for="email" class="field-label">Email</label>
              <input id="email" name="email" type="email" class="field-input" autocomplete="email" inputmode="email" required maxlength="255" />
              <p class="field-error hidden" data-error-for="email"></p>
            </div>
          </section>

          <section class="ob-step" data-title="Your Farm" hidden>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="province" class="field-label">Province</label>
                <select id="province" name="province" class="field-input" required></select>
                <p class="field-error hidden" data-error-for="province"></p>
              </div>
              <div>
                <label for="address" class="field-label">Town or Farm Area <span class="ob-opt">(optional)</span></label>
                <input id="address" name="address" type="text" class="field-input" autocomplete="address-level2" maxlength="255" />
                <p class="field-error hidden" data-error-for="address"></p>
              </div>
            </div>
            <div>
              <p class="field-label">Pickup Point for Transport</p>
              <div class="ob-choice" role="radiogroup" aria-label="Pickup point">
                <label><input type="radio" name="pickup_now" value="1"><span>Add It Now<small>Buyers can order transport</small></span></label>
                <label><input type="radio" name="pickup_now" value="0" checked><span>Later<small>Add it in your profile</small></span></label>
              </div>
            </div>
            <div id="pickup-fields" class="space-y-4" hidden>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label for="pickup_district" class="field-label">District</label>
                  <input id="pickup_district" name="pickup_district" class="field-input" maxlength="80" />
                  <p class="field-error hidden" data-error-for="pickup_district"></p>
                </div>
                <div>
                  <label for="pickup_address" class="field-label">Address or Directions</label>
                  <input id="pickup_address" name="pickup_address" class="field-input" maxlength="255" placeholder="e.g. Plot 9, off Great North Rd" />
                  <p class="field-error hidden" data-error-for="pickup_address"></p>
                </div>
              </div>
              <div>
                <div id="pickup-map"></div>
                <p class="field-error hidden" data-error-for="pickup_point"></p>
              </div>
            </div>
          </section>

          <section class="ob-step" data-title="Password" hidden>
            <div>
              <label for="password" class="field-label">Password</label>
              <div class="relative">
                <input id="password" name="password" type="password" class="field-input pr-12" autocomplete="new-password" required />
                <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600" aria-label="Show password"></button>
              </div>
              <p class="field-error hidden" data-error-for="password"></p>
            </div>
            <label class="co-terms-box">
              <input id="agree" name="agree" type="checkbox" />
              <span>I accept the <a href="/terms" target="_blank" class="text-blue-700 hover:underline">Terms</a> and <a href="/privacy" target="_blank" class="text-blue-700 hover:underline">Privacy Policy</a>.</span>
            </label>
            <p class="field-error hidden" data-error-for="agree"></p>
          </section>

          <div class="ob-nav">
            <button type="button" class="ob-btn ob-btn-back" data-ob-back>Back</button>
            <button type="button" class="ob-btn" data-ob-next>Continue</button>
            <button id="submit-btn" type="submit" class="ob-btn" data-ob-submit hidden>Create Account</button>
          </div>
        </form>
        <p class="ob-foot">Already have an account? <a href="/seller/login">Sign In</a></p>
      </div>
    </main>

    <script>
      document.getElementById("seller-header").innerHTML = sellerPageHeader(null);
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
      bindPasswordToggles();
      const form = document.getElementById("register-form");
      const meter = bindPasswordMeter(form.elements.password, () => ({ email: form.elements.email.value, phone: form.elements.phone.value }));
      const alertBox = document.getElementById("form-alert");
      form.province.innerHTML = `<option value="">Choose…</option>` + ZAMBIA_PROVINCES.map((p) => `<option>${p}</option>`).join("");

      sellerApi("/api/seller/auth/me").then(() => (window.location.href = "/seller/")).catch(() => {});

      // The pickup point: the map only loads when the seller chooses to add it now.
      let pickupPicker = null;
      const pickupBox = document.getElementById("pickup-fields");
      const pickupNow = () => form.querySelector('input[name="pickup_now"]:checked').value === "1";
      form.querySelectorAll('input[name="pickup_now"]').forEach((r) => r.addEventListener("change", async () => {
        pickupBox.hidden = !pickupNow();
        showFieldErrors(form, {});
        if (pickupNow() && !pickupPicker) {
          trPlaceFields({ province: form.province, district: form.pickup_district, address: form.pickup_address, picker: () => pickupPicker });
          pickupPicker = await trPointPicker(document.getElementById("pickup-map"), { kind: "pickup", label: "Pickup point", onChange: () => steps.clear("pickup_point") });
        }
        if (pickupNow() && pickupPicker && pickupPicker.map) setTimeout(() => pickupPicker.map.invalidateSize(), 50);
      }));

      const steps = obSteps(form, {
        check(i) {
          const e = {};
          if (i === 0) {
            if (form.name.value.trim().length < 2) e.name = "Please enter your full name.";
            if (!obPhoneOk(form.phone.value)) e.phone = "Please enter your WhatsApp number, e.g. 0977 123 456.";
            if (!OB_EMAIL.test(form.email.value.trim())) e.email = "Please enter a valid email address.";
          }
          if (i === 1) {
            if (!form.province.value) e.province = "Please choose your province.";
            if (pickupNow()) {
              if (form.pickup_district.value.trim().length < 2) e.pickup_district = "Please choose the district.";
              if (form.pickup_address.value.trim().length < 3) e.pickup_address = "Please enter the address or directions.";
              if (!(pickupPicker && pickupPicker.get())) e.pickup_point = "Please mark the pickup point on the map.";
            }
          }
          if (i === 2) {
            if (meter && meter.problem()) e.password = meter.problem();
            else if (!form.password.value) e.password = "Please choose a password.";
            if (!form.agree.checked) e.agree = "Please accept the Terms and Privacy Policy.";
          }
          return e;
        },
        onStep: (i) => {
          alertBox.classList.add("hidden");
          if (i === 1 && pickupPicker && pickupPicker.map) setTimeout(() => pickupPicker.map.invalidateSize(), 50);
        },
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        alertBox.classList.add("hidden");
        const v = Object.fromEntries(new FormData(form).entries());
        delete v.pickup_now;
        delete v.agree;
        // The pickup point goes with the form only when the seller chose to add it now.
        if (pickupNow()) {
          const pin = pickupPicker ? pickupPicker.get() : null;
          Object.assign(v, { pickup_lat: pin ? pin.lat : "", pickup_lng: pin ? pin.lng : "" });
        } else { delete v.pickup_district; delete v.pickup_address; }
        try {
          await withBusy(document.getElementById("submit-btn"), "Creating account…", () =>
            sellerApi("/api/seller/auth/register", { method: "POST", body: v }));
          setSellerHint(true);
          window.location.href = "/seller/?welcome=1";
        } catch (error) {
          const errs = error.errors || {};
          steps.showErrors(errs);
          if (!Object.keys(errs).some((k) => form.querySelector(`[data-error-for="${k}"]`))) {
            alertBox.textContent = error.message;
            alertBox.classList.remove("hidden");
          }
        }
      });
    </script>
  </body>
</html>
