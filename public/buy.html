<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Buy - Frontier Marketplace</title>
    <script src="/js/main.js"></script>
    <script src="/js/cart.js"></script>
    <script>
      // Older "Buy Now" links: put the listing in the cart and go to checkout.
      (function () {
        const q = new URLSearchParams(location.search);
        const id = Number.parseInt(q.get("id"), 10);
        if (id > 0) addToCart(id, Number.parseInt(q.get("qty"), 10) || 1);
        location.replace(id > 0 ? "/checkout.html" : "/cart.html");
      })();
    </script>
  </head>
  <body></body>
</html>
