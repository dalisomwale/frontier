<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace - Frontier Marketplace</title>
    <link rel="icon" href="images/logo-icon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Loaded blocking, in <head>, so the bottom nav below can be painted
         on first render instead of popping in after the page has already
         shown without it. -->
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/species.js"></script>
    <script src="/js/app-shell.js"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Navigation -->
    <nav id="page-topnav" class="bg-white shadow-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-3">
              <div class="brand-mark-full">
                <img src="images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
              </div>
            </a>
          </div>

          <div id="nav-auth" class="relative hidden md:block">
            <button
              id="nav-auth-toggle"
              type="button"
              class="w-10 h-10 rounded-full border border-gray-300 flex items-center justify-center text-gray-600 hover:bg-gray-50 hover:text-gray-900"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="Account"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="20"
                height="20"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
              </svg>
            </button>
            <div
              id="nav-auth-menu"
              class="hidden absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-lg shadow-lg py-1 z-50"
            >
              <a
                href="login.html"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"
                >Login</a
              >
              <a
                href="register.html"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"
                >Register</a
              >
            </div>
          </div>

          <div id="nav-authenticated" class="hidden flex items-center gap-4">
            <a
              href="dashboard.html"
              class="text-gray-600 hover:text-gray-900 font-medium"
              >Dashboard</a
            >
            <a
              href="messages.html"
              class="text-gray-600 hover:text-gray-900 font-medium"
              >Messages</a
            >
            <a
              href="profile.html"
              class="text-gray-600 hover:text-gray-900 font-medium"
              >Profile</a
            >
            <button
              id="logout-btn"
              class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div id="tab-self-content">
    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- Sidebar Filters -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-lg shadow-md p-6 sticky top-20">
            <h2 class="text-xl font-bold text-gray-900 mb-6">Filters</h2>

            <!-- Keyword Search -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Keyword</label
              >
              <input
                type="text"
                id="filter-keyword"
                placeholder="Search..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            <!-- Species -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Species</label
              >
              <div
                id="species-picker"
                class="grid grid-cols-3 gap-2 mb-2"
              ></div>
              <select id="filter-species" class="hidden">
                <option value="">All Species</option>
                <option value="Cattle">Cattle</option>
                <option value="Goats">Goats</option>
                <option value="Sheep">Sheep</option>
                <option value="Pigs">Pigs</option>
                <option value="Poultry">Poultry</option>
                <option value="Other">Other Livestock</option>
              </select>
            </div>

            <!-- Location -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Breed</label
              >
              <input
                type="text"
                id="filter-breed"
                placeholder="Any breed"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            <!-- Location -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Location</label
              >
              <input
                type="text"
                id="filter-location"
                placeholder="e.g., Lusaka"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Weight (kg)</label
              >
              <div class="flex gap-2">
                <input
                  type="number"
                  min="0"
                  id="filter-min-weight"
                  placeholder="Min"
                  class="w-1/2 px-4 py-2 border border-gray-300 rounded-lg"
                />
                <input
                  type="number"
                  min="0"
                  id="filter-max-weight"
                  placeholder="Max"
                  class="w-1/2 px-4 py-2 border border-gray-300 rounded-lg"
                />
              </div>
            </div>

            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Age</label
              >
              <input
                type="text"
                id="filter-age"
                placeholder="Any age"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg"
              />
            </div>

            <!-- Price Range -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Price Range</label
              >
              <div class="flex gap-2">
                <input
                  type="number"
                  id="filter-min-price"
                  placeholder="Min"
                  class="w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <input
                  type="number"
                  id="filter-max-price"
                  placeholder="Max"
                  class="w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
              </div>
            </div>

            <!-- Sort -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Sort By</label
              >
              <select
                id="filter-sort"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="newest">Newest First</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="location">Location</option>
              </select>
            </div>

            <!-- Apply Filters Button -->
            <button
              id="apply-filters"
              class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium"
            >
              Apply Filters
            </button>

            <button
              id="clear-filters"
              class="w-full mt-2 bg-gray-300 text-gray-900 px-4 py-2 rounded-lg hover:bg-gray-400 font-medium"
            >
              Clear Filters
            </button>
          </div>
        </div>

        <!-- Listings Grid -->
        <div class="lg:col-span-3">
          <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Livestock Listings</h1>
            <p id="results-count" class="text-gray-600 mt-2"></p>
          </div>

          <!-- Listings Container -->
          <div
            id="listings-container"
            class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8"
          >
            <!-- Listings will be loaded here -->
          </div>

          <!-- Pagination -->
          <div id="pagination-container" class="mt-8">
            <!-- Pagination will be rendered here -->
          </div>
        </div>
      </div>
    </div>

    </div>
    <div id="tab-frame-host" class="tab-frame-host hidden"></div>

    <!-- Mobile app-style bottom navigation: rendered synchronously, right
         here, instead of waiting for DOMContentLoaded. -->
    <div id="app-bottom-nav"></div>
    <script>
      renderBottomNav("public");
    </script>

    <script src="/js/marketplace.js"></script>
    <script>
      let currentPage = 1;
      const SPECIES_OPTIONS = ["", "Cattle", "Goats", "Sheep", "Pigs", "Poultry", "Other"];

      function renderSpeciesPicker() {
        const picker = document.getElementById("species-picker");
        const select = document.getElementById("filter-species");

        function paint() {
          picker.querySelectorAll("button").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.value === select.value);
          });
        }

        picker.innerHTML = SPECIES_OPTIONS.map((value) => {
          const label = value || "All";
          return `
            <button type="button" data-value="${value}" class="species-chip justify-center ${value ? "" : "px-3"}">
              ${value ? speciesIcon(value) : ""}
              <span>${label}</span>
            </button>`;
        }).join("");

        picker.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            select.value = btn.dataset.value;
            paint();
            currentPage = 1;
            loadListings(1);
          });
        });

        window.paintSpeciesPicker = paint;
        paint();
      }

      document.addEventListener("DOMContentLoaded", async () => {
        renderSpeciesPicker();
        await checkAuthentication();
        // Re-run after the server round-trip resolves, in case the
        // optimistic localStorage snapshot used for the instant render
        // above was missing or stale.
        renderBottomNav("public");
        const query = getQueryParams();
        [
          "keyword",
          "species",
          "breed",
          "location",
          "minPrice",
          "maxPrice",
          "minWeight",
          "maxWeight",
          "age",
          "sort",
        ].forEach((key) => {
          const field = document.getElementById(
            `filter-${key.replace(/([A-Z])/g, "-$1").toLowerCase()}`,
          );
          if (field && query[key]) field.value = query[key];
        });
        paintSpeciesPicker();

        // Initialize marketplace
        await loadListings(1);

        // Setup filter listeners
        document
          .getElementById("apply-filters")
          .addEventListener("click", () => {
            currentPage = 1;
            loadListings(1);
          });

        document
          .getElementById("clear-filters")
          .addEventListener("click", () => {
            document.getElementById("filter-keyword").value = "";
            document.getElementById("filter-species").value = "";
            document.getElementById("filter-breed").value = "";
            document.getElementById("filter-location").value = "";
            document.getElementById("filter-min-price").value = "";
            document.getElementById("filter-max-price").value = "";
            document.getElementById("filter-min-weight").value = "";
            document.getElementById("filter-max-weight").value = "";
            document.getElementById("filter-age").value = "";
            document.getElementById("filter-sort").value = "newest";
            paintSpeciesPicker();
            currentPage = 1;
            loadListings(1);
          });

        // Logout
        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", async () => {
            await logout();
          });
        }
      });

      /**
       * Load listings from API
       */
      async function loadListings(page = 1) {
        showLoading();

        try {
          const keyword = document.getElementById("filter-keyword").value;
          const species = document.getElementById("filter-species").value;
          const breed = document.getElementById("filter-breed").value;
          const location = document.getElementById("filter-location").value;
          const minPrice = document.getElementById("filter-min-price").value;
          const maxPrice = document.getElementById("filter-max-price").value;
          const minWeight = document.getElementById("filter-min-weight").value;
          const maxWeight = document.getElementById("filter-max-weight").value;
          const age = document.getElementById("filter-age").value;
          const sort = document.getElementById("filter-sort").value;

          const params = new URLSearchParams();
          if (keyword) params.append("keyword", keyword);
          if (species) params.append("species", species);
          if (breed) params.append("breed", breed);
          if (location) params.append("location", location);
          if (minPrice) params.append("minPrice", minPrice);
          if (maxPrice) params.append("maxPrice", maxPrice);
          if (minWeight) params.append("minWeight", minWeight);
          if (maxWeight) params.append("maxWeight", maxWeight);
          if (age) params.append("age", age);
          params.append("sort", sort);
          params.append("page", page);
          params.append("limit", 12);

          const response = await apiRequest(
            `/api/listings?${params.toString()}`,
          );

          if (response.success) {
            renderListings(response.data);
            renderPagination(response.pagination);
            document.getElementById("results-count").textContent =
              `${response.pagination.totalItems} listings found`;
          } else {
            showNotification("Failed to load listings", "error");
          }
        } catch (error) {
          console.error("Load listings error:", error);
          showNotification("Failed to load listings", "error");
        } finally {
          hideLoading();
        }
      }

      /**
       * Render listings
       */
      function renderListings(listings) {
        const container = document.getElementById("listings-container");

        if (listings.length === 0) {
          renderEmptyState(container, "No livestock listings available yet.");
          return;
        }

        container.innerHTML = listings
          .map(
            (listing) => `
        <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition cursor-pointer"
             onclick="window.location.href = 'listing.html?id=${listing.id}'">
          <div class="bg-gray-200 h-48 flex items-center justify-center">
            ${listing.main_image ? `<img src="${listing.main_image}" alt="Livestock listing" class="h-full w-full object-cover">` : speciesFallbackMedia(listing.species)}
          </div>
          <div class="p-4">
            <h3 class="text-lg font-semibold text-gray-900 line-clamp-2 mb-2">${escapeHtml(listing.title)}</h3>
            <p class="text-sm text-gray-600 mb-2 flex items-center flex-wrap gap-2">
              <span class="species-chip">${speciesIcon(listing.species)}<span>${escapeHtml(listing.species)}</span></span>
              ${listing.breed ? `<span class="text-gray-700">${escapeHtml(listing.breed)}</span>` : ""}
            </p>
            <div class="text-2xl font-bold text-blue-600 mb-3">K${parseFloat(listing.price).toLocaleString()}</div>
            <div class="text-sm text-gray-600 space-y-1 mb-3">
              ${listing.age ? `<p>Age: ${listing.age}</p>` : ""}
              ${listing.weight ? `<p>Weight: ${listing.weight}</p>` : ""}
              ${listing.location ? `<p>Location: ${listing.location}</p>` : ""}
              ${listing.health_status ? `<p>Health: ${escapeHtml(listing.health_status)}</p>` : ""}
            </div>
            <div class="flex items-center justify-between text-sm">
              <span class="text-gray-600">Seller: ${escapeHtml(listing.seller_name)}</span>
              <span class="text-gray-500">${formatDateShort(listing.created_at)}</span>
            </div>
          </div>
        </div>
      `,
          )
          .join("");
      }

      /**
       * Render pagination
       */
      function renderPagination(pagination) {
        const container = document.getElementById("pagination-container");

        if (pagination.total <= 1) {
          container.innerHTML = "";
          return;
        }

        const paginationHtml = createPagination(
          pagination.current,
          pagination.total,
          (page) => {
            currentPage = page;
            window.scrollTo({ top: 0, behavior: "smooth" });
            loadListings(page);
          },
        );

        container.innerHTML = "";
        container.appendChild(paginationHtml);
      }
    </script>
  </body>
</html>
