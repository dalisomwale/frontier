<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livestock Details - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/livestock.js"></script>
    <script src="/js/inquiry.js"></script>
  </head>
  <body class="bg-gray-50">
    <nav id="page-topnav" class="bg-white shadow-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <a href="/" class="flex items-center gap-3" aria-label="Frontier Marketplace home">
            <div class="brand-mark-full">
              <img src="/images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
            </div>
            <span class="hidden sm:block font-bold text-gray-900">Frontier Marketplace</span>
          </a>
          <a id="seller-link" href="/seller/register.html" class="header-seller-link">Register</a>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <nav class="text-sm mb-5 flex flex-wrap items-center gap-1 text-gray-500" aria-label="Breadcrumb">
        <a href="/#listings" class="inline-flex items-center gap-1 font-medium text-blue-600 hover:text-blue-700"><span class="w-4 h-4" data-icon="chevronLeft"></span>All livestock</a>
      </nav>

      <div id="listing-error" class="hidden"></div>

      <div id="listing-container" class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">
        <div class="lg:col-span-2">
          <div class="gallery-frame rounded-lg">
            <div id="main-image" class="w-full h-full flex items-center justify-center bg-gray-200 animate-pulse"></div>
            <button type="button" id="gallery-prev" class="gallery-nav gallery-nav-prev hidden" aria-label="Previous photo"></button>
            <button type="button" id="gallery-next" class="gallery-nav gallery-nav-next hidden" aria-label="Next photo"></button>
            <div id="gallery-dots" class="gallery-dots"></div>
            <div id="gallery-verified"></div>
          </div>
          <div id="gallery-thumbs" class="gallery-thumbs" aria-label="Photo gallery"></div>
        </div>

        <div class="lg:col-span-1">
          <div class="lg:sticky lg:top-20 bg-white lg:bg-transparent rounded-lg lg:rounded-none p-5 lg:p-0 shadow-sm lg:shadow-none">
            <div class="mb-5 pb-5 border-b border-gray-200">
              <h1 id="listing-title" class="text-xl sm:text-2xl font-bold text-gray-900">
                <span class="inline-block h-8 w-64 bg-gray-200 rounded animate-pulse"></span>
              </h1>
            </div>

            <div id="listing-attributes" class="mb-6 hidden">
              <h3 class="text-base font-semibold text-gray-900 mb-3">Details</h3>
              <dl id="attribute-list" class="space-y-2"></dl>
              <div id="description-section" class="hidden mt-4 pt-4 border-t border-gray-200">
                <p class="text-sm text-gray-500 mb-1">Description</p>
                <p id="listing-description" class="text-sm text-gray-800 leading-relaxed whitespace-pre-line"></p>
              </div>
            </div>

            <button id="inquire-btn" type="button" disabled
              class="w-full inline-flex items-center justify-center gap-2 btn-inquire px-4 py-3.5 rounded-lg font-semibold text-base disabled:opacity-60">
              <span class="w-5 h-5" data-icon="inquire"></span> Contact Seller
            </button>
          </div>
        </div>
      </div>

      <section id="related-section" class="hidden mt-12 pt-8 border-t border-gray-200">
        <h2 id="related-heading" class="text-xl sm:text-2xl font-bold text-gray-900 mb-4">More like this</h2>
        <div id="related-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6"></div>
      </section>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-gray-500">
        <p>© <span id="footer-year"></span> Frontier Farms &amp; Consult. All rights reserved.</p>
        <nav class="flex flex-wrap gap-x-5 gap-y-2">
          <a href="/seller/login.html" class="hover:text-gray-700">Seller sign in</a>
          <a href="/terms.html" class="hover:text-gray-700">Terms of Service</a>
          <a href="/privacy.html" class="hover:text-gray-700">Privacy Policy</a>
        </nav>
      </div>
    </footer>

    <div id="mobile-inquire" class="hidden fixed inset-x-0 bottom-0 z-40 px-4 pt-2 lg:hidden" style="padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px))">
      <button type="button" class="w-full inline-flex items-center justify-center gap-2 btn-inquire py-3 rounded-lg font-semibold shadow-lg">
        <span class="w-5 h-5" data-icon="inquire"></span> Contact Seller
      </button>
    </div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
    </script>

    <script>
      let listing = null;
      let galleryIndex = 0;

      function setAttributes(item) {
        const rows = [
          ["Animal", item.animal_name],
          ["Production Purpose", item.category_name],
          ["Breed", item.breed_name],
          ["Type", item.livestock_type],
          ["Quantity", item.quantity ? quantityLabel(item.quantity, item.animal_name) : null],
          ["Age", item.age_months !== null && item.age_months !== undefined ? formatAge(item.age_months) : null],
          ["Province", item.location],
          ["Listed", formatDateShort(item.created_at)],
        ].filter(([, value]) => value);
        document.getElementById("attribute-list").innerHTML = rows
          .map(([label, value]) => `
            <div class="flex justify-between gap-3">
              <dt class="text-sm text-gray-500">${label}</dt>
              <dd class="text-sm font-semibold text-gray-900 text-right">${escapeHtml(value)}</dd>
            </div>`)
          .join("");
        document.getElementById("listing-attributes").classList.toggle("hidden", !rows.length && !item.description);
      }

      function formatAge(months) {
        months = Number(months);
        if (months < 24) return `${months} month${months === 1 ? "" : "s"}`;
        const years = Math.floor(months / 12);
        const rest = months % 12;
        return `${years} yr${rest ? ` ${rest} mo` : "s"}`;
      }

      function renderListing(item) {
        document.title = `${item.title} - Frontier Marketplace`;
        document.getElementById("listing-title").textContent = item.title;

        if (item.description) {
          document.getElementById("listing-description").textContent = item.description;
          document.getElementById("description-section").classList.remove("hidden");
        }
        setAttributes(item);
        renderGallery();
        document.getElementById("gallery-verified").innerHTML = verifiedBadge(item);

        const inquire = () => openInquiryModal(item);
        const btn = document.getElementById("inquire-btn");
        btn.disabled = false;
        btn.addEventListener("click", inquire);
        const mobile = document.getElementById("mobile-inquire");
        mobile.classList.remove("hidden");
        mobile.querySelector("button").addEventListener("click", inquire);

        new IntersectionObserver(([entry]) => {
          mobile.style.visibility = entry.isIntersecting ? "hidden" : "visible";
        }).observe(btn);
      }

      function renderGallery() {
        const images = listing.images || [];
        const main = document.getElementById("main-image");
        const prev = document.getElementById("gallery-prev");
        const next = document.getElementById("gallery-next");
        const dots = document.getElementById("gallery-dots");
        const thumbs = document.getElementById("gallery-thumbs");
        main.classList.remove("animate-pulse");

        if (!images.length) {
          main.innerHTML = livestockFallbackMedia("w-24 h-24");
          [prev, next].forEach((b) => b.classList.add("hidden"));
          dots.innerHTML = thumbs.innerHTML = "";
          return;
        }

        const img = images[galleryIndex];
        main.innerHTML = `<img src="${escapeHtml(img.image_path)}" alt="${escapeHtml(listing.title)} - photo ${galleryIndex + 1} of ${images.length}" class="w-full h-full object-cover" decoding="async">`;

        const multiple = images.length > 1;
        prev.innerHTML = uiIcon("chevronLeft");
        next.innerHTML = uiIcon("chevronRight");
        prev.classList.toggle("hidden", !multiple);
        next.classList.toggle("hidden", !multiple);
        prev.disabled = galleryIndex === 0;
        next.disabled = galleryIndex === images.length - 1;

        dots.innerHTML = multiple
          ? images.map((_, i) => `<button type="button" class="gallery-dot ${i === galleryIndex ? "active" : ""}" data-index="${i}" aria-label="Photo ${i + 1}"></button>`).join("")
          : "";
        thumbs.innerHTML = multiple
          ? images.map((im, i) => `<button type="button" class="${i === galleryIndex ? "active" : ""}" data-index="${i}" aria-label="Show photo ${i + 1}"><img src="${escapeHtml(im.thumb_path || im.image_path)}" alt="" loading="lazy"></button>`).join("")
          : "";
        [...dots.querySelectorAll("button"), ...thumbs.querySelectorAll("button")].forEach((b) =>
          b.addEventListener("click", () => { galleryIndex = Number(b.dataset.index); renderGallery(); }),
        );
        if (images[galleryIndex + 1]) new Image().src = images[galleryIndex + 1].image_path;
      }

      function step(delta) {
        const count = listing?.images?.length || 0;
        const nextIndex = galleryIndex + delta;
        if (nextIndex < 0 || nextIndex >= count) return;
        galleryIndex = nextIndex;
        renderGallery();
      }
      document.getElementById("gallery-prev").addEventListener("click", () => step(-1));
      document.getElementById("gallery-next").addEventListener("click", () => step(1));

      (() => {
        const frame = document.querySelector(".gallery-frame");
        let startX = null;
        frame.addEventListener("touchstart", (e) => (startX = e.touches[0].clientX), { passive: true });
        frame.addEventListener("touchend", (e) => {
          if (startX === null) return;
          const dx = e.changedTouches[0].clientX - startX;
          if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
          startX = null;
        });
      })();

      async function loadRelated() {
        try {
          const res = await apiRequest(`/api/livestock?category_id=${listing.category_id}&exclude=${listing.id}&limit=4`);
          if (!res.data.length) return;
          document.getElementById("related-heading").textContent = `More ${listing.category_name} ${listing.animal_name}`;
          const container = document.getElementById("related-container");
          container.innerHTML = res.data.map(renderLivestockCard).join("");
          bindInquireButtons(container, res.data);
          document.getElementById("related-section").classList.remove("hidden");
        } catch {
        }
      }

      function showNotFound(message) {
        document.getElementById("listing-container").classList.add("hidden");
        const box = document.getElementById("listing-error");
        box.classList.remove("hidden");
        renderEmptyState(box, {
          title: "Listing not available",
          message: message || "",
          icon: "cattle",
          action: `<a href="/#listings" class="inline-block mt-4 bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 font-medium">Browse all livestock</a>`,
        });
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const id = getQueryParams().id;
        if (!id) return showNotFound();
        try {
          listing = (await apiRequest(`/api/livestock/${encodeURIComponent(id)}`)).data;
        } catch (error) {
          return showNotFound(error.status === 404 ? null : error.message);
        }
        renderListing(listing);
        if (getQueryParams().inquire === "1") openInquiryModal(listing);
        loadRelated();
      });
    </script>
  </body>
</html>
