<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livestock Details - Frontier Marketplace</title>
    <link rel="icon" href="/images/logo-icon.jpg" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/livestock.js"></script>
    <script src="/js/inquiry.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/buyer.js"></script>
  </head>
  <body class="bg-gray-50">
    <nav id="page-topnav" class="site-topnav sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <a href="/" class="flex items-center gap-3" aria-label="Frontier Marketplace home">
            <div class="brand-mark-full">
              <img src="/images/logo-full.jpg" alt="Frontier Farms &amp; Consult" />
            </div>
            <span class="hidden sm:block font-bold site-topnav-name">Frontier Marketplace</span>
          </a>
          <div class="header-auth">
            <a id="login-link" href="/account/login.html" class="header-login-link">Log in</a>
            <a id="seller-link" href="/account/register.html" class="header-seller-link">Register</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <nav class="text-sm mb-5 flex flex-wrap items-center gap-1 text-gray-500" aria-label="Breadcrumb">
        <a href="/#listings" class="inline-flex items-center gap-1 font-medium text-blue-600 hover:text-blue-700"><span class="w-4 h-4" data-icon="chevronLeft"></span>All livestock</a>
      </nav>

      <div id="listing-error" class="hidden"></div>

      <div id="listing-container" class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">
        <div class="lg:col-span-2">
          <div class="gallery-frame rounded-lg">
            <div id="main-image" class="w-full h-full flex items-center justify-center bg-gray-200 animate-pulse"></div>
            <button type="button" id="gallery-prev" class="gallery-nav gallery-nav-prev hidden" aria-label="Previous photo"></button>
            <button type="button" id="gallery-next" class="gallery-nav gallery-nav-next hidden" aria-label="Next photo"></button>
            <div id="gallery-dots" class="gallery-dots"></div>
            <div id="gallery-verified"></div>
          </div>
          <div id="gallery-thumbs" class="gallery-thumbs" aria-label="Photo gallery"></div>
        </div>

        <div class="lg:col-span-1">
          <div class="lg:sticky lg:top-20 bg-white lg:bg-transparent rounded-lg lg:rounded-none p-5 lg:p-0">
            <h1 id="listing-title" class="text-xl sm:text-2xl font-bold text-gray-900">
              <span class="inline-block h-8 w-64 bg-gray-200 rounded animate-pulse"></span>
            </h1>
            <div id="buy-price" class="buy-price-line mt-2"><span class="inline-block h-8 w-40 bg-gray-200 rounded animate-pulse"></span></div>
            <div id="listing-facts" class="lv-facts"></div>
            <p id="listing-description" class="lv-desc hidden"></p>

            <div id="buy-box" class="buy-box">
              <div id="buy-qty" class="buy-qty hidden">
                <p class="text-sm font-semibold text-gray-800">Quantity</p>
                <div class="qty-stepper" role="group" aria-label="Quantity">
                  <button type="button" data-step="-1" aria-label="Fewer">&minus;</button>
                  <input id="buy-qty-input" type="number" inputmode="numeric" min="1" value="1" aria-label="Quantity">
                  <button type="button" data-step="1" aria-label="More">+</button>
                </div>
              </div>
              <div id="buy-total" class="buy-total hidden"><span>Total</span><strong></strong></div>
              <div id="buy-actions" class="buy-row buy-row-desk">
                <button id="cart-btn" type="button" class="btn-cart btn-lg hidden">Add to cart</button>
                <button id="buy-btn" type="button" class="btn-buy btn-lg hidden">Buy now</button>
              </div>
              <button id="inquire-btn" type="button" disabled class="lv-ask">Ask the seller a question</button>
            </div>
          </div>
        </div>
      </div>

      <section id="related-section" class="hidden mt-12 pt-8 border-t border-gray-200">
        <h2 id="related-heading" class="text-xl sm:text-2xl font-bold text-gray-900 mb-4">More like this</h2>
        <div id="related-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6"></div>
      </section>
    </main>

    <footer id="site-footer" class="mt-10"></footer>

    <div id="mobile-inquire" class="mobile-buy-bar hidden lg:hidden">
      <div class="buy-row">
        <button type="button" data-mobile-cart class="btn-cart btn-lg hidden">Add to cart</button>
        <button type="button" data-mobile-buy class="btn-buy btn-lg hidden">Buy now</button>
        <button type="button" data-mobile-contact class="btn-contact btn-inquire btn-lg">Ask the seller</button>
      </div>
    </div>

    <script>
      document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = uiIcon(el.dataset.icon)));
    </script>

    <script>
      let listing = null;
      let galleryIndex = 0;

      // Key facts as small tags; the description as a short paragraph.
      function setAttributes(item) {
        const facts = [
          item.animal_name,
          item.category_name,
          item.breed_name,
          item.livestock_type,
          item.age_months !== null && item.age_months !== undefined ? formatAge(item.age_months) : null,
          item.location,
          item.quantity ? `${quantityLabel(item.quantity, item.animal_name, item.animal_kind)} available` : null,
        ].filter(Boolean);
        document.getElementById("listing-facts").innerHTML = facts.map((f) => `<span class="lv-fact">${escapeHtml(f)}</span>`).join("");
        const desc = document.getElementById("listing-description");
        desc.textContent = item.description || "";
        desc.classList.toggle("hidden", !item.description);
      }

      function formatAge(months) {
        months = Number(months);
        if (months < 24) return `${months} month${months === 1 ? "" : "s"}`;
        const years = Math.floor(months / 12);
        const rest = months % 12;
        return `${years} yr${rest ? ` ${rest} mo` : "s"}`;
      }

      function renderListing(item) {
        document.title = `${item.title} - Frontier Marketplace`;
        if (item.animal_kind === "feed") {
          const back = document.querySelector('nav[aria-label="Breadcrumb"] a');
          back.href = `/feed.html?type=${encodeURIComponent(item.animal_id)}`;
          back.lastChild.textContent = `All ${item.animal_name}`;
        }
        document.getElementById("listing-title").textContent = item.title;

        setAttributes(item);
        renderGallery();
        document.getElementById("gallery-verified").innerHTML = verifiedBadge(item);

        renderBuyBox(item);
        const inquire = () => openInquiryModal(item);
        const btn = document.getElementById("inquire-btn");
        btn.disabled = false;
        btn.addEventListener("click", inquire);
        const mobile = document.getElementById("mobile-inquire");
        mobile.classList.remove("hidden");
        document.body.classList.add("has-buy-bar");
        const mobileContact = mobile.querySelector("[data-mobile-contact]");
        mobileContact.addEventListener("click", inquire);
        const mobileBuy = mobile.querySelector("[data-mobile-buy]");
        const mobileCart = mobile.querySelector("[data-mobile-cart]");
        if (hasPrice(item)) {
          // Priced: Add to cart and Buy Now; Contact Seller stays in the page.
          mobileBuy.classList.remove("hidden");
          mobileCart.classList.remove("hidden");
          mobileContact.classList.add("hidden");
          mobileBuy.addEventListener("click", buy);
          mobileCart.addEventListener("click", () => addItem(mobileCart));
        } else {
          mobile.querySelector(".buy-row").classList.add("buy-row-single");
        }

      }

      let buyQty = 1;
      function buy() {
        buyNow(listing, buyQty);
      }
      function addItem() {
        addToCart(listing.id, listing.price_unit === "lot" ? Number(listing.quantity) || 1 : buyQty);
        showCartToast(listing.title);
        document.querySelectorAll("#cart-btn, [data-mobile-cart]").forEach((b) => { b.textContent = "Added to cart ✓"; });
        clearTimeout(addItem.timer);
        addItem.timer = setTimeout(() => document.querySelectorAll("#cart-btn, [data-mobile-cart]").forEach((b) => { b.textContent = "Add to cart"; }), 2500);
      }

      function renderBuyBox(item) {
        const priceBox = document.getElementById("buy-price");
        const actions = document.getElementById("buy-actions");
        if (!hasPrice(item)) {
          priceBox.innerHTML = `<span class="lv-price-request">Price on request</span>`;
          document.getElementById("inquire-btn").classList.add("lv-ask-desk");
          actions.classList.add("hidden");
          return;
        }
        priceBox.innerHTML = `
          <span class="buy-price">${kwacha(item.price)}</span>
          <span class="buy-price-unit">${priceUnitLabel(item)}</span>`;
        const max = Math.max(1, Number(item.quantity) || 1);
        const lot = item.price_unit === "lot";
        const totalBox = document.getElementById("buy-total");
        const input = document.getElementById("buy-qty-input");
        const qtyBox = document.getElementById("buy-qty");
        const update = () => {
          totalBox.querySelector("strong").textContent = kwacha(lot ? Number(item.price) : Number(item.price) * buyQty);
          totalBox.classList.toggle("hidden", buyQty < 2);
          input.value = buyQty;
          qtyBox.querySelector('[data-step="-1"]').disabled = buyQty <= 1;
          qtyBox.querySelector('[data-step="1"]').disabled = buyQty >= max;
        };
        if (!lot && max > 1) {
          qtyBox.classList.remove("hidden");
          input.max = max;
          qtyBox.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
            buyQty = Math.min(max, Math.max(1, buyQty + Number(b.dataset.step)));
            update();
          }));
          input.addEventListener("input", () => {
            const n = Number.parseInt(input.value, 10);
            if (Number.isFinite(n)) buyQty = Math.min(max, Math.max(1, n));
            totalBox.querySelector("strong").textContent = kwacha(Number(item.price) * buyQty);
            totalBox.classList.toggle("hidden", buyQty < 2);
          });
          input.addEventListener("blur", update);
          update();
        }
        const buyBtn = document.getElementById("buy-btn");
        buyBtn.classList.remove("hidden");
        buyBtn.addEventListener("click", buy);
        const cartBtn = document.getElementById("cart-btn");
        cartBtn.classList.remove("hidden");
        cartBtn.addEventListener("click", addItem);
      }

      function renderGallery() {
        const images = listing.images || [];
        const main = document.getElementById("main-image");
        const prev = document.getElementById("gallery-prev");
        const next = document.getElementById("gallery-next");
        const dots = document.getElementById("gallery-dots");
        const thumbs = document.getElementById("gallery-thumbs");
        main.classList.remove("animate-pulse");

        if (!images.length) {
          main.innerHTML = livestockFallbackMedia("w-24 h-24");
          [prev, next].forEach((b) => b.classList.add("hidden"));
          dots.innerHTML = thumbs.innerHTML = "";
          return;
        }

        const img = images[galleryIndex];
        main.innerHTML = `<img src="${escapeHtml(img.image_path)}" alt="${escapeHtml(listing.title)} - photo ${galleryIndex + 1} of ${images.length}" class="w-full h-full object-cover" decoding="async">`;

        const multiple = images.length > 1;
        prev.innerHTML = uiIcon("chevronLeft");
        next.innerHTML = uiIcon("chevronRight");
        prev.classList.toggle("hidden", !multiple);
        next.classList.toggle("hidden", !multiple);
        prev.disabled = galleryIndex === 0;
        next.disabled = galleryIndex === images.length - 1;

        dots.innerHTML = multiple
          ? images.map((_, i) => `<button type="button" class="gallery-dot ${i === galleryIndex ? "active" : ""}" data-index="${i}" aria-label="Photo ${i + 1}"></button>`).join("")
          : "";
        thumbs.innerHTML = multiple
          ? images.map((im, i) => `<button type="button" class="${i === galleryIndex ? "active" : ""}" data-index="${i}" aria-label="Show photo ${i + 1}"><img src="${escapeHtml(im.thumb_path || im.image_path)}" alt="" loading="lazy"></button>`).join("")
          : "";
        [...dots.querySelectorAll("button"), ...thumbs.querySelectorAll("button")].forEach((b) =>
          b.addEventListener("click", () => { galleryIndex = Number(b.dataset.index); renderGallery(); }),
        );
        if (images[galleryIndex + 1]) new Image().src = images[galleryIndex + 1].image_path;
      }

      function step(delta) {
        const count = listing?.images?.length || 0;
        const nextIndex = galleryIndex + delta;
        if (nextIndex < 0 || nextIndex >= count) return;
        galleryIndex = nextIndex;
        renderGallery();
      }
      document.getElementById("gallery-prev").addEventListener("click", () => step(-1));
      document.getElementById("gallery-next").addEventListener("click", () => step(1));

      (() => {
        const frame = document.querySelector(".gallery-frame");
        let startX = null;
        frame.addEventListener("touchstart", (e) => (startX = e.touches[0].clientX), { passive: true });
        frame.addEventListener("touchend", (e) => {
          if (startX === null) return;
          const dx = e.changedTouches[0].clientX - startX;
          if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
          startX = null;
        });
      })();

      async function loadRelated() {
        try {
          const res = await apiRequest(`/api/livestock?category_id=${listing.category_id}&exclude=${listing.id}&limit=4`);
          if (!res.data.length) return;
          document.getElementById("related-heading").textContent = `More ${listing.category_name} ${listing.animal_name}`;
          const container = document.getElementById("related-container");
          container.innerHTML = res.data.map(renderLivestockCard).join("");
          bindInquireButtons(container, res.data);
          document.getElementById("related-section").classList.remove("hidden");
        } catch {
        }
      }

      function showNotFound(message) {
        document.getElementById("listing-container").classList.add("hidden");
        const box = document.getElementById("listing-error");
        box.classList.remove("hidden");
        renderEmptyState(box, {
          title: "Listing not available",
          message: message || "",
          icon: "cattle",
          action: `<a href="/#listings" class="inline-block mt-4 bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 font-medium">Browse all livestock</a>`,
        });
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const id = getQueryParams().id;
        if (!id) return showNotFound();
        try {
          listing = (await apiRequest(`/api/livestock/${encodeURIComponent(id)}`)).data;
        } catch (error) {
          return showNotFound(error.status === 404 ? null : error.message);
        }
        renderListing(listing);
        if (getQueryParams().inquire === "1") openInquiryModal(listing);
        else if (getQueryParams().buy === "1" && hasPrice(listing)) buy();
        loadRelated();
      });
    </script>
  </body>
</html>
